<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>農業概論1-3章複習（Kahoot題庫）</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: 同「自然段與意義段」的架構：上方標題＋QR，分頁 土壤重點／肥料重點／動手做／計算練習／小測驗。土色系，投影用大字。 */
:root{
  --bg:#f7f3ec; --paper:#ffffff; --ink:#2a2118; --muted:#6c5f52; --line:#e3d9cb; --grid:#efe8dc;
  --accent:#2f6b3a; --accent-ink:#ffffff; --accent-soft:#e3f0e3;
  --soil:#8a5a35; --soil-soft:#f4e7da;
  --mark:#ffe08a; --mark-ink:#2a2118;
  --ok:#1f7a45; --ok-soft:#e1f4e7; --bad:#b4362c; --bad-soft:#fbe7e4;
  --g1:#c46a17; --g2:#2f8a57; --g3:#3b6fd1; --g4:#a2408c;
  --g1s:#fbecdc; --g2s:#e0f2e7; --g3s:#e3ebfb; --g4s:#f6e4f1;
  --lA:#4a3324; --lB:#8e6038; --lC:#c4a07a; --lR:#8d8a85;
  --f:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17130f; --paper:#211b16; --ink:#efe7dc; --muted:#b4a594; --line:#3a3027; --grid:#1d1813;
  --accent:#7fcf8c; --accent-ink:#10170f; --accent-soft:#1f3322;
  --soil:#d59a6a; --soil-soft:#33261b;
  --mark:#6b5414; --mark-ink:#fff4cc;
  --ok:#6fd398; --ok-soft:#173326; --bad:#ff8f84; --bad-soft:#3a1d1a;
  --g1:#f0a35a; --g2:#6fd09a; --g3:#8eaaf0; --g4:#e08ccc;
  --g1s:#3a2a1a; --g2s:#173326; --g3s:#1c2740; --g4s:#36203a;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17130f; --paper:#211b16; --ink:#efe7dc; --muted:#b4a594; --line:#3a3027; --grid:#1d1813;
  --accent:#7fcf8c; --accent-ink:#10170f; --accent-soft:#1f3322;
  --soil:#d59a6a; --soil-soft:#33261b;
  --mark:#6b5414; --mark-ink:#fff4cc;
  --ok:#6fd398; --ok-soft:#173326; --bad:#ff8f84; --bad-soft:#3a1d1a;
  --g1:#f0a35a; --g2:#6fd09a; --g3:#8eaaf0; --g4:#e08ccc;
  --g1s:#3a2a1a; --g2s:#173326; --g3s:#1c2740; --g4s:#36203a;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:17px;line-height:1.7;
  background-image:radial-gradient(var(--grid) 1.2px,transparent 1.2px);background-size:22px 22px}
.wrap{max-width:980px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;gap:16px;align-items:flex-start;justify-content:space-between}
.brand{min-width:0}
.eyebrow{font-size:14px;letter-spacing:.12em;color:var(--soil);font-weight:700}
h1{font-size:clamp(30px,6vw,44px);font-weight:900;line-height:1.2;margin:4px 0 6px;text-wrap:balance}
.sub{color:var(--muted);margin:0;font-size:16px}
.qr{flex:none;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.qr img{width:84px;height:84px;image-rendering:pixelated;display:block}
.qr span{font-size:12px;color:#4a3d31;font-weight:700}
button:focus-visible,.qr:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tabs{display:flex;gap:8px;margin:22px 0 14px;flex-wrap:wrap}
.tab{font:inherit;font-weight:700;font-size:17px;border:2px solid var(--accent);background:var(--paper);color:var(--accent);border-radius:999px;padding:7px 18px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.tab small{font-weight:500;opacity:.8;margin-left:4px;font-size:13px}
.panel{display:flex;flex-direction:column;gap:16px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.toolbar .hint{font-size:14px;color:var(--muted)}
.switch{display:inline-flex;align-items:center;gap:8px;font-weight:700;cursor:pointer;user-select:none}
.switch input{width:20px;height:20px;accent-color:var(--accent)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;min-width:0}
.card h2{font-size:24px;font-weight:900;margin:0 0 8px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.card h2 .sec{font-size:13px;font-weight:700;color:var(--soil);background:var(--soil-soft);border-radius:999px;padding:1px 10px}
.card h3{font-size:19px;margin:14px 0 4px}
.card p{margin:6px 0}
.card ul{margin:6px 0;padding-left:1.3em}
.card li{margin:3px 0}
.key{background:var(--mark);color:var(--mark-ink);border-radius:4px;padding:0 4px;font-weight:700;transition:filter .2s}
body.blank .key{color:transparent;background:var(--soil-soft);border-bottom:2px solid var(--soil);cursor:pointer;user-select:none}
body.blank .key.show{color:var(--mark-ink);background:var(--mark);border-bottom-color:transparent}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:720px){.two,.three{grid-template-columns:1fr}}
.box{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--bg);min-width:0}
.box b.t{display:block;font-size:17px;margin-bottom:2px}
.box.c1{border-top:5px solid var(--g1)}.box.c2{border-top:5px solid var(--g2)}.box.c3{border-top:5px solid var(--g3)}.box.c4{border-top:5px solid var(--g4)}
.note{font-size:15px;color:var(--muted);background:var(--bg);border-radius:8px;padding:8px 12px;margin-top:10px}
.tip{font-size:15px;border:1.5px dashed var(--soil);border-radius:10px;padding:8px 12px;margin-top:10px;background:var(--soil-soft)}
.tip b{color:var(--soil)}
.tblwrap{overflow-x:auto;margin-top:8px}
table.t{width:100%;border-collapse:collapse;font-size:16px;min-width:520px}
table.t th,table.t td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
table.t th{background:var(--accent-soft);white-space:nowrap}
table.t td.c{text-align:center}
.pill{display:inline-block;font-size:13px;font-weight:700;border-radius:999px;padding:0 9px;border:1.5px solid currentColor;white-space:nowrap;line-height:1.6}
.pill.ok{color:var(--ok)}.pill.no{color:var(--bad)}.pill.mid{color:var(--g1)}
.btn{font:inherit;font-weight:700;font-size:16px;border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:9px 22px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:2px solid var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}

/* 組成條 */
.bar{display:flex;height:44px;border-radius:10px;overflow:hidden;margin-top:8px;font-size:14px;font-weight:700;color:#fff}
.bar span{display:grid;place-items:center;white-space:nowrap;padding:0 4px;overflow:hidden}

/* 粒徑尺 */
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin-top:8px}
.scale div{border-radius:8px;padding:8px 6px;text-align:center;font-size:14px;line-height:1.35;background:var(--bg);border:1px solid var(--line)}
.scale div b{display:block;font-size:16px}
.scale .dot{display:block;margin:4px auto;border-radius:50%;background:var(--soil)}
@media (max-width:560px){.scale{grid-template-columns:1fr 1fr}}

/* 剖面 */
.profile{display:grid;grid-template-columns:minmax(150px,220px) minmax(0,1fr);gap:16px;align-items:stretch}
@media (max-width:620px){.profile{grid-template-columns:1fr}}
.layers{display:flex;flex-direction:column;border-radius:10px;overflow:hidden;border:2px solid var(--line)}
.layer{font:inherit;border:0;color:#fff;font-weight:900;font-size:18px;cursor:pointer;text-align:left;padding:10px 14px;display:flex;flex-direction:column;justify-content:center;position:relative}
.layer small{font-weight:500;font-size:13px;opacity:.9}
.layer[aria-pressed="true"]{box-shadow:inset 0 0 0 4px var(--mark)}
.layer.A{background:var(--lA);min-height:70px}.layer.B{background:var(--lB);min-height:90px}.layer.C{background:var(--lC);color:#2a2118;min-height:80px}.layer.R{background:var(--lR);min-height:50px;background-image:radial-gradient(#6d6a66 3px,transparent 3.5px);background-size:16px 14px}
.lay-info{border:1px solid var(--line);border-radius:10px;padding:12px 16px;background:var(--bg)}
.lay-info h3{margin:0 0 4px}

/* 氮轉化 */
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px}
.chem{border:2px solid var(--soil);border-radius:10px;padding:4px 12px;font-weight:900;font-size:18px;background:var(--paper)}
.arr{display:flex;flex-direction:column;align-items:center;font-size:13px;font-weight:700;color:var(--accent);line-height:1.2;min-width:70px}
.arr::after{content:"⟶";font-size:22px;line-height:1}
.arr.bad{color:var(--bad)}

/* 元素格 */
.egroup{margin-top:10px}
.egroup .lab{font-size:14px;font-weight:700;color:var(--muted);margin-bottom:4px}
.els{display:flex;flex-wrap:wrap;gap:8px}
.el{font:inherit;width:72px;height:72px;border-radius:10px;border:2px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;position:relative}
.el b{font-size:24px;font-weight:900}
.el small{font-size:13px}
.el.main{border-color:var(--g1)}.el.sec{border-color:var(--g3)}.el.tr{border-color:var(--g2)}
.el.npk::before{content:"三要素";position:absolute;top:-9px;font-size:11px;font-weight:700;background:var(--g1);color:#fff;border-radius:999px;padding:0 6px}
.el.mob::after{content:"";position:absolute;right:6px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--g4)}
.el[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.einfo{margin-top:14px;border:1px solid var(--line);border-radius:10px;padding:12px 16px;background:var(--bg);min-height:120px}
.einfo h3{margin:0 0 6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.einfo dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px}
.einfo dt{font-weight:700;color:var(--soil);white-space:nowrap}
.einfo dd{margin:0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--g4);margin-right:4px}

/* 木桶 */
.barrel{display:flex;align-items:flex-end;gap:3px;height:120px;margin:8px 0}
.barrel span{flex:1;background:var(--soil);border-radius:4px 4px 0 0;color:#fff;font-size:12px;font-weight:700;text-align:center;padding-top:2px}
.barrel span.low{background:var(--bad)}

/* pH 站 */
.phwrap{margin-top:6px}
.phscale{height:22px;border-radius:999px;background:linear-gradient(90deg,#d63b2f,#ef8a2c,#f2cf3c,#5cb85c,#3a8ad6,#5a4bc4);position:relative}
input[type=range]{width:100%;accent-color:var(--accent);margin:8px 0 0}
.phnum{font-size:46px;font-weight:900;line-height:1;color:var(--accent)}
.phzone{font-size:20px;font-weight:900}
.phgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
@media (max-width:620px){.phgrid{grid-template-columns:1fr}}

/* 診斷卡 */
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.case{font:inherit;color:var(--ink);text-align:left;border:2px solid var(--line);border-radius:12px;background:var(--paper);padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:150px}
.case .q{font-size:16px}
.case .tag{font-size:12px;font-weight:700;color:var(--muted)}
.case .a{margin-top:auto;font-size:15px;color:var(--muted)}
.case.open{border-color:var(--accent);background:var(--accent-soft)}
.case.open .a{color:var(--ink)}
.case .a b{font-size:22px;color:var(--accent);margin-right:6px}

/* 計算 */
.picker{display:flex;gap:8px;flex-wrap:wrap}
.pk{font:inherit;font-size:15px;font-weight:700;border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:7px 12px;cursor:pointer;line-height:1.3;text-align:left}
.pk small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.pk[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.problem{font-size:21px;line-height:1.8;font-weight:500}
.problem b{color:var(--soil)}
.formula{font-size:18px;font-weight:700;background:var(--soil-soft);border-radius:10px;padding:8px 14px;margin-top:10px}
.ansrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.ansrow input{font:inherit;font-size:20px;width:180px;border:2px solid var(--line);border-radius:10px;padding:6px 12px;background:var(--paper);color:var(--ink)}
.ansfb{font-weight:700}
.ansfb.ok{color:var(--ok)}.ansfb.bad{color:var(--bad)}
.steps{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.step{border-left:5px solid var(--accent);background:var(--bg);border-radius:0 10px 10px 0;padding:8px 14px;font-size:18px}
.step .n{font-size:13px;font-weight:700;color:var(--accent);display:block}
.step.final{border-color:var(--g1);background:var(--g1s);font-weight:900}

/* 測驗 */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.progress{display:flex;gap:4px;flex-wrap:wrap}
.dot{width:18px;height:8px;border-radius:4px;background:var(--line)}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}.dot.now{background:var(--line)}
.qtype{font-size:14px;font-weight:700;color:var(--accent);letter-spacing:.06em}
.qsrc{font-size:13px;font-weight:700;color:var(--soil);background:var(--soil-soft);border-radius:999px;padding:0 8px;margin-left:6px}
.qtext{font-size:22px;line-height:1.75;margin:10px 0 14px;font-weight:500}
.qlist{font-size:18px;background:var(--bg);border-radius:10px;padding:8px 14px;margin:-4px 0 14px;line-height:1.9}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
.opt{font:inherit;font-size:18px;text-align:left;border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:12px 14px;cursor:pointer;display:flex;gap:10px;align-items:center}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--bg);font-size:14px;font-weight:700}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.feedback{margin-top:14px;border-radius:10px;padding:10px 14px;font-size:16px}
.feedback.ok{background:var(--ok-soft);color:var(--ok)}
.feedback.bad{background:var(--bad-soft);color:var(--bad)}
.feedback .why{color:var(--ink);display:block;margin-top:4px}
.score{font-size:64px;font-weight:900;color:var(--accent);line-height:1;margin:10px 0}
.review .item{border-left:4px solid var(--bad);padding:6px 12px;background:var(--bg);border-radius:0 6px 6px 0;font-size:16px;margin-top:8px;text-align:left}
.overlay{position:fixed;inset:0;background:rgba(20,14,8,.72);display:grid;place-items:center;z-index:50;padding:20px}
.overlay .inner{background:#fff;border-radius:16px;padding:22px;text-align:center;color:#2a2118;max-width:92vw}
.overlay img{width:min(340px,72vw);height:min(340px,72vw);image-rendering:pixelated;display:block;margin:0 auto}
.overlay p{font-size:22px;font-weight:700;margin:12px 0 0}
.overlay small{display:block;color:#6c5f52;margin-top:4px;word-break:break-all}
footer{margin-top:28px;font-size:13px;color:var(--muted);text-align:center}

.art{width:100%;height:auto;display:block;color:var(--ink)}
figure{margin:0}
figcaption{font-size:15px;line-height:1.5;margin-top:6px;text-align:center}
figcaption b{display:block;font-size:17px}
.ex{color:var(--muted);font-size:14px}
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:8px}
.icons.three-up{grid-template-columns:repeat(3,minmax(0,1fr))}
.icons.two-up{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:620px){.icons.three-up,.icons.two-up{grid-template-columns:1fr}}
.icons figure{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px}
.icons figure svg{max-height:180px}
.two>svg.art{max-height:260px}
.scene{border-radius:12px;margin-top:6px}
.legend2{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.lg{font-size:14px;font-weight:700;border-radius:999px;padding:2px 12px}
.lg.g{background:var(--g2s);color:var(--g2)}.lg.p{background:var(--g4s);color:var(--g4)}
.phbar{display:flex;border-radius:12px;overflow:hidden;margin-top:6px}
.phbar .seg{color:#fff;font-weight:900;font-size:15px;text-align:center;padding:8px 4px;line-height:1.3}
.phbar small{font-weight:500;font-size:12px}
.phaxis{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px}

.defmap .art{border-radius:12px}
.dchips g{cursor:pointer}
.dchips rect{fill:#fff;stroke:#2f6b3a;stroke-width:2.5}
.dchips text{font-size:15px;font-weight:900;text-anchor:middle;fill:#2f6b3a}
.dchips g.on rect{fill:#2f6b3a}.dchips g.on text{fill:#fff}
.dchips g:focus{outline:none}.dchips g:focus rect{stroke:#e0a21b;stroke-width:4}
.defkey{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.dk{border-radius:10px;padding:8px 12px;font-size:15px}
.dk b{display:block;font-size:16px}
.dk.new{background:var(--g3s);border-left:5px solid var(--g3)}.dk.old{background:var(--g1s);border-left:5px solid var(--g1)}
@media (max-width:599px){.defkey{grid-template-columns:1fr}.defmap{overflow-x:auto}.defmap svg{min-width:520px}}
.einfo .eflex{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;align-items:center}
.leafpic{background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px;text-align:center}
.leafpic svg{width:100%;height:auto;display:block}
.leafpic small{display:block;font-size:13px;font-weight:700;color:#4a3324}
@media (max-width:520px){.einfo .eflex{grid-template-columns:1fr}.leafpic{max-width:170px;margin:0 auto}}
.cagal{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.cgt{font-size:17px;color:var(--soil)}
.cgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:6px}
@media (max-width:720px){.cgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cgrid figure{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px;color:#2a2118}
.cgrid svg{width:100%;height:auto;display:block;max-height:110px}
.cgrid figcaption{font-size:14px;text-align:center}
.cgrid figcaption b{font-size:16px;display:block}
.qnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap}
.qcount{font-size:14px;color:var(--muted);font-weight:700}
.btn.sm{min-height:36px;padding:4px 14px;font-size:14px}

button.dot{border:0;padding:0;cursor:pointer;width:22px;height:12px}
.dot.now{outline:2px solid var(--accent);outline-offset:2px}
.dot.ok.now{background:var(--ok)}.dot.bad.now{background:var(--bad)}
@media (max-width:599px){.qnav .btn{flex:1}.qcount{order:-1;width:100%;text-align:center}}
.stages.pic{gap:2px}

.stg svg{width:58px;height:42px;display:block}
.stg b{font-size:15px;line-height:1.2}
.stg.pupa{border-color:var(--g1);background:var(--g1s)}

.diff{display:block;font-size:15px;color:var(--g1);margin-bottom:2px}

.xp{margin-top:8px;color:var(--ink)}
.xpt{font-weight:700;background:var(--paper);border:1.5px solid var(--g3);border-radius:8px;padding:6px 10px;color:var(--g3)}
.xex{margin-top:8px;background:var(--paper);border-radius:8px;padding:6px 10px}
.xex ul{margin:4px 0 0;padding-left:1.2em}.xex li{margin:3px 0;font-size:16px;line-height:1.6}
.xtag{display:inline-block;font-size:12px;font-weight:900;border-radius:999px;padding:0 8px;margin-right:6px;background:var(--g3);color:#fff;vertical-align:1px}

.vsa{background:var(--g2s);color:var(--g2);border-radius:10px;padding:8px 12px;font-weight:900;text-align:center}

      <li>答錯會直接出現<b>考點＋每個選項的詳解</b>；答對也可以按「看詳解」。</li>
    </ul>
    <div class="actions" style="margin-top:12px"><button class="btn" id="go">開始練習 →</button></div></div>`;
  document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{range=b.dataset.r;home();});
  document.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{order=b.dataset.o;home();});
  $("go").onclick=()=>start();
}
function start(only){
  let idx = only || QS.map((q,i)=>i).filter(i=>range==="all"||QS[i].ch===range);
  if(order==="rnd"&&!only) idx=shuffle(idx);
  quiz={retry:!!only,items:idx.map(i=>({i,perm:shuffle([0,1,2,3])})),cur:0,res:[],pick:[],sel:[],open:[],done:false};
  render(); window.scrollTo({top:0});
}
function dots(){ return quiz.items.map((_,k)=>`<button class="dot ${quiz.res[k]===true?"ok":quiz.res[k]===false?"bad":""}${k===quiz.cur&&!quiz.done?" now":""}" data-go="${k}" aria-label="第 ${k+1} 題"></button>`).join(""); }
function explain(q,it,picked){
  return `<div class="xp"><div class="xpt"><span class="xtag">考點</span>${q.pt}</div>
    <div class="xex"><span class="xtag ex">詳解</span><ul class="xopt">${it.perm.map((o,k)=>{const y=q.c.includes(o); return `<li class="${y?"y":"n"}"><span class="mk">${y?"✔":"✘"}</span><span><span class="ot">${L[k]}. ${q.o[o]}</span>${picked&&picked.includes(k)?'<span class="you">你選的</span>':""}<br>${q.ex[o]}</span></li>`;}).join("")}</ul>
    <p style="margin:6px 0 0;font-size:15px;color:var(--muted)">💡 ${q.why}</p></div></div>`;
}
function goQ(k){ quiz.cur=k; quiz.done=false; render(); window.scrollTo({top:0}); }
function bindCommon(P){
  P.querySelectorAll(".dot[data-go]").forEach(d=>d.onclick=()=>goQ(+d.dataset.go));
  const r=P.querySelector("#qReset");
  if(r) r.onclick=()=>{ if(r.dataset.arm){ home(); window.scrollTo({top:0}); } else { r.dataset.arm="1"; r.textContent="確定要從頭開始？再按一次"; r.classList.add("warn"); setTimeout(()=>{ if(r.isConnected){ delete r.dataset.arm; r.textContent="↺ 重新開始"; r.classList.remove("warn"); } },3000); } };
}
function render(){
  const P=$("app"), {items,cur,res}=quiz, answered=res.filter(x=>x!==undefined).length;
  if(quiz.done){
    const n=res.filter(Boolean).length, tot=items.length, r=n/tot;
    if(!quiz.retry){ const s=load(); if(!s[range]||n>s[range]) s[range]=n; save(s); }
    const msg=r===1?(quiz.retry?"錯題全部訂正完成！":"全對！第一～三章你已經掌握了！"):r>=.8?"很棒！把錯的題目再練一次。":r>=.6?"不錯喔！看完詳解再挑戰一次。":"別灰心，先看詳解，再練一次錯題！";
    const wr=items.map((it,k)=>({it,k})).filter(x=>res[x.k]!==true);
    const by={}; items.forEach((it,k)=>{const c=QS[it.i].ch; by[c]=by[c]||[0,0]; by[c][1]++; if(res[k]) by[c][0]++;});
    P.innerHTML=`<div class="card" style="text-align:center"><div class="qtype">${quiz.retry?"錯題再練結果":"練習結果"}</div><div class="score">${n} / ${tot}</div><p>${msg}${tot-answered?`<br><span style="color:var(--bad)">還有 ${tot-answered} 題沒作答</span>`:""}</p>
      <div class="stats">${Object.keys(by).map(c=>`<span>${CH[c]}：${by[c][0]} / ${by[c][1]}</span>`).join("")}</div>
      ${wr.length?`<div class="review" style="margin-top:14px"><b>訂正一下：</b>${wr.map(({it,k})=>{const q=QS[it.i]; return `<div class="item"><b>第 ${k+1} 題</b>${res[k]===undefined?"（未作答）":""}　${q.q}<br><b style="color:var(--ok)">正確答案：${q.c.map(o=>q.o[o]).join("、")}</b><br><span class="xtag sm">考點</span> ${q.pt}</div>`;}).join("")}</div>`:""}
      <div class="actions" style="justify-content:center;margin-top:14px">${wr.length?`<button class="btn" id="retry">錯題再練（${wr.length} 題）</button>`:""}<button class="btn ghost" id="again">再練一次</button><button class="btn ghost" id="qReset">↺ 換範圍</button></div></div>`;
    if($("retry")) $("retry").onclick=()=>start(wr.map(x=>x.it.i));
    $("again").onclick=()=>start(quiz.retry?items.map(x=>x.i):undefined);
    $("qReset").onclick=()=>home();
    P.querySelectorAll(".dot[data-go]").forEach(d=>d.onclick=()=>goQ(+d.dataset.go));
    return;
  }
  const it=items[cur], q=QS[it.i], multi=q.c.length>1, locked=res[cur]!==undefined, last=cur===items.length-1;
  const right=it.perm.map((o,k)=>q.c.includes(o)?k:-1).filter(k=>k>=0);
  const picked=quiz.pick[cur], sel=quiz.sel[cur]||[];
  const opts=it.perm.map((o,k)=>{ let c=""; if(locked){ if(right.includes(k)) c=picked.includes(k)?" right":" right miss"; else if(picked.includes(k)) c=" wrong"; } else if(sel.includes(k)) c=" sel";
    return `<button class="opt${c}" data-k="${k}" ${locked?"disabled":""} aria-pressed="${sel.includes(k)}"><span class="k">${multi&&!locked?(sel.includes(k)?"✓":L[k]):L[k]}</span><span>${q.o[o]}</span></button>`; }).join("");
  let fb="";
  if(locked){
    const ok=res[cur];
    fb=`<div class="feedback ${ok?"ok":"bad"}"><b>${ok?"答對了！":"答錯了，正確答案是「"+right.map(k=>L[k]+". "+q.o[it.perm[k]]).join("、")+"」"}</b>
      ${ok&&!quiz.open[cur]?`<div class="showx"><button class="btn ghost sm" id="showX">看詳解</button></div>`:explain(q,it,picked)}</div>`;
  }
  P.innerHTML=`<div class="card"><div class="qhead"><span class="qtype">${quiz.retry?"錯題再練・":""}第 ${cur+1} 題／共 ${items.length} 題<span class="qsrc">${CH[q.ch]}</span></span><button class="btn ghost sm" id="qReset">↺ 重新開始</button></div>
    <div class="progress" style="margin-top:8px">${dots()}</div>
    <div class="qtext"><span class="mtag${multi?" m":""}" style="margin:0 8px 0 0">${multi?"複選":"單選"}</span>${q.q}</div>
    ${multi&&!locked?`<div class="mhint">這題有 2 個以上的正確答案，選好後按「送出答案」</div>`:""}
    <div class="opts">${opts}</div>
    ${multi&&!locked?`<div class="actions" style="margin-top:10px"><button class="btn" id="submit" ${sel.length?"":"disabled"}>送出答案</button></div>`:""}
    <div id="fb" aria-live="polite">${fb}</div>
    <div class="qnav"><button class="btn ghost" id="qPrev" ${cur===0?"disabled":""}>← 上一題</button><span class="qcount">已作答 ${answered} / ${items.length}</span><button class="btn" id="qNext">${last?"看結果":"下一題 →"}</button></div></div>`;
  const finish=p=>{ quiz.pick[cur]=p; quiz.res[cur]=same(p,right); render(); const f=$("fb"); if(f&&!quiz.res[cur]) f.scrollIntoView({behavior:"smooth",block:"nearest"}); };
  P.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    if(locked) return; const k=+b.dataset.k;
    if(!multi) return finish([k]);
    const s=quiz.sel[cur]=quiz.sel[cur]||[]; const at=s.indexOf(k); at>=0?s.splice(at,1):s.push(k); render();
  });
  if($("submit")) $("submit").onclick=()=>finish([...(quiz.sel[cur]||[])]);
  if($("showX")) $("showX").onclick=()=>{quiz.open[cur]=true; render();};
  $("qPrev").onclick=()=>{ if(cur>0) goQ(cur-1); };
  $("qNext").onclick=()=>{ if(last){ quiz.done=true; render(); window.scrollTo({top:0}); } else goQ(cur+1); };
  bindCommon(P);
}
const openQR=()=>{$("overlay").hidden=false;};
$("qrBtn").onclick=openQR; $("qrBtn").onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openQR();}};
$("overlay").onclick=()=>{$("overlay").hidden=true;};
home();
})();
</script>
</body>
</html>
