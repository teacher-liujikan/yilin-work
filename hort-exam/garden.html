<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>技藝競賽造園 複習本</title>
<style>
:root{
  --bg:#f6f3ea; --card:#fffdf7; --ink:#24302a; --mute:#6b766e; --line:#e3dccb;
  --green:#2f6b4f; --green2:#e3efe6; --leaf:#5a9a6e; --sun:#fff1b8; --red:#b6463a;
  --fs:17px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-size:var(--fs);line-height:1.75;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:20;background:var(--green);color:#fff;padding:10px 14px 8px;padding-top:max(10px,env(safe-area-inset-top))}
.hrow{display:flex;align-items:center;gap:10px}
header h1{font-size:1.05rem;margin:0;flex:1;letter-spacing:.03em}
header h1 small{display:block;font-weight:400;font-size:.72rem;opacity:.8;letter-spacing:0}
.ibtn{background:rgba(255,255,255,.14);border:0;border-radius:10px;padding:6px 10px;color:#fff;font-size:.85rem;min-height:36px}
.ibtn.on{background:var(--sun);color:var(--ink)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;border-radius:999px;padding:4px 12px;background:rgba(255,255,255,.14);color:#fff;font-size:.82rem;white-space:nowrap}
.chip.cur{background:#fff;color:var(--green);font-weight:700}
.chip .ok{color:var(--sun)} .chip.cur .ok{color:var(--leaf)}
main{max-width:820px;margin:0 auto;padding:14px 14px 110px}
.view{display:none}.view.show{display:block}
/* notes */
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tools input{flex:1;min-width:160px;border:1px solid var(--line);border-radius:12px;padding:9px 12px;font:inherit;font-size:.95rem;background:var(--card)}
.tbtn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 12px;font-size:.88rem;min-height:42px}
.tbtn.on{background:var(--sun);border-color:#e8d27a;font-weight:700}
article{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 18px 8px;box-shadow:0 2px 10px rgba(60,50,20,.05)}
article h2{font-size:1.3rem;margin:.1em 0 .6em;color:var(--green);line-height:1.4}
article h3{font-size:1.08rem;margin:1.5em 0 .5em;padding:4px 10px;border-left:5px solid var(--leaf);background:var(--green2);border-radius:0 8px 8px 0}
article p,article li{margin:.35em 0}
article ul,article ol{padding-left:1.3em}
article strong{background:linear-gradient(transparent 55%,var(--sun) 55%);font-weight:700}
article blockquote{margin:1em 0;padding:8px 12px;background:#f3efe2;border-radius:10px;color:var(--mute);font-size:.92em}
.tw{overflow-x:auto;margin:.8em 0;border-radius:12px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:.9em;min-width:420px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--green2);color:var(--green);white-space:nowrap;position:sticky;top:0}
tr:nth-child(even) td{background:#fbf8ef}
td:first-child{font-weight:700;white-space:nowrap}
mark.ok{background:#dcefe2;color:#1d5a37;border-radius:4px;padding:0 3px;font-weight:600}
.ng{color:var(--red);font-weight:800}
.fx{font-weight:700;color:var(--ink);text-align:center;font-size:1.05em;background:#eef5ef}
.term{font-size:1.15rem!important}
mark.hit{background:#ffd36b;border-radius:3px}
/* cloze */
body.cloze article strong,body.cloze article mark.ok,body.cloze article td:not(:first-child){color:transparent!important;background:#d9d2bd!important;border-radius:5px;user-select:none;transition:.15s}
body.cloze article strong *,body.cloze article td:not(:first-child) *{color:transparent!important;background:transparent!important}
body.cloze article .rv,body.cloze article .rv *{color:var(--ink)!important;background:var(--sun)!important}
.pager{display:flex;gap:10px;margin:16px 0}
.pager button{flex:1;border:0;border-radius:14px;padding:12px;background:var(--green);color:#fff;font-weight:700;min-height:52px}
.pager button:disabled{opacity:.3}
.donebar{display:flex;align-items:center;justify-content:center;margin:6px 0 0}
.done{border:2px solid var(--leaf);background:var(--card);color:var(--green);border-radius:999px;padding:8px 18px;font-weight:700}
.done.on{background:var(--leaf);color:#fff}
.hint{color:var(--mute);font-size:.82rem;text-align:center;margin:6px 0 0}
.empty{text-align:center;color:var(--mute);padding:30px 0}
.sres{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:10px}
.sres b{color:var(--green)} .sres p{margin:.2em 0;font-size:.92rem}
/* quiz */
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 2px 10px rgba(60,50,20,.05)}
.qtop{display:flex;justify-content:space-between;color:var(--mute);font-size:.88rem;margin-bottom:6px}
.qplant{font-size:2rem;font-weight:800;text-align:center;margin:16px 0 4px;color:var(--green)}
.qask{text-align:center;color:var(--mute);margin-bottom:14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:2px solid var(--line);background:#fff;border-radius:14px;padding:14px 8px;font-size:1.05rem;font-weight:700;min-height:58px}
.opt.right{border-color:var(--leaf);background:#dff0e3}
.opt.wrong{border-color:var(--red);background:#f8e1dd}
.fb{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--green2);display:none;font-size:.95rem}
.fb.show{display:block}
.row{display:flex;gap:10px;margin-top:14px}
.row button{flex:1;border:0;border-radius:14px;padding:12px;font-weight:700;min-height:50px;background:var(--green);color:#fff}
.row .sec{background:#e9e3d2;color:var(--ink)}
.score{font-size:2.4rem;font-weight:800;text-align:center;color:var(--green);margin:10px 0}
.wlist li{margin:.3em 0}
/* cards */
.flip{perspective:1000px;margin:10px 0}
.fcard{position:relative;min-height:270px;transition:transform .45s;transform-style:preserve-3d;cursor:pointer}
.fcard.f{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;padding:22px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;border:1px solid var(--line)}
.front{background:var(--card)}
.back{background:#fdf6d8;transform:rotateY(180deg);font-size:1.05rem;line-height:1.8}
.term{font-size:1.5rem;font-weight:800;color:var(--green);line-height:1.5}
.yr{color:var(--mute);font-size:.85rem;margin-top:8px}
.tap{color:var(--mute);font-size:.8rem;margin-top:16px}
.cmark{display:flex;gap:10px}
.cmark button{flex:1;border:2px solid var(--line);border-radius:14px;padding:11px;background:#fff;font-weight:700;min-height:50px}
.cmark .k{border-color:var(--leaf);color:var(--green)} .cmark .u{border-color:#e0b04a;color:#8a6510}
.seg{display:flex;background:#e9e3d2;border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:transparent;border-radius:10px;padding:7px;font-size:.88rem}
.seg button.on{background:#fff;font-weight:700;color:var(--green)}
/* nav */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.bottom button{flex:1;border:0;background:none;padding:9px 0 10px;font-size:.78rem;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.bottom button svg{width:24px;height:24px}
nav.bottom button.on{color:var(--green);font-weight:700}
/* sheet */
.sheet{position:fixed;inset:0;background:rgba(20,30,25,.45);z-index:40;display:none;align-items:flex-end;justify-content:center}
.sheet.show{display:flex}
.sbox{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto}
.sbox h3{margin:0 0 10px;color:var(--green)}
.toc button{display:flex;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:12px 4px;gap:8px;align-items:center}
.toc .st{margin-left:auto;font-size:.8rem;color:var(--leaf)}
.prog{height:8px;background:#e9e3d2;border-radius:99px;overflow:hidden;margin:6px 0 14px}
.prog i{display:block;height:100%;background:var(--leaf);border-radius:99px}
.qrbox{text-align:center}
.qrbox svg{width:220px;height:220px;background:#fff;padding:8px;border-radius:12px}
.close{width:100%;margin-top:12px;border:0;border-radius:14px;padding:12px;background:#e9e3d2;font-weight:700}
.fsz{display:flex;gap:8px;margin:8px 0 4px}
.fsz button{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px;font-weight:700}
@media (min-width:900px){ :root{--fs:18px} main{padding-top:20px} }
</style>


<style id="prog-css">
article h3{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
article h2{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sbtns{margin-left:auto;display:inline-flex;gap:6px;font-size:.8rem;font-weight:700}
.sbtns button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:3px 10px;min-height:32px;line-height:1.2;color:var(--mute)}
.sbtns .ck.on{background:var(--leaf);border-color:var(--leaf);color:#fff}
.sbtns .bm{font-size:1rem;padding:2px 8px}
.sbtns .bm.on{color:#c98a00;border-color:#e8c060;background:#fff6d6}
article h3.secdone{opacity:.75}
.secfoot{display:flex;justify-content:flex-end;margin:10px 0 18px}
.secfoot .ck{font-size:.9rem;padding:8px 16px;min-height:40px}
.ckmini{font-size:.75rem;color:var(--leaf);font-weight:700;align-self:center}
.ptools{display:flex;align-items:center;gap:8px;margin:-4px 0 12px;font-size:.85rem;color:var(--mute)}
.ptools .pb{flex:1;height:8px;background:#e9e3d2;border-radius:99px;overflow:hidden}
.ptools .pb i{display:block;height:100%;background:var(--leaf)}
.ptools button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:5px 10px;font-size:.82rem}
.toc .mini{display:block;width:54px;height:6px;background:#e9e3d2;border-radius:9px;overflow:hidden;flex:none}
.toc .mini b{display:block;height:100%;background:var(--leaf)}
.bmh{font-weight:700;color:#a87300;margin:4px 0 2px}
.toc .bmi{color:#7a5a00}
body.cloze .sbtns button{color:var(--mute)!important;background:#fff!important}
body.cloze .sbtns .ck.on{color:#fff!important;background:var(--leaf)!important}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <a class="ibtn" href="index.html" aria-label="回首頁" style="text-decoration:none">⌂</a>
    <h1>技藝競賽造園 複習本<small id="sub">歷屆考題重點整理（100–114）</small></h1>
    <button class="ibtn" id="tocBtn" aria-label="目錄">目錄</button>
    <button class="ibtn" id="setBtn" aria-label="設定">Aa</button>
  </div>
  <div class="chips" id="chips"></div>
</header>

<main>
  <!-- notes -->
  <section class="view show" id="v-notes">
    <div class="tools">
      <input id="q" type="search" placeholder="搜尋：例如 飛石、植穴、虎渡子法" enterkeyhint="search">
      <button class="tbtn" id="clozeBtn">挖空模式</button>
    </div>
    <div id="sresults"></div>
    <article id="art"></article>
    <div class="donebar"><button class="done" id="doneBtn">✓ 這章讀完了</button></div>
    <p class="hint" id="clozeHint" hidden>挖空模式：先想答案，再點灰色方塊翻開</p>
    <div class="pager"><button id="prevBtn">← 上一章</button><button id="nextBtn">下一章 →</button></div>
  </section>

  <!-- family quiz -->
  <section class="view" id="v-quiz">
    <div class="panel" id="quizBox"></div>
  </section>

  <!-- cards -->
  <section class="view" id="v-cards">
    <div class="seg" id="cardSeg">
      <button data-m="all" class="on">全部</button><button data-m="unk">還不熟</button><button data-m="shuf">隨機</button>
    </div>
    <div class="qtop"><span id="cpos"></span><span id="cstat"></span></div>
    <div class="flip"><div class="fcard" id="fcard">
      <div class="face front"><div class="term" id="cterm"></div><div class="yr" id="cyr"></div><div class="tap">點卡片看正確答案</div></div>
      <div class="face back"><div id="cans"></div></div>
    </div></div>
    <div class="cmark"><button class="u" id="cUnk">還不熟</button><button class="k" id="cKnow">記住了</button></div>
    <div class="row"><button class="sec" id="cPrev">← 上一張</button><button id="cNext">下一張 →</button></div>
  </section>
</main>

<nav class="bottom">
  <button class="on" data-v="notes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/><path d="M8 7h6M8 11h6"/></svg>讀筆記</button>
  <button data-v="quiz"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z"/><path d="M12 8v6M9 11h6"/></svg>分類測驗</button>
  <button data-v="cards"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/></svg>錯誤選項卡</button>
</nav>

<div class="sheet" id="tocSheet"><div class="sbox">
  <h3>目錄與進度</h3>
  <div id="progTxt"></div><div class="prog"><i id="progBar"></i></div>
  <div class="toc" id="toc"></div>
  <button class="close" data-close>關閉</button>
</div></div>

<div class="sheet" id="setSheet"><div class="sbox">
  <h3>字體大小</h3>
  <div class="fsz"><button data-fs="15">小</button><button data-fs="17">中</button><button data-fs="19">大</button><button data-fs="21">特大</button></div>
