const CH=[{"id": "c0", "title": "考題總覽與讀書策略", "short": "考題總覽與讀書策略", "html": "<p>15 屆考卷（100–114）幾乎全出自兩套課本：<strong>東大圖書《造園》上、下冊</strong>與《地景》（早期另有三民版）。最穩定的得分點是「<strong>階梯／步道／坡道數字</strong>」「<strong>植穴與移植數字</strong>」「<strong>飛石與遊戲水池數字</strong>」「<strong>中日西造園史</strong>」「<strong>施工規範與驗收</strong>」五大塊，幾乎每屆都考。</p>\n<table>\n<thead>\n<tr>\n<th>年度</th>\n<th>題型與配分</th>\n<th>答案來源</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>100</td>\n<td>是非 40＋選擇 40（四選一）＋問答配合 20</td>\n<td>答案卷</td>\n</tr>\n<tr>\n<td>101、102</td>\n<td>是非 35～40＋選擇 35～40＋問答配合 20～30</td>\n<td>含答案及出處（地景、三民）</td>\n</tr>\n<tr>\n<td>103、104</td>\n<td>是非 40＋選擇 35～40＋配合 25</td>\n<td>含答案及出處（東大、地景）</td>\n</tr>\n<tr>\n<td>105</td>\n<td>是非 40＋選擇 35＋配合問答 25</td>\n<td>含答案及「正解」欄</td>\n</tr>\n<tr>\n<td>106</td>\n<td>是非 48＋選擇 45＋配合 7</td>\n<td>含答案、出處與註記</td>\n</tr>\n<tr>\n<td>107</td>\n<td>選擇 50＋是非 50</td>\n<td>手寫答案</td>\n</tr>\n<tr>\n<td>108</td>\n<td>是非 20×2＋選擇 30×2（五選一）</td>\n<td>含出處</td>\n</tr>\n<tr>\n<td>109–111</td>\n<td>是非 20×2＋選擇 30×2（五選一）</td>\n<td><strong>附詳解</strong>（最好用）</td>\n</tr>\n<tr>\n<td>112、113</td>\n<td>是非 25×2＋選擇 25×2</td>\n<td>附詳解</td>\n</tr>\n<tr>\n<td>114</td>\n<td><strong>選擇 50×2，全部選擇題</strong></td>\n<td>附詳解</td>\n</tr>\n</tbody>\n</table>\n<p>出題趨勢：</p>\n<ul>\n<li><strong>重複出題非常多</strong>：防風林 1:11.5、步道斜度 ≤10%、2R+T=66、植穴「根球 2 倍或大 30 cm、深加 15～20 cm」、飛石間隔 10 cm、遊戲水池 10～30 cm、群植奇數、摘心不保直立幹形、桂竹抗彎最大，每個都考過 4 次以上。</li>\n<li><strong>題型改變</strong>：108 年起每題 2 分、五選一；114 年全改選擇題，題幹變長、選項更像「敘述判斷」。</li>\n<li><strong>愛考「題目顛倒」</strong>：把正確敘述的兩個主詞對調（如「暢幽靈雅／體宜因借」、「傳染性／非傳染性」、「深綠上層／淺綠下層」），讀的時候要記「誰配誰」。</li>\n<li><strong>施工實務比重上升</strong>：109 年後每卷都有 6～10 題在考施工規範、估價、驗收、養護。</li>\n</ul>\n<p>讀書順序建議：數字速記表（第十五章）→ 造園史 → 植物材料與配置 → 結構設施 → 施工與規範 → 製圖測量 → 問答題庫。</p>\n<blockquote>\n<p>標註方式比照教甄筆記：<strong>粗體</strong>＝常考重點；每題先寫 <mark class=\"ok\">✔ 完整的正確敘述，再列 </mark><span class=\"ng\">✗</span> 曾經考過的錯誤說法（括號為年度），讀的時候先記正確句。答案以各屆考卷所附答案為準；早期掃描卷有幾題看不清，寫「依答案」的是保留考卷答案、但課本說法可能不同，請對照課本。102 與 107 年少數題目的答案卷字跡不清，已略過。</p>\n</blockquote>"}, {"id": "c1", "title": "一、造園史：中國", "short": "造園史：中國", "html": "<p>中國題每屆 2～4 題，核心只有三組字：<strong>體宜因借</strong>是設計原則、<strong>暢幽靈雅</strong>是風格、<strong>透漏瘦</strong>是疊石原則，最愛把前兩組對調。</p>\n<h3>典籍與人物</h3>\n<table>\n<thead>\n<tr>\n<th>典籍／人物</th>\n<th>重點</th>\n<th>考過的錯誤選項</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>《園冶》</td>\n<td><strong>明朝計成</strong>著（1582～1644），「造園」一詞出處，最有系統、世界最早的造園專書；主張水面約佔十分之三</td>\n<td><span class=\"ng\">✗</span> 宋朝、唐朝、清朝；<span class=\"ng\">✗</span> 作者陳植</td>\n</tr>\n<tr>\n<td>《長物志》</td>\n<td><strong>文震亨</strong>著（明）</td>\n<td></td>\n</tr>\n<tr>\n<td>朱舜水</td>\n<td>明末遺臣，設計日本東京<strong>小石川後樂園</strong>（參照西湖、廬山，迴遊式）</td>\n<td><span class=\"ng\">✗</span>「清朝人」</td>\n</tr>\n<tr>\n<td>《詩譜》</td>\n<td>記載<strong>堯舜時期</strong>已有管理山澤苑囿的官吏（108，依答案）</td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<h3>設計原則與風格</h3>\n<p>口訣：<strong>體宜因借是「怎麼設計」的原則，暢幽靈雅是「做出來要有的感覺」</strong>。「因、借」的概念出自明朝計成《園冶》。</p>\n<table>\n<thead>\n<tr>\n<th>字</th>\n<th>意思</th>\n<th>例子／考點</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>體</strong></td>\n<td>得體、<strong>合於功能</strong>：每個部分都做得恰如其分，符合使用需求（「體者得也，各做即為體」）</td>\n<td><span class=\"ng\">✗</span>「注意物體大小與比例」（105）；<span class=\"ng\">✗</span>「通達、通暢」——那是「暢」（104）</td>\n</tr>\n<tr>\n<td><strong>宜</strong></td>\n<td>合宜、調和：<strong>物與物相配、物與背景相配</strong></td>\n<td>大樹配大庭、小庭配小品；建築與植栽風格一致</td>\n</tr>\n<tr>\n<td><strong>因</strong></td>\n<td>因應、隨機應變：<strong>依地勢安排，不故意違背自然</strong>（因地制宜）</td>\n<td>低窪處挖池、高處疊山、原有大樹保留利用</td>\n</tr>\n<tr>\n<td><strong>借</strong></td>\n<td><strong>借景</strong>：把園外美景納入園中，「借景無拘遠近，嘉則收之」；<strong>中國造園最高手法</strong></td>\n<td>《園冶》分遠借、鄰借、仰借、俯借、應時而借；如從窗洞、門洞望外山</td>\n</tr>\n<tr>\n<td><strong>暢</strong></td>\n<td>通暢、開朗：動線與視野<strong>通達有系統</strong>，不阻塞、不壓迫</td>\n<td>園路、景觀連貫；水面開闊處令人舒暢</td>\n</tr>\n<tr>\n<td><strong>幽</strong></td>\n<td>幽深、含蓄：<strong>曲徑通幽、藏而不露</strong>，景深層層</td>\n<td>假山、花木遮擋視線，走進去才見下一景；南方園林「曲折幽深」</td>\n</tr>\n<tr>\n<td><strong>靈</strong></td>\n<td>靈活、不滯：<strong>生動、曲折多變</strong></td>\n<td>「<strong>柳暗花明</strong>」＝靈（107 考過）</td>\n</tr>\n<tr>\n<td><strong>雅</strong></td>\n<td>高雅、脱俗：素淨有文人意境，不堆砌、不俗艷</td>\n<td>選用品格高尚植物（梅、竹、桂、梧桐）、題字對聯</td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li><mark class=\"ok\">✔ 中國庭園的設計原則講求體宜因借，風格講求暢幽靈雅。</mark><br><span class=\"ng\">✗ 曾考錯：</span>「風格講求體宜因借，設計原則講求暢幽靈雅」（103，兩者對調）。</li>\n<li>中國庭園精神：<strong>師法自然、創造意境</strong>；善用<strong>借景</strong>。<ul>\n<li><mark class=\"ok\">✔ 善用縮景是日本庭園的特色，中國庭園善用借景。</mark><br><span class=\"ng\">✗ 曾考錯：</span>「中國庭園特色之一是善用縮景」（113）。</li>\n</ul>\n</li>\n</ul>\n<blockquote>\n<p>「體」與「靈」的解釋出自考卷答案（105、107）及《地景》p.013；其餘字義是依《園冶》常見解說整理，對照課本用詞作答。</p>\n</blockquote>\n<h3>疊石與建築</h3>\n<p><strong>疊石原則：透、漏、瘦、皺</strong>（相傳為宋代米芾提出的「相石」標準，太湖石是代表；考卷多只考前三字）</p>\n<table>\n<thead>\n<tr>\n<th>字</th>\n<th>意思</th>\n<th>看石頭時怎麼辨認</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>透</strong></td>\n<td>石上孔洞<strong>彼此相通</strong>，可以從這邊看到那邊</td>\n<td>面對石頭，穿過孔洞看得到後方景物（左右、前後通透）</td>\n</tr>\n<tr>\n<td><strong>漏</strong></td>\n<td>石上有眼，<strong>上下貫通</strong>，四面有孔</td>\n<td>由上往下淋水，水會從孔洞漏下來</td>\n</tr>\n<tr>\n<td><strong>瘦</strong></td>\n<td>細長挺拔、峻岭而不臃腫；依考卷答案＝<strong>下窄上寬</strong>，取其險峻、美在高聳</td>\n<td>立石高而細，頭重腳輕、有一種悬空孤立的勢</td>\n</tr>\n<tr>\n<td><strong>皺</strong></td>\n<td>石面<strong>起伏紋理</strong>豐富，如皺摺、波紋</td>\n<td>表面有凹凸線條、細紋，光影變化大</td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li><mark class=\"ok\">✔ 疊石的「瘦」是指下窄上寬，挺拔險峻。</mark><br><span class=\"ng\">✗ 曾考錯：</span>「上窄下寬為瘦」（102、107）。</li>\n<li><mark class=\"ok\">✔ 疊石原則是「透、漏、瘦」。</mark><br><span class=\"ng\">✗ 曾考錯：</span>「枯山水假山依透、露、瘦」（111，依答案推斷）。</li>\n</ul>\n<p><strong>園林建築：亭、台、樓、閣、榭、舫、廊……</strong></p>\n<table>\n<thead>\n<tr>\n<th>建築</th>\n<th>意思與功能</th>\n<th>考點／例子</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>亭</strong></td>\n<td>有頂無牆、四面開敢，供遊人<strong>停留休憩</strong>、觀景也成為景點（《園冶》：亭者停也）</td>\n<td>涼亭可設低凹處（抬高）或陡坡（架空）（110）</td>\n</tr>\n<tr>\n<td><strong>台</strong></td>\n<td>高而平、上方無屋頂或較低的建築台基，供<strong>登高眺望、賞月</strong></td>\n<td>常與榭、樓結合（「榭是造在台上的屋子」）</td>\n</tr>\n<tr>\n<td><strong>樓</strong></td>\n<td><strong>二層以上</strong>的重屋，登高望遠（「重屋曰樓」）</td>\n<td>與閣同類</td>\n</tr>\n<tr>\n<td><strong>閣</strong></td>\n<td>中國傳統樓房的一種，四面開窗，<strong>與「樓」同為登高望遠、遊憩賞景或供佛</strong>之建築，亦可藏書</td>\n<td>102 是非題（○）</td>\n</tr>\n<tr>\n<td><strong>榭</strong></td>\n<td><strong>「榭者藉也」</strong>：藉景而成、<strong>可依靠借助</strong>；造在台上的屋子，多臨水稱「水榭」</td>\n<td>107 選擇題（<span class=\"ng\">✗</span> 堅固耐用、可觀魚娛樂）</td>\n</tr>\n<tr>\n<td><strong>舫</strong></td>\n<td>仿船形的臨水建築，又稱石舫、旱船</td>\n<td>頤和園石舫；與廊同有休憩功能（110）</td>\n</tr>\n<tr>\n<td><strong>廊</strong></td>\n<td>連接建築的有頂通道，<strong>遮陽避雨、引導遊覽、分隔空間</strong></td>\n<td>曲廊、水廊、爬山廊</td>\n</tr>\n<tr>\n<td><strong>軒</strong></td>\n<td>小巧、高敢明朗的小建築，供賞景、品茶</td>\n<td>—</td>\n</tr>\n<tr>\n<td><strong>館、齋</strong></td>\n<td>館供宴客、居住；齋供讀書靜修，位置較幽靜</td>\n<td>—</td>\n</tr>\n<tr>\n<td><strong>堂、廳</strong></td>\n<td>園中主體建築，高大寬敞，供聚會、待客</td>\n<td>—</td>\n</tr>\n<tr>\n<td><strong>祠</strong></td>\n<td>祭祀建築，在園中為<strong>點景建築</strong></td>\n<td>107 是非題（○）</td>\n</tr>\n</tbody>\n</table>\n<blockquote>\n<p>「榭者藉也」「閣與樓同」「祠為點景建築」出自考卷（102、107）；其餘建築與「皺」的說明是依中國園林常見解說整理，請對照課本。</p>\n</blockquote>\n<ul>\n<li>窗洞、門洞：具<strong>採光、框景、通風</strong>功能，構成<strong>框景、對景</strong>。園窗後襯山石花木＝<strong>無心畫</strong>；漏窗＝<strong>漏景</strong>；門洞＝<strong>景門</strong>，宜<strong>小巧玲瓏</strong>（109、113）。</li>\n<li>「萬綠叢中一點紅」＝<strong>色彩對比</strong>（<span class=\"ng\">✗</span> 明暗對比，104）；「雜樹映朱閣」＝<strong>背景對比</strong>（107）。</li>\n</ul>\n<h3>園林類型與名園</h3>\n<table>\n<thead>\n<tr>\n<th>類型</th>\n<th>重點</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>三種類型</td>\n<td><strong>皇家園林、私家園林、自然風景園林</strong></td>\n</tr>\n<tr>\n<td>北方（黃河流域）</td>\n<td><strong>皇家園林為主</strong>，規模大、建築雄偉，氣候乾燥、常綠樹少、黃色調</td>\n</tr>\n<tr>\n<td>南方（長江流域）</td>\n<td><strong>私家園林為主</strong>，規模小，<strong>曲折幽深</strong>，綠色調濃；蘇州園林為代表</td>\n</tr>\n<tr>\n<td>魏晉南北朝</td>\n<td>盛行<strong>私家園林與寺廟園林</strong>；文人園林格調<strong>樸素</strong></td>\n</tr>\n<tr>\n<td>清代皇家園林</td>\n<td><strong>圓明園</strong>（萬園之園，比頤和園大）、暢春園、頤和園、避暑山莊；長春園西洋樓為歐洲造園<strong>18 世紀首次引入</strong>中國</td>\n</tr>\n<tr>\n<td>蘇州四大名園</td>\n<td><strong>滄浪亭、獅子林、拙政園、留園</strong></td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li><mark class=\"ok\">✔ 南方園林以曲折幽深見長。</mark><br><span class=\"ng\">✗ 曾考錯：</span>「北方園林以曲折幽深見長」（106）。</li>\n<li><mark class=\"ok\">✔ 皇家園林大多建於北方，南方以私家園林為主。</mark><br><span class=\"ng\">✗ 曾考錯：</span>「皇家園林大多建於南方」（102）。</li>\n<li><mark class=\"ok\">✔ 北方造園規模大、建築雄偉，多為帝王所建；南方規模小。</mark><br><span class=\"ng\">✗ 曾考錯：</span>「南方造園規模大、帝王所建」（101）。</li>\n<li><mark class=\"ok\">✔ 圓明園被譽為「萬園之園」。</mark><br><span class=\"ng\">✗ 曾考錯：</span>「頤和園被譽為萬園之園」（105）。</li>\n<li><mark class=\"ok\">✔ 避暑山莊在承德，和頤和園是不同的兩座皇家園林。</mark><br><span class=\"ng\">✗ 曾考錯：</span>「頤和園又名避暑山莊」（114）。</li>\n<li><mark class=\"ok\">✔ 魏晉南北朝文人園林格調樸素自然。</mark><br><span class=\"ng\">✗ 曾考錯：</span>「魏晉文人園林格調華麗、建築比重大」（103）。</li>\n<li><mark class=\"ok\">✔ 唐朝輞川園是王維的私家園林，不是御花園。</mark><br><span class=\"ng\">✗ 曾考錯：</span>「唐朝輞川園為御花園」（100、104）。</li>\n<li><mark class=\"ok\">✔ 蘇州四大名園是滄浪亭、獅子林、拙政園、留園；頤和園在北京。</mark><br><span class=\"ng\">✗ 曾考錯：</span>「頤和園為蘇州四大名園」（103）。網師園、怡園、西園也都不在四大名園內。</li>\n<li>中國園林常用植物：梧桐、桂、竹、梅、杜鵑、梔子；<span class=\"ng\">✗</span> <strong>蒲葵</strong>不是（100）。</li>\n</ul>"}, {"id": "c2", "title": "二、造園史：日本", "short": "造園史：日本", "html": "<p>日本題最愛考<strong>龍安寺虎渡子法</strong>、<strong>茶庭＝露地</strong>、<strong>迴遊式 vs 枯山水</strong>三組；日本庭園的核心手法是<strong>縮景</strong>，擅長小空間設計。</p>\n<h3>庭園形式對照</h3>\n<table>\n<thead>\n<tr>\n<th>形式</th>\n<th>時代／代表</th>\n<th>特徵</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>枯山水</td>\n<td>始見<strong>鎌倉時代</strong>，<strong>室町時代</strong>為代表；龍安寺、大德寺、天龍寺</td>\n<td>以<strong>砂代水、以石代山</strong>，寫意式、供沉思默想；除苔蘚外無其他植物</td>\n</tr>\n<tr>\n<td>龍安寺石庭</td>\n<td>京都、室町</td>\n<td><strong>虎渡子法</strong>：敷白砂為海、掃痕為波，<strong>15 石分 5、2、3、2、3 五組</strong>，不用一木</td>\n</tr>\n<tr>\n<td>茶庭</td>\n<td><strong>桃山時代</strong>代表，多出自<strong>千利休</strong></td>\n<td>又稱<strong>露地（路地）庭</strong>；代表<strong>限制、禮儀、敏感與謙虛</strong>；踏石小路如通往山中幽谷；以小地形描寫大自然</td>\n</tr>\n<tr>\n<td>迴遊式</td>\n<td>江戶前期；桂離宮、小石川後樂園</td>\n<td><strong>以水池為中心</strong>，四周配茶亭、苑路連絡，可從水邊、水上、園中各點觀景</td>\n</tr>\n<tr>\n<td>池泉舟遊式</td>\n<td>平安時代</td>\n<td>年代早於拙政園（108 排序題）</td>\n</tr>\n<tr>\n<td>和洋折衷式</td>\n<td><strong>明治維新</strong>後</td>\n<td>納入行道樹、綠籬、花壇、壁泉、草地</td>\n</tr>\n</tbody>\n</table>\n<h3>時代與書籍</h3>\n<ul>\n<li>上古表現神池；飛鳥時代融入蓬萊與佛教思想；<strong>鎌倉時代</strong>受禪宗影響多僧式庭園；室町時代受明朝文化影響；江戶時代<strong>前期以迴遊式為代表、後期參照明朝中國式</strong>。</li>\n<li>日本最早的造園書是《作庭記》（平安時代）。<ul>\n<li><mark class=\"ok\">✔ 日本最早的造園書是《作庭記》。</mark><br><span class=\"ng\">✗ 曾考錯：</span>「《圓方書》為日本最早造園書」（104）。103 年題「《作庭記》出現於平安時代」答案標 <span class=\"ng\">✗</span>，與其他年度矛盾，請對照課本。</li>\n</ul>\n</li>\n<li>庭園材料喜用<strong>飛石、石燈籠、手水缽、小拱橋</strong>；偏好<strong>常綠樹</strong>，喜加工成老態。<ul>\n<li><mark class=\"ok\">✔ 飛石、燈籠、手水缽最初是實用設施，後來才成為裝飾。</mark><br><span class=\"ng\">✗ 曾考錯：</span>「最初為裝飾後變實用」（109）。</li>\n</ul>\n</li>\n<li>日式代橋的石墩：三丁步設於較窄較淺的水面，以貼水為佳（114）。</li>\n</ul>\n<h3>常見錯誤選項</h3>\n<ul>\n<li><mark class=\"ok\">✔ 龍安寺石庭只用白砂與 15 石，不用一木。</mark><br><span class=\"ng\">✗ 曾考錯：</span>「龍安寺配置低灌木為林」（100）。</li>\n<li><mark class=\"ok\">✔ 虎渡子法 15 石的排列是 5、2、3、2、3。</mark><br><span class=\"ng\">✗ 曾考錯：</span>「排列 5、3、3、2、3」（102）。</li>\n<li><mark class=\"ok\">✔ 桂離宮是迴遊式庭園的代表。</mark><br><span class=\"ng\">✗ 曾考錯：</span>「桂離宮為枯山水代表」（100）。</li>\n<li><mark class=\"ok\">✔ 千利休代表的是茶庭，桂離宮、南禪寺不是他設計的。</mark><br><span class=\"ng\">✗ 曾考錯：</span>「桂離宮、南禪寺皆千利休設計」（104）。</li>\n<li><mark class=\"ok\">✔ 枯山水是室町時代的代表庭園。</mark><br><span class=\"ng\">✗ 曾考錯：</span>「枯山水為平安時代代表」（100）。</li>\n<li><mark class=\"ok\">✔ 茶庭又稱露地（路地）庭。</mark><br><span class=\"ng\">✗ 曾考錯：</span>「茶庭又稱陋地庭」（100）。</li>\n<li><mark class=\"ok\">✔ 以大石、碎石及沙象徵水與土地的是枯山水。</mark><br><span class=\"ng\">✗ 曾考錯：</span>「這是迴遊式」（101）。</li>\n<li><mark class=\"ok\">✔ 作沉思默想之所的是枯山水，迴遊式是繞池遊賞。</mark><br><span class=\"ng\">✗ 曾考錯：</span>「迴遊式作沉思默想之所」（102）。</li>\n<li><mark class=\"ok\">✔ 日本庭園以砂代水、以石代山。</mark><br><span class=\"ng\">✗ 曾考錯：</span>「日本庭園以土丘代山」（101）。</li>\n<li><mark class=\"ok\">✔ 日本庭園在明治維新後受西洋影響，發展出和洋折衷式。</mark><br><span class=\"ng\">✗ 曾考錯：</span>「日本庭園未受西洋影響」（100）。</li>\n<li><mark class=\"ok\">✔ 日本式庭園以表現自然山水的縮景為主。</mark><br><span class=\"ng\">✗ 曾考錯：</span>「日本式庭園以牆面為主景」（108）。</li>\n<li><mark class=\"ok\">✔ 枯山水庭園是供沉思默想的寫意庭園。</mark><br><span class=\"ng\">✗ 曾考錯：</span>「龍安寺枯山水是表現貧乏生活」（107）、「枯山水用於貴族宴飲」（114）。</li>\n<li>傳統日本庭園形式有枯山水、迴遊式、茶庭；<span class=\"ng\">✗</span> <strong>自然式庭園</strong>不是（103）。<span class=\"ng\">✗</span> <strong>龍山寺</strong>非枯山水代表（103）。</li>\n<li>在臺灣營造枯山水與露地庭，<strong>不可用幾何對稱的花廊</strong>（那是法式，110）。</li>\n</ul>"}, {"id": "c3", "title": "三、造園史：西洋", "short": "造園史：西洋", "html": "<p>西洋史的主線是「規則式 → 風景式」：<strong>義大利坡地台地式 → 法國平地幾何式 → 英國自然風景式 → 美國公園運動</strong>；最常考「誰設計什麼」與「義法差異」。</p>\n<h3>古代與中世紀</h3>\n<table>\n<thead>\n<tr>\n<th>地區</th>\n<th>重點</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>古埃及</td>\n<td><strong>主軸式、對稱幾何</strong>，強調秩序；建材<strong>以石材為主</strong>；以<strong>椰子類</strong>為行道樹；四周圍牆；水池可行舟、降溫、栽植水生植物</td>\n</tr>\n<tr>\n<td>巴比倫</td>\n<td><strong>空中花園</strong>（Hanging Garden），古世界七大奇景、<strong>世界最早的屋頂花園</strong>，結合農業與神廟建築、遠觀像綠色山陵；寶塔式（Ziggurat）建築</td>\n</tr>\n<tr>\n<td>波斯</td>\n<td>幾何式，利用地勢落差形成噴泉，<strong>專供王公貴族</strong>，影響義大利庭園</td>\n</tr>\n<tr>\n<td>古希臘</td>\n<td>初期為實用園（果樹、蔬菜）；類型：公共活動林園、城市宅園、寺廟林園</td>\n</tr>\n<tr>\n<td>古羅馬</td>\n<td>水道系統（水池、噴泉、灌溉、養魚）、銅製或大理石雕像、鑲嵌鋪面</td>\n</tr>\n<tr>\n<td>中世紀歐洲</td>\n<td>建於城堡寺廟內，<strong>以生產蔬果藥材為主</strong>、觀賞其次；花色象徵宗教意義（<strong>白百合＝聖母、紅玫瑰＝神聖之愛</strong>）；<strong>不強調向外借景</strong></td>\n</tr>\n<tr>\n<td>西班牙</td>\n<td>先後被摩爾人征服，帶濃厚東方色彩；阿罕布拉宮「獅子的中庭」1377 年、中央 12 獅；中庭噴泉具降溫功能</td>\n</tr>\n<tr>\n<td>回教庭園</td>\n<td>植物有象徵意義，如杏樹（107 考過）</td>\n</tr>\n<tr>\n<td>荷蘭</td>\n<td>以運河水流為主、列樹、整形樹（孔雀、船、人像）、綠籬區劃</td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li><mark class=\"ok\">✔ 被摩爾人征服、帶濃厚東方色彩的是西班牙。</mark><br><span class=\"ng\">✗ 曾考錯：</span>「古羅馬曾被摩爾人征服」（101）。</li>\n<li><mark class=\"ok\">✔ 古埃及庭園建材以石材為主，以椰子類為行道樹，水池可行舟、降溫、栽植水生植物。</mark><br><span class=\"ng\">✗ 曾考錯：</span>「以木材為主」（106）、「以竹類為行道樹」（105）、「水池具消防功能」（100）、「廣植罌粟花」（114）。</li>\n<li><mark class=\"ok\">✔ 寶塔式（Ziggurat）建築是巴比倫的特徵。</mark><br><span class=\"ng\">✗ 曾考錯：</span>「古希臘運用寶塔式建築」（112）。</li>\n<li><mark class=\"ok\">✔ 羅馬式有水道系統、雕像與鑲嵌鋪面；波斯庭園專供王公貴族。</mark><br><span class=\"ng\">✗ 曾考錯：</span>「羅馬式利用自然地形不加修飾」（106）、「波斯庭園專供一般民眾」（113）。</li>\n</ul>\n<h3>義大利 vs 法國（102 問答、幾乎每年選擇）</h3>\n<table>\n<thead>\n<tr>\n<th>比較</th>\n<th>義大利（文藝復興）</th>\n<th>法國</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>地形</td>\n<td><strong>坡地造園典範</strong>，多層平台（台地式）、最高處可鳥瞰</td>\n<td><strong>平坦地造園</strong>，尤以花壇著稱</td>\n</tr>\n<tr>\n<td>風格</td>\n<td>幾何對稱（規則式）</td>\n<td>幾何式（軸式、對稱式），<strong>人優於自然</strong></td>\n</tr>\n<tr>\n<td>水</td>\n<td>富變化：水魔術、水劇場、驚愕噴泉、水風琴、秘密噴泉</td>\n<td>噴泉及瀑布<strong>較義大利少</strong>，水以雕刻藝術表現於噴水池</td>\n</tr>\n<tr>\n<td>植栽</td>\n<td>本土性常綠灌木與喬木、整形樹；<strong>17 世紀後</strong>整形成鳥獸</td>\n<td>主軸左右廣植樹林與草地，建築旁<strong>模樣花壇</strong>，中心為雕像或缽飾</td>\n</tr>\n<tr>\n<td>其他</td>\n<td>對後世影響最大；代表蓮特莊園（Villa Lante）</td>\n<td>富麗堂皇、反映財勢與嚴格社會結構；發達<strong>晚於義大利</strong></td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li>法國造園家<strong>勒諾特（Le Nôtre）</strong>：設計 <strong>Vaux-le-Vicomte（卜園）</strong> 後法國才發展出自己風格，並為路易十四設計<strong>凡爾賽宮</strong>。<ul>\n<li><mark class=\"ok\">✔ 凡爾賽宮的設計者是勒諾特（為路易十四設計）。</mark><br><span class=\"ng\">✗ 曾考錯：</span>「設計者為路易十四」（100、104）、「為 Repton 代表作」（104）。</li>\n</ul>\n</li>\n<li><mark class=\"ok\">✔ 受山嶺地形影響、發展出平臺式（台地式）庭園並大量運用水流與噴泉的是義大利。</mark><br><span class=\"ng\">✗ 曾考錯：</span>「法國受山嶺地形影響發展平台式」（105）、「平台式庭園、水流與噴泉為法式特色」（104）。</li>\n<li><mark class=\"ok\">✔ 義大利庭園是幾何式（規則式）的坡地造園；法國庭園是在平坦地造園。</mark><br><span class=\"ng\">✗ 曾考錯：</span>「義大利風格為自然式」（103、111）、「法國坡地地形造園」（103）。</li>\n<li><mark class=\"ok\">✔ 凡爾賽宮表現人優於自然；擅長在平坦地造園、以花壇著稱的是法國。</mark><br><span class=\"ng\">✗ 曾考錯：</span>「凡爾賽表現自然優於人」（106）、「英國擅長平坦地花壇」（111）。</li>\n<li><mark class=\"ok\">✔ 文藝復興義大利庭園為幾何式，水池是規則形；文藝復興初期重「植物收集」，促進科學與園藝（112）。</mark><br><span class=\"ng\">✗ 曾考錯：</span>「文藝復興以不規則狀水池為特色」（108）。</li>\n</ul>\n<h3>英國風景式</h3>\n<ul>\n<li>特色：<strong>草地面積特大</strong>、彎曲道路、自然樹叢、<strong>不規則水池</strong>、利用自然地形；<strong>假裝或隱蔽庭園境界以增加寬度與自由外觀</strong>（Ha-ha 陷坑牆）；隱藏不調和設施；<strong>受中國影響</strong>。</li>\n</ul>\n<table>\n<thead>\n<tr>\n<th>人物</th>\n<th>重點</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>肯特 William Kent</td>\n<td>用<strong>不規則式</strong>手法（<span class=\"ng\">✗</span> 直線園路、綠籬，109）</td>\n</tr>\n<tr>\n<td>布朗 Lancelot Brown</td>\n<td>「全能布朗」，以自然式水池為中心改造舊庭園</td>\n</tr>\n<tr>\n<td>康白 William Chambers</td>\n<td>著《東方庭園論》，將中國拱橋、寶塔、亭閣引入英國；邱園 Kew Garden 開「英中折衷式」</td>\n</tr>\n<tr>\n<td>黎樸通 Humphry Repton</td>\n<td>英國風景式極盛，偶在建築旁設平台、整形樹、雕像，<strong>混合式由他開始</strong></td>\n</tr>\n<tr>\n<td>Gertrude Jekyll</td>\n<td>主張<strong>折衷式</strong>，以<strong>草本花卉作邊緣</strong>表現四季變化（110）</td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li><mark class=\"ok\">✔ 《東方庭園論》的作者是康白（Chambers）；《園冶》的作者是明朝計成。</mark><br><span class=\"ng\">✗ 曾考錯：</span>「布朗著《東方庭園論》」（105）、「康白著《園冶》」（113）。</li>\n<li><mark class=\"ok\">✔ 英國風景式不強調庭園邊界，假裝或隱蔽境界以增加寬度與自由外觀。</mark><br><span class=\"ng\">✗ 曾考錯：</span>「英國強調庭園邊界」（100）、「隱蔽境界以減少寬度」（103）。</li>\n<li><mark class=\"ok\">✔ 英國風景式庭園的水池多為不規則狀；Olmsted 是美國造園家。</mark><br><span class=\"ng\">✗ 曾考錯：</span>「英國庭園水池多為幾何狀」（113）、「Olmsted 是英國造園家」（105）。</li>\n<li>文藝復興時將風景繪畫融入造園的是<strong>英國</strong>，<span class=\"ng\">✗</span> 荷蘭（102）。</li>\n</ul>\n<h3>美國</h3>\n<table>\n<thead>\n<tr>\n<th>人物</th>\n<th>重點</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>道寧 Andrew Jackson Downing</td>\n<td>美國<strong>最初的風景式造園家</strong>，提倡自然式；<span class=\"ng\">✗</span> 師承 Olmsted（反了）、<span class=\"ng\">✗</span> 參與黃石公園</td>\n</tr>\n<tr>\n<td>奧姆斯特德 Frederick Law Olmsted</td>\n<td><strong>美國國家公園之父</strong>，<strong>繼承道寧理念</strong>，參與<strong>黃石國家公園</strong>創設，設計<strong>紐約中央公園</strong>（依地形設計道路、中央設草地牧場）</td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li>殖民時代僅似農莊實用園；建國後<strong>東部為英式風景式、西部為西班牙式</strong>。<ul>\n<li><mark class=\"ok\">✔ 美國建國後東部為英式風景式、西部為西班牙式，並非完全抄襲英國。</mark><br><span class=\"ng\">✗ 曾考錯：</span>「西部英式、東部西班牙式」（102）、「英式始於西部、完全抄襲」（101）。</li>\n</ul>\n</li>\n<li><mark class=\"ok\">✔ 紐約中央公園的設計者是 Olmsted；美國最初的風景式造園家是道寧。</mark><br><span class=\"ng\">✗ 曾考錯：</span>「中央公園設計者為 Repton」（100）、「美國最初風景式造園家為康白」（102）。</li>\n</ul>\n<h3>年代排序（108）</h3>\n<p>巴比倫空中庭園 → 日本池泉舟遊式 → 拙政園（明）→ 蓮特莊園 → 凡爾賽 → 紐約中央公園。</p>"}, {"id": "c4", "title": "四、造園概論、分類與設計程序", "short": "造園概論、分類與設計", "html": "<p>概論題最愛考「造園程序四步驟」與「設計程序七步驟」的順序，以及<strong>規劃 vs 設計</strong>、<strong>細部景觀設計 vs 都市設計</strong>的定義互換。</p>\n<h3>造園範疇與重要性</h3>\n<ul>\n<li>造園範疇：庭園設計、植栽設計、<strong>景觀評估與規劃、敷地計畫、細部景觀設計、都市設計、遊憩規劃與設計</strong>；也涵蓋自然保護與景觀保育。</li>\n<li><strong>景觀評估與規劃</strong>：重生態與自然科學、大區域，結果是土地使用計畫或政策建議。<strong>敷地計畫</strong>：將基地特色與使用要求結合的創造性組合。<strong>細部景觀設計</strong>：針對入口、停車場等特定空間，強調材料、植物、構造。<strong>都市設計</strong>：常由政府整合，與社會經濟制度密切，<strong>很少由一人負責</strong>。<ul>\n<li><mark class=\"ok\">✔ 常由政府單位整合、與社會經濟制度關係密切的是都市設計；細部景觀設計是針對入口、停車場等特定空間的細緻設計。</mark><br><span class=\"ng\">✗ 曾考錯：</span>「細部景觀設計常由政府整合」（114）。</li>\n<li><mark class=\"ok\">✔ 對未來土地使用作合理安排、引導開發次序、作為爭取經費依據的是規劃工作。</mark><br><span class=\"ng\">✗ 曾考錯：</span>「這是設計工作」（111）。</li>\n</ul>\n</li>\n<li>造園重要性：<strong>有形</strong>＝經濟性（景觀資源促進觀光）；<strong>無形</strong>＝象徵性、教育性、休閒性、美學性（111）。安全功能：避難疏散、控制交通、減輕風災（<span class=\"ng\">✗</span> 都市進化指標，106）。</li>\n<li>與造園最無關的學科：<strong>熱力學</strong>（108）。造園師工作包含協調道路、橋樑結構工程師（104），並要提供業主維護資料（110）。</li>\n<li>現代造園範圍比傳統廣（遊憩區、環境問題、景觀美質），<strong>沒有嚴格的造型規定</strong>，趨向國際化、低維護、生態綠化。</li>\n</ul>\n<h3>造園分類</h3>\n<table>\n<thead>\n<tr>\n<th>依據</th>\n<th>分類</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>樣式</td>\n<td><strong>規則式</strong>（建築式）、<strong>自然式</strong>、<strong>混合式</strong>；近代造園大多屬混合式</td>\n</tr>\n<tr>\n<td>所有權</td>\n<td>私人、宗教、公共所有（<span class=\"ng\">✗</span> 這是「依位置」，108）</td>\n</tr>\n<tr>\n<td>近代庭園形式</td>\n<td><strong>牆垣式</strong>（牆面為主元素、作植栽背景）、<strong>中庭式</strong>（屋中有院、院中為庭）、<strong>私人式</strong>（打破室內外區隔）、<strong>原野式</strong>（未經修飾基地）、<strong>屋基種植</strong>（隱藏屋基不雅處）、新潮藝術式、<strong>綠洲式</strong>（乾燥區、縮小植栽區、省維護）</td>\n</tr>\n<tr>\n<td>種類</td>\n<td>運動公園、墓園、果園、標本園、牧場、養蜂園都屬造園</td>\n</tr>\n</tbody>\n</table>\n<table>\n<thead>\n<tr>\n<th>比較</th>\n<th>規則式</th>\n<th>自然式</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>線條</td>\n<td>軸線明顯、對稱，力求工整</td>\n<td>無明顯軸線，以看不出人工痕跡為原則</td>\n</tr>\n<tr>\n<td>花壇</td>\n<td><strong>毛氈狀、明顯邊緣與圖案</strong></td>\n<td>絕無圖案花紋</td>\n</tr>\n<tr>\n<td>裝飾</td>\n<td>雕刻、噴泉、運河</td>\n<td>假山、曲水等仿自然裝飾品</td>\n</tr>\n<tr>\n<td>樹木</td>\n<td>整形樹、列植</td>\n<td>保有樹的原型</td>\n</tr>\n<tr>\n<td>代表</td>\n<td>西方古典式</td>\n<td><strong>英國天然式與中國山水式</strong></td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li><span class=\"ng\">✗</span>「花壇呈毛氈狀屬自然式」（100）、<span class=\"ng\">✗</span>「規則式以看不出人工痕跡為原則」（101）、<span class=\"ng\">✗</span>「自然式沒有仿自然裝飾品」（102）。</li>\n</ul>\n<h3>造園程序與設計程序</h3>\n<ol>\n<li>造園程序四步驟：<strong>規劃 → 設計 → 施工 → 維護</strong>，缺一不可。</li>\n<li>設計程序七步驟：<strong>計畫接受 → 研究與分析 → 設計 → 施工圖繪製 → 執行 → 評估 → 維護</strong>。簡化版：研究與分析 → 設計 → 執行 → 維護。</li>\n<li>\n<p>設計方法：<strong>基地調查分析 → 設計構想 → 分區與動線規劃 → 細部設計</strong>；108 年版：訂定目標 → 基地調查與環境分析 → 設計原則確立 → 細部設計 → 工程預算書。</p>\n</li>\n<li>\n<p>各步驟雖有次序，但<strong>可同時進行、重視回饋</strong>，不必拘泥形式（<span class=\"ng\">✗</span>「必須依序固定完成」，111、114）。</p>\n</li>\n<li><strong>基地分析與使用者需求分析是設計成敗基礎</strong>；設計者站在使用者立場考量。</li>\n<li>設計須滿足<strong>機能、人類、生態</strong>之要求；設計品質決定在<strong>設計者</strong>對美學與知覺的了解（<span class=\"ng\">✗</span> 業主，114）。造園設計是<strong>邏輯思考的整合過程</strong>。</li>\n<li>人行道、車道、鋪面宜用<strong>常見尺寸與形式</strong>（<span class=\"ng\">✗</span> 特殊尺寸，109）。基本設計也要考慮美學（105）。</li>\n<li>住宅庭園：考量立地條件（地形、面積、日照、通風）、主人興趣年齡、家人維護能力；<span class=\"ng\">✗</span>「形式只須考量業主喜好」（103、108）。後庭可栽植蔬果。</li>\n</ol>\n<h3>基地調查與潛力</h3>\n<ul>\n<li>基地調查分<strong>自然環境</strong>（地形坡度坡向、土壤、氣候：風向、雨量、日照、水文、植生）與<strong>人文環境</strong>（交通、法規、風俗習慣、土地使用）。<span class=\"ng\">✗</span>「排水系統」不是人文條件（100）。</li>\n<li>原有地物應<strong>盡量保留利用</strong>（<span class=\"ng\">✗</span> 協調移除，102）。山谷道路沿河谷線、利用既有建物、設噴灌系統可省經費；<strong>特殊圖案鋪面無助節省</strong>（110）。</li>\n<li>重要建物設在<strong>高地</strong>以利排水（<span class=\"ng\">✗</span> 低地，109）。車流大、空氣污染重 → 設防塵林、選抗污植栽。</li>\n<li>基地地形會影響全局配置並限制使用發展（114）；地下水位影響水景、植栽、灌溉，<span class=\"ng\">✗</span> 不影響開窗方位（100）；方位影響日照陰影佈局，<span class=\"ng\">✗</span> 不影響施工花費（101）。</li>\n<li>危峻峡谷與低濕地應<strong>少設測點</strong>（102）。</li>\n</ul>\n<h3>生態設計 vs 生態綠化</h3>\n<ul>\n<li><strong>生態設計</strong>：以生態學為出發點、創造自然景緻；使用自然材料、鄉土石材、強調與自然接觸、<strong>反應人類興趣情緒</strong>、注重尺寸合理性；以<strong>零逕流</strong>觀念處理雨水（透水鋪面、卵石層）；以爬藤披覆垂直或水平空間。<ul>\n<li><span class=\"ng\">✗</span>「注重設計風格」（106）、<span class=\"ng\">✗</span>「使用外來種」（103）、<span class=\"ng\">✗</span>「極小化人類興趣情緒」（111）、<span class=\"ng\">✗</span>「以喬木作垂直水平披覆」。</li>\n</ul>\n</li>\n<li><strong>生態綠化</strong>：運用<strong>小樹苗、鄉土樹種</strong>；符合當地生態法則、<strong>抗害力強、建設成本低</strong>、環境保全功能大。<ul>\n<li><span class=\"ng\">✗</span>「運用大樹苗」（110）、<span class=\"ng\">✗</span>「需花較多經費」（101）、<span class=\"ng\">✗</span>「鄉土樹種可選擇性少」（100）、<span class=\"ng\">✗</span>「鄉土樹種易適應不良」（113）。</li>\n</ul>\n</li>\n</ul>\n<table>\n<thead>\n<tr>\n<th>比較（101 問答）</th>\n<th>小樹苗</th>\n<th>大樹苗</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>坡面保護</td>\n<td>植穴小、根系發展快可穩定邊坡</td>\n<td>大植穴破壞坡面、根系發展慢</td>\n</tr>\n<tr>\n<td>育苗</td>\n<td>時間短、體積小</td>\n<td>需長時間培育</td>\n</tr>\n<tr>\n<td>移植</td>\n<td><strong>易移植、成活率高</strong>、抗逆境</td>\n<td>易因移植不當停止生長或死亡</td>\n</tr>\n<tr>\n<td>經費</td>\n<td>低</td>\n<td>高出許多</td>\n</tr>\n</tbody>\n</table>"}, {"id": "c5", "title": "五、造園組合法則與色彩、質地、線條", "short": "造園組合法則與色彩、", "html": "<p>組合法則題幾乎都是「定義對調」：要記住<strong>對稱≠均衡、對比＝突出活力、反覆＝單純統一、漸層＝韻律</strong>。</p>\n<h3>組合法則對照</h3>\n<table>\n<thead>\n<tr>\n<th>法則</th>\n<th>定義與考點</th>\n<th>常被對調成</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>統一 Unity</td>\n<td>局部的形體、數量、色彩、線條、風格<strong>有相似性或一致性</strong>；<strong>不禁止變化</strong>，要「統一中求變化」（盧溝橋石獅）；堆石假山尤重<strong>線條統一</strong></td>\n<td><span class=\"ng\">✗</span> 材料統一（101）</td>\n</tr>\n<tr>\n<td>調和 Harmony</td>\n<td>同性質或相似物擇其風趣相同者配合，融合不突兀；顏色調和最常見於<strong>花壇花色</strong></td>\n<td><span class=\"ng\">✗</span> 人行道喬木（114）</td>\n</tr>\n<tr>\n<td>對比 Contrast</td>\n<td>性質相反之物並陳，<strong>突顯焦點與活力</strong>，但同一園景<strong>不宜頻繁使用</strong>；「山小顯水大」</td>\n<td><span class=\"ng\">✗</span> 漸層（110）</td>\n</tr>\n<tr>\n<td>反覆 Repetition</td>\n<td>同樣材料、形狀、顏色、質地反覆排列；<strong>與創造單純設計最重要的因素</strong>；不同植栽但相同質地可造成單純意象；同形植物等距成列</td>\n<td><span class=\"ng\">✗</span> 調和（109）、<span class=\"ng\">✗</span> 對稱（104）</td>\n</tr>\n<tr>\n<td>漸層 Gradation</td>\n<td>由大而小、由強而弱漸變，<strong>表現韻律</strong>；漸增引起注意、漸減餘韻猶存；天際線屬韻律漸層</td>\n<td><span class=\"ng\">✗</span> 反覆</td>\n</tr>\n<tr>\n<td>對稱 Symmetry</td>\n<td>依一中心線完全相同排列；給人<strong>和平、安穩、嚴肅</strong>感</td>\n<td><span class=\"ng\">✗</span> 神秘、閒適（106）</td>\n</tr>\n<tr>\n<td>均衡（平衡） Balance</td>\n<td>分對稱平衡與<strong>不對稱平衡</strong>；不對稱平衡＝自然式的「神秘的平衡」；給人非整齊但安定優美，可創造焦點、指引動線</td>\n<td><span class=\"ng\">✗</span>「左右形狀完全相同」（101）</td>\n</tr>\n<tr>\n<td>比例 Proportion</td>\n<td>景物間及個體與整體具適當相對大小、數目、顏色的美好關係</td>\n<td></td>\n</tr>\n<tr>\n<td>單純</td>\n<td>枯山水大片草地、水池、石組的組合</td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li><strong>黃金比</strong>：短邊：長邊＝長邊：（長＋短），約 <strong>5：8</strong>（1：1.618）。<span class=\"ng\">✗</span> 4：7（101）、<span class=\"ng\">✗</span> 5：9（106）。</li>\n<li>「山小顯水大、水小顯山高」＝對比；桂林群峰＝近似的調和。</li>\n</ul>\n<h3>色彩</h3>\n<ul>\n<li><strong>色彩三要素</strong>：色相（顏色名稱）、明度（明暗程度）、彩度（純度、飽和度）。清色＝混白、暗色＝混黑。<ul>\n<li><mark class=\"ok\">✔ 明度是色彩的明暗程度，彩度是色彩的純度、飽和度。</mark><br><span class=\"ng\">✗ 曾考錯：</span>「彩度是色彩明暗程度」（110）。</li>\n</ul>\n</li>\n<li>依 110 詳解：紅、黃、藍＝<strong>原色</strong>；橘、綠、紫＝基本色。指示或管制標誌多用<strong>原色</strong>。</li>\n<li>互補色：<strong>紅↔綠、紫↔黃</strong>、藍↔橘；調和色＝色相環相鄰（紅與橘、藍與綠）。</li>\n</ul>\n<table>\n<thead>\n<tr>\n<th>目的</th>\n<th>用色</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>營造熱鬧、喜悅</td>\n<td><strong>暖色系</strong>（紅橙黃），有興奮、前進感</td>\n</tr>\n<tr>\n<td>安靜嚴肅、醫院靜心場所</td>\n<td><strong>冷色系</strong>（藍綠），有放鬆、後退感</td>\n</tr>\n<tr>\n<td>增加庭園深度</td>\n<td><strong>冷色、淡色</strong></td>\n</tr>\n<tr>\n<td>營造焦點、引人注意</td>\n<td><strong>對比色（補色）</strong></td>\n</tr>\n<tr>\n<td>建築外表色彩濃厚</td>\n<td>附近用<strong>清淡顏色</strong>沖淡</td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li><span class=\"ng\">✗</span>「暖色系具放鬆、後退感」（112）、<span class=\"ng\">✗</span>「冷色系是橙、黃」（100）、<span class=\"ng\">✗</span>「冷色不適用醫療院所」（110）、<span class=\"ng\">✗</span>「增加深度用暖色」（102、104）、<span class=\"ng\">✗</span>「焦點用相近色」（113）。</li>\n<li>色彩選擇需照顧綠色變化、葉花果枝的效果，也要考慮<strong>前景與背景</strong>（109、110）。</li>\n<li>園燈光色以<strong>黃色最醒目</strong>（<span class=\"ng\">✗</span> 紅色，107；109）。</li>\n</ul>\n<h3>質地、線條、造型</h3>\n<ul>\n<li><strong>質地</strong>＝物體表面的視覺或觸覺特色，會受觀看距離影響；無質地變異則基地顯平坦、缺吸引力。遠觀整體植物時，<strong>枝條密度</strong>是影響質感的主因。</li>\n<li><strong>線條</strong>：維持一致性可增加秩序感，太多型式會混亂；<strong>曲線創造自然性</strong>（<span class=\"ng\">✗</span> 一致性，110）。</li>\n<li><strong>造型</strong>＝真正的三度空間現象（高、深、寬）。</li>\n<li>「山明水秀、風光明媚」＝<strong>視覺</strong>美感（<span class=\"ng\">✗</span> 聽覺，107）。近代造園藝術歸於造型藝術。</li>\n</ul>"}, {"id": "c6", "title": "六、植物材料：分類與功能", "short": "植物材料：分類與功能", "html": "<p>植物題每屆 6～10 題，高頻點是<strong>植物歸類（草本／木本／球根）</strong>、<strong>水生植物四類</strong>、<strong>空間類型</strong>、<strong>防風林數字</strong>。</p>\n<h3>植物歸類（最愛考「何者不屬於」）</h3>\n<table>\n<thead>\n<tr>\n<th>類別</th>\n<th>考過的植物</th>\n<th>易錯提醒</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>一、二年生草花</td>\n<td><strong>鳳仙花</strong>、三色堇、金魚草</td>\n<td><span class=\"ng\">✗</span> 大理花（球根）、<span class=\"ng\">✗</span> 康乃馨（宿根）、<span class=\"ng\">✗</span> 香水草、口紅花</td>\n</tr>\n<tr>\n<td>宿根（多年生）草花</td>\n<td><strong>康乃馨</strong>、君子蘭、常春花</td>\n<td><span class=\"ng\">✗</span>「君子蘭為球根」（102）</td>\n</tr>\n<tr>\n<td>球根花卉</td>\n<td><strong>大理花、美人蕉、韭蘭</strong></td>\n<td><span class=\"ng\">✗</span> 虎尾蘭不是（113）</td>\n</tr>\n<tr>\n<td>草本觀葉</td>\n<td><strong>文竹、武竹</strong>（莖未木質化）</td>\n<td><span class=\"ng\">✗</span>「文竹武竹為木本」（109、113）</td>\n</tr>\n<tr>\n<td>木本植物</td>\n<td>竹類、棕櫚類、矮仙丹、朱槿、馬櫻丹、錫蘭葉下珠</td>\n<td>竹類是<strong>禾本科</strong>、屬木本；<span class=\"ng\">✗</span> 苔蘚不屬草本（103）</td>\n</tr>\n<tr>\n<td>灌木</td>\n<td>紅蝴蝶、綠珊瑚、台灣黃楊</td>\n<td><span class=\"ng\">✗</span> 緬梔是喬木（101）</td>\n</tr>\n<tr>\n<td>蔓藤</td>\n<td>九重葛、炮仗花、牛花、凌霄花、珊瑚藤、白蝴蝶</td>\n<td><span class=\"ng\">✗</span> 金露花不是蔓性（103）</td>\n</tr>\n<tr>\n<td>草坪</td>\n<td>百慕達草（狗牙根，禾本科）、韓國草、台北草、百喜草</td>\n<td></td>\n</tr>\n<tr>\n<td>室外觀葉植物</td>\n<td>馬拉巴栗、垂葉榕、虎尾蘭：移入室內一段時間需移室外養護</td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<h3>水生植物四類（110、112、113 都考）</h3>\n<table>\n<thead>\n<tr>\n<th>類型</th>\n<th>代表</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>挺水植物</td>\n<td><strong>海芋、鳶尾</strong></td>\n</tr>\n<tr>\n<td>浮葉植物</td>\n<td><strong>睡蓮、水金英、莕菜</strong></td>\n</tr>\n<tr>\n<td>沉水植物</td>\n<td><strong>金魚藻</strong>、水蘊草</td>\n</tr>\n<tr>\n<td>漂移（漂浮）植物</td>\n<td><strong>布袋蓮</strong>、滿江紅</td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li><span class=\"ng\">✗</span>「水金英為挺水植物」（104）、<span class=\"ng\">✗</span>「珊瑚藤、水金英為沉水」（100）、<span class=\"ng\">✗</span>「布袋蓮是挺水」（113）；<span class=\"ng\">✗</span> 氣生植物不是水生植物（105）。</li>\n<li>人工湖或沼澤的滯水，最好有水生植物點綴，增加立體情趣。</li>\n</ul>\n<h3>樹形與視覺特性</h3>\n<table>\n<thead>\n<tr>\n<th>外形</th>\n<th>代表／用法</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>圓形</td>\n<td>正榕；可調和外形特殊植物；<strong>重複使用產生統一</strong>；單株不易成焦點</td>\n</tr>\n<tr>\n<td>圓柱形</td>\n<td>福木；可作焦點</td>\n</tr>\n<tr>\n<td>金字塔（圓錐）形</td>\n<td>羅漢松、<strong>臺灣肖楠</strong>；與尖聳地形呼應；與低圓植物搭配形成焦點</td>\n</tr>\n<tr>\n<td>紡錘形</td>\n<td>引導視線垂直向上</td>\n</tr>\n<tr>\n<td>垂枝形</td>\n<td><strong>垂柳</strong>；用於水邊，象徵水的流動</td>\n</tr>\n<tr>\n<td>散形（水平展開）</td>\n<td><strong>第倫桃</strong>；給人寬闊感，<strong>調和低水平建築</strong></td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li><span class=\"ng\">✗</span>「垂柳—紡錘形」（105）、<span class=\"ng\">✗</span>「調和水平建築宜種狹長聳直的側柏」（110）。</li>\n<li><strong>特殊形（優形樹）</strong>：樹形優良、開花美麗、或具紀念性；應<strong>單植</strong>於顯著位置，避免 2 株以上；<span class=\"ng\">✗</span>「多同時配植數株」（100）。獨立植物不可大量使用（114）。</li>\n<li>植物大小是<strong>最重要的視覺特性</strong>；中大型喬木 9～12 m、小喬木 4.5～6 m。</li>\n</ul>\n<h3>植物的建築功能：五種空間（100 配合題）</h3>\n<table>\n<thead>\n<tr>\n<th>空間</th>\n<th>構成與感覺</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>開放空間</td>\n<td>低矮灌木與地被界定，外向、無私密性</td>\n</tr>\n<tr>\n<td>半開放空間</td>\n<td><strong>在某側用較高植物造成較強封閉性</strong>，限制視線穿透</td>\n</tr>\n<tr>\n<td>遮蓋空間</td>\n<td>高過頭頂的樹蓬形成天花板，四周開放；雙植道路兩側樹冠交錯亦成遮蓋空間與框景</td>\n</tr>\n<tr>\n<td>封閉的遮蓋空間</td>\n<td>在遮蓋空間的道路兩側加<strong>中小型植物封閉</strong></td>\n</tr>\n<tr>\n<td>垂直空間</td>\n<td>高而細的植物封閉兩側，引導視線向上；<strong>大量的樹幹可暗示垂直空間</strong></td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li>地被與草坪作<strong>地面</strong>，暗示空間邊緣（<span class=\"ng\">✗</span> 創造垂直空間，108）。高大枝葉濃密的落葉灌木，冬天空間<strong>較開放</strong>（110）。</li>\n<li>植栽置<strong>山谷→減緩起伏</strong>、置<strong>凸面→增加起伏</strong>（111 題目顛倒）。</li>\n<li>私密性植栽常用於私密座位區與住宅前後院露臺（111）。</li>\n</ul>\n<h3>植物的視覺功能</h3>\n<table>\n<thead>\n<tr>\n<th>植物</th>\n<th>視覺功能</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>中大型喬木</td>\n<td>優勢視覺元素；<strong>小基地不宜使用過多</strong></td>\n</tr>\n<tr>\n<td>小喬木</td>\n<td>作焦點的<strong>前景</strong>、防止人在樹下走動</td>\n</tr>\n<tr>\n<td>大灌木</td>\n<td>垂直面上當一面牆，遮蔽與私密性控制</td>\n</tr>\n<tr>\n<td>小灌木（1 m 以下）</td>\n<td>界定區分空間、<strong>聯繫不相關元素</strong>，<strong>不阻絕視線</strong>；使場域小巧親密</td>\n</tr>\n<tr>\n<td>地被植物</td>\n<td><strong>連接分散元素達到統一</strong>；穩定陡坡土壤；陰暗樹下可用地被取代草地</td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li>植栽高度與空間感：<strong>膝高→引導</strong>、<strong>腰高→交通控制</strong>（106）、<strong>胸高→分隔</strong>。綠籬 45 cm 分界、胸高 120 cm 阻斷、170 cm 以上阻絕（105）。<ul>\n<li><strong>綠籬高度這組數字出自 105 年是非題（答案 ○）</strong>。</li>\n</ul>\n</li>\n<li>質地與顏色：<strong>粗質地、深色→距離變近（趨近觀賞者）</strong>；<strong>細質地、淡色→距離變遠</strong>，小空間顯寬大。大多數植物屬中質地，可作過渡。<ul>\n<li><span class=\"ng\">✗</span>「細質地具向觀賞者移動功能」（106）、<span class=\"ng\">✗</span>「粗質地有遠離效果」（100）、<span class=\"ng\">✗</span>「深色調植栽有遠離傾向」（104）。</li>\n</ul>\n</li>\n<li>植物顏色配置：<strong>深綠置下層、淺綠置上層</strong>才穩重（<span class=\"ng\">✗</span> 題目顛倒，105）；深色植栽可作淡色材料背景。</li>\n<li>植物的美學功能：框景者、柔化建築、強調焦點；<span class=\"ng\">✗</span>「界定空間邊界」屬建築功能（101）；<span class=\"ng\">✗</span> 把景物圈圍、對準焦點是「框景者」而非「統一者」（100）。</li>\n</ul>\n<h3>氣候、污染、沖蝕、光線控制</h3>\n<ul>\n<li><strong>防風林</strong>：高寬比 <strong>1：11.5</strong> 最佳；密度 <strong>50～60%</strong> 最佳（<span class=\"ng\">✗</span> 越密越好、<span class=\"ng\">✗</span> 70～80%）；風速最低處在<strong>樹高 3～4 倍</strong>（<span class=\"ng\">✗</span> 6～11 倍，107）；林帶與風向垂直；不規則斜屋頂式樹冠減風較好；樹種選生長快者。</li>\n<li><strong>防音植栽</strong>：密生、常綠、表面粗糙、<strong>分枝高度低</strong>、植栽帶加寬並靠近音源；<span class=\"ng\">✗</span>「葉面光滑尤佳」（100）、<span class=\"ng\">✗</span>「分枝高度高」（105、106）。植栽減噪靠緩衝、反射、吸收（<span class=\"ng\">✗</span> 光合，104）。</li>\n<li>蒸散作用吸收熱量降溫；森林地表溫度較林外低 3～4℃；針葉林下落雨量 60%、闊葉林 80%；葉面絨毛吸附懸浮粒子。</li>\n<li>樹冠減少雨滴直接打擊地面；枯枝落葉層<strong>增加</strong>土壤透水吸水性（<span class=\"ng\">✗</span> 減少，111、114）。</li>\n<li>遮光：在<strong>東、西兩方</strong>栽植阻擋晨光與午後西曬（<span class=\"ng\">✗</span> 南北，106）；質感重的濃綠遮蔭樹緩和人工鋪面反光；冬需陽光、夏需遮蔭處種落葉樹。</li>\n</ul>"}, {"id": "c7", "title": "七、植栽配置、栽培管理與病蟲害", "short": "植栽配置、栽培管理與", "html": "<p>配置題的答案公式：<strong>群植用奇數、三株成不等邊三角、三植法二一分配、優形樹單植</strong>；管理題的答案公式：<strong>摘心不保直立幹形、避開花芽分化期修剪、輪作防病</strong>。</p>\n<h3>植栽組合手法</h3>\n<table>\n<thead>\n<tr>\n<th>手法</th>\n<th>重點</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>單植（孤植）</td>\n<td>易成主景；優形樹、特殊形用單植；圓形單株無法成焦點</td>\n</tr>\n<tr>\n<td>雙植（對植）</td>\n<td>整齊有秩序，<strong>多為配景</strong>；道路兩側雙植有<strong>透景</strong>作用、增加景深；不是唯一方式</td>\n</tr>\n<tr>\n<td>三植法</td>\n<td>主樹、副樹、配樹，配成<strong>不等邊三角形</strong>，<strong>二、一分配</strong>（<span class=\"ng\">✗</span> 三、一分配，106）</td>\n</tr>\n<tr>\n<td>叢植（樹叢）</td>\n<td>三株一叢排成不等邊三角，<strong>不成直線或正三角</strong>；單一樹種叢植：立面參差錯落、平面疏密有致、保持視覺距離，不必有主景、不求對比</td>\n</tr>\n<tr>\n<td>群植</td>\n<td>最能表現天然生長狀況、產生整體感；<strong>奇數、少於 7 株</strong>；避免簇群間空隙、善用樹蓬下空間；不同植物群增加接觸面可加強完整性</td>\n</tr>\n<tr>\n<td>列植</td>\n<td>行道樹：道路兩側等距列植高大樹木</td>\n</tr>\n<tr>\n<td>綠籬</td>\n<td>成列密植灌木；枝葉茂密、耐修剪；<strong>密葉型竹類適合作綠籬</strong>；兼具觀賞與區隔：高 120 cm、寬 60 cm</td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li><mark class=\"ok\">✔ 群植的數目原則上以奇數為宜。</mark><br><span class=\"ng\">✗ 曾考錯：</span>「群植以雙數為宜」（100、101、102、109、113 五度考）。</li>\n<li><mark class=\"ok\">✔ 單植易成主景；雙植整齊有秩序，多為配景。</mark><br><span class=\"ng\">✗ 曾考錯：</span>「單植過於單調難成主景、雙植易成主景」（105）。</li>\n<li><mark class=\"ok\">✔ 群植時不同種類植物的數量或組成不宜過多。</mark><br><span class=\"ng\">✗ 曾考錯：</span>「大面積栽植不同種花木稱為群植」（103、109）。</li>\n<li>群植時喬木與灌木組合要點：量體相稱、型態協調、疏密得宜（<span class=\"ng\">✗</span> 習性變化，106）。植物分散種植會有散漫雜亂感。</li>\n</ul>\n<h3>栽培管理</h3>\n<ul>\n<li>苗木來源：種子繁殖（實生苗）與營養繁殖（嫁接、扳插、高壓、組織培養）。種子實生苗<strong>不是</strong>營養繁殖（113）。使用育苗床可集約保護幼苗。</li>\n<li><strong>中耕</strong>：鬆解表土硬化、增加空氣流通與水分滲透、除草；<span class=\"ng\">✗</span>「去除病蟲害」（104）、<span class=\"ng\">✗</span>「控制病原菌」（106）。</li>\n<li>不透明塑膠布覆蓋番面：抑制雜草、調節水分蒸散、減少病蟲害；苗木應淘汰生長勢弱者。</li>\n<li><strong>摘心</strong>：苗期或定植後摘除頂部；目的＝<strong>增加開花數、調節花期、整形</strong>；<span class=\"ng\">✗</span>「保持直立幹形」（100、101、102、110、113 五度考，要保持直立幹形的「不需」摘心）。</li>\n<li><strong>整枝</strong>：控制枝條數及生長、去除多餘側枝弱小枝；觀賞性造園植物需適當修剪。</li>\n<li><strong>土壤消毒</strong>：目的是<strong>降低有害微生物密度</strong>（<span class=\"ng\">✗</span> 完全殺死，113）。</li>\n</ul>\n<table>\n<thead>\n<tr>\n<th>消毒法</th>\n<th>數字</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>濕熱 60℃</td>\n<td>30 分鐘（大部分病原菌死亡）</td>\n</tr>\n<tr>\n<td>45～50℃</td>\n<td>12 小時</td>\n</tr>\n<tr>\n<td>80℃</td>\n<td><strong>10 分鐘完全消毒</strong></td>\n</tr>\n<tr>\n<td>蓄水消毒法</td>\n<td>水深 10～15 cm、浸 25～35 天</td>\n</tr>\n<tr>\n<td>氯化苦</td>\n<td>土壤<strong>微溼</strong>時施作（<span class=\"ng\">✗</span> 乾燥）；可殺線蟲、雜草種子</td>\n</tr>\n<tr>\n<td>必速滅（邁隆）</td>\n<td>地溫低於 8℃ 無效</td>\n</tr>\n<tr>\n<td>乾熱消毒</td>\n<td>一次量少、易破壞土壤物理性，較少使用</td>\n</tr>\n</tbody>\n</table>\n<h3>病蟲害防治</h3>\n<ul>\n<li>病害分兩大類：<strong>病原菌引起的傳染性病害</strong>與<strong>生理傷害引起的非傳染性病害</strong>（103、106 都把兩者顛倒出題）。營養不平衡或缺乏養分屬生理病害。</li>\n<li>同一區域多種植物同時發生類似症狀且<strong>無擴大</strong>，多為凍害、霜害、煙害或空氣污染（非傳染性，112、113）。</li>\n<li>毒素病：由<strong>病毒</strong>引起，黃化、病斑、畸形、萎縮；<strong>無農藥可根治</strong>，發現病株立即拔除燒毀；可用無菌操作取生長點（莖頂培養）培育健康苗。</li>\n<li>防治法分類：<strong>耕作防治</strong>（輪作、抗病品種、無病苗、良好肥水通風管理）；<strong>化學</strong>（農藥殺蟲劑）；<strong>生物</strong>（天敵，如瓢蟲幼蟲治蚊蟲；利用不孕性雌蟲）；<strong>物理</strong>（色彩黏板）。<ul>\n<li><mark class=\"ok\">✔ 利用色彩黏膠帶誘殺害蟲屬於物理防治。</mark><br><span class=\"ng\">✗ 曾考錯：</span>「色彩黏膠帶是生物防治」（100）。</li>\n<li><mark class=\"ok\">✔ 輪作可降低有害微生物密度、減少病原與寄主的寄生關係。</mark><br><span class=\"ng\">✗ 曾考錯：</span>「連作可降低有害微生物密度」（111、113）。</li>\n<li><mark class=\"ok\">✔ 防治病害應減少 N 肥、增加 P、K 肥。</mark><br><span class=\"ng\">✗ 曾考錯：</span>「大量提高 N 肥、降低 P、K」（109）。</li>\n</ul>\n</li>\n<li>有機硫磺可抑制白粉病，對斑點性病害無效（102）。萬靈、好年冬＝<strong>滲透性殺蟲劑</strong>，治介殼蟲，毒性強需防護（110）。</li>\n<li>黑松移植包裹樹幹可防蟲害（102）。</li>\n</ul>"}, {"id": "c8", "title": "八、造園材料", "short": "造園材料", "html": "<p>材料題每屆 4～6 題，最常考的是<strong>岩石三大類</strong>、<strong>桂竹抗彎最大</strong>、<strong>合金配對</strong>、<strong>GRC 與 FRP</strong>。</p>\n<h3>石材（岩石三大類）</h3>\n<table>\n<thead>\n<tr>\n<th>類別</th>\n<th>代表石材</th>\n<th>易錯提醒</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>火成岩</td>\n<td><strong>花崗岩</strong>（石英、長石、雲母）、<strong>安山岩</strong>（含鐵多色深）、<strong>玄武岩</strong>（澎湖花嶼、恆春尖山）、橄欖岩</td>\n<td><span class=\"ng\">✗</span> 玄武岩由珊瑚構成（100）；花崗岩是深成岩非噴出岩；石英安山岩主成分為石英與鈣鹼質長石（<span class=\"ng\">✗</span> 鐵礦物，114）</td>\n</tr>\n<tr>\n<td>沉積岩</td>\n<td><strong>石灰岩</strong>、頁岩、砂岩；生物岩：<strong>硓碡石</strong>（珊瑚礁，恆春最多）</td>\n<td><span class=\"ng\">✗</span>「石灰岩屬火成岩」（100）、<span class=\"ng\">✗</span>「有機水成岩有橄欖岩、板岩」（102）</td>\n</tr>\n<tr>\n<td>變質岩</td>\n<td><strong>大理石</strong>（碳酸鈣 98% 以上，黑奇石亦是）、<strong>板岩</strong>（頁岩泥岩變質）、<strong>蛇紋岩</strong>、石英岩</td>\n<td><span class=\"ng\">✗</span>「大理石屬沉積岩」（101、111）</td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li>臺灣常見造園石材：玄武岩、奇麗石、帝王石、<strong>五彩石片</strong>、觀音山石、璉礫岩；<strong>太湖石不產於臺灣</strong>（100、101）。</li>\n<li>石材不耐震、部分遇高溫會破裂；石造建築從古埃及開始發展。</li>\n<li>法則：群置石景「三不等」＝<strong>大小、高低、間距不等</strong>（<span class=\"ng\">✗</span> 色彩不等，105）。</li>\n</ul>\n<h3>木材與竹材</h3>\n<ul>\n<li><strong>木材特點</strong>：質輕、強度大、比重小、易加工、膨脹係數小、<strong>對稀鹽稀酸有抵抗性</strong>、為熱音電不良導體；非均勻體強度不均。<ul>\n<li><span class=\"ng\">✗</span>「木材對稀鹽、稀酸不具抵抗力」：106、108 都考。</li>\n</ul>\n</li>\n<li><strong>心材優於邊材</strong>（邊材淡色、心材濃色）；髓線多者好；木理緻密者為良材易加工、少龜裂；闊葉樹光澤較針葉樹好；新鮮木材皆有香氣。木材外在性質：色彩、氣味、木理、光澤（<span class=\"ng\">✗</span> 質地，103）。</li>\n</ul>\n<table>\n<thead>\n<tr>\n<th>木材</th>\n<th>重點</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>針葉樹</td>\n<td>檜木、柏木、杉木、松木、柳杉；<span class=\"ng\">✗</span> 榆木、柚木、柳安是闊葉樹</td>\n</tr>\n<tr>\n<td>杉木</td>\n<td><strong>木理通直、有香氣、不耐腐、軟而韌、強度不大</strong></td>\n</tr>\n<tr>\n<td>松木</td>\n<td>適用<strong>乾濕交觸處、可用於水中</strong>（<span class=\"ng\">✗</span> 不耐水）</td>\n</tr>\n<tr>\n<td>黃楊木</td>\n<td>紋理均勻、淡黃、光滑，適合雕刻印章</td>\n</tr>\n<tr>\n<td>榆木</td>\n<td>易蛀蟲</td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li><strong>竹材</strong>：竹青（表皮）堅韌富彈性；<strong>竹內（基本組織）粗鬆易蛀腐</strong>；竹簧為髓層；中空有節；抗拉強、彈性大、富割裂、易乾燥；<strong>耐久性約 5 年</strong>（<span class=\"ng\">✗</span> 50 年，105）；使用以<strong>美觀為主、牢固次之</strong>；常見於日本式庭園。</li>\n<li><strong>桂竹抗彎強度最大、綠竹最小</strong>；桂竹以嘉義、南投產量最多。<ul>\n<li><span class=\"ng\">✗</span>「綠竹之抗彎強度最大」：100、101、102、109 四度考。</li>\n</ul>\n</li>\n<li>玉山箭竹為臺灣原有竹類，分布海拔 1800～3000 m。</li>\n</ul>\n<h3>金屬</h3>\n<table>\n<thead>\n<tr>\n<th>材料</th>\n<th>成分</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>青銅</td>\n<td><strong>銅＋錫</strong></td>\n</tr>\n<tr>\n<td>黃銅</td>\n<td><strong>銅＋鋅</strong>；α 黃銅＝銅 70%＋鋅 30%</td>\n</tr>\n<tr>\n<td>不銹鋼</td>\n<td><strong>鐵＋鉤（鎳）</strong>（<span class=\"ng\">✗</span> 鐵＋鋁、<span class=\"ng\">✗</span> 鐵＋銅）</td>\n</tr>\n<tr>\n<td>馬口鐵</td>\n<td><strong>鍍錫鋼片</strong></td>\n</tr>\n<tr>\n<td>白鐵</td>\n<td><strong>鍍鋅鐵片</strong>，常作屋頂</td>\n</tr>\n<tr>\n<td>鑄鐵</td>\n<td>含碳 <strong>1.7% 以上</strong>；鋼材含碳低於 1.7%</td>\n</tr>\n<tr>\n<td>鐵的分類</td>\n<td>鑄鐵、硬鋼、軟鋼、鍊鐵依<strong>碳</strong>含量區分</td>\n</tr>\n<tr>\n<td>鋁合金</td>\n<td>輕金屬結構材料；園燈軀殼多為鋁製或 FRP 製</td>\n</tr>\n</tbody>\n</table>\n<h3>黏土製品（磚）</h3>\n<ul>\n<li>普通磚：品質良好者<strong>吸水率小</strong>、兩磚相擊聲響清脆；品質與窯心、窯邊火候有關。<span class=\"ng\">✗</span>「普通磚標準規格為 6×12×18 cm」（100）。</li>\n<li><strong>二丁掛磁磚 60×227 mm</strong>；一丁掛、二丁掛、三丁掛差在大小。</li>\n<li>釉磚適用於<strong>溼度高</strong>場所（<span class=\"ng\">✗</span> 乾燥，100、114）。路面磚需高抗壓與耐磨；克硬化磚（高壓磚）適合人行道、廣場、停車場、車道。</li>\n<li>輕磚（多孔磚）用於隔間、外牆、填充架構，不作荷重；鋼筋磚可灌入鋼筋與砂漿補強（112）。</li>\n<li>耐火磚耐火溫度不低於 1580℃；玻璃磚中空作隔絕層；磁磚現場加工困難、反射大；石質馬賽克不施釉。</li>\n<li>文化瓦屬洋瓦、灰黑色；琉璃瓦光滑不吸水。</li>\n</ul>\n<h3>混凝土</h3>\n<ul>\n<li>骨材＝填充材料（卵石、河沙、碎石、爐渣、洗過的海沙山砂；<span class=\"ng\">✗</span> 木料），約占混凝土體積 <strong>70～80%</strong>（<span class=\"ng\">✗</span> 20～30%）。</li>\n<li><strong>級配</strong>＝骨材顆粒大小混合的程度（<span class=\"ng\">✗</span> 水泥顆粒，113）。</li>\n<li>優點：不受尺寸形狀限制、塑性高、抗壓強、不需熟練工、造價經濟。缺點：<strong>重量大</strong>、抗拉抗彎弱、<strong>品質與施工管理不易</strong>（114）。</li>\n<li>PC＝混凝土、RC＝鋼筋混凝土（<span class=\"ng\">✗</span> PC 為鋼筋混凝土，110）。</li>\n</ul>\n<h3>塑膠、塗料與其他</h3>\n<table>\n<thead>\n<tr>\n<th>代號</th>\n<th>意思</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>GRC</strong></td>\n<td>玻璃纖維強化<strong>水泥</strong>，混凝土製品、輕巧易塑（<span class=\"ng\">✗</span>「GRC 是玻璃纖維」，101）</td>\n</tr>\n<tr>\n<td><strong>FRP</strong></td>\n<td>玻璃纖維強化<strong>塑膠</strong>，又名塑膠鋼、強力塑膠；用<strong>長纖維</strong>；依含鹼分 E、C、A 級</td>\n</tr>\n<tr>\n<td>PVC</td>\n<td>聚氯乙烯塑膠管（<span class=\"ng\">✗</span> 鍍鋅鋼管，102）</td>\n</tr>\n<tr>\n<td>PE</td>\n<td>聚乙烯</td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li>FRP、GRC <strong>不是栽培介質</strong>（100）；FRP <strong>不是塑膠管</strong>（常用 PE、PVC、PP，100）。</li>\n<li>油性塗料用於建築內外防蝕裝飾、木材防蝕可用；<strong>水性塗料：乾燥快、價廉、無臭、耐鹼、不耐雨水沖洗</strong>（111 題目將此說成油性）。</li>\n<li>針筆需用專用墨水（107）。</li>\n</ul>"}, {"id": "c9", "title": "九、園景結構與設施", "short": "園景結構與設施", "html": "<p>這章是<strong>數字題重災區</strong>：階梯 2R+T=66、步道 ≤10%、車道 &lt;9%、坡道 1/12、遊戲水池 10～30 cm、飛石間隔 10 cm，幾乎每屆都考。</p>\n<h3>階梯</h3>\n<blockquote class=\"fx\">2R + T = 63 ～ 66 cm\n</blockquote>\n<ul>\n<li><strong>R＝升面（高度）、T＝踏面（深度）</strong>；特殊情況 2R+T=66～67。<ul>\n<li><span class=\"ng\">✗</span>「2T+R=66」（101）、<span class=\"ng\">✗</span>「R+2T=66」（106、112）、<span class=\"ng\">✗</span>「T 為升面、R 為踏面」（110、114）。</li>\n</ul>\n</li>\n<li>踏面最小深度 <strong>28 cm</strong>、一般不超過 45 cm；升面約 <strong>10～16.5 cm</strong>，小於 10 cm 易被忽略而危險；升面高度應固定不變化。<ul>\n<li><span class=\"ng\">✗</span>「R 一般約 28 cm」（100）、<span class=\"ng\">✗</span>「T 至少 15 cm」（102）、<span class=\"ng\">✗</span>「T 不超過 17.6 cm」（108）、<span class=\"ng\">✗</span>「踏面最小 25 cm、升面 16～20 cm」（112）。</li>\n</ul>\n</li>\n<li>一般園內階梯 3～4 級，<strong>至多 7～9 級</strong>；登山步道每 12～20 階設一平臺；踏面應與動線方向垂直。階段可使庭園有立體感與寬廣錯覺。</li>\n<li>整齊式階梯材料：<strong>水泥板、石板</strong>（108）。</li>\n</ul>\n<h3>道路、步道、坡道</h3>\n<table>\n<thead>\n<tr>\n<th>項目</th>\n<th>數字</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>一般步道寬</td>\n<td><strong>至少 1.83 m</strong>（105 寫 1.8 m）；考慮緊急使用 <strong>2.44 m</strong></td>\n</tr>\n<tr>\n<td>園路（單人或兩人並行）</td>\n<td>0.8～1.5 m；人行道 1.5～3 m</td>\n</tr>\n<tr>\n<td>步道斜度</td>\n<td><strong>最大不可超過 10%</strong>，超過須經工程師同意；步行道以 1/15 內為宜</td>\n</tr>\n<tr>\n<td>車道坡度</td>\n<td><strong>小於 9%</strong>；縱斜度約 1/10</td>\n</tr>\n<tr>\n<td>單行道</td>\n<td>路面 <strong>3.66 m</strong>；含路肩約 4.88 m</td>\n</tr>\n<tr>\n<td>主要雙行道</td>\n<td>路面 <strong>6.71 m</strong></td>\n</tr>\n<tr>\n<td>車道最狹寬度</td>\n<td>2.4 m（104）</td>\n</tr>\n<tr>\n<td>路面排水坡度</td>\n<td><strong>1～3%</strong>；路之橫斜度 1/10～1/30</td>\n</tr>\n<tr>\n<td>無障礙坡道</td>\n<td><strong>不超過 1/12</strong>（升高 1 m 水平 12 m，即 8.33%）；<strong>兩平台間坡道不超過 9 m</strong>；設於主要動線、設計初期就決定</td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li><span class=\"ng\">✗</span>「人行步道坡度不宜大於 5%」（112）、<span class=\"ng\">✗</span>「兩平台間坡道至少 12 m」（109、110）、<span class=\"ng\">✗</span>「坡道設於視覺遮蔽處」（114）、<span class=\"ng\">✗</span>「一般步道寬 1 m」（111、113）、<span class=\"ng\">✗</span>「路面排水坡度至少 6%」（104）。</li>\n</ul>\n<h3>飛石（步石、踏石）</h3>\n<ul>\n<li>直徑 <strong>30～50 cm、龜甲型</strong>為佳（112 詳解寫 20～50 cm）；厚度 6 cm 以上。</li>\n<li><strong>每石間隔約 10 cm</strong>；<strong>突出地面 3～6 cm</strong>；<strong>2 m 中鋪 4～5 塊</strong>。<ul>\n<li><span class=\"ng\">✗</span>「間隔 30 cm」（101）、<span class=\"ng\">✗</span>「40～50 cm」（102）、<span class=\"ng\">✗</span>「大於 50 cm 以促進步幅」（114）。</li>\n</ul>\n</li>\n<li>排列：<strong>千鳥法</strong>＝左右交互排列；<strong>飛雁法</strong>＝作雁之飛行狀；二丁步、三丁步代橋。<span class=\"ng\">✗</span>「千鳥法為雁行」（112）。</li>\n</ul>\n<h3>遊戲設施</h3>\n<table>\n<thead>\n<tr>\n<th>項目</th>\n<th>規定</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>地面材料</td>\n<td><strong>沙、軟木或彈性合成材料</strong>；鋪設範圍大於設施四周 <strong>180 cm</strong> 以上</td>\n</tr>\n<tr>\n<td>鞦韆搭擺設施</td>\n<td>四周<strong>至少 3 m</strong> 軟性材料</td>\n</tr>\n<tr>\n<td>遊戲水景池深</td>\n<td><strong>10～30 cm</strong>；池底<strong>止滑</strong>、避免急流、機械設施設防護欄</td>\n</tr>\n<tr>\n<td>組件開口</td>\n<td><strong>避免 V 形開口</strong></td>\n</tr>\n<tr>\n<td>幼兒設施高度</td>\n<td>低於 150 cm</td>\n</tr>\n<tr>\n<td>年齡偏好</td>\n<td>低年級喜簡單重複、高年級喜複雜冒險；旋轉台、旋轉球、單槓適合 5～6 歲（107）</td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li><span class=\"ng\">✗</span> 池深 10～45 cm（103）、50 cm（104）、40～50 cm（110）、20～40 cm（113）、30 cm 以上（114）；<span class=\"ng\">✗</span> 池底光滑（107、114）。</li>\n<li><span class=\"ng\">✗</span> 鋪設範圍 100 cm（106）、120 cm（101）；<span class=\"ng\">✗</span> 鞦韆 1 m（114）。</li>\n<li>遊戲設施簡單有變化、可容納多人，<strong>不宜密集配置</strong>；附近應設家長座椅；周圍避種有毒有刺植物；社區公園可設動物飼養地，注意安全（110）。</li>\n</ul>\n<h3>座椅、休憩與服務設施</h3>\n<ul>\n<li>園椅高度兩版本數字不同，作答時看題目標的出處：<ul>\n<li>《地景》：一般園椅<strong>高 40～45 cm、深 30～45 cm</strong>。來源：102 年是非第 17 題（答案 ○，出處《地景》p.126）。</li>\n<li>東大《造園》上冊：<strong>成人座椅高 46～51 cm</strong>。來源：114 年選擇第 39 題（答案 B，出處東大上冊 p.152）。</li>\n<li>三民版：<span class=\"ng\">✗</span>「成人座椅坐面高於地面 30～46 cm、寬度約 46～51 cm」。來源：101 年是非第 18 題（答案 <span class=\"ng\">✗</span>，出處三民 p.152），考卷未附正解。</li>\n</ul>\n</li>\n<li>ㄈ形座椅較直線形有利交談；座下鋪礫石減少泥巴；花臺矮牆可當短時座椅。</li>\n<li>涼亭可設於低凹處（抬高防積水）或陡坡（架空）（110）。廊、舫亦有休憩功能；頂部木格子攝附蔓性植物的花架可分隔景物。</li>\n<li>格子牆：搭配落葉藤蔓，夏天遮蔭、冬天透陽（114）。</li>\n<li>飲水台高約 80 cm（107）；公廁是風景遊樂區必要設施，設於非主要眺望區、活動集中處，出入口採<strong>正面退縮</strong>。</li>\n<li>圍牆高 180 cm 以上；欄杆約 90 cm（<span class=\"ng\">✗</span> 120 cm，104）；花柵 50～60 cm。花臺＝中國古典園林特有、高型花壇。</li>\n<li>鳥舍與鳥浴盆為添景；招引野鳥：生物、人工鳥巢、電子招引皆是（106）。</li>\n</ul>\n<h3>水景</h3>\n<ul>\n<li><strong>四種基本型態：滯（靜）、流、落、噴</strong>；來源「湧出」（103 配合）。<span class=\"ng\">✗</span> 「沖」不是（106）。</li>\n<li>水景具擴大、連結、隔離、統一功能；<strong>東方庭園多流水、靜態水景，偏向自然式瀑布</strong>（<span class=\"ng\">✗</span> 噴泉、台階式瀑布，106）。</li>\n<li>「落水」垂直落下展現力感（<span class=\"ng\">✗</span> 滯水，105）；瀑布氣勢最雄壯；噴水具意外突發、常成焦點。</li>\n<li>水流<strong>上游坡度宜大於下游</strong>（102、112）；連續性水岸＝幾乎由單一素材構成。</li>\n<li>池水深度<span class=\"ng\">✗</span> 80～100 cm（101）；《園冶》主張水面佔十分之三。</li>\n<li>錦鯉池：色澤與<strong>斜陽光</strong>有關；石山不留暗洞（106、107）。</li>\n</ul>\n<h3>石景</h3>\n<ul>\n<li>景石：形態、色彩、質地特殊，供靜觀沉思；<strong>通常單獨應用</strong>、常作焦點；伏石＝橫臥的景石。庭石與景石定義考過顛倒（105）。</li>\n<li>擺置要訣：<strong>最有特色一面朝觀賞者</strong>；有紋路時先考慮紋路、再考慮形狀；相同大小形狀的<strong>不宜並排</strong>；不可整塊放在土面上（應埋入）。</li>\n<li>三遠（疊山法則）：<strong>高遠＝自山下仰山巔；深遠＝自山前窺山後；平遠＝自近山望遠山</strong>（111）。</li>\n<li>岩石庭園發源英國，主要觀賞植物，仿<strong>高山</strong>景觀（<span class=\"ng\">✗</span> 低海拔，102）；自然式岩石庭園石材不宜繽紛、紋路一致；規則式石牆高 &lt;5 英呎、每增高 1 英呎後傾 1 英吋。</li>\n</ul>\n<h3>園燈與解說設施</h3>\n<ul>\n<li>公園照明：<strong>明視照明以維護治安為主</strong>，景觀照明創造夜景（106、109 都將兩者顛倒）。</li>\n<li>光色以<strong>黃色最醒目</strong>；日光燈及螢光型水銀燈適宜花壇；點滅次數多處（廁所、倉庫）用<strong>白熾燈</strong>；燈具輕量、堅固、防水防蝕；以不刺眼為原則、照度依分區不同。</li>\n<li><strong>解說步道</strong>：最好成<strong>環狀</strong>，長度 <strong>0.8～3.2 km</strong>，過長設休息區；<strong>避免 Z 型轉彎或雙轉彎</strong>；景觀優美處留較寬路面。</li>\n<li><strong>解說牌</strong>：<strong>圖形優先、文字輔助</strong>；文字簡潔；色彩不超過 3 種；<strong>不釘在樹上</strong>。<span class=\"ng\">✗</span>「文字優先」（106、109）。</li>\n</ul>"}, {"id": "c10", "title": "十、製圖與圖面", "short": "製圖與圖面", "html": "<p>製圖題的高頻點：<strong>紙張尺寸</strong>、<strong>平立剖圖的投影定義</strong>、<strong>透視圖術語</strong>、<strong>比例尺</strong>、<strong>施工圖代號</strong>。</p>\n<h3>紙張（每 2～3 年考一次）</h3>\n<table>\n<thead>\n<tr>\n<th>規格</th>\n<th>尺寸（mm）</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>A0</td>\n<td><strong>841×1189</strong>（＝4 張 A2）</td>\n</tr>\n<tr>\n<td>A1</td>\n<td><strong>594×841</strong></td>\n</tr>\n<tr>\n<td>A2</td>\n<td><strong>420×594</strong></td>\n</tr>\n<tr>\n<td>A3</td>\n<td><strong>297×420</strong></td>\n</tr>\n<tr>\n<td>B3</td>\n<td>364×515</td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li>A 系列長寬比 <strong>√2：1</strong>；下一號是上一號對折，故 A2＝A3 的 <strong>2 倍</strong>（<span class=\"ng\">✗</span> 1.5 倍，102）；B 系列比 A 系列大（<span class=\"ng\">✗</span> 較小，109）。</li>\n<li><span class=\"ng\">✗</span>「A1 為 420×594」（104）、<span class=\"ng\">✗</span>「B3 為 297×420」（107）。</li>\n</ul>\n<h3>工具與字體</h3>\n<ul>\n<li>鉛筆：硬度 6H～6B；<strong>H 硬質、F 中等</strong>（<span class=\"ng\">✗</span> F 軟質，101）；削成<strong>錐形</strong>用於寫字畫線、<strong>鑿形</strong>用於圓規。</li>\n<li>針筆：0.1～1.2 mm、筆尖細小似針；使用時<strong>與紙面垂直</strong>（<span class=\"ng\">✗</span> 45°，104）；需專用墨水。</li>\n<li>三角板：兩塊一副，一塊 45°、45°、90°、一塊 30°、60°、90°；<strong>三角板≠三稜尺</strong>（<span class=\"ng\">✗</span>，101）。丁字尺不用時懸掛。</li>\n<li><strong>量角器≠分規</strong>；分規用以量取長度及分割直線；曲線板又名雲形定規。</li>\n<li>比例尺是最正式且常用的工具；<strong>1：35 無法直接用比例尺繪製</strong>（111）。</li>\n<li>畫線要領：一氣呵成、不可重複修飾；<strong>筆依「拉」的方向前進</strong>（<span class=\"ng\">✗</span> 推，114）、畫圖時筆蕤旋轉；右手持筆時水平線由左往右、右上斜線由左往右。圓之相接、直線與曲線接合<strong>不可留接縫、粗細要一致</strong>（103）。</li>\n<li>徒手線條：粗細、長短、輕重、間距<strong>要一致</strong>（<span class=\"ng\">✗</span> 不必一致，103、110）。</li>\n<li>字體：工程字依 CNS 採<strong>仿宋體</strong>，或黑體（方頭字）、等線體；<span class=\"ng\">✗</span> 隸書、標楷體、細明體、哥德式；<strong>方頭字＝黑體</strong>（<span class=\"ng\">✗</span> 宋體，100）。</li>\n</ul>\n<h3>各種圖面（103、105 配合題）</h3>\n<table>\n<thead>\n<tr>\n<th>圖</th>\n<th>定義</th>\n<th>常被對調</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>平面圖</td>\n<td><strong>垂直投影（俯視）</strong>，表示尺寸、形狀、位置及距離，也可定義物體本身</td>\n<td><span class=\"ng\">✗</span> 側視投影（108）</td>\n</tr>\n<tr>\n<td>立面圖</td>\n<td><strong>垂直投影（側視）</strong>，觀賞者站在物體正面所見；需繪出建築與雕塑；加人車可表比例</td>\n<td><span class=\"ng\">✗</span> 正面外貌是剖面圖（103）</td>\n</tr>\n<tr>\n<td>剖（斷）面圖</td>\n<td>物體在<strong>切割線的平面垂直投影</strong>，著重空間性質研究；僅表示切割平面所呈現的物象</td>\n<td><span class=\"ng\">✗</span> 立面圖（112）、<span class=\"ng\">✗</span> 透視投影（106）</td>\n</tr>\n<tr>\n<td>剖面透視圖</td>\n<td>除切割線剖面，亦將線後景象以透視表現</td>\n<td></td>\n</tr>\n<tr>\n<td>剖立面圖</td>\n<td>不僅切割線剖面，也表示線後意象</td>\n<td></td>\n</tr>\n<tr>\n<td>透視圖</td>\n<td>如觀察者實際看物體，具三度空間感</td>\n<td></td>\n</tr>\n<tr>\n<td>示意圖</td>\n<td>表達設計構想，<strong>多以不具比例</strong>方式表現</td>\n<td><span class=\"ng\">✗</span> 須具比例（108）</td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li>剖面圖依目的分：<strong>施工用</strong>（細部結構）、<strong>分析用</strong>（植栽分析）、<strong>設計用</strong>。立剖面圖功能：說明垂直空間層次、界面處理、施工細部、植被高低、<strong>立面動線</strong>（<span class=\"ng\">✗</span> 平面動線，114）。</li>\n<li>植物立面圖以<strong>成株尺度</strong>繪製（<span class=\"ng\">✗</span> 需標示植物年齡，111）。</li>\n<li>平面圖：喬灌木以圓形頂視表示，<strong>大小以成樹樹冠寬度為準</strong>（估價單則以種植規格）；喬木圖例<strong>沒有一定規範</strong>，能辨別即可；建築物以屋頂平面表示；道路可添加車輛暗示寬度；鋪面圖例可依比例增減細部；鋪面「型態法」是表達組合型態（<span class=\"ng\">✗</span> 用線條或點，114）。</li>\n<li>平面圖種類：基本資料類、分析圖、設計概念圖、設計圖。先繪基地分析、設計概念圖，<strong>最後才繪施工圖</strong>（<span class=\"ng\">✗</span> 104）。</li>\n</ul>\n<h3>透視圖術語</h3>\n<table>\n<thead>\n<tr>\n<th>術語</th>\n<th>定義</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>地平線 G.L.</td>\n<td>地平面（基面）與畫面的交線；基線＝基面與畫面接觸線</td>\n</tr>\n<tr>\n<td>視平線 H.L.</td>\n<td>視平面與畫面的交線</td>\n</tr>\n<tr>\n<td>視心 C.V.</td>\n<td>視軸穿過畫面之點</td>\n</tr>\n<tr>\n<td>視點 EP</td>\n<td>看對象物者眼睛的高度位置</td>\n</tr>\n<tr>\n<td>立點 S.P.</td>\n<td>人站立的位置</td>\n</tr>\n<tr>\n<td>畫面 PP</td>\n<td>對象物與觀看者之間的<strong>垂直面</strong>（<span class=\"ng\">✗</span> 平行面，106）</td>\n</tr>\n<tr>\n<td>消點 VP</td>\n<td>畫面上平行線會集的點</td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li>一點透視（平行透視）＝<strong>1 個消點</strong>；小面積庭園常用 45 度法平行透視，<strong>深度會縮小</strong>（<span class=\"ng\">✗</span> 與平面圖相等，110）。</li>\n<li>二點透視＝<strong>成角透視</strong>，垂直線仍與畫面平行。三點透視＝<strong>傾斜透視</strong>，可展現高空俯視或高層建築。</li>\n<li><span class=\"ng\">✗</span>「視點 S.P. 為視平面與畫面交線」（101）、<span class=\"ng\">✗</span>「地平線 G.L. 為視平面與畫面交線」（104）。</li>\n</ul>\n<h3>比例尺與施工圖代號</h3>\n<table>\n<thead>\n<tr>\n<th>圖類</th>\n<th>常用比例</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>都市公園</td>\n<td>1/500～1/1000（112）</td>\n</tr>\n<tr>\n<td>一般庭園</td>\n<td>1/100、1/200</td>\n</tr>\n<tr>\n<td>細部精密設計、花木配植</td>\n<td><strong>1/50～1/200</strong></td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li>1/500 圖上 1 cm＝實際 <strong>5 m</strong>；20 m 水池以 1/200 繪為 10 cm；1：25 即 S=1/25。</li>\n<li>施工圖代號：<strong>Ø（φ）＝圓鋼筋</strong>、<strong>@＝間距</strong>、<strong>Ew＝雙向</strong>、<strong>GL＝地面線</strong>、<strong>1B＝磚長邊</strong>（1B 磚牆粉光後約 24～25 cm）。<span class=\"ng\">✗</span>「@ 表示圓鋼筋」（104、109）。</li>\n<li>植物表中 <strong>Φ＝米徑（樹幹直徑）</strong>；考卷答案認定「離地 1 m」是錯的（103）、「離地 0.5 m」也錯（107），實際度量高度請對照課本。</li>\n<li>施工圖要對地面下不可見工程標註精確尺寸；園景常用施工圖：結構體、步道、圍牆、排水系統。水景施工圖以<strong>剖面圖</strong>說明管線與幫浦，力求<strong>施工者</strong>了解（111）。</li>\n<li>植栽施工圖要標：支柱尺寸材質埋深固定方式、植穴大小深度與周圍隆起高度、地面高度、根球徑；<strong>不標植株高度冠幅</strong>（111）、<strong>不標價格</strong>（110）。排水不良或鋪面區的植栽需另繪施工圖。</li>\n</ul>"}, {"id": "c11", "title": "十一、園地測量", "short": "園地測量", "html": "<p>測量題核心是「<strong>哪種儀器測什麼</strong>」：水準儀測高差、平板儀測平面圖、羅盤儀測方位角、經緯儀測角度；<strong>距離測量是最基本的測量工作</strong>。</p>\n<h3>儀器與用途</h3>\n<table>\n<thead>\n<tr>\n<th>儀器</th>\n<th>用途與重點</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>水準儀</td>\n<td><strong>測各點間高差</strong>（決定高程）；高倍望遠鏡＋水準管；<strong>構造較經緯儀簡單</strong>；三腳架在斜坡上一足置上坡、二足置下坡</td>\n</tr>\n<tr>\n<td>平板儀</td>\n<td>野外直接測繪地圖；由<strong>照準儀與平板</strong>構成；配件：圖板、三角架、對點器與垂球、水準器與磁針（<span class=\"ng\">✗</span> 測槍、<span class=\"ng\">✗</span> 測距雷射儀）；缺點：<strong>不易獲得精密結果</strong>、圖板笨重、受氣候影響、角度無度數紀錄</td>\n</tr>\n<tr>\n<td>羅盤儀</td>\n<td><strong>測角度（方位）</strong>，可迅速定方位、林地廣用；<span class=\"ng\">✗</span> 不是測距離工具（100）</td>\n</tr>\n<tr>\n<td>經緯儀</td>\n<td>測角度</td>\n</tr>\n<tr>\n<td>山岳高度計</td>\n<td>測高差，不能定位（110）</td>\n</tr>\n<tr>\n<td>卷尺</td>\n<td>簡易測距；<strong>不適合測地物地貌</strong>（平板儀、水準儀、經緯儀較適，111）</td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li><span class=\"ng\">✗</span>「平板儀可測各點高度差」（100）、<span class=\"ng\">✗</span>「水準儀構造較經緯儀複雜」（103）、<span class=\"ng\">✗</span>「平板儀容易獲得精密結果」（103）。</li>\n<li>水準測量公式：<strong>欲求高程＝已知高程＋BS（後視）−FS（前視）</strong>；TP（轉點）是高程差過大、無法一次測出時所設的點（109）。</li>\n</ul>\n<h3>平板儀測繪</h3>\n<ul>\n<li>測站安置：<strong>定平、定心（對中、定點）、定向</strong>；<span class=\"ng\">✗</span>「定平→定向→定點」。</li>\n<li><strong>導線法</strong>適大面積（果園、森林）；放射法（輻射法）適小面積農田空地；<strong>交會法精度最差</strong>；小型基地可直接繪於圖面，不需複雜內業（110）。</li>\n<li>地界測量常用平板測量、輻射法、導線法、交會法（<span class=\"ng\">✗</span> 步測法，111）。</li>\n<li>定位園中喬木：對角線法、垂線法、極測法、三角測量法；測量運用的數學原理：垂線法、對角線法、三角測量法。</li>\n<li>測量程序：準備工作（用具、計畫）→ <strong>外業</strong>（野外勘測、實測角度距離高低、儀器檢查、設標誌）→ 內業。</li>\n</ul>\n<h3>距離測量</h3>\n<ul>\n<li>目的是求兩點間<strong>水平距離</strong>；<strong>直接測量</strong>：目測法、步測法、測尺量距法（<span class=\"ng\">✗</span>「目測步測屬間接」，107）。簡易工具：卷尺、標桿、測針、手旗、垂球。</li>\n</ul>\n<table>\n<thead>\n<tr>\n<th>方法</th>\n<th>公式與重點</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>目測法</td>\n<td>比照已知距離推知</td>\n</tr>\n<tr>\n<td>步測法</td>\n<td><strong>距離＝步數×步長</strong>；身高 155 cm 步長約 <strong>75 cm</strong>；在平坦路段多次來回求平均步長；精度優於目測法</td>\n</tr>\n<tr>\n<td>輪測法</td>\n<td>以騎車代替步行；<strong>距離＝2πR×輪轉數，R 為半徑</strong>（<span class=\"ng\">✗</span> 直徑，106、112）</td>\n</tr>\n<tr>\n<td>音測法</td>\n<td>音速 <strong>V＝331（或 332）＋0.609t</strong>（t＝氣溫℃）；<strong>距離＝V×秒數</strong>；可用炮聲槍聲；音速隨溫度升高而增加</td>\n</tr>\n<tr>\n<td>光測法</td>\n<td>測<strong>光速×時間</strong>推算距離（<span class=\"ng\">✗</span> 光學望遠鏡放大倍率，那是光學測距儀，110）</td>\n</tr>\n<tr>\n<td>電測法</td>\n<td>電波訊號間接求得</td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li><span class=\"ng\">✗</span>「步測法精度不如目測法」（104）、<span class=\"ng\">✗</span>「步長約 80 cm，距離＝步數÷步長」（110）、<span class=\"ng\">✗</span>「時測法」不是距離測量法（105）。</li>\n<li>以測尺測 AB 水平距離：拉尺用力均勻、勿扭轉、往返各量一次；<span class=\"ng\">✗</span>「卷尺緊貼地板面」（104）。</li>\n</ul>\n<h3>測量圖繪製</h3>\n<ul>\n<li>步驟：<strong>描繪</strong>（依實測結果描繪，先繪主要導線再繪細部）→ <strong>清繪</strong>（上墨描線）→ <strong>整飾</strong>（添加圖名圖號、指北線、比例尺、測圖單位與時間等註記）。</li>\n<li>要著色時<strong>先著色後上墨</strong>（<span class=\"ng\">✗</span> 先上墨，109）。「上墨描線」屬清繪不屬整飾（114）。</li>\n<li>局部精密設計、花木配植最適比例 <strong>1/50～1/200</strong>（<span class=\"ng\">✗</span> 1/10，104）。</li>\n</ul>"}, {"id": "c12", "title": "十二、施工：整地、植穴、移植與各類工程", "short": "施工", "html": "<p>施工題的答案大多是固定數字：<strong>植穴＝根球 2 倍或直徑大 30 cm、深加 15～20 cm</strong>；<strong>回填每 30 cm 夯實</strong>；<strong>鬆方增加 25～30%</strong>；<strong>根球＝地際幹徑 3～5 倍</strong>。</p>\n<h3>施工順序</h3>\n<ul>\n<li>基地施工：<strong>土木 → 建築 → 植栽</strong>（<span class=\"ng\">✗</span> 先植栽綠化，105）。</li>\n<li>植栽工程：喬木 → 灌木 → 草花地被，<strong>草皮最後鋪植</strong>（<span class=\"ng\">✗</span> 先草花地被，108）。</li>\n<li>屋頂花園：基地調查 → 規劃 → <strong>土木 → 防溼 → 給排水 → 植栽</strong>（102 配合題）。</li>\n<li>水景工程：<strong>整地 → 放樣 → 管路配置 → 模板組立 → 灌漿</strong>（110）。</li>\n<li>瀑布：挑選石材 → 放樣挖池（土方築假山）→ 池底配筋灌漿 → 釘模灌池岸 → 裝排水管 → 配植（108）。</li>\n</ul>\n<h3>整地工程</h3>\n<ul>\n<li>分開工前施做與回填後施做；<strong>高差小可回填後整地、高差大應先整地</strong>（110）。</li>\n<li>事故災害<strong>多由水引起</strong>；挖土方保持<strong>乾燥狀態</strong>，挖地基前檢查地下湧水或流砂；人工挖掘時黏土、礫交土效率較普通土低。</li>\n<li>自然方 → 鬆方：體積<strong>增加 25～30%</strong>（約 1.25～1.3 倍；<span class=\"ng\">✗</span> 10%，104）。</li>\n<li>回填：<strong>每 30 cm 撒水夯實</strong>（<span class=\"ng\">✗</span> 60、100 cm），黏土不可過份撒水；回填土<strong>不含有機質</strong>以防沉陷。土方除回填外需搬出場外。</li>\n</ul>\n<h3>植穴與種植</h3>\n<blockquote class=\"fx\">植穴寬=根球× 2 或根球+30 cm　｜　 植穴深=根球厚+15～ 20 cm\n</blockquote>\n<ul>\n<li>101、102、103、106、109、110 都考。<span class=\"ng\">✗</span>「深寬與根球相同」（101、102、106）、<span class=\"ng\">✗</span>「大 20 cm、深加 30 cm」（109）。</li>\n<li>植穴底部<strong>削成凹型、周圍垂直、穴底土挖鬆</strong>（<span class=\"ng\">✗</span> 夷實，100）；排水不良可挖深 30 cm 以上放粗礫石；一般大樹客土為根球體積 3～5 倍。</li>\n<li>植穴內石礫、混凝土塊等雜物<strong>應清除</strong>（103）；廢土多時運離工地（109）。</li>\n<li>回填<strong>先填心土再填表土</strong>，不可混合；定植時充分灌水夯實；種植深度考慮新填土下陷；植入後<strong>解除綑繩及包裹物</strong>。</li>\n<li>苗木種植後<strong>應立即澆水</strong>（<span class=\"ng\">✗</span> 不可立即澆水，108）。經設計師同意才可修剪枝葉，<strong>不可一刀切除</strong>（105）。</li>\n<li><strong>支柱</strong>：定植時同時設立、植妥再加打樁；埋入土中<strong>至少 30 cm</strong>（<span class=\"ng\">✗</span> 10～30 cm，108）；桂竹、杉木常用；生長快的樹種注意調整綁紮；<strong>苗木生長固定後支架應全面拆除</strong>（113）。</li>\n<li>地被草花種植：表土挖鬆 <strong>15 cm</strong>，清除 <strong>3 cm 以上</strong>石塊，填加 <strong>2.5 cm</strong> 腐熟堆肥（<span class=\"ng\">✗</span> 1 cm，104）；<strong>種植後 7 天</strong>及維護開始後每 30 天施肥。</li>\n<li>苗木由苗圃掘起至種植完畢<strong>不超過 2 日</strong>（<span class=\"ng\">✗</span> 7 日，106）。</li>\n</ul>\n<h3>移植與斷根</h3>\n<ul>\n<li><strong>根球大小＝地際幹徑（根元直徑）的 3～5 倍</strong>（105）；公式根球徑＝24＋（N−3）×d（d：常綠 4、落葉 5），根元直徑 30 cm 落葉樹 → <strong>159 cm</strong>（107）。</li>\n<li>落葉樹根球可<strong>小於</strong>常綠樹；<strong>根再生能力強者根球可較小</strong>；根球太大運送不易、太小影響發根。</li>\n<li>斷根時機：炎夏酷寒不宜；<strong>落葉樹春季斷根、秋季移植</strong>；常綠樹春季斷根、第二年春天或梅雨期移植；<strong>貴重樹、高齡大樹應分次斷根</strong>（<span class=\"ng\">✗</span> 一次完成，103）。</li>\n<li>野外取得的樹木<strong>仍需斷根</strong>（104）；<strong>樹齡高者發根力弱</strong>，不適合斷根移植（105）。</li>\n<li>夏季蒸散旺盛<strong>不適合移植</strong>；中部以早春未萌芽或梅雨季移植；欖仁、臺灣欒樹休眠期濕度高時可不帶土移植（107）。</li>\n<li>挖掘大樹：先架支柱、無風陰天最佳、先剷雜草、切口平滑；<strong>先以直鏟削切 2 cm 以下細側根</strong>（<span class=\"ng\">✗</span> 圓鏟、5 cm，111）。</li>\n<li>切口大的枝條<strong>塗抹接蠟</strong>：使切口癒合良好、減少水分流失（<span class=\"ng\">✗</span> 避免搬運傷害，106、112）。</li>\n<li>移植六步驟（100 問答）：<strong>斷根處理 → 樹木挖掘 → 搬運 → 植穴處理 → 種植 → 保護與培養</strong>（立支柱、卷幹、灌溉、防天候傷害、覆蓋地面、施肥、病蟲害防治）。</li>\n</ul>\n<h3>草皮施工</h3>\n<ul>\n<li>鋪植前以鋤頭挖鬆表土 <strong>15 cm</strong>，清除 3 cm 以上雜物；維持預定傾斜度以利排水。</li>\n<li>草皮帶草根草土，<strong>厚不小於 2 cm、每塊至少 15×15 cm</strong>；<strong>品字形</strong>鋪植，間距約 <strong>10 cm</strong>（107；<span class=\"ng\">✗</span> 緊密接合，100）；鋪植後<strong>應鎮壓滾實</strong>（<span class=\"ng\">✗</span> 不宜鎮壓，108）。</li>\n<li>播種法：<strong>少量多次</strong>（<span class=\"ng\">✗</span> 多量少次，103）、覆土滾壓、均勻澆水。草坪栽植法：播種法、種子噴植法（用於山坡地）、鋪植法；<span class=\"ng\">✗</span> 扳插法（105）。田字型疏鋪綠草非排水方式（110）。</li>\n</ul>\n<h3>水景、石景、階梯、鋪面施工</h3>\n<ul>\n<li>混凝土水池：挖深<strong>大於池底高度約 20～30 cm</strong>（109）；臺灣建水池以明礬水調混凝土、加冰醋酸預措，作用是<strong>除石灰質</strong>（107）。</li>\n<li>噴泉噴水型式由<strong>噴頭設計與幫浦馬力</strong>決定；水管彎 90° 用 <strong>L 型</strong>接頭。</li>\n<li>景石：挖約景石 <strong>2 倍</strong>大的穴（<span class=\"ng\">✗</span> 1.5、3 倍）；確定位置方向後<strong>周圍填土壓實</strong>；在<strong>觀景點眺望</strong>調整擺法；石組先放大石於穴中央；多塊組合由大的先排。</li>\n<li>階梯：新填土先澆水沉實、震動夯壓；鬆軟地盤排列<strong>直徑 15 cm 卵石</strong>。</li>\n<li>鋪面：紅磚鋪地<strong>磚縫約 1 cm</strong>（<span class=\"ng\">✗</span> 2 cm，104）；1：3 水泥砂漿填縫；踏石 2 m 鋪 4～5 塊、突出 3～6 cm。水泥鋪面破裂多因<strong>預留膨脹縫太少</strong>（106）。木質鋪面使用前須加壓防腐。</li>\n<li>排水管分布型式：<strong>平行式、魚骨式、隨機式</strong>（<span class=\"ng\">✗</span> 交叉式，105；<span class=\"ng\">✗</span> 骨牌式，106）；有助排水：排水溝、排水管、陰井、透水管。排水不良基地另外覆土、隆起植栽床。</li>\n</ul>"}, {"id": "c13", "title": "十三、施工規範、估價、合約、驗收與養護", "short": "施工規範、估價、合約", "html": "<p>109 年起每屆 6～10 題。記住三個原則就能解大半：<strong>施工規範是合約的一部分</strong>、<strong>風險與責任多在乙方（承包商）</strong>、<strong>代用與變更要甲方同意且不可加價</strong>。</p>\n<h3>施工規範</h3>\n<ul>\n<li>又稱施工說明書，是施工遵循的原則，<strong>是工程合約的一部分</strong>，可補足設計圖說不足（<span class=\"ng\">✗</span> 與合約無關：105、110）。</li>\n<li>單價包括人工、稅利、搬運、養護等；工地安全措施與交通維持<strong>由乙方負責</strong>（<span class=\"ng\">✗</span> 甲方，102）；施工期間<strong>乙方辦理保險</strong>（113）。</li>\n<li>工程用水由乙方自行決定，不当致損乙方負全責、<strong>不可要求加價</strong>（111）；農藥種類用量由乙方決定，施用不当致人受害乙方負全責。</li>\n<li>合約簽訂後<strong>不可以季節不適移植或斷根時間要求延期</strong>；苗木來源需書面說明、現場驗苗；支架種類圖說未說明者須經設計師同意（109）。</li>\n<li>代用材料（大於或小於規格）<strong>須經甲方同意、不可要求增加費用</strong>（<span class=\"ng\">✗</span> 乙方同意，113；<span class=\"ng\">✗</span> 可加價，100）。同一代號植物未另註明應為同品種花色。</li>\n<li>施工圖說簽約後仍可依程序變更設計（113）。</li>\n</ul>\n<h3>植物材料檢驗（不合格不得使用）</h3>\n<ul>\n<li>顛著病蟲害、折枝裂幹、樹形不端、偏斜、樹冠過疏；護根土球不夠大、破裂鬆散；灌木草花分枝過少。</li>\n<li><strong>高壓苗、扳插苗「未」經苗圃培養二年以上者不得使用</strong>（<span class=\"ng\">✗</span> 「經二年以上」不合格，105、111）。</li>\n<li>樹高、冠幅、冠厚<strong>不包含徒長枝</strong>，以徒長枝剪除後量得為準（108、109、113、114 四度考）。</li>\n<li>草皮厚度不小於 2 cm；不合格苗木<strong>應立即運離</strong>（<span class=\"ng\">✗</span> 置於基地旁再利用，106）；苗木運到工地先經設計師檢驗。護根土球大小是檢驗項目。</li>\n</ul>\n<h3>估價與預算</h3>\n<ul>\n<li>施工估價目的：<strong>業主的預算計畫（發包預算）、承包者的承包估價與施工計畫、設計者的設計檢討</strong>；<span class=\"ng\">✗</span> 施工者的施工管理（100）、<span class=\"ng\">✗</span> 設計及維護費用計算（109）。估價有概估與詳估。</li>\n<li>估價正確性：事先<strong>詳細勘查現場</strong>、建立估價順序、了解工程全貌、考慮季節；<strong>研判經濟動向很重要</strong>；<span class=\"ng\">✗</span> 了解業主需求無關（109）、<span class=\"ng\">✗</span> 未現勘可依圖估價（113）、<span class=\"ng\">✗</span> 時價上網查即可（114）。</li>\n<li>詢價：平時建立完整資料、數家信用可靠供應商、留意市場價格。材料因時因地有價差，<strong>無法統一訂定單價</strong>（114）。</li>\n<li><strong>單價分析</strong>：使業主了解價格由來，包含各項材料費用，<strong>依地區運輸成本與工資調整</strong>；植栽工程也要列出人工材料機具搬運（105）；<span class=\"ng\">✗</span> 「多方詢問」不是單價分析內容（106）。</li>\n<li>植物單價表內容：植物名稱、規格、單價（<span class=\"ng\">✗</span> 花季，104）；單價可按每株（喬灌木）或每平方公尺（草皮）計。</li>\n</ul>\n<table>\n<thead>\n<tr>\n<th>材料</th>\n<th>單位</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>級配碎石、客土、土方</td>\n<td><strong>m³</strong>（<span class=\"ng\">✗</span> 式、<span class=\"ng\">✗</span> 公噸）</td>\n</tr>\n<tr>\n<td>防腐杉木</td>\n<td>才</td>\n</tr>\n<tr>\n<td>技術工</td>\n<td>工</td>\n</tr>\n<tr>\n<td>喬木、灌木（臺灣海桐、南天竹、玉龍草）</td>\n<td>株</td>\n</tr>\n<tr>\n<td>草皮、地被、<strong>草花</strong></td>\n<td>m²（草花預算以面積估，111）</td>\n</tr>\n<tr>\n<td>卡車搬運、斷根及土球包紮、各分項工程</td>\n<td>式</td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li><strong>工程費構成</strong>：工程費成本（共同假設設備費、機械器具費、施工工資、材料費）＋一般管理費＋利潤＋設計監工費。一般管理費<strong>不屬工程費成本</strong>（110）；總工程費<strong>包含</strong>設計監工費與利潤（113）；預算書需計入稅金與利潤（110）。<ul>\n<li><span class=\"ng\">✗</span>「管理雜支、設計費、監造費及稅金不可列於預算」（100）。</li>\n</ul>\n</li>\n<li>預算詳表單位需與單價分析相同；提給業主的估價單可分二式、其一不列價格。</li>\n<li>歐美家庭建物 200 萬元，庭園工程約 <strong>80 萬元</strong>（約 40%，107）。</li>\n<li>造園工程在大型土木工程中只佔小部分，多由營造業或土木包工業<strong>轉包</strong>（114）。乙方得標後需經甲方同意方可開工。</li>\n</ul>\n<h3>施工準備與管理</h3>\n<ul>\n<li>拿到合約、預算書、規範、圖說後<strong>立即檢查遺漏錯誤</strong>，有疑問即報請上級（設計單位）解釋；實地核對工程位置；大型工程設臨時工地事務所；<strong>施工計畫依設計圖樣與合約擬定</strong>（<span class=\"ng\">✗</span> 不需，114）。</li>\n<li>施工管理種類：<strong>品質、工期、成本、安全管理</strong>（<span class=\"ng\">✗</span> 人事管理，105）；工期管理<span class=\"ng\">✗</span>「越長越好」（103）。</li>\n<li>承包價格會隨工資、材料價格變動，估價階段研判經濟動向很重要（109）。</li>\n</ul>\n<h3>養護與驗收</h3>\n<table>\n<thead>\n<tr>\n<th>項目</th>\n<th>規定</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>正式養護期</td>\n<td>初驗合格日起 <strong>90～270 日</strong>（105、112）</td>\n</tr>\n<tr>\n<td>養護開始</td>\n<td>植物養護由栽植後即日開始，由乙方負責；包含除草、澆水、病蟲害防治、修剪</td>\n</tr>\n<tr>\n<td>養護期枯死</td>\n<td>乙方<strong>無條件補植</strong>（<span class=\"ng\">✗</span> 向甲方請款，113）</td>\n</tr>\n<tr>\n<td>存活率</td>\n<td>需 <strong>90% 以上</strong>，未達依違約賠償</td>\n</tr>\n<tr>\n<td>草地雜草</td>\n<td>不可超過全部之 <strong>10%</strong></td>\n</tr>\n<tr>\n<td>養護期滿不合格</td>\n<td>超過施工量 <strong>40%</strong> 以上，該部分不予計價（110）</td>\n</tr>\n<tr>\n<td>天然災害</td>\n<td>乙方應於 <strong>24 小時內</strong>報請會勘、拍照、清理現場</td>\n</tr>\n<tr>\n<td>驗收計價</td>\n<td>植物材料驗收付款以<strong>實作數量</strong>計價（<span class=\"ng\">✗</span> 合約數量，109）</td>\n</tr>\n<tr>\n<td>初驗</td>\n<td><strong>乙方</strong>申請（<span class=\"ng\">✗</span> 甲方，113）；初驗時有植株枯死即不及格（113）</td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li>養護期滿驗收合格：植物生長良好無病蟲害枯萎、種類與合約一致、草地地被土面不裸露、<strong>植株尺寸不小於施工時規格</strong>。</li>\n<li>天然災害處理（114）：喬木傾倒折斷應無償扶植；灌木因洪水損失或甲方認定無法成活者<strong>免予保活</strong>；地被草花受損達該次栽植量 <strong>1/3</strong> 以上才免保活；草皮因洪水流失及土埋者免保活。</li>\n</ul>"}, {"id": "c14", "title": "十四、維護管理、公園系統與經營", "short": "維護管理、公園系統與", "html": "<p>維護題最常考<strong>修剪季節</strong>、<strong>澆水時機</strong>、<strong>水池維護季節</strong>；公園題最常考<strong>公園系統三要素與形式</strong>。</p>\n<h3>修剪</h3>\n<ul>\n<li>維護最重要考慮：<strong>水、肥料、修剪</strong>（<span class=\"ng\">✗</span> 空氣陽光土壤，111）；維持生長不可或缺的是<strong>水</strong>（112）。</li>\n<li>修剪原則：剪除繁枝茂葉使通風、剪除妨礙電線燈具標示牌的枝條、<strong>病蟲害或不潔淨枝葉應剪除</strong>；修剪包括摘心、摘芽、摘蕾、剪枝。</li>\n<li><strong>冬季剪枝</strong>：可較大幅度，以<strong>落葉後、發芽前</strong>為佳，目的為保護樹木、保持樹型；<strong>夏季剪枝</strong>：預防颱風、整枝通風，生長旺盛區每年 1～2 次。<ul>\n<li><span class=\"ng\">✗</span>「秋季剪枝保護、春季防颱」（111）、<span class=\"ng\">✗</span>「颱風前截頭式修剪、只留主幹」（106、110）。</li>\n</ul>\n</li>\n<li><strong>避免在花芽分化期修剪</strong>：103、105、107、108、113 五度考。</li>\n<li>綠籬：修剪季節次數不受限制，<strong>春夏每月一次、秋冬一二次</strong>；長期未修剪而凌亂的綠籬應<strong>分次修整</strong>（<span class=\"ng\">✗</span> 一次大剪：110、111、112）。</li>\n</ul>\n<h3>草坪與澆水、施肥</h3>\n<ul>\n<li>草坪：<strong>每月至少割草 2～3 次</strong>、<strong>韓國草每月至少一次</strong>；割草力求平整、先整理場地；<strong>高低不平應補土整平</strong>（<span class=\"ng\">✗</span> 維持現狀，100、114）；老化應更換。</li>\n<li>灌溉準則：水滲入土壤 <strong>15 cm</strong>（草皮；<span class=\"ng\">✗</span> 2 cm，110）；減少逕流、勿過度澆灌；<strong>新移植植物需較多水分</strong>（<span class=\"ng\">✗</span> 較少，103）。取 15～20 cm 深土壤握擠，若黏著則不需澆水。</li>\n<li><strong>高濕地區避免晚上澆水</strong>（易感染疾病）；<strong>乾燥地區宜晚上澆水</strong>（減少蒸散）。<span class=\"ng\">✗</span>「高濕地區適合晚上澆水」（107）、<span class=\"ng\">✗</span>「高濕地區避免中午」（111）。自動灌溉需良好排水。</li>\n<li>肥料：含 N、P、K 為完全肥料；<strong>氮促生長、磷促開花、鉀對根莖葉有幫助</strong>；臺肥 43 號＝15-15-15。<span class=\"ng\">✗</span>「磷肥促進發根」（105）、<span class=\"ng\">✗</span>「鉀肥可促進開花」（113）。</li>\n<li>基肥以<strong>遲效性</strong>肥料為主（<span class=\"ng\">✗</span> 速效性，102）；基肥施於樹冠外緣下。</li>\n</ul>\n<h3>水景與設施維護</h3>\n<table>\n<thead>\n<tr>\n<th>季節</th>\n<th>水池維護重點</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>春</td>\n<td>—</td>\n</tr>\n<tr>\n<td>夏</td>\n<td><strong>施肥和增加新種植物最好的時機</strong>（<span class=\"ng\">✗</span> 冬季，106；<span class=\"ng\">✗</span> 春季，112）</td>\n</tr>\n<tr>\n<td>秋</td>\n<td>首要處理周圍樹林落葉（落葉分解消耗氧氣，用細網撈起）</td>\n</tr>\n<tr>\n<td>冬</td>\n<td>溫帶結冰厚度達植物根部時，移走睡蓮和小型開花水生植物</td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li><strong>並非每年都要清理水池</strong>，過度擾動使生態失衡（114）。</li>\n<li>水生植物用富含腐植質、較粘重的壤土栽植；基肥須<strong>完全腐熟</strong>（108）；長年栽植葉片失綠加錠劑肥料或<strong>鉀肥</strong>（<span class=\"ng\">✗</span> 磷肥，111）；水生植物<strong>仍須維護</strong>，繁衍過多要疏拔。</li>\n<li>抑藻：可加過錳酸鉀液、硫酸銅、多植水生植物競爭；<strong>不可加鹽酸</strong>（105）。</li>\n<li>遊戲設施：砂坑用砂不足隨時補充；<strong>磨石子滑梯磨損露出基礎水泥時應重新全面研磨</strong>（<span class=\"ng\">✗</span> 覆蓋砂漿，111；<span class=\"ng\">✗</span> 不用研磨，114）；木製滑梯注意破裂腐朽；鞦韆軸轉螺絲隨時上緊。</li>\n<li>沖蝕控制：種百喜草、狗牙根等水保植物、設排水溝、植物結合鐵絲網木樁、保留原有植被、選低維護植栽；<span class=\"ng\">✗</span>「促進逕流」（106）、<span class=\"ng\">✗</span>「斜坡以觀賞性植栽為主」（110）、<span class=\"ng\">✗</span>「高維護性植栽」（114）。臺灣月桃具水保功用（107）。</li>\n</ul>\n<h3>公園系統與分配</h3>\n<ul>\n<li><strong>公園系統</strong>＝公園之分布及相互間聯絡的關係；<strong>三要素：公園面積、公園分布、公園聯絡</strong>（<span class=\"ng\">✗</span> 公園維護，106）。</li>\n</ul>\n<table>\n<thead>\n<tr>\n<th>公園系統形式</th>\n<th>特點</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>分散式</td>\n<td>具體連絡欠佳</td>\n</tr>\n<tr>\n<td>綠道形式</td>\n<td>缺乏大面積公園</td>\n</tr>\n<tr>\n<td>環狀綠地帶</td>\n<td>位於<strong>都市</strong>外部及周圍（<span class=\"ng\">✗</span> 鄉村，106），歐洲舊城牆遺跡；內外缺乏連絡</td>\n</tr>\n<tr>\n<td>放射狀綠地帶</td>\n<td>—</td>\n</tr>\n<tr>\n<td><strong>放射環狀綠地帶</strong></td>\n<td><strong>最理想</strong>，放射式與環狀式互補（109、114）</td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li>公園分配原則：都市計畫一環、均衡發展、考慮聯絡系統、<strong>與交通設施保持嚴密聯繫</strong>（114）；選址可用低溼地、荒廢地、傾斜地等不適建築之地。</li>\n<li>公園必要量公式的分母：<strong>公園種類別有效面積率</strong>（106）。都市公園面積<span class=\"ng\">✗</span> 不只由使用者多寡決定（102）。</li>\n<li>公園兼具防火、避難、防災功能（<span class=\"ng\">✗</span> 不宜防災，108）；動物園、植物園屬<strong>特殊教育性公園</strong>。</li>\n<li>自然公園：以人為方式創造生物棲地，需<strong>控制過度生長物種、保護競爭力差物種</strong>（109）。</li>\n<li>公園管理考量人口結構改變、都市化、教育水準提高（106）。景觀遊憩管理中「行政管理」不是管遊客安全諮詢（107）。</li>\n</ul>\n<h3>自然風景區與遊樂場經營</h3>\n<ul>\n<li>自然風景區：<strong>協調規劃</strong>（中央地方各級單位）、<strong>安排原始性遊憩活動</strong>（賞景、體驗自然；<span class=\"ng\">✗</span> 人為性、冒險性）、特殊資源擬定<strong>長期</strong>經營計畫、培育珍稀野生物、建立解說系統（解說員、服務中心、解說圖、自導式）。</li>\n<li><strong>食宿服務設施設於區外</strong>減少衝擊（109）；遊憩承載量以不影響原始生態為主，服務區集中於耐衝擊力大處。研究必要性：大眾交通、分區承載、垃圾污水處理（以上皆是，114）。</li>\n<li>遊樂場：以<strong>吸引遊客、滿足需求</strong>為考量（<span class=\"ng\">✗</span> 以環境保護為目的，106）；選交通良好、有能源水排水處；<strong>旺季是夏季</strong>（<span class=\"ng\">✗</span> 春秋，111）。</li>\n<li>造園公司型態：傳統苗圃商、造園工程公司、造園規劃顧問公司（<span class=\"ng\">✗</span> 營造工程公司，106）。臺灣造園教育「分級化」＝各級訓練重點不同（110）。</li>\n</ul>\n<h3>特殊庭園</h3>\n<ul>\n<li><strong>屋頂花園</strong>：輕質材料、輕質介質、<strong>土壤深度盡量降低</strong>（<span class=\"ng\">✗</span> 越深越好，103）、荷重大者置樑柱上方；排水坡度 ≥1%（通常 1～3%）；植栽選<strong>淺根性、低矮</strong>（<span class=\"ng\">✗</span> 深根，105）；屋頂地形平坦（<span class=\"ng\">✗</span> 起伏劇烈，105）；土壤重約 <strong>1.2～2.0 t/m³</strong>（107）；解決隔熱、漏水問題，<span class=\"ng\">✗</span> 不增貯藏空間（100）。土深：地被 30 cm 以下、灌木 30～60 cm、喬木 60 cm 以上。</li>\n<li><strong>醫院庭園</strong>：需考量使用者（<span class=\"ng\">✗</span> 僅空間美化，108）；避 4、10、13 等數字；<span class=\"ng\">✗</span> 不選柏樹等令人聯想喪事的植栽（100）；遮掩焚化爐、太平間。</li>\n<li><strong>工廠庭園</strong>：以「生產」為前提；盡量保留廣闊開放空間。<strong>學校園</strong>：啟發智能、培養技能、生活態度、鍛鍊體魄。</li>\n<li>住宅庭園：生活空間的延伸，後庭可栽植蔬果花木。</li>\n</ul>"}, {"id": "c15", "title": "十五、數字速記總表", "short": "數字速記總表", "html": "<p>考前最後一小時只看這張表：下列數字約佔每屆考卷 15～25% 的分數。「次數」是 100–114 年考過的屆數。</p>\n<table>\n<thead>\n<tr>\n<th>主題</th>\n<th>要記的數字</th>\n<th>次數</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>防風林</td>\n<td>高寬比 <strong>1：11.5</strong>；密度 <strong>50～60%</strong>；風速最低在樹高 <strong>3～4 倍</strong></td>\n<td>9</td>\n</tr>\n<tr>\n<td>階梯</td>\n<td><strong>2R+T=63～66 cm</strong>；T ≥ <strong>28 cm</strong>、不超過 45 cm；R <strong>10～16.5 cm</strong>；至多 <strong>7～9 級</strong></td>\n<td>10</td>\n</tr>\n<tr>\n<td>步道</td>\n<td>斜度 <strong>≤10%</strong>；寬 <strong>≥1.83 m</strong>（緊急 2.44 m）；解說步道 <strong>0.8～3.2 km</strong></td>\n<td>9</td>\n</tr>\n<tr>\n<td>車道</td>\n<td>坡度 <strong>&lt;9%</strong>；單行 <strong>3.66 m</strong>、雙行 <strong>6.71 m</strong></td>\n<td>5</td>\n</tr>\n<tr>\n<td>坡道</td>\n<td><strong>≤1/12（8.33%）</strong>；兩平台間 <strong>≤9 m</strong></td>\n<td>4</td>\n</tr>\n<tr>\n<td>路面排水</td>\n<td><strong>1～3%</strong></td>\n<td>2</td>\n</tr>\n<tr>\n<td>飛石</td>\n<td>直徑 <strong>30～50 cm</strong>、間隔 <strong>10 cm</strong>、突出 <strong>3～6 cm</strong>、2 m 鋪 <strong>4～5 塊</strong></td>\n<td>8</td>\n</tr>\n<tr>\n<td>遊戲水池</td>\n<td>池深 <strong>10～30 cm</strong></td>\n<td>8</td>\n</tr>\n<tr>\n<td>遊戲場地面</td>\n<td>鋪設範圍 <strong>≥180 cm</strong>；鞦韆 <strong>≥3 m</strong>；幼兒設施高 <strong>&lt;150 cm</strong></td>\n<td>5</td>\n</tr>\n<tr>\n<td>植穴</td>\n<td>根球 <strong>2 倍</strong>或大 <strong>30 cm</strong>；深＝根球厚 <strong>+15～20 cm</strong></td>\n<td>7</td>\n</tr>\n<tr>\n<td>根球</td>\n<td>地際幹徑 <strong>3～5 倍</strong>；24＋（N−3）×d</td>\n<td>2</td>\n</tr>\n<tr>\n<td>支柱</td>\n<td>埋入 <strong>≥30 cm</strong></td>\n<td>2</td>\n</tr>\n<tr>\n<td>苗木</td>\n<td>掘起至種植 <strong>≤2 日</strong>；苗圃樹木 <strong>4、5 年生</strong>最好；高壓扳插苗須培養 <strong>≥2 年</strong></td>\n<td>6</td>\n</tr>\n<tr>\n<td>整地</td>\n<td>回填每 <strong>30 cm</strong> 夯實；鬆方增 <strong>25～30%</strong></td>\n<td>5</td>\n</tr>\n<tr>\n<td>草皮</td>\n<td>厚 <strong>≥2 cm</strong>、每塊 <strong>15×15 cm</strong>、品字形間距 <strong>10 cm</strong>；鬆土 <strong>15 cm</strong>；灌溉滲透 <strong>15 cm</strong></td>\n<td>7</td>\n</tr>\n<tr>\n<td>地被種植</td>\n<td>鬆土 15 cm、清除 &gt;3 cm、堆肥 <strong>2.5 cm</strong>、種後 <strong>7 天</strong>施肥</td>\n<td>3</td>\n</tr>\n<tr>\n<td>養護驗收</td>\n<td>養護期 <strong>90～270 日</strong>；存活率 <strong>90%</strong>；雜草 <strong>≤10%</strong>；不合格 <strong>&gt;40%</strong> 不計價；災後 <strong>24 小時</strong>會勘；地被災損 <strong>1/3</strong></td>\n<td>6</td>\n</tr>\n<tr>\n<td>土壤消毒</td>\n<td>60℃ <strong>30 分</strong>；45～50℃ <strong>12 小時</strong>；80℃ <strong>10 分</strong></td>\n<td>4</td>\n</tr>\n<tr>\n<td>紙張</td>\n<td>A0 841×1189、A1 594×841、<strong>A2 420×594</strong>、A3 297×420；長寬比 <strong>√2</strong></td>\n<td>5</td>\n</tr>\n<tr>\n<td>比例</td>\n<td>花木配植、精密設計 <strong>1/50～1/200</strong>；1/500 圖 1 cm＝<strong>5 m</strong></td>\n<td>5</td>\n</tr>\n<tr>\n<td>黃金比</td>\n<td><strong>5：8</strong>（1：1.618）</td>\n<td>5</td>\n</tr>\n<tr>\n<td>音測法</td>\n<td><strong>V=331＋0.609t</strong>；距離＝V×秒</td>\n<td>3</td>\n</tr>\n<tr>\n<td>步測法</td>\n<td>身高 155 cm 步長 <strong>75 cm</strong></td>\n<td>1</td>\n</tr>\n<tr>\n<td>座椅</td>\n<td>《地景》p.126：高 40～45 cm、深 30～45 cm（102）；東大上冊 p.152：成人高 46～51 cm（114）</td>\n<td>3</td>\n</tr>\n<tr>\n<td>綠籬</td>\n<td>分界 <strong>45</strong>、阻斷 <strong>120</strong>、阻絕 <strong>170 cm</strong>；觀賞區隔綠籬高 120、寬 60 cm</td>\n<td>2</td>\n</tr>\n<tr>\n<td>屋頂花園</td>\n<td>土重 <strong>1.2～2.0 t/m³</strong>；排水坡 <strong>1～3%</strong>；土深 地被 &lt;30、灌木 30～60、喬木 &gt;60 cm</td>\n<td>4</td>\n</tr>\n<tr>\n<td>材料</td>\n<td>二丁掛 <strong>60×227 mm</strong>；鑄鐵含碳 <strong>&gt;1.7%</strong>；α 黃銅 <strong>銅 70＋鋅 30</strong>；竹耐久 <strong>5 年</strong>；骨材佔 <strong>70～80%</strong>；耐火磚 <strong>≥1580℃</strong></td>\n<td>6</td>\n</tr>\n<tr>\n<td>其他</td>\n<td>玉山箭竹 1800～3000 m；森林地表低 <strong>3～4℃</strong>；庭園工程費約建物 <strong>40%</strong>；中大型喬木 9～12 m、小喬木 4.5～6 m</td>\n<td>4</td>\n</tr>\n</tbody>\n</table>\n<h3>易混淆對照（題目最愛顛倒）</h3>\n<table>\n<thead>\n<tr>\n<th>這個</th>\n<th>是</th>\n<th>不是</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>體宜因借</td>\n<td>設計原則</td>\n<td>風格</td>\n</tr>\n<tr>\n<td>暢幽靈雅</td>\n<td>風格</td>\n<td>設計原則</td>\n</tr>\n<tr>\n<td>對稱</td>\n<td>和平安穩嚴肅</td>\n<td>神秘（不對稱平衡才是「神秘的平衡」）</td>\n</tr>\n<tr>\n<td>粗質地、深色</td>\n<td>距離變近</td>\n<td>遠離</td>\n</tr>\n<tr>\n<td>暖色</td>\n<td>興奮、前進</td>\n<td>放鬆、後退</td>\n</tr>\n<tr>\n<td>明視照明</td>\n<td>維護治安</td>\n<td>創造夜景</td>\n</tr>\n<tr>\n<td>傳染性病害</td>\n<td>病原菌引起</td>\n<td>生理傷害</td>\n</tr>\n<tr>\n<td>剖面圖</td>\n<td>切割線平面垂直投影</td>\n<td>立面圖</td>\n</tr>\n<tr>\n<td>三植法</td>\n<td>二、一分配</td>\n<td>三、一分配</td>\n</tr>\n<tr>\n<td>植栽在山谷</td>\n<td>減緩起伏</td>\n<td>增加起伏</td>\n</tr>\n<tr>\n<td>深綠植栽</td>\n<td>下層</td>\n<td>上層</td>\n</tr>\n<tr>\n<td>單植</td>\n<td>易成主景</td>\n<td>配景</td>\n</tr>\n<tr>\n<td>自然方變鬆方</td>\n<td>增 25～30%</td>\n<td>10%</td>\n</tr>\n<tr>\n<td>GRC</td>\n<td>玻璃纖維強化水泥</td>\n<td>玻璃纖維、塑膠（FRP）</td>\n</tr>\n<tr>\n<td>水金英</td>\n<td>浮葉植物</td>\n<td>挺水、沉水</td>\n</tr>\n<tr>\n<td>布袋蓮</td>\n<td>漂移植物</td>\n<td>挺水</td>\n</tr>\n<tr>\n<td>文竹、武竹</td>\n<td>草本</td>\n<td>木本</td>\n</tr>\n<tr>\n<td>康白</td>\n<td>《東方庭園論》</td>\n<td>《園冶》</td>\n</tr>\n<tr>\n<td>圓明園</td>\n<td>萬園之園</td>\n<td>頤和園</td>\n</tr>\n<tr>\n<td>法國</td>\n<td>平坦地、花壇</td>\n<td>坡地台地（義大利）</td>\n</tr>\n<tr>\n<td>羅盤儀</td>\n<td>測方位角度</td>\n<td>測距離</td>\n</tr>\n<tr>\n<td>水準儀</td>\n<td>測高差</td>\n<td>平板儀</td>\n</tr>\n<tr>\n<td>材料代用、延期</td>\n<td>甲方同意、不可加價</td>\n<td>乙方自定</td>\n</tr>\n</tbody>\n</table>"}, {"id": "c16", "title": "十六、問答、配合與製圖題題庫", "short": "問答、配合與製圖題題", "html": "<p>100–107 年每屆有 7～30 分問答配合題，108 年起取消；但這些題目的內容後來都改成選擇題再考，答題要點仍要記。</p>\n<h3>問答題（附參考答案）</h3>\n<blockquote>\n<p>100、101、102 年的參考答案依考卷所附答案整理並補充說明；105 年兩題考卷答案寫「略」，以下為依課本出處（東大下冊、《地景》）整理的參考答案，請對照課本。</p>\n</blockquote>\n<ol>\n<li><strong>試陳述樹木移植作業重點步驟的操作目的及重點（100 年，15%）</strong>（出處：《地景》p.195～206）</li>\n<li>參考答案：</li>\n<li>（一）斷根處理：目的是在根球範圍內促生細根，提高移植成活率。時機避開炎夏酷寒；落葉樹春季斷根、秋季移植；常綠樹春季斷根、第二年春天或梅雨期移植。實施時以根元直徑 3～5 倍為半徑挖溝，切斷細根、粗根作環狀剝皮，回填土壤；貴重樹、高齡樹分次斷根。</li>\n<li>（二）樹木挖掘：依根的形態（淺根、深根）決定根球大小與形狀；根球約為地際幹徑的 3～5 倍。挖掘前先立支柱、剪除妨礙枝條、剷除雜草，以直鏟削切細根，切口平滑並塗接蠟，根球以草繩或麻布紮緊。</li>\n<li>（三）樹木搬運：避免根球鬆散破裂、樹幹樹皮受傷，枝葉束緊；縮短運輸時間，避免日曬風吹失水，苗木掘起至種植完畢不超過 2 日。</li>\n<li>（四）植穴處理：植穴寬為根球 2 倍或大 30 cm，深為根球厚加 15～20 cm；穴底挖鬆成凹型、清除石礫雜物；排水不良處挖深放粗礫石；穴底施腐熟基肥與客土。</li>\n<li>（五）樹木種植：保持樹幹垂直、最佳觀賞面朝前；解除綑繩包裹物；先填心土再填表土、分層灌水夯實；周圍做環狀土埂便於注水；必要時作補償修剪以減少蒸散。</li>\n<li>（六）保護與培養：立支柱防風搭（埋深 30 cm 以上）；卷幹（包幹）防日灼、蒸散與蟲害；定期灌溉；防止天候傷害（寒害、颱風）；覆蓋地面保濕；成活後再施肥；病蟲害防治。</li>\n<li><strong>生態綠化運用小樹苗、鄉土樹種，試與大樹苗、外來樹種比較，以彰顯其優點（101 年，12%）</strong>（出處：三民 p.057～058）</li>\n<li>參考答案：</li>\n<li>小樹苗 vs 大樹苗：① 坡面保護：小樹苗植穴小、減少坡面擾動，根系發展快可穩定邊坡；大樹苗大植穴破壞坡面、根系發展慢。② 育苗：小樹苗時間短、體積小；大樹苗需長時間培育、常無法及時提供。③ 移植生長：小樹苗移植易、成活率高、抗逆境強；大樹苗易因移植不當停止生長或死亡。④ 經費：小樹苗培育及種植費低；大樹苗高出許多。</li>\n<li>鄉土樹種 vs 外來樹種：① 環境適應力：鄉土樹種適應力強；外來樹種易因適應不良而生長欠佳。② 資源保育：鄉土樹種採用樹種多樣、可保存臺灣原生樹種；外來樹種常用優良種類有限，適應力太強者有侵擾原生態系的危險。</li>\n<li><strong>屋頂綠化設置應考慮的重要因素（101 年，10%）</strong>（出處：《地景》p.161～162）</li>\n<li>參考答案：</li>\n<li>（一）安全載重：盡量使用輕質材料；以輕質栽培介質代替自然土壤；土壤深度盡量降低；荷重大的樹木與花槽置於樑柱上方；事先與建築師商量，併入結構分析考慮屋頂承重。</li>\n<li>（二）防水及給排水：做好防水層；設置給水設施；土壤排水坡度不小於 1%（通常 1～3%）並埋設排水管。</li>\n<li>（三）植栽環境：有效土壤厚度——地被 30 cm 以下、低矮灌木 30～60 cm、中高喬木 60 cm 以上；防風——花槽設固根網、較大樹木用繩索或支柱固定；植栽選擇——避免深根植物並鋪防根層，宜淺根、低矮、耐風耐旱種類。</li>\n<li><strong>請比較義大利庭園與法式庭園的風格及營造手法異同（102 年，10%）</strong>（出處：三民 p.025）</li>\n<li>參考答案：</li>\n<li>相同：兩者皆為幾何式（軸式、對稱式）規則式庭園，均使用整形樹、雕刻物與水景，表現人為秩序。</li>\n<li>風格：義大利為幾何式、台地式；法式以幾何式（軸式、對稱式）手法造景，規模更宏大。</li>\n<li>水的使用：義大利對水的處理富變化，有變幻莫測、戲劇性、驚奇神秘之感，如水魔術、水劇場、驚愕噴泉、水風琴、秘密噴泉；法式噴泉及瀑布之應用較義大利少，多以運河、噴水池表現雕刻藝術。</li>\n<li>地形：義大利為坡地造園典範，庭園中設多層平台；法式為平坦地形造園，尤以花壇著稱。</li>\n<li>植栽：義大利利用本土性常綠灌木和喬木，配合整形樹；法式在主要軸線左右廣植樹林及草地，與模樣花壇全體構成幾何圖案。</li>\n<li>其他：義大利庭園有整形樹、雕刻物及水流之設計；法式富麗堂皇，反映財勢及嚴格的法國社會結構，表現出人優於自然之觀點。</li>\n<li><strong>請列出施工規範常見的項目（105 年，10%）</strong>（出處：東大下冊 p.112～126、《地景》p.178；考卷答案「略」）</li>\n<li>參考答案：</li>\n<li>① 總則：工程範圍、施工規範為合約一部分、甲乙方責任、單價包括項目（人工、稅利、搬運、養護）、工地安全與交通維持、保險。</li>\n<li>② 植物材料：規格（樹高、冠幅、冠厚、米徑，不含徒長枝）、檢驗與不合格標準、代用材料須甲方同意且不加價、苗木來源說明。</li>\n<li>③ 其他材料：土壤（客土、填沃土）、肥料、農藥、支架及保護設施。</li>\n<li>④ 施工方法：整地、植穴開挖及施基肥、喬灌木種植、地被草花種植、草皮鋪植、支架設立、澆水。</li>\n<li>⑤ 養護：養護期間（初驗合格日起 90～270 日）、養護工作內容（除草、澆水、病蟲害防治、修剪、補植）。</li>\n<li>⑥ 驗收與計價：初驗、養護期滿驗收標準（存活率 90%、雜草 ≤10%）、以實作數量計價、不合格處理。</li>\n<li>⑦ 天然災害處理：24 小時內報請會勘、拍照留證、清理現場，各類植物的扶植與保活規定。</li>\n<li><strong>請分別列出基地調查應蒸集之四項自然環境資料與三項人文環境資料（105 年，7%）</strong>（出處：東大下冊 p.007～011、《地景》p.099～101；考卷答案「略」）</li>\n<li>參考答案：</li>\n<li>自然環境（任四項）：① 地形（坡度、坡向、高程）② 土壤（土質、物理性與化學性）③ 氣候（日照、風向、雨量、溫度）④ 水文（地下水位、排水）⑤ 植生與野生動物⑥ 景觀與原有地物。</li>\n<li>人文環境（任三項）：① 交通狀況② 法規與政策③ 土地使用與鄰近建物④ 風俗習慣與歷史文化⑤ 使用者需求與業主意見⑥ 公共設施（水電管線）。</li>\n</ol>\n<h3>配合題</h3>\n<ul>\n<li>植栽創造的五種<strong>空間類型</strong>與空間感覺（100）→ 第六章表。</li>\n<li><strong>植栽平面圖例</strong>：闊葉樹、椰子葉及觀葉樹、竹、針葉樹、落葉樹（101）；落葉樹、常綠樹施工圖（103）。</li>\n<li><strong>虎渡子法</strong>繪圖：15 石分 5、2、3、2、3 五組（101）。</li>\n<li><strong>造園設計流程</strong>填空：使用者→「需求」→ 空間項目；基地→限制→環境改良方案、借景強化→空間基本架構→庭園形式→「施工可行性分析」→ 選擇洽談 → 定案施工 →「施工期間修正改良」→ 完工啟用 →「維護」（102）。</li>\n<li><strong>屋頂花園施工順序</strong>：基地調查 → 規劃草案 → 土木 → 防溼 → 給排水 → 植栽（102）。</li>\n<li><strong>水的四種基本形態</strong>：滯（靜）、流、落、噴，對應自然型態（湖泊、溪河、瀑布、湧泉）（103）。</li>\n<li><strong>平、立、剖、透視圖</strong>的圖名與功能配對（103、105）；<strong>剖面圖</strong>表現方式三種（剖面圖、剖面透視圖、剖立面圖）與目的三種（施工、分析、設計用）（103）。</li>\n<li><strong>簡易距離測量工具</strong>：卷尺（皮尺）、標桿、測針、手旗、垂球（103）。</li>\n<li><strong>工程費結構樹狀圖</strong>：工程費成本（材料、工資、機械器具、共同假設）、一般管理費、利潤、設計監工費（106）。</li>\n</ul>\n<h3>製圖設計題（102 試卷）</h3>\n<p>基地為 4 樓集合住宅中庭，居民多為 65 歲以上，要設計「<strong>高齡友善</strong>」庭園，運用五感中任兩種並注意無障礙與安全。配分：主題 5、基地分析 10、設計構想 10、<strong>平面配置圖 1:100 含設施植栽名稱 40</strong>、上色 15、剖（立）面圖 1:30 或 1:50 共 10、示意圖 10。練習重點：平面圖佔 55% 分數，植栽名稱要寫清楚、坡道 1/12、步道寬 1.83 m 以上、座椅與扶手。</p>"}];

/* swipe between chapters */

$("#art").addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});

/* search */
const plain=CH.map(c=>{const d=document.createElement("div");d.innerHTML=c.html;return [...d.querySelectorAll("p,li,tr,h3")].map(n=>n.textContent.replace(/\s+/g," ").trim()).filter(Boolean)});
function clearSearch(){$("#q").value="";$("#sresults").innerHTML="";$("#art").style.display=""}
$("#q").addEventListener("input",()=>{
  const k=$("#q").value.trim();
  if(!k){clearSearch();return}
  const res=[];
  plain.forEach((arr,ci)=>arr.forEach(t=>{if(t.toLowerCase().includes(k.toLowerCase()))res.push([ci,t])}));
  const hl=t=>esc(t).split(esc(k)).join(`<mark class="hit">${esc(k)}</mark>`);
  $("#art").style.display="none";
  $("#sresults").innerHTML=res.length?`<p class="hint">找到 ${res.length} 筆，點一下跳到該章</p>`+res.slice(0,80).map(([ci,t])=>`<div class="sres" data-i="${ci}"><b>${esc(CH[ci].short)}</b><p>${hl(t)}</p></div>`).join(""):`<div class="empty">找不到「${esc(k)}」</div>`;
});
$("#sresults").onclick=e=>{const r=e.target.closest(".sres");if(!r)return;const k=$("#q").value.trim();clearSearch();render(+r.dataset.i);
