table>\n<thead>\n<tr>\n<th>項目</th>\n<th>真細菌</th>\n<th>古細菌</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>細胞壁</td>\n<td>含肽聚醣（peptidoglycan）</td>\n<td>不含肽聚醣</td>\n</tr>\n<tr>\n<td>細胞膜脂質</td>\n<td>酯鍵連接的直鏈脂肪酸</td>\n<td>醚鍵連接的分枝烴類</td>\n</tr>\n<tr>\n<td>生存環境</td>\n<td>一般環境</td>\n<td>多為極端環境（高溫、高鹽、產甲烷）</td>\n</tr>\n<tr>\n<td>遺傳機制</td>\n<td>RNA 聚合酶簡單</td>\n<td>RNA 聚合酶複雜、較接近真核生物</td>\n</tr>\n<tr>\n<td>對抗生素</td>\n<td>對青黴素等敏感</td>\n<td>多不敏感</td>\n</tr>\n</tbody>\n</table>\n<p>答題重點：肽聚醣、醚鍵脂質、極端環境、較接近真核；兩者都是原核生物。</p>\n<p><strong>6. 說明遺傳工程技術正確的四個操作順序（107 農經，5 分）</strong></p>\n<p>① 分離、切取目標基因（限制酶）→ ② 將目標基因接入載體（質體，用 DNA 連接酶）形成重組 DNA → ③ 將重組 DNA 送入宿主細胞（轉形：勝任細胞、農桿菌、基因槍）→ ④ 篩選與檢驗重組體（抗生素篩選、藍白篩、核酸雜交）並大量表現。</p>\n<p>答題重點：限制酶、連接酶、載體、轉形、篩選。</p>\n<p><strong>7. 舉例說明自然農藥的種類及功用（99 員林，10 分）</strong></p>\n<ul>\n<li>植物性：苦楝油（忌避、抗食、干擾昆蟲蛻皮）、辣椒大蒜萃取液（忌避）、魚藤精、菸草水。</li>\n<li>礦物性：硫磺、石灰硫磺合劑、波爾多液（殺菌）、礦物油（窒息介殼蟲、葉蟎）。</li>\n<li>生活素材：種子油乳劑（葵花油、大豆油加乳化劑）、軟肥皂水（防治蚜蟲、粉蝨）、醫用酒精、木醋液、小蘇打（抑制白粉病）。</li>\n<li>使用原則：多為觸殺或忌避、效果較慢且持續期短，需早期、定期噴施；先小面積試驗避免藥害。</li>\n</ul>\n<p>答題重點：依來源分類（植物性、礦物性、生活素材）＋ 功用（忌避、觸殺、抑菌）。</p>\n<p><strong>8. 有機作物病害管理的四大原則（99 員林，10 分）</strong></p>\n<p>① 排除（防止病原侵入）：健康種苗、種子消毒、網室、檢疫。② 防護（提高寄主抵抗力）：抗病品種、抗病砧木、健康栽培、均衡施肥。③ 剷除（減少病原密度）：清園、移除病株、輪作、浸水、太陽能消毒。④ 環境管理與生物防治：改善通風排水、降低濕度，使用拮抗微生物（枯草桿菌、木黴菌）與允許使用的自然資材。</p>\n<p>答題重點：排除、防護、剷除、環境與生物；不用化學農藥。</p>\n<p><strong>9. 堆肥製作應考慮哪些因子？（99 員林，10 分）</strong></p>\n<ul>\n<li>碳氮比：調整至 25–30，稻草等高碳材料需加入糞尿、豆粕等含氮材料。</li>\n<li>水分：50–60%（手握成糰、指縫微滴水）。</li>\n<li>通氣：好氣性微生物需氧，定期翻堆。</li>\n<li>溫度：堆內升至 55–65 ℃ 可殺死病原與雜草種子，過高需翻堆散熱。</li>\n<li>pH：中性至微鹼為宜。</li>\n<li>材料粒徑：切碎增加表面積。</li>\n<li>微生物：可接種促進劑或成熟堆肥加速發酵。</li>\n<li>腐熟度判斷：黑褐色、無臭味、溫度不再升高。</li>\n</ul>\n<p>答題重點：C/N 25–30、水 50–60%、翻堆、高溫殺菌、腐熟判斷。</p>\n<p><strong>10. 蛋雞點燈計畫與強迫換羽的原理及方法（99 員林，10 分）</strong></p>\n<ul>\n<li>點燈計畫原理：光照刺激下視丘腦垂體，分泌促濾泡激素與黃體成形素，促進卵巢發育與產蛋。方法：育成期日照不增加（避免早熟），開始產蛋後每週逐步延長光照，達每日 16 小時後維持不減少。</li>\n<li>強迫換羽原理：蛋雞產蛋一年後產蛋率、蛋殼品質下降，人為使全群同時休產、換羽、生殖器官休息復原後重新開始第二個產蛋期。方法：短期斷料（及短時斷水）、減少光照至 8 小時，體重降約 25–30% 後恢復飼料與光照；現代考量動物福利，多改用低營養飼料法。</li>\n</ul>\n<p>答題重點：下視丘腦垂體、光照 16 小時、全群同步休產、斷料減光、動物福利。</p>"}, {"id": "c16", "title": "十六、農場經營學補充（95 臺中、99 員林）", "short": "十六、農場經營學補充", "html": "<p>考農場經營科的話，除了作物與生技，經濟法則、畜牧水產是常客。</p>\n<table>\n<thead>\n<tr>\n<th>主題</th>\n<th>考過的重點</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>農場經濟特徵</td>\n<td>生產周期長、價格不穩、不易更換業務；<span class=\"ng\">✗</span>「供需彈性大」是錯的；<mark class=\"ok\">✔ 正確：農產品供需彈性小（需求缺乏彈性，供給短期難調整，所以價格波動大）。</mark>農業勞動分工不精密</td>\n</tr>\n<tr>\n<td>生產要素</td>\n<td>技術越進步、生產越迂迴 → 資本使用越多；生產力最大 = 受容力與生產效率皆最大</td>\n</tr>\n<tr>\n<td>邊際土地</td>\n<td>生產所得剛好足以支付一切費用的農地；農地等則 7–12 等為中等農地</td>\n</tr>\n<tr>\n<td>經濟法則</td>\n<td>報酬遞減律中只有「邊際報酬」可為負；一種要素分配於多種業務用「均等邊際報酬原則」；選擇業務用「比較利益法則」</td>\n</tr>\n<tr>\n<td>業務關係</td>\n<td>園藝農場兼營養蜂 = 互助業務；水稻加綠肥 = 半專業化經營</td>\n</tr>\n<tr>\n<td>農場佈置</td>\n<td>田坵同面積、同形狀、同土質，長方形佳，坵數 ≥ 輪作年數；無法兼顧時以「同土質」優先</td>\n</tr>\n<tr>\n<td>政策與組織</td>\n<td>委託經營須書面契約，受託人不取得自耕農身份；農業生產專業區不是「維護傳統結構」；鄉鎮農會設推廣股；保證責任合作社以股金加保證金為限</td>\n</tr>\n<tr>\n<td>運銷與價格</td>\n<td>基本職能：運輸、儲藏、買賣；純屬人為供需失調的價格變動 = 循環變動；GDP = 國內生產毛額</td>\n</tr>\n<tr>\n<td>農業三生</td>\n<td>生產、生活、生態</td>\n</tr>\n<tr>\n<td>水產</td>\n<td>西南沿海鹹水魚塭以虱目魚為主；海洋牧場 = 沿海箱網或魚礁養殖；魚「浮頭」最佳解法是注水；溶氧以日落前最高</td>\n</tr>\n<tr>\n<td>畜牧</td>\n<td>維生素維護神經與黏膜、抗壞血病；鮮乳標章的「檢驗」由縣市政府負責；蛋雞點燈計畫（光照刺激下視丘腦垂體促產蛋）與強迫換羽（斷料、斷水、減光使全群休產後重新產蛋）</td>\n</tr>\n<tr>\n<td>作物</td>\n<td>甘蔗蔗苗平植在畦底；薏苡含蛋白質與脂肪最多、為漢藥材；甜高粱又名蘆粟；「地上開花、地下結果」是落花生；插秧機缺株與「插植速度太慢」無關</td>\n</tr>\n<tr>\n<td>99 員林問答</td>\n<td>堆肥製作考慮因子：碳氮比（25–30）、水分（50–60%）、通氣翻堆、溫度、pH、粒徑、接種微生物</td>\n</tr>\n</tbody>\n</table>"}, {"id": "c17", "title": "十七、技藝競賽園藝職種考點（94、96–114）", "short": "十七、技藝競賽園藝職種考點", "html": "<p>來源：全國高級中等學校農業類技藝競賽「園藝職種」學科試題（94、96–114 學年度，共 20 份）。每一條後面的<span class=\"skill\">技藝競賽 年度</span>是出現過的年度；標「教甄也考」的是教甄和技藝競賽都出過的高頻考點。是非題答案為 <span class=\"ng\">✗</span> 的，這裡先寫正確的資料，再在後面括號用「<span class=\"ng\">✗</span> 錯誤選項」列出考卷上的錯誤說法。</p>\n<p>題型變化：94–105 年為是非 50 題＋選擇 50 題；106 年起改為選擇 50 題（每題 2 分）；94 年另有「園藝植物識別」實物題；造園題只出到 98 年。出處多為東大、地景、復文三家高職課本。</p>\n<h3>1. 科別、學名與別名</h3>\n<ul>\n<li>果樹科別：番石榴、蓮霧為桃金孃科<span class=\"skill\">技藝競賽 111</span>；印度棗為鼠李科<span class=\"skill\">技藝競賽 112</span>；榴槤為木棉科<span class=\"skill\">技藝競賽 110</span><span class=\"both\">教甄也考</span>；芒果為漆樹科<span class=\"skill\">技藝競賽 105</span>；百香果為西番蓮科<span class=\"skill\">技藝競賽 108</span>。</li>\n<li>荔枝、龍眼、紅毛丹為無患子科；蘋婆不是（梧桐科）<span class=\"skill\">技藝競賽 106、114</span>。番荔枝為番荔枝科<span class=\"wopt\">（<span class=\"ng\">✗</span> 錯誤選項：「番荔枝為無患子科」）</span><span class=\"skill\">技藝競賽 98</span>。</li>\n<li>薔薇科：蘋果、梨、枇杷、覆盆子；楊梅、番木瓜不是<span class=\"skill\">技藝競賽 102、105、113</span>。桃、梅、李同屬 Prunus，梨是 Pyrus<span class=\"skill\">技藝競賽 110</span>。桑科果樹：麵包樹、無花果<span class=\"skill\">技藝競賽 99</span>。</li>\n<li>蔬菜科別：蘆筍為百合科<span class=\"wopt\">（<span class=\"ng\">✗</span> 錯誤選項：「蘆筍為禾本科」）</span><span class=\"skill\">技藝競賽 97、102</span>；芋為天南星科、菠菜為藜科、秋葵為錦葵科<span class=\"skill\">技藝競賽 97</span>；馬鈴薯為茄科（芋不是茄科）<span class=\"skill\">技藝競賽 96、111</span>。</li>\n<li>菊科蔬菜：牛蒡、萵苣、嫩莖萵苣、菊芋、茼蒿、紅鳳菜、朝鮮薊；甘藷不是（旋花科）<span class=\"skill\">技藝競賽 101、103、104、108</span>。紅鳳菜不是十字花科<span class=\"skill\">技藝競賽 109</span>。</li>\n<li>繖形花科：芫荽、芹菜、胡蘿蔔、根芹菜；莧菜（莧科）、波羅門參（菊科）不是<span class=\"skill\">技藝競賽 94、98</span>。蘿蔔（十字花科）與胡蘿蔔（繖形花科）不同科不同屬<span class=\"skill\">技藝競賽 101</span>。</li>\n<li>單子葉蔬菜：百合科、天南星科、禾本科，茭白、荸薺、慈菇、山藥；藜科、蓮藕、菱角為雙子葉<span class=\"skill\">技藝競賽 100、101、102</span>。</li>\n<li>花卉科別：火鶴花為天南星科<span class=\"skill\">技藝競賽 96</span>；夜來香（晚香玉）為龍舌蘭科，原產墨西哥（<span class=\"ng\">✗</span>原生臺灣）<span class=\"skill\">技藝競賽 96、101、102</span>；長壽花為景天科<span class=\"skill\">技藝競賽 100</span>；唐菖蒲為鳶尾科<span class=\"skill\">技藝競賽 109</span>；宿根滿天星為石竹科<span class=\"skill\">技藝競賽 104</span>；醉蝶花為白花菜科<span class=\"skill\">技藝競賽 107</span>；皺葉椒草為胡椒科<span class=\"skill\">技藝競賽 111</span>；仙客來為報春花科<span class=\"skill\">技藝競賽 112</span>。</li>\n<li>唇形科：彩葉草、紫蘇（金魚草不是）<span class=\"skill\">技藝競賽 99</span>；莧科：雞冠花、雁來紅、千日紅（彩葉草不是）<span class=\"skill\">技藝競賽 108</span>。</li>\n<li>天南星科觀葉：黃金葛、彩葉芋、觀音蓮、海芋、合果芋、黛粉葉；竹芋、孔雀竹芋（竹芋科）、圓葉椒草（胡椒科）不是<span class=\"skill\">技藝競賽 94、101、103、109、113</span>。<span class=\"ng\">✗</span>「竹芋與芋頭同屬天南星科」<span class=\"skill\">技藝競賽 94</span>。</li>\n<li>學名與英名：Carambola、Averrhoa carambola＝楊桃<span class=\"skill\">技藝競賽 96、102、109</span>；Eriobotrya japonica＝枇杷<span class=\"skill\">技藝競賽 101</span>；Syzygium samarangense＝蓮霧<span class=\"skill\">技藝競賽 101</span>；Passion fruit＝百香果<span class=\"skill\">技藝競賽 110</span>；Anthurium＝火鶴花屬<span class=\"skill\">技藝競賽 104</span>；Drosera＝毛氈苔（Dionaea 捕蠅草、Nepenthes 豬籠草、Sarracenia 瓶子草）<span class=\"skill\">技藝競賽 111</span>。</li>\n<li>英名易混：Day lily＝金針花（<span class=\"ng\">✗</span>夜來香）<span class=\"skill\">技藝競賽 101、102</span>；Golden spider lily＝金花石蒜<span class=\"skill\">技藝競賽 108</span>；大蒜英名 garlic、別名「葫」<span class=\"skill\">技藝競賽 99、102</span>。</li>\n<li>別名：茼蒿＝春菊<span class=\"skill\">技藝競賽 104</span>；西紅柿＝番茄<span class=\"skill\">技藝競賽 106</span>；萊菔＝蘿蔔、薯蕷＝山藥、石刁柏＝蘆筍；馬蹄是荸薺<span class=\"wopt\">（<span class=\"ng\">✗</span> 錯誤選項：「慈菇別名馬蹄」）</span><span class=\"skill\">技藝競賽 111</span>。</li>\n</ul>\n<h3>2. 果樹</h3>\n<p>果實構造</p>\n<ul>\n<li>核果的硬核由內果皮硬化而成<span class=\"wopt\">（<span class=\"ng\">✗</span> 錯誤選項：「核是種皮硬化」）</span><span class=\"skill\">技藝競賽 100、102</span>。核果類：桃、櫻桃、芒果、印度棗；葡萄是漿果，櫻桃不是仁果<span class=\"skill\">技藝競賽 100、101、109</span>。</li>\n<li>仁果類（蘋果、梨、枇杷）食用部位是花托及附屬組織（<span class=\"ng\">✗</span>中果皮）<span class=\"skill\">技藝競賽 101、102</span>；蘋果為子房下位花<span class=\"skill\">技藝競賽 99</span>。果實主要由子房發育者：柿、酪梨、葡萄、芒果<span class=\"skill\">技藝競賽 102、109</span>。</li>\n<li>柑橘食用部位是內果皮內側長出的砂囊（<span class=\"ng\">✗</span>中果皮、<span class=\"ng\">✗</span>假種皮）<span class=\"skill\">技藝競賽 96、101、102、104</span>；具砂囊的柑橘類與柿同屬「準仁果類」<span class=\"skill\">技藝競賽 107、113</span>。</li>\n<li>堅果食用部位為子葉（<span class=\"ng\">✗</span>內果皮）<span class=\"skill\">技藝競賽 100</span>；栗的總苞包在子房壁外、子房壁硬化成殼、子葉肉質，栗為雌雄同株（<span class=\"ng\">✗</span>雌雄異株）<span class=\"skill\">技藝競賽 106</span>。</li>\n<li>枇杷為假果；柑橘、葡萄、甜橙、桃、酪梨為真果；鳳梨為聚合果（多花果），屬假果<span class=\"skill\">技藝競賽 99、100、101、102、103、104</span>。一般果實食用部位以中果皮居多，香蕉例外<span class=\"skill\">技藝競賽 107、110</span>。</li>\n</ul>\n<p>氣候與分布</p>\n<ul>\n<li>氣溫是影響果樹地理分布最主要的因子（<span class=\"ng\">✗</span>日照）<span class=\"skill\">技藝競賽 100、102、104</span>；「橘越淮而為枳」講的就是溫度<span class=\"skill\">技藝競賽 106</span>。</li>\n<li>柑桔、龍眼、荔枝為亞熱帶果樹；酪梨不是<span class=\"skill\">技藝競賽 100、103、112</span>。溫帶果樹：冬季落葉、分布南北緯 30–50°、需 7 ℃ 以下低溫打破休眠<span class=\"skill\">技藝競賽 114</span>。</li>\n<li>冬季低溫是打破溫帶果樹的芽體休眠<span class=\"wopt\">（<span class=\"ng\">✗</span> 錯誤選項：「溫帶果樹需冬季低溫誘導花芽分化」）</span>；低溫不足則春天萌芽不整齊，臺灣平地冬季太暖使落葉果樹抽梢不齊<span class=\"skill\">技藝競賽 96、100、101、102、109</span>。低溫並非越低越好（有效低溫約 7.2 ℃ 以下）；蘋果約需 1400 小時<span class=\"skill\">技藝競賽 101、111</span>。</li>\n<li>枇杷在夏季高溫期（7–8 月）花芽分化（<span class=\"ng\">✗</span>冬季涼溫）<span class=\"skill\">技藝競賽 98、100、101、102</span>；荔枝、龍眼、芒果靠秋冬涼溫促進花芽分化，荔枝冬季應避免灌溉<span class=\"skill\">技藝競賽 94、101、102、110</span>。</li>\n<li>一般果樹喜微酸性土壤，pH 5.5–6.5；pH 過低會阻礙磷吸收；鳳梨宜 pH 4.5–6<span class=\"skill\">技藝競賽 97、98、100、108、110、112</span>。</li>\n<li>常綠果樹：柑橘、香蕉、鳳梨、枇杷；葡萄落葉<span class=\"skill\">技藝競賽 107、114</span>。灌木型果樹：醋栗<span class=\"skill\">技藝競賽 103</span>。</li>\n</ul>\n<p>繁殖與育種</p>\n<ul>\n<li>優良變異枝條育成新品種的方法是「芽條變異」<span class=\"wopt\">（<span class=\"ng\">✗</span> 錯誤選項：「實生變異」）</span><span class=\"skill\">技藝競賽 94、97</span>。印度棗新品種多由實生苗變異選拔<span class=\"skill\">技藝競賽 98</span>；星露佩葡萄柚由人為誘變育成；愛文芒果為引種<span class=\"wopt\">（<span class=\"ng\">✗</span> 錯誤選項：「愛文芒果由人工誘變育成」）</span><span class=\"skill\">技藝競賽 103、113</span>。</li>\n<li>土芒果具多胚性，實生苗與母樹相同<span class=\"skill\">技藝競賽 94</span>；柚類為單胚，柑橘類並非全都多胚<span class=\"wopt\">（<span class=\"ng\">✗</span> 錯誤選項：「文旦柚多胚性」）</span><span class=\"skill\">技藝競賽 96、101</span>。</li>\n<li>秋水仙素處理生長點（<span class=\"ng\">✗</span>全株噴施）<span class=\"skill\">技藝競賽 100</span>；雜交胚易敗育時用胚培養救援<span class=\"skill\">技藝競賽 100、105</span>；細胞融合要從細胞（原生質體）培養做起<span class=\"skill\">技藝競賽 96</span>。</li>\n<li>果樹育種障礙：多胚性、自交不親和、幼年期長（自然變異不是障礙）；高壓不是品種改良方法<span class=\"skill\">技藝競賽 104、111、114</span>。</li>\n<li>柑橘苗木以嫁接為主（<span class=\"ng\">✗</span>高壓）<span class=\"skill\">技藝競賽 97、102</span>；枳殼最耐寒、為優良砧木<span class=\"both\">教甄也考</span><span class=\"skill\">技藝競賽 97、99</span>；椪柑常用酸桔作砧<span class=\"skill\">技藝競賽 103</span>。</li>\n<li>番石榴砧木以種子繁殖；番木瓜以實生苗栽培<span class=\"skill\">技藝競賽 108、110</span>。龍眼用高壓、切接、高接（不用組培）；印度棗用切接、靠接、高接（不用高壓）<span class=\"skill\">技藝競賽 107、108</span>。</li>\n<li>李的根砧：毛桃、梅、李（梨不是）<span class=\"skill\">技藝競賽 111</span>；臺灣梨根砧多用鳥梨<span class=\"skill\">技藝競賽 114</span>。</li>\n<li>高接梨以橫山梨為砧，嫁接溫帶梨花芽<span class=\"wopt\">（<span class=\"ng\">✗</span> 錯誤選項：「高接梨以溫帶梨作砧木」）</span><span class=\"skill\">技藝競賽 94、97、113</span>。梨品種混植是為了克服自交不親和<span class=\"skill\">技藝競賽 94、96</span>。</li>\n<li>香蕉組培苗是為了防黃葉病（<span class=\"ng\">✗</span>假莖象鼻蟲）；黃葉病由根部侵入維管束（<span class=\"ng\">✗</span>經葉片）；「臺蕉一號」由微體繁殖產出<span class=\"skill\">技藝競賽 96、97、98、103、104、109、114</span>。</li>\n<li>鳳梨繁殖芽：裔芽長在果柄、冠芽長在果頂、吸芽長在葉腋，商業上不用種子<span class=\"skill\">技藝競賽 94、103、104、107</span>。經濟栽培鳳梨不結子是因為自交不親和，仍可雜交育種<span class=\"wopt\">（<span class=\"ng\">✗</span> 錯誤選項：「經濟栽培鳳梨為三倍體才不結子」）</span><span class=\"skill\">技藝競賽 101、104</span>。</li>\n<li><span class=\"ng\">✗</span>「番木瓜種子有休眠需層積」、<span class=\"ng\">✗</span>「番木瓜不能無性繁殖」<span class=\"skill\">技藝競賽 94</span>；番木瓜種子乾燥後可密封冷藏 5–10 ℃<span class=\"skill\">技藝競賽 97、104</span>。番木瓜有雌株、雄株、兩性株，兩性株為圓錐花序，可持續邊生長邊開花結果<span class=\"skill\">技藝競賽 101、106、108、110</span>。</li>\n<li>獼猴桃：雌雄異株（雌雄比約 8:1）、原產中國（<span class=\"ng\">✗</span>紐西蘭）、主栽品種 Hayward、漿果 10–11 月熟、葉互生（<span class=\"ng\">✗</span>對生）<span class=\"skill\">技藝競賽 94、96、101、102、106、108、112</span>。</li>\n</ul>\n<p>栽培管理</p>\n<ul>\n<li>定植時表土心土分開，先回填表土；嫁接口不可埋入土中<span class=\"skill\">技藝競賽 96、100</span>。落葉果樹在秋季落葉後至春季萌芽前定植（<span class=\"ng\">✗</span>夏季、<span class=\"ng\">✗</span>新根長出後 3–5 月）<span class=\"skill\">技藝競賽 96、101、111</span>。</li>\n<li>坡地用等高耕作做水土保持；清耕不是水保方式<span class=\"skill\">技藝競賽 106、111</span>。</li>\n<li>整枝：平地與多風地區的梨用水平棚架；蘋果用圓錐形；柑橘用自然或半自然型；枇杷用改良杯狀形，可減風害並增加結果面；番石榴少用棚架<span class=\"skill\">技藝競賽 94、99、101、105、108、112、113</span>。撚枝是把直立新梢扭轉 90–180°<span class=\"skill\">技藝競賽 107</span>。</li>\n<li>C/N 比影響花芽分化，但<span class=\"ng\">✗</span>「C/N 越高越好」；氮多碳少會徒長<span class=\"skill\">技藝競賽 98、100、102、108</span>。環狀剝皮使「上方」碳水化合物累積（<span class=\"ng\">✗</span>下方）<span class=\"skill\">技藝競賽 94</span>。</li>\n<li>疏果目的：增大果、減少隔年結果、提高品質、減病蟲害；不包括降低葉果比、減少肥料或人工、提高產量<span class=\"skill\">技藝競賽 97、102、105、108、113</span>。葉果比：蘋果 30–40:1、柿 15:1、椪柑 80:1<span class=\"skill\">技藝競賽 103、111、112</span>。</li>\n<li>套袋目的：品質、減病蟲害、防日燒、減藥斑；不是促進軟化或新梢；芒果套袋不防白粉病；百香果一般不套袋<span class=\"skill\">技藝競賽 100、102、107、112</span>。</li>\n<li>生理落果原因：授粉受精不良、環境不適、養分水分不足；<span class=\"ng\">✗</span>「果柄產生 GA 導致離層」；多施氮肥不能減少落果；開花期降雨最降低著果<span class=\"skill\">技藝競賽 97、101、105、106</span>。</li>\n<li>落葉果樹基肥在休眠期至隔年萌芽前施；禮肥在果實採收後施<span class=\"skill\">技藝競賽 112、113</span>。</li>\n</ul>\n<p>產期調節與生長調節劑</p>\n<ul>\n<li>鳳梨催花：電石水夜間處理效果最好；乙烯、乙炔（電石）、NAA 可用，ABA 不行；電石水 0.5–1%；處理後約 1.5 個月抽穗；南部 4 月下旬催花約 10 月中旬採收<span class=\"skill\">技藝競賽 94、97、98、100、106、109、114</span>。<span class=\"ng\">✗</span>「日照長的夏天較易催花」<span class=\"skill\">技藝競賽 102</span>。</li>\n<li>鳳梨催花計算：25000 株 × 30 mL × 5000 ppm → 電石 3.75 kg<span class=\"skill\">技藝競賽 100</span>；20000 株 → 3 kg（<span class=\"ng\">✗</span>30 kg）<span class=\"skill\">技藝競賽 104</span>；益收 39.5%，8 L 配 316 ppm 約 6.4 mL、400 ppm 約 8.1 mL<span class=\"skill\">技藝競賽 96、109</span>。</li>\n<li>葡萄：氰胺（hydrogen cyanamide）催芽打破休眠（<span class=\"ng\">✗</span>NAA）；開花後幼果期處理 GA 誘導無子、單為結實；冬果由夏果結果枝修剪催芽而來<span class=\"skill\">技藝競賽 96、98、101、103、104、109、111</span>。</li>\n<li>葡萄品種：巨峰為歐美雜交種（Vitis labrusca × V. vinifera），臺灣種植最多；黑后為歐美雜交種，供釀酒及果汁、不作鮮食；金香釀酒；意大利鮮食<span class=\"skill\">技藝競賽 97、98、101、102、105、113、114</span>。</li>\n<li>蓮霧：遮黑網、浸水、斷根、環剝都可抑制營養生長；電石不是蓮霧的方法；<span class=\"ng\">✗</span>「速滅松可隨時催花」<span class=\"skill\">技藝競賽 97、102、104、106、111、113、114</span>。</li>\n<li>番石榴靠摘心、修剪、施肥控制全年供果<span class=\"skill\">技藝競賽 97、102、103</span>；釋迦 6–9 月修剪產冬果<span class=\"skill\">技藝競賽 106</span>；香蕉靠種植期調節，高屏冬蕉於 2–3 月種植<span class=\"skill\">技藝競賽 106、111</span>。</li>\n<li>梨的寄接（高接）是產期調節，但不以促進花芽形成為目的<span class=\"skill\">技藝競賽 101、104</span>；柳橙尚無法一年二收、柿尚未以技術成功調節產期<span class=\"skill\">技藝競賽 101、110</span>。</li>\n<li>NAA 用途：疏果、防落果、扦插發根、鳳梨催花；不能促進果皮轉色<span class=\"skill\">技藝競賽 100、102、109、111</span>。克美素（CCC）為矮化劑，矮化劑抑制 GA 生合成<span class=\"skill\">技藝競賽 94、105</span>。GA 可打破溫帶果樹種子休眠（<span class=\"ng\">✗</span>ABA）<span class=\"skill\">技藝競賽 100、102、104</span>。</li>\n<li>果實轉色：乙烯、光照、冷涼夜溫都能促進；大量氮肥不能<span class=\"skill\">技藝競賽 113</span>。</li>\n</ul>\n<p>品種與各論</p>\n<ul>\n<li>荔枝成熟序：三月紅 → 玉荷包 → 黑葉 → 糯米糍 → 桂味；開花後 80–100 天成熟；雌雄同株異花<span class=\"skill\">技藝競賽 97、98、102、103、108</span>。</li>\n<li>龍眼花穗長在前一年發育枝條頂端，為圓錐花序；粉殼龍眼不需授粉樹<span class=\"skill\">技藝競賽 98、108、111</span>。圓錐花序：葡萄、枇杷、荔枝、龍眼；蓮霧不是<span class=\"skill\">技藝競賽 96、104</span>。頂生花序：枇杷、芒果、荔枝；楊桃、百香果不是<span class=\"skill\">技藝競賽 96、106、109、113</span>。</li>\n<li>鳳梨：原產南美洲；臺灣年產量最大的果樹（早年）；近三年栽培面積最大為香蕉；栽培面積最小曾考葡萄、桃<span class=\"skill\">技藝競賽 94、100、101、105、109、110</span>。</li>\n<li>蓮霧：主栽粉紅種，黑珍珠、黑金剛等是產期調節果（<span class=\"ng\">✗</span>變種）；子房 2 室<span class=\"skill\">技藝競賽 94、97、98</span>。</li>\n<li>番木瓜：網室栽培防輪點毒素病（蚜蟲傳播），是最嚴重病害；台農 5 號以耐毒素病為育種目標；日陞可溶性固形物最高；行株距 2.5 × 2 m 每分地約 200 株<span class=\"skill\">技藝競賽 94、96、98、102、103、105、109、111</span>。</li>\n<li>百香果：台農 1 號＝紫色種 × 黃色種；黃色種需人工授粉，紫色種可自然授粉；毒素病無法用甲基丁香油防治<span class=\"skill\">技藝競賽 101、102、103、104、111、113</span>。</li>\n<li>楊桃：酸味種花瓣濃紫、成熟果皮深黃，適合加工；甜味種鮮食<span class=\"skill\">技藝競賽 101、104</span>。</li>\n<li>柿：澀味來自可溶性單寧，脫澀是單寧轉為不溶性<span class=\"wopt\">（<span class=\"ng\">✗</span> 錯誤選項：「脫澀是單寧分解成糖」）</span>；可用石灰水、10% 酒精、電石、CO₂，NAA 不行（106 年另考「電石不是硬柿脫澀方式」）；牛心柿常人工脫澀成脆柿；富有柿為甜柿，樹上即脫澀；柿結果母枝為前一年生枝（<span class=\"ng\">✗</span>當年生）<span class=\"skill\">技藝競賽 94、97、99、103、104、106、108、113</span>。</li>\n<li>梨：砂梨系統有橫山梨、新興、新世紀，巴梨為西洋梨；東洋梨採後即可吃、西洋梨需後熟；橫山梨可在低海拔種植<span class=\"skill\">技藝競賽 103、105、106、112</span>。</li>\n<li>桃：台農甜蜜桃可低海拔種植、具水蜜桃風味；普利美最早熟；脆梅用青梅在果實尚未充分肥大時採收<span class=\"skill\">技藝競賽 97、111、113、114</span>。</li>\n<li>甜橙類：柳橙、印子柑、晚崙西亞、華盛頓臍橙；桶柑、椪柑不是；文旦屬柚類，海梨柑屬寬皮柑；臺灣栽培最多為甜橙類<span class=\"skill\">技藝競賽 97、98、101、105、112</span>。</li>\n<li>香蕉：華蕉系（Cavendish）如仙人蕉；雄花苞應剪除；吸芽儘早剷除；臺灣有八大季節蕉<span class=\"skill\">技藝競賽 106、114</span>。</li>\n</ul>\n<p>果樹病蟲害</p>\n<ul>\n<li>柑橘：黃龍病（椪柑）、象皮病由銹蜱引起、潰瘍病多發於葉片且防風林可減少、潛葉蛾使葉片出現畫圖狀紋路<span class=\"skill\">技藝競賽 94、101、106、113、114</span>。</li>\n<li>梨赤星病中間寄主為龍柏<span class=\"skill\">技藝競賽 96、111</span>；桃最易流膠病<span class=\"skill\">技藝競賽 96</span>；番石榴立枯病用免賴得<span class=\"skill\">技藝競賽 112</span>；瓢蟲防治吹綿介殼蟲<span class=\"skill\">技藝競賽 112</span>。</li>\n<li>甲基丁香油誘殺雄果實蠅；鳳梨沒有果實蠅問題<span class=\"skill\">技藝競賽 94、110</span>。葡萄露菌病不用納乃得（殺蟲劑）；黑星病不是臺灣葡萄常見病害<span class=\"skill\">技藝競賽 99、110</span>。</li>\n<li>膠蟲是荔枝、龍眼害蟲，需防治<span class=\"wopt\">（<span class=\"ng\">✗</span> 錯誤選項：「膠蟲可採蟲膠增加收入，不必防治」）</span><span class=\"skill\">技藝競賽 96</span>。</li>\n</ul>\n<h3>3. 蔬菜</h3>\n<p>溫度、光週期與花性</p>\n<ul>\n<li>甘藍、胡蘿蔔為綠植株感應型<span class=\"wopt\">（<span class=\"ng\">✗</span> 錯誤選項：「甘藍為種子春化型」）</span>；種子感應型有蘿蔔、蕪菁、白菜，生育期間也能感應低溫<span class=\"skill\">技藝競賽 94、96、97、101、102、107</span>。蘿蔔「催芽後」種子放 7 ℃ 約 15 天可誘導花芽（陰乾種子不行）<span class=\"skill\">技藝競賽 98、100、104</span>。</li>\n<li>菠菜：長日促抽苔、不耐酸性土、屬藜科；<span class=\"ng\">✗</span>「菠菜為低溫感應開花型」<span class=\"skill\">技藝競賽 94、97、104、108</span>。莧菜為短日蔬菜<span class=\"skill\">技藝競賽 100</span>。</li>\n<li>洋蔥：長日促結球（<span class=\"ng\">✗</span>低溫促結球）；恆春品種屬短日照型；鱗莖由葉鞘基部肥大而成（<span class=\"ng\">✗</span>莖盤）；以地上部倒伏枯萎為採收指標；以種子繁殖為主<span class=\"skill\">技藝競賽 94、96、97、103、106、112</span>。</li>\n<li>大蒜：長日促進鱗莖形成；種蒜有休眠，種植前放 15 ℃ 數週催芽；西螺白蒜為軟骨種；學甲大片黑供蒜球用<span class=\"skill\">技藝競賽 99、107、109、114</span>。</li>\n<li>馬鈴薯：短日、低夜溫有利結薯；食用部位是匍匐莖先端膨大的塊莖（<span class=\"ng\">✗</span>球莖）；種薯可用低溫或硫脲打破休眠；是世界主要糧食作物<span class=\"skill\">技藝競賽 94、96、99、100、101、104、106、114</span>。</li>\n<li>番茄開花不受光週期影響；茄果類需強光、開花不受日長影響<span class=\"skill\">技藝競賽 94、104</span>。</li>\n<li>胡瓜：短日、低溫促雌花，長日、高溫促雄花；益收（乙烯）促雌花；GA 可讓全雌株產生雄花以便留種；細胞分裂素不改變花性；<span class=\"ng\">✗</span>「益收可使全雌株產生雄花」<span class=\"skill\">技藝競賽 96、97、98、100、101、103、106、109</span>。</li>\n<li>雌雄同株異花：胡瓜等瓜類（蟲媒花，喜溫暖）；四季秋海棠也是<span class=\"skill\">技藝競賽 97、101、102、103</span>。</li>\n</ul>\n<p>種子與育種</p>\n<ul>\n<li>好光性種子：萵苣、芹菜，種子小宜淺播；紅光促進萵苣發芽，紅外光抵銷<span class=\"skill\">技藝競賽 96、98、101、102、103、104</span>。</li>\n<li>種子貯藏宜低溫低濕；常規種子含水量約 4–8%；包裝要防水、低透氣<span class=\"skill\">技藝競賽 100、106、107</span>。</li>\n<li>滲調處理用 PEG（聚乙二醇），目的在控制吸水；<span class=\"ng\">✗</span>「以次氯酸鈉滲調」<span class=\"skill\">技藝競賽 94、98、107</span>。溫湯處理可殺死種子表面病原<span class=\"skill\">技藝競賽 97、98</span>。</li>\n<li>硬實種子可刻傷、酸鹼處理、去種皮（浸冷水無效）；翼豆、黃秋葵、苦瓜要刻傷，牛蒡不必<span class=\"skill\">技藝競賽 98、101、108、109</span>。</li>\n<li>自花授粉：番茄、萵苣、豌豆、甜椒；甘藍與十字花科多為異花授粉；異花授粉作物育種以族群為對象；隔離栽培是防雜交最經濟的方法<span class=\"skill\">技藝競賽 94、96、98、100、104</span>。</li>\n<li>番茄、胡瓜採種時果肉要先發酵再水洗取種<span class=\"skill\">技藝競賽 112、113</span>。</li>\n<li>無子西瓜：四倍體母本 × 二倍體父本得三倍體種子；種植時不可與二倍體混植；秋水仙鹼處理幼苗生長點得四倍體；「鳳山一號」為臺灣第一個商業無子西瓜（1961）<span class=\"skill\">技藝競賽 94、97、101、103、106</span>。</li>\n</ul>\n<p>栽培管理</p>\n<ul>\n<li>作畦宜南北向（<span class=\"ng\">✗</span>東西向）；多雨地區作高畦，乾燥肥沃地作平畦<span class=\"skill\">技藝競賽 94、98、100、104</span>。中耕：乾旱地宜淺，多雨地稍深<span class=\"skill\">技藝競賽 98、102</span>；山藥、蘿蔔需深耕<span class=\"skill\">技藝競賽 97</span>。</li>\n<li>輪作減輕病蟲害（與水稻輪作可防青枯病）；間作是為了充分利用土地<span class=\"skill\">技藝競賽 94、96、98、100、104、109</span>。</li>\n<li>移植選陰天；豆類不適移植；茭白不直播；苗床宜早上澆水<span class=\"skill\">技藝競賽 94、97、101、102、104</span>。</li>\n<li>蘆筍：臺灣採「留母莖」栽培（<span class=\"ng\">✗</span>不留母莖）；雌雄異株；吸收氮、鉀多；主要病害有莖枯病<span class=\"skill\">技藝競賽 96、97、102、103、104</span>。</li>\n<li>瓜類：西瓜留主蔓結大果、適合河床地；溫室洋香瓜直立栽培以子蔓留果；絲瓜、苦瓜子蔓結果，扁蒲與雙蔓整枝的甜瓜在孫蔓結果<span class=\"skill\">技藝競賽 98、102、109</span>。</li>\n<li>竹筍：麻竹、綠竹為叢生竹，喜溫暖；孟宗竹、桂竹為散生竹，有竹鞭較耐寒；冬筍來自孟宗竹；綠竹筍以牛角形為佳；竹筍需清晨採收<span class=\"skill\">技藝競賽 99、103、104、106、108、110</span>。</li>\n<li>茭白：因菰黑穗菌寄生而肥大（不是要避免感染）；以分株繁殖；青殼種為早生種<span class=\"skill\">技藝競賽 94、98、99、101、108</span>。</li>\n<li>韭黃是在黑暗下軟化（<span class=\"ng\">✗</span>50% 遮光）；綠蘆筍不做軟化栽培<span class=\"skill\">技藝競賽 100、105、112、114</span>。</li>\n</ul>\n<p>營養、病害與雜草</p>\n<ul>\n<li>缺硼：生長點停止、葉柄或莖縱裂、授粉不正常、果實凹凸；缺錳：新葉網狀黃化、葉脈保持綠色；缺鈣：結球白菜葉緣焦枯；缺鉀：葉緣先黃化；缺硫：嫩梢黃化細長；鹼性土缺鐵使葉片白化<span class=\"skill\">技藝競賽 97、98、100、102、106、107、111</span>。</li>\n<li>症狀先出現在新葉：硫、鐵、硼、鋅；鎂缺乏先見於老葉<span class=\"skill\">技藝競賽 99、109</span>。</li>\n<li>酸性土壤鈣、鎂含量低，以石灰改良；馬鈴薯較耐酸，西瓜可耐 pH 5–5.5<span class=\"skill\">技藝競賽 96、98、100、102、104、105</span>。</li>\n<li>甘藍根瘤病（<span class=\"ng\">✗</span>根瘤菌）在酸性土易發；馬鈴薯瘡痂病在鹼性土易發<span class=\"skill\">技藝競賽 97、113</span>。</li>\n<li>白粉病在乾燥環境較嚴重（<span class=\"ng\">✗</span>潮濕）；晚疫病好發低溫多濕；青枯病、黑腐病、軟腐病為細菌性（<span class=\"ng\">✗</span>病毒）<span class=\"skill\">技藝競賽 100、102、106、109、112</span>。</li>\n<li>巴拉刈為接觸型（2,4-D 才會移行）<span class=\"both\">教甄也考</span>；萌前殺草劑如拉草、施得圃要在土壤濕潤時施用<span class=\"skill\">技藝競賽 97、101、102、104、107</span>。</li>\n<li>性費洛蒙是雌蟲分泌、用來誘殺雄蟲；<span class=\"ng\">✗</span>「透明塑膠布可抑制雜草」<span class=\"skill\">技藝競賽 98、100、104</span>。</li>\n</ul>\n<p>採收後處理</p>\n<ul>\n<li>預冷是降低呼吸與蒸散<span class=\"wopt\">（<span class=\"ng\">✗</span> 錯誤選項：「預冷促進蒸散與呼吸」）</span>；貯藏溫度並非越低越好，寒害是 0 ℃ 以上低溫造成的傷害<span class=\"both\">教甄也考</span><span class=\"skill\">技藝競賽 94、96、101</span>。</li>\n<li>癒傷：馬鈴薯、甘藷在高溫高濕下進行；洋蔥、蒜頭在高溫低濕下；蔥不需癒傷<span class=\"skill\">技藝競賽 99、101、104、107、113</span>。</li>\n<li>呼吸率低：洋蔥<span class=\"skill\">技藝競賽 98、113</span>。分級的好處不含延長貯藏壽命、增加維生素<span class=\"skill\">技藝競賽 96、106</span>。</li>\n<li>結球萵苣不宜水冷預冷；青花菜採後儘速冰水預冷，在小花蕾未開前採收<span class=\"skill\">技藝競賽 109、112、113</span>。</li>\n</ul>\n<h3>4. 花卉</h3>\n<p>球根與分類</p>\n<ul>\n<li>鱗片鱗莖：百合；鱗皮鱗莖：金花石蒜、孤挺花、水仙、風信子；球莖：唐菖蒲、小蒼蘭、番紅花；塊莖：彩葉芋、球根秋海棠、仙客來；根莖：美人蕉、薑花、荷花；塊根：大理花、嘉蘭、芍藥、桔梗<span class=\"skill\">技藝競賽 94、96、97、99、100、103、104、106、108、110、113、114</span>。</li>\n<li>易錯：<span class=\"ng\">✗</span>「美人蕉、薑花為球莖」、<span class=\"ng\">✗</span>「番紅花為塊莖」、<span class=\"ng\">✗</span>「百合為球莖」（教甄也考唐菖蒲為球莖）<span class=\"skill\">技藝競賽 96、97、113</span>。</li>\n<li>地中海氣候夏乾冬濕，是鬱金香、風信子、水仙等球根的原產地（<span class=\"ng\">✗</span>夏濕冬乾）<span class=\"skill\">技藝競賽 100、103、111</span>。球根需「暖－涼－暖」週期稱為感溫週期性（thermoperiodicity）<span class=\"skill\">技藝競賽 101、102、103</span>。</li>\n<li>一、二年生草花種類多、品種也多；毛地黃為二年生；宿根花卉如火鶴花、菊花、非洲菊、天竺葵、繡球花<span class=\"skill\">技藝競賽 97、99、107、108、109、110、111</span>。</li>\n</ul>\n<p>光週期與春化</p>\n<ul>\n<li>質的短日：聖誕紅、秋菊、長壽花；量的短日：雞冠花、九重葛；相對短日：杜鵑；短日：牽牛花<span class=\"skill\">技藝競賽 94、96、97、100、101、103、109、114</span>。</li>\n<li>量的長日：矮牽牛；相對長日：洋桔梗；長短日：翠菊；短長日：報春花、花菖蒲；中日性：玫瑰、向日葵、茉莉（矮牽牛不是）<span class=\"skill\">技藝競賽 94、104、105、106、108、112、114</span>。</li>\n<li>聖誕紅以遮光（短日處理）提早到 9–10 月開花，暗期中斷可延後到春節<span class=\"wopt\">（<span class=\"ng\">✗</span> 錯誤選項：「聖誕紅以夜間電照提早開花」）</span><span class=\"skill\">技藝競賽 97、100、103</span>。秋冬菊花電照是抑制花芽分化、維持營養生長<span class=\"skill\">技藝競賽 100、101、102、103、111</span>。</li>\n<li>臨界日長題型：絕對短日植物（臨界 12.5 小時）與相對長日植物（臨界 14 小時）在臺灣冬天都會開花<span class=\"skill\">技藝競賽 100</span>。</li>\n<li>種子春化型：香豌豆；綠植株春化型：紫羅蘭；風鈴草需低溫才抽苔開花<span class=\"skill\">技藝競賽 94、100、103、107、108、111</span>。</li>\n</ul>\n<p>種子與繁殖</p>\n<ul>\n<li>好光性種子：矮牽牛、秋海棠；嫌光（暗發芽）種子：雞冠花、日日春、百日草、美女櫻；<span class=\"ng\">✗</span>「彩葉草和百日草都是暗發芽」<span class=\"skill\">技藝競賽 94、96、97、100、104、107、112</span>。</li>\n<li>GA 可讓好光性種子在黑暗中發芽（<span class=\"ng\">✗</span>BA）；紅外光抑制發芽<span class=\"skill\">技藝競賽 100、103、108、113</span>。</li>\n<li>F1 後代會分離、性狀不整齊，不宜自行留種<span class=\"wopt\">（<span class=\"ng\">✗</span> 錯誤選項：「雜交一代種子可自行留種」）</span><span class=\"skill\">技藝競賽 94、97、103</span>。</li>\n<li>葉插：西瓜皮椒草、非洲菫、虎尾蘭（斑葉虎尾蘭葉插會失去葉斑）、蝦蟆秋海棠；火鶴花不用葉插；根插：磯松；玫瑰用芽接<span class=\"skill\">技藝競賽 98、100、104、106、114</span>。</li>\n<li>蝴蝶蘭不用分株（<span class=\"ng\">✗</span>分株）；以組培或花梗高芽繁殖；洋桔梗、仙客來、鐵砲百合可用種子繁殖；九重葛以無性繁殖為主<span class=\"skill\">技藝競賽 94、97、101、102、104、110、112、114</span>。</li>\n<li>莖頂生長點培養可得無病毒苗；微體繁殖利用細胞全能性可等比級數增殖<span class=\"skill\">技藝競賽 100、102、110、114</span>。</li>\n</ul>\n<p>生長調節劑</p>\n<ul>\n<li>發根：IBA、NAA；IAA 易遇光分解，不常用（<span class=\"ng\">✗</span>IBA 易分解）；細胞分裂素不能促進發根<span class=\"skill\">技藝競賽 96、97、100、101、102、108</span>。</li>\n<li>鐵砲百合矮化用 Ancymidol（A-Rest），應在肉眼可見花芽「之前」處理<span class=\"skill\">技藝競賽 97、101、102</span>。矮化劑（Paclobutrazol、Chlormequat、Uniconazole）抑制節間伸長；BA 不是矮化劑，反而促進分枝並減少百合黃葉<span class=\"skill\">技藝競賽 105、110、112、113</span>。</li>\n<li>GA3 可取代杜鵑的低溫需求、促進仙客來發芽；Ethephon 促進休眠性花卉落葉；Chlormequat 處理西洋杜鵑可促進開花<span class=\"skill\">技藝競賽 104、105、106、112</span>。</li>\n<li>觀賞鳳梨催花：乙烯（Ethephon）、0.5% 電石水、NAA、BOH；ABA 不行<span class=\"skill\">技藝競賽 103、104、106、113</span>。乙烯過高使蝴蝶蘭落蕾、花朵凋謝<span class=\"skill\">技藝競賽 105、111</span>。</li>\n</ul>\n<p>蘭科</p>\n<ul>\n<li>單莖蘭：蝴蝶蘭、萬代蘭，無假球莖；複莖蘭：嘉德麗雅蘭（假球莖間以匍匐莖相連）、石斛蘭、文心蘭、虎頭蘭；地生蘭：國蘭、一葉蘭（<span class=\"ng\">✗</span>石斛為地生蘭）<span class=\"skill\">技藝競賽 94、96、97、98、101、102、106、108、109、110、112、113</span>。</li>\n<li>CAM 植物：蝴蝶蘭、虎尾蘭、萬代蘭；文心蘭為 C3<span class=\"skill\">技藝競賽 98、105、106</span>。</li>\n<li>蝴蝶蘭以日溫 25 ℃、夜溫 15–20 ℃ 處理約 4–6 週抽梗（<span class=\"ng\">✗</span>25–30 ℃ 高溫）<span class=\"skill\">技藝競賽 98、101、102、103、114</span>。</li>\n<li>蘭科特徵：雌雄蕊合生為蕊柱、單子葉植物、種子細小無胚乳、自然狀態下需蘭菌（<span class=\"ng\">✗</span>細菌）協助發芽、根有根被層<span class=\"skill\">技藝競賽 97、98、99、101、102、104、110、111、112</span>。</li>\n<li>人工屬：千代蘭＝萬代蘭 × 百代蘭；BLC＝Brassolaeliocattleya；屬間雜交可向英國皇家園藝學會（RHS）登錄<span class=\"skill\">技藝競賽 98、101、102</span>。</li>\n<li>國蘭：素心蘭、四季蘭、春蘭（捧心蘭不是）；文心蘭原生美洲、臺灣週年開花；春石斛花芽分化約 13 ℃，棒狀假球莖；蘭科原生種多在熱帶與亞熱帶<span class=\"skill\">技藝競賽 96、101、102、104、109、110、114</span>。</li>\n</ul>\n<p>切花與各論</p>\n<ul>\n<li>菊花：頭狀花序由管狀花（兩性）與舌狀花組成；大菊去側蕾、留頂蕾；中生品種短日處理後 9–11 週開花；以頂芽扦插繁殖；臺灣切花栽培面積最大<span class=\"skill\">技藝競賽 96、100、101、102、104、105、109、112</span>。</li>\n<li>香石竹：以摘心調節產量與產期；一次半摘心可分散產期；迷你型用二次摘心；大花花瓣伸出萼 1–2 cm 時採收；常見裂萼<span class=\"skill\">技藝競賽 94、101、102、104、109、114</span>。</li>\n<li>火鶴花：肉穗花序由基部向上 1/3–3/4 轉白時採收（<span class=\"ng\">✗</span>頂端向下轉綠）；觀賞部位是佛焰苞；貯藏不宜低於 13 ℃；夏季遮蔭到 15000–20000 lux<span class=\"skill\">技藝競賽 101、102、104、109、113、114</span>。</li>\n<li>其他採收：洋桔梗 2–4 朵開放；唐菖蒲需直立裝箱以免背地性彎曲；玫瑰下午採收壽命較久<span class=\"skill\">技藝競賽 104、105、113、114</span>。</li>\n<li>洋桔梗：原產美國、日本為主要育種國；高溫育苗或 10 ℃ 以下低溫易簇生化，近年從丹麥進口穴盤苗<span class=\"skill\">技藝競賽 94、97、103、105、111、112、114</span>。</li>\n<li>百合：荷蘭產量最大；LO-hybrids＝鐵砲 × 東方型；切花種球種植深度 6–10 cm；高溫期遮光 50%；山百合花橫向、透百合向上；鹿子百合需低溫打破種球休眠；種球貯藏要拌微濕介質防失水<span class=\"skill\">技藝競賽 94、101、102、108、109、112</span>。</li>\n<li>繡球花：土壤鋁多為天藍色、鋁少為粉紅色（<span class=\"ng\">✗</span>相反）<span class=\"skill\">技藝競賽 97、101、102、103、105</span>。</li>\n<li>玫瑰：開花自發性植物，不需特定光週或低溫；以修剪調節花期；中國月季引入後才有四季開花品種；夏季高溫使花色不鮮<span class=\"skill\">技藝競賽 97、101、102、104、109</span>。</li>\n<li>宿根滿天星老株扦插苗易在夏季出現「獅頭花」<span class=\"skill\">技藝競賽 103</span>；長壽花夏季遮黑布是為了提早開花<span class=\"skill\">技藝競賽 112</span>。</li>\n</ul>\n<p>介質、光與產業</p>\n<ul>\n<li>泥炭：吸水達 15–20 倍、陽離子交換能力強、偏酸；蛭石：保水、CEC 高、不含氮（<span class=\"ng\">✗</span>含高量氮）；珍珠石：pH 7–7.5、幾乎無 CEC；炭化稻殼偏鹼；未分解樹皮 C/N 高，會和植物爭氮<span class=\"skill\">技藝競賽 97、98、101、102、106、109、111、112、113、114</span>。</li>\n<li>可感應光 380–780 nm，光合有效光 400–700 nm；紅光與藍光影響光合作用最大，葉綠素對綠光利用最低；1 fc ≈ 10 lux<span class=\"skill\">技藝競賽 94、96、98、100、101、102、104</span>。</li>\n<li>光補償點、光飽和點定義；陽性植物：變葉木、玫瑰；陰性植物：蝴蝶蘭、非洲菫<span class=\"skill\">技藝競賽 96、100、104、106、107、110、111、112、113</span>。</li>\n<li>產業：臺灣花卉面積以苗圃類最多；苗木主產區彰化；出口苗木以馬拉巴栗最多、蝴蝶蘭出口值最高；哥倫比亞供應北美但不是主要消費市場；德國為歐盟花卉消費最高；桃園為最重要盆花產區<span class=\"skill\">技藝競賽 94、98、100、104、105、113</span>。</li>\n<li>臺灣原生：金花石蒜（也外銷）、白花蝴蝶蘭；鳳凰木、珊瑚藤不是原生<span class=\"skill\">技藝競賽 94、106、109、112</span>。</li>\n<li>水生植物：挺水—荷花；浮葉—睡蓮、水金英、萍蓬草、莕菜；漂浮—布袋蓮、水芙蓉、槐葉蘋；水韭不是浮葉<span class=\"skill\">技藝競賽 96、97、100、106、108</span>。</li>\n<li>蕨類：孢子體為無性世代（鐵線蕨盆栽），原葉體為有性世代；<span class=\"ng\">✗</span>「孢子繁殖屬無性繁殖」；多數蕨類喜潮濕<span class=\"skill\">技藝競賽 94、100、104、110、111、112</span>。捕蠅草以葉片摺合夾蟲<span class=\"skill\">技藝競賽 110</span>。</li>\n</ul>\n<h3>5. 造園（94–98 年）</h3>\n<ul>\n<li>平板儀安置為定心、定平、定向；調整基座螺絲使氣泡居中是「定平」<span class=\"both\">教甄也考</span><span class=\"skill\">技藝競賽 94、97</span>。經緯儀可測方向、角度、距離、高程；野外測量稱為外業；視角法利用相似三角形求水平距離<span class=\"skill\">技藝競賽 94、96、97</span>。</li>\n<li>透視：鳥瞰圖視平線在物體之上；成角透視＝兩點透視；平行透視的視中心即消點；<span class=\"ng\">✗</span>「視點是人站立的位置」（那是立點）<span class=\"skill\">技藝競賽 94、96、97、98</span>。</li>\n<li>造園史：《園冶》作者計成；東京小石川後樂園由朱舜水設計；《東方庭園論》（1772）作者康白，也設計裘園；陸諾特設計卜園後受路易十四賞識而設計凡爾賽；空中庭園在巴比倫；義大利式源於波斯；網師園不在蘇州四大名園；桂離宮是小堀遠州的迴游式庭園<span class=\"skill\">技藝競賽 94、96、97、98</span>。</li>\n<li>設計原理：中國庭園講「暢幽靈雅」「體宜因借」；疊石「瘦漏透皺」中「漏」指多孔隙；造園最高境界是真善美，「善」指實用、經濟、合於適用；黃金比約 0.6<span class=\"skill\">技藝競賽 94、96、97、98</span>。</li>\n<li>施工數據：飛石直徑 30–50 cm、步距約 50 cm、突出地面 3–6 cm（<span class=\"ng\">✗</span>間隔 20 cm）；一左一右排列為千鳥法；植穴深度＝根球厚度加 15–20 cm；園椅高 40–45 cm、深 30–45 cm；短牆高多不超過 120 cm；花木配植圖比例約 1/100<span class=\"skill\">技藝競賽 94、96、97</span>。</li>\n<li>植栽管理：大樹或貴重樹應分次斷根（<span class=\"ng\">✗</span>一次）；綠籬不宜一次大修剪；草皮在高濕地區避免晚上澆水；地被植物株高約 60 cm 以下<span class=\"skill\">技藝競賽 96、98、103、108</span>。</li>\n</ul>"}];

function chips(){

function render(i,keepScroll){
  S.cur=Math.max(0,Math.min(CH.length-1,i)); save();
  const c=CH[S.cur];
  $("#art").innerHTML=`<h2>${esc(c.title)}</h2>`+c.html;
  $("#art").querySelectorAll("table").forEach(t=>{const w=document.createElement("div");w.className="tw";t.parentNode.insertBefore(w,t);w.appendChild(t)});
  $("#prevBtn").disabled=S.cur===0; $("#nextBtn").disabled=S.cur===CH.length-1;
  $("#doneBtn").classList.toggle("on",!!S.done[c.id]);
  $("#doneBtn").textContent=S.done[c.id]?"✓ 已讀完（再按取消）":"✓ 這章讀完了";
  chips(); if(!keepScroll) window.scrollTo({top:0});
}
$("#chips").onclick=e=>{const b=e.target.closest(".chip");if(b){showView("notes");clearSearch();render(+b.dataset.i)}};

});
$("#sresults").onclick=e=>{const r=e.target.closest(".sres");if(!r)return;const k=$("#q").value.trim();clearSearch();render(+r.dataset.i);
  setTimeout(()=>{const w=document.createTreeWalker($("#art"),NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){const p=n.nodeValue.indexOf(k);if(p>=0){const r2=document.createRange();r2.setStart(n,p);r2.setEnd(n,p+k.length);const m=document.createElement("mark");m.className="hit";r2.surroundContents(m);m.scrollIntoView({block:"center"});break}}},30)};

/* toc */
function toc(){
  const n=CH.filter(c=>S.done[c.id]).length;
  $("#progTxt").textContent=`已讀 ${n} / ${CH.length} 章`;
  $("#progBar").style.width=(n/CH.length*100)+"%";
  $("#toc").innerHTML=CH.map((c,i)=>`<button data-i="${i}">${esc(c.title)}<span class="st">${S.done[c.id]?"✓ 讀完":""}</span></button>`).join("");
}
$("#tocBtn").onclick=()=>{toc();$("#tocSheet").classList.add("show")};
$("#toc").onclick=e=>{const b=e.target.closest("button");if(!b)return;$("#tocSheet").classList.remove("show");showView("notes");clearSearch();render(+b.dataset.i)};
$("#setBtn").onclick=()=>$("#setSheet").classList.add("show");
document.querySelectorAll(".sheet").forEach(s=>s.addEventListener("click",e=>{if(e.target===s||e.target.hasAttribute("data-close"))s.classList.remove("show")}));
document.querySelectorAll("[data-fs]").forEach(b=>b.onclick=()=>{S.fs=+b.dataset.fs;save();document.documentElement.style.setProperty("--fs",S.fs+"px")});
$("#resetBtn").onclick=()=>{if(confirmTwice(this)){S.done={};S.unk={};save();render(S.cur,true);drawCard()}};
let rst=0;function confirmTwice(){const b=$("#resetBtn");if(rst&&Date.now()-rst<3000){rst=0;b.textContent="已清除";return true}rst=Date.now();b.textContent="再按一次確認清除";setTimeout(()=>{b.textContent="清除閱讀進度與閃卡紀錄"},3000);return false}

/* views */
function showView(v){
  document.querySelectorAll(".view").forEach(x=>x.classList.toggle("show",x.id==="v-"+v));
  document.querySelectorAll("nav.bottom button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
  $("#chips").style.display=v==="notes"?"":"none";
  $("#sub").textContent=v==="notes"?"教甄＋技藝競賽考題重點（94–114）":v==="quiz"?"看植物，選科名（10 題一回合）":`${CARDS.length} 張歷屆名詞解釋`;
  if(v==="quiz"&&!Q.list)newQuiz();
  if(v==="cards")drawCard();
  window.scrollTo({top:0});
}
document.querySelectorAll("nav.bottom button").forEach(b=>b.onclick=()=>showView(b.dataset.v));

/* ---------- family quiz ---------- */
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const Q={};
function newQuiz(){
  const pool=[];FAM.forEach(f=>f.p.forEach(p=>pool.push({p,f:f.f})));
  Q.list=shuffle(pool).slice(0,10).map(it=>{
    const others=shuffle(FAM.map(x=>x.f).filter(x=>x!==it.f)).slice(0,3);
    const fam=FAM.find(x=>x.f===it.f);
    return {...it,opts:shuffle([it.f,...others]),also:fam.p.filter(x=>x!==it.p)}
  });
  Q.i=0;Q.ans=[];drawQ();
}
function drawQ(){
  if(Q.i>=Q.list.length)return drawResult();
  const it=Q.list[Q.i],a=Q.ans[Q.i];
  $("#quizBox").innerHTML=`<div class="qtop"><span>第 ${Q.i+1} / ${Q.list.length} 題</span><span>答對 ${Q.ans.filter((x,k)=>x===Q.list[k].f).length}</span></div>
  <div class="qplant">${esc(it.p)}</div><div class="qask">是哪一科？</div>
  <div class="opts">${it.opts.map(o=>`<button class="opt${a?(o===it.f?" right":o===a?" wrong":""):""}" data-o="${esc(o)}">${esc(o)}</button>`).join("")}</div>
  <div class="fb${a?" show":""}">${a?(a===it.f?"答對了！":"正確答案是 <b>"+esc(it.f)+"</b>。")+(it.also.length?`<br>同科還考過：${esc(it.also.join("、"))}`:""):""}</div>
  <div class="row"><button class="sec" id="qPrev"${Q.i===0?" disabled":""}>← 上一題</button><button id="qNext">${Q.i===Q.list.length-1?"看結果":"下一題 →"}</button></div>`;
  $("#quizBox .opts").onclick=e=>{const b=e.target.closest(".opt");if(!b||Q.ans[Q.i])return;Q.ans[Q.i]=b.dataset.o;drawQ()};
  $("#qPrev").onclick=()=>{Q.i--;drawQ()};
  $("#qNext").onclick=()=>{Q.i++;drawQ()};
}
function drawResult(){
  const ok=Q.list.filter((x,k)=>Q.ans[k]===x.f).length;
  const wrong=Q.list.filter((x,k)=>Q.ans[k]!==x.f);
  $("#quizBox").innerHTML=`<div class="score">${ok} / ${Q.list.length}</div>
  ${wrong.length?`<p><b>訂正：</b></p><ul class="wlist">${wrong.map(x=>`<li>${esc(x.p)} → <b>${esc(x.f)}</b></li>`).join("")}</ul>`:'<p style="text-align:center">全對，太厲害了！</p>'}
  <div class="row"><button id="qAgain">再來一回合</button></div>`;
  $("#qAgain").onclick=newQuiz;
}

/* ---------- glossary cards ---------- */
let mode="all",order=CARDS.map((_,i)=>i);
function deck(){
  if(mode==="unk")return CARDS.map((_,i)=>i).filter(i=>S.unk[i]);
  return order;
}
function drawCard(){
  const d=deck();
  $("#fcard").classList.remove("f");
  $("#cstat").textContent=`還不熟 ${Object.values(S.unk).filter(Boolean).length} 張`;
  if(!d.length){$("#cterm").textContent="目前沒有「還不熟」的卡片";$("#cyr").textContent="";$("#cans").textContent="";$("#cpos").textContent="";return}
  S.cardI=Math.max(0,Math.min(d.length-1,S.cardI||0));
  const c=CARDS[d[S.cardI]];
  $("#cpos").textContent=`${S.cardI+1} / ${d.length}`;
  $("#cterm").textContent=c.t;$("#cyr").textContent="考過："+c.y;
  setTimeout(()=>{$("#cans").innerHTML=`<div style="font-weight:800;color:var(--green);margin-bottom:8px">${esc(c.t)}</div>${esc(c.a)}`},200);
}
$("#fcard").onclick=()=>$("#fcard").classList.toggle("f");
$("#cNext").onclick=()=>{const d=deck();S.cardI=(S.cardI+1)%Math.max(d.length,1);save();drawCard()};
$("#cPrev").onclick=()=>{const d=deck();S.cardI=(S.cardI-1+d.length)%Math.max(d.length,1);save();drawCard()};
$("#cKnow").onclick=()=>{const d=deck();if(!d.length)return;delete S.unk[d[S.cardI]];save();if(mode==="unk")drawCard();else $("#cNext").onclick()};
$("#cUnk").onclick=()=>{const d=deck();if(!d.length)return;S.unk[d[S.cardI]]=1;save();$("#cNext").onclick()};
$("#cardSeg").onclick=e=>{const b=e.target.closest("button");if(!b)return;
  document.querySelectorAll("#cardSeg button").forEach(x=>x.classList.toggle("on",x===b));
  mode=b.dataset.m==="unk"?"unk":"all";order=b.dataset.m==="shuf"?shuffle(CARDS.map((_,i)=>i)):CARDS.map((_,i)=>i);S.cardI=0;drawCard()};

setCloze(!!S.cloze);
{const sk=CH.findIndex(c=>c.title.startsWith("十七"));render(location.hash==="#skill"&&sk>=0?sk:(S.cur||0));}
</script>

<script id="prog-js">
(function(){
S.sec=S.sec||{};S.bm=S.bm||{};
const SECS=CH.map(c=>{const d=document.createElement("div");d.innerHTML=c.html;const h=[...d.querySelectorAll("h3")].map(x=>x.textContent.trim());return h.length?h:[c.title]});
const sk=(ci,j)=>CH[ci].id+"|"+j;
const stat=ci=>{const n=SECS[ci].length;let k=0;for(let j=0;j<n;j++)if(S.sec[sk(ci,j)])k++;return[k,n]};
const sync=ci=>{const[k,n]=stat(ci);S.done[CH[ci].id]=k===n};
const total=()=>{let K=0,N=0;CH.forEach((_,i)=>{const[k,n]=stat(i);K+=k;N+=n});return[K,N]};
// migrate: chapters already marked 讀完 -> all sections checked
CH.forEach((c,i)=>{if(S.done[c.id]&&stat(i)[0]===0)SECS[i].forEach((_,j)=>S.sec[sk(i,j)]=true)});
save();
// progress strip under search
const tools=document.querySelector("#v-notes .tools");
const pt=document.createElement("div");pt.className="ptools";
pt.innerHTML='<span id="ptTxt"></span><span class="pb"><i id="ptBar"></i></span><button id="ptBm">★ 書籤</button>';
tools.after(pt);
$("#ptBm").onclick=()=>{toc();$("#tocSheet").classList.add("show")};
function strip(){const[K,N]=total();$("#ptTxt").textContent=`複習進度 ${K}/${N}（${Math.round(K/N*100)}%）`;$("#ptBar").style.width=(K/N*100)+"%";
  const nb=Object.keys(S.bm).filter(k=>S.bm[k]).length;$("#ptBm").textContent=nb?`★ 書籤 ${nb}`:"☆ 書籤"}
chips=function(){
  $("#chips").innerHTML=CH.map((c,i)=>{const[k,n]=stat(i);const tag=k===n?'<span class="ok">✓</span> ':k?`<span class="ok">${k}/${n}</span> `:"";return `<button class="chip${i===S.cur?" cur":""}" data-i="${i}">${tag}${esc(c.short)}</button>`}).join("");
  const el=$("#chips .cur");if(el)el.scrollIntoView({inline:"center",block:"nearest"});
};
const _render=render;
render=function(i,keep){_render(i,keep);decorate();strip()};
function decorate(){
  const ci=S.cur,art=$("#art");let hs=[...art.querySelectorAll("h3")];if(!hs.length)hs=[art.querySelector("h2")];
  hs.forEach((h,j)=>{const key=sk(ci,j),on=!!S.sec[key],bm=!!S.bm[key];
    const w=document.createElement("span");w.className="sbtns";
    w.innerHTML=`<button class="bm${bm?" on":""}" data-k="${key}" data-j="${j}" aria-label="書籤">${bm?"★":"☆"}</button>${on?'<span class="ckmini">✓ 已複習</span>':""}`;
    h.appendChild(w);h.classList.toggle("secdone",on);
    let last=h,nx=h.nextElementSibling;
    while(nx&&!/^H[23]$/.test(nx.tagName)&&!nx.classList.contains("secfoot")){last=nx;nx=nx.nextElementSibling}
    const f=document.createElement("div");f.className="sbtns secfoot";
    f.innerHTML=`<button class="ck${on?" on":""}" data-k="${key}">${on?"✓ 這一節已複習（再按取消）":"☐ 這一節複習完了，打勾"}</button>`;
    last.after(f)});
  const[k,n]=stat(ci),b=$("#doneBtn");
  b.classList.toggle("on",k===n);
  b.textContent=k===n?`✓ 本章 ${n} 節全部複習完（再按取消）`:`本章已複習 ${k}/${n} 節・按此全部勾選`;
}
$("#art").addEventListener("click",e=>{const b=e.target.closest(".sbtns button");if(!b)return;e.stopPropagation();e.preventDefault();
  const key=b.dataset.k;
  if(b.classList.contains("bm")){if(S.bm[key])delete S.bm[key];else S.bm[key]=1}
  else{S.sec[key]=!S.sec[key];sync(S.cur)}
  save();render(S.cur,true)},true);
$("#doneBtn").onclick=()=>{const ci=S.cur,[k,n]=stat(ci),v=k!==n;SECS[ci].forEach((_,j)=>S.sec[sk(ci,j)]=v);sync(ci);save();render(ci,true)};
toc=function(){
  const[K,N]=total(),nd=CH.filter(c=>S.done[c.id]).length;
  $("#progTxt").textContent=`已複習 ${K} / ${N} 小節（${Math.round(K/N*100)}%）・完成 ${nd} / ${CH.length} 章`;
  $("#progBar").style.width=(K/N*100)+"%";
  const bms=Object.keys(S.bm).filter(k=>S.bm[k]).map(k=>{const[id,j]=k.split("|");const ci=CH.findIndex(c=>c.id===id);return ci<0?null:{ci,j:+j}}).filter(Boolean).sort((a,b)=>a.ci-b.ci||a.j-b.j);
  const bmHtml=bms.length?`<div class="bmh">★ 我的書籤（${bms.length}）</div>`+bms.map(x=>`<button class="bmi" data-i="${x.ci}" data-j="${x.j}">★ ${esc(CH[x.ci].short)}／${esc(SECS[x.ci][x.j]||"")}</button>`).join("")+`<div class="bmh" style="color:var(--green);margin-top:10px">各章進度</div>`:"";
  $("#toc").innerHTML=bmHtml+CH.map((c,i)=>{const[k,n]=stat(i);return `<button data-i="${i}">${esc(c.title)}<span class="st">${k===n?"✓ 完成":k+"/"+n}</span><i class="mini"><b style="width:${k/n*100}%"></b></i></button>`}).join("");
};
$("#toc").onclick=e=>{const b=e.target.closest("button");if(!b)return;$("#tocSheet").classList.remove("show");showView("notes");clearSearch();render(+b.dataset.i);
  if(b.dataset.j!==undefined){const hs=[...$("#art").querySelectorAll("h3")];const h=hs[+b.dataset.j];if(h)setTimeout(()=>h.scrollIntoView({block:"start",behavior:"smooth"}),50)}};
const rb=$("#resetBtn");rb.textContent="清除複習進度、書籤與閃卡紀錄";
let rt=0;rb.onclick=()=>{if(rt&&Date.now()-rt<3000){rt=0;S.done={};S.unk={};S.sec={};S.bm={};save();render(S.cur,true);try{drawCard()}catch(e){}rb.textContent="已清除";return}
  rt=Date.now();rb.textContent="再按一次確認清除";setTimeout(()=>{rb.textContent="清除複習進度、書籤與閃卡紀錄"},3000)};
{const _sk=CH.findIndex(c=>c.title.startsWith("十七"));render(location.hash==="#skill"&&_sk>=0?_sk:(S.cur||0),location.hash!=="#skill");}
})();
</script>
</body>
</html>
