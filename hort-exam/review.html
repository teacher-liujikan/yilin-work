<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>園藝科教甄 複習本</title>
<style>
:root{
  --bg:#f6f3ea; --card:#fffdf7; --ink:#24302a; --mute:#6b766e; --line:#e3dccb;
  --green:#2f6b4f; --green2:#e3efe6; --leaf:#5a9a6e; --sun:#fff1b8; --red:#b6463a;
  --fs:17px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-size:var(--fs);line-height:1.75;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:20;background:var(--green);color:#fff;padding:10px 14px 8px;padding-top:max(10px,env(safe-area-inset-top))}
.hrow{display:flex;align-items:center;gap:10px}
header h1{font-size:1.05rem;margin:0;flex:1;letter-spacing:.03em}
header h1 small{display:block;font-weight:400;font-size:.72rem;opacity:.8;letter-spacing:0}
.ibtn{background:rgba(255,255,255,.14);border:0;border-radius:10px;padding:6px 10px;color:#fff;font-size:.85rem;min-height:36px}
.ibtn.on{background:var(--sun);color:var(--ink)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;border-radius:999px;padding:4px 12px;background:rgba(255,255,255,.14);color:#fff;font-size:.82rem;white-space:nowrap}
.chip.cur{background:#fff;color:var(--green);font-weight:700}
.chip .ok{color:var(--sun)} .chip.cur .ok{color:var(--leaf)}
main{max-width:820px;margin:0 auto;padding:14px 14px 110px}
.view{display:none}.view.show{display:block}
/* notes */
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tools input{flex:1;min-width:160px;border:1px solid var(--line);border-radius:12px;padding:9px 12px;font:inherit;font-size:.95rem;background:var(--card)}
.tbtn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 12px;font-size:.88rem;min-height:42px}
.tbtn.on{background:var(--sun);border-color:#e8d27a;font-weight:700}
article{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 18px 8px;box-shadow:0 2px 10px rgba(60,50,20,.05)}
article h2{font-size:1.3rem;margin:.1em 0 .6em;color:var(--green);line-height:1.4}
article h3{font-size:1.08rem;margin:1.5em 0 .5em;padding:4px 10px;border-left:5px solid var(--leaf);background:var(--green2);border-radius:0 8px 8px 0}
article p,article li{margin:.35em 0}
article ul,article ol{padding-left:1.3em}
article strong{background:linear-gradient(transparent 55%,var(--sun) 55%);font-weight:700}
article blockquote{margin:1em 0;padding:8px 12px;background:#f3efe2;border-radius:10px;color:var(--mute);font-size:.92em}
.tw{overflow-x:auto;margin:.8em 0;border-radius:12px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:.9em;min-width:420px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--green2);color:var(--green);white-space:nowrap;position:sticky;top:0}
tr:nth-child(even) td{background:#fbf8ef}
td:first-child{font-weight:700;white-space:nowrap}
mark.ok{background:#dcefe2;color:#1d5a37;border-radius:4px;padding:0 3px;font-weight:600}
.skill{display:inline;font-size:.72em;font-weight:700;color:#7a4b00;background:#ffe7b3;border:1px solid #f0c66b;border-radius:8px;padding:0 6px;margin:0 2px;line-height:1.9;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.both{display:inline-block;font-size:.72em;font-weight:700;color:#fff;background:#2f6b4f;border-radius:999px;padding:0 7px;margin:0 2px;line-height:1.6;vertical-align:1px}
.wopt{color:#9a3b30;font-size:.9em}
.ng{color:var(--red);font-weight:800}
mark.hit{background:#ffd36b;border-radius:3px}
/* cloze */
body.cloze article strong,body.cloze article mark.ok,body.cloze article td:not(:first-child){color:transparent!important;background:#d9d2bd!important;border-radius:5px;user-select:none;transition:.15s}
body.cloze article strong *,body.cloze article td:not(:first-child) *{color:transparent!important;background:transparent!important}
body.cloze article .rv,body.cloze article .rv *{color:var(--ink)!important;background:var(--sun)!important}
.pager{display:flex;gap:10px;margin:16px 0}
.pager button{flex:1;border:0;border-radius:14px;padding:12px;background:var(--green);color:#fff;font-weight:700;min-height:52px}
.pager button:disabled{opacity:.3}
.donebar{display:flex;align-items:center;justify-content:center;margin:6px 0 0}
.done{border:2px solid var(--leaf);background:var(--card);color:var(--green);border-radius:999px;padding:8px 18px;font-weight:700}
.done.on{background:var(--leaf);color:#fff}
.hint{color:var(--mute);font-size:.82rem;text-align:center;margin:6px 0 0}
.empty{text-align:center;color:var(--mute);padding:30px 0}
.sres{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:10px}
.sres b{color:var(--green)} .sres p{margin:.2em 0;font-size:.92rem}
/* quiz */
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 2px 10px rgba(60,50,20,.05)}
.qtop{display:flex;justify-content:space-between;color:var(--mute);font-size:.88rem;margin-bottom:6px}
.qplant{font-size:2rem;font-weight:800;text-align:center;margin:16px 0 4px;color:var(--green)}
.qask{text-align:center;color:var(--mute);margin-bottom:14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:2px solid var(--line);background:#fff;border-radius:14px;padding:14px 8px;font-size:1.05rem;font-weight:700;min-height:58px}
.opt.right{border-color:var(--leaf);background:#dff0e3}
.opt.wrong{border-color:var(--red);background:#f8e1dd}
.fb{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--green2);display:none;font-size:.95rem}
.fb.show{display:block}
.row{display:flex;gap:10px;margin-top:14px}
.row button{flex:1;border:0;border-radius:14px;padding:12px;font-weight:700;min-height:50px;background:var(--green);color:#fff}
.row .sec{background:#e9e3d2;color:var(--ink)}
.score{font-size:2.4rem;font-weight:800;text-align:center;color:var(--green);margin:10px 0}
.wlist li{margin:.3em 0}
/* cards */
.flip{perspective:1000px;margin:10px 0}
.fcard{position:relative;min-height:270px;transition:transform .45s;transform-style:preserve-3d;cursor:pointer}
.fcard.f{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;padding:22px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;border:1px solid var(--line)}
.front{background:var(--card)}
.back{background:#fdf6d8;transform:rotateY(180deg);font-size:1.05rem;line-height:1.8}
.term{font-size:1.5rem;font-weight:800;color:var(--green);line-height:1.5}
.yr{color:var(--mute);font-size:.85rem;margin-top:8px}
.tap{color:var(--mute);font-size:.8rem;margin-top:16px}
.cmark{display:flex;gap:10px}
.cmark button{flex:1;border:2px solid var(--line);border-radius:14px;padding:11px;background:#fff;font-weight:700;min-height:50px}
.cmark .k{border-color:var(--leaf);color:var(--green)} .cmark .u{border-color:#e0b04a;color:#8a6510}
.seg{display:flex;background:#e9e3d2;border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:transparent;border-radius:10px;padding:7px;font-size:.88rem}
.seg button.on{background:#fff;font-weight:700;color:var(--green)}
/* nav */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.bottom button{flex:1;border:0;background:none;padding:9px 0 10px;font-size:.78rem;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.bottom button svg{width:24px;height:24px}
nav.bottom button.on{color:var(--green);font-weight:700}
/* sheet */
.sheet{position:fixed;inset:0;background:rgba(20,30,25,.45);z-index:40;display:none;align-items:flex-end;justify-content:center}
.sheet.show{display:flex}
.sbox{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto}
.sbox h3{margin:0 0 10px;color:var(--green)}
.toc button{display:flex;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:12px 4px;gap:8px;align-items:center}
.toc .st{margin-left:auto;font-size:.8rem;color:var(--leaf)}
.prog{height:8px;background:#e9e3d2;border-radius:99px;overflow:hidden;margin:6px 0 14px}
.prog i{display:block;height:100%;background:var(--leaf);border-radius:99px}
.qrbox{text-align:center}
.qrbox svg{width:220px;height:220px;background:#fff;padding:8px;border-radius:12px}
.close{width:100%;margin-top:12px;border:0;border-radius:14px;padding:12px;background:#e9e3d2;font-weight:700}
.fsz{display:flex;gap:8px;margin:8px 0 4px}
.fsz button{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px;font-weight:700}
@media (min-width:900px){ :root{--fs:18px} main{padding-top:20px} }
</style>

<style id="prog-css">
article h3{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
article h2{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sbtns{margin-left:auto;display:inline-flex;gap:6px;font-size:.8rem;font-weight:700}
.sbtns button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:3px 10px;min-height:32px;line-height:1.2;color:var(--mute)}
.sbtns .ck.on{background:var(--leaf);border-color:var(--leaf);color:#fff}
.sbtns .bm{font-size:1rem;padding:2px 8px}
.sbtns .bm.on{color:#c98a00;border-color:#e8c060;background:#fff6d6}
article h3.secdone{opacity:.75}
.secfoot{display:flex;justify-content:flex-end;margin:10px 0 18px}
.secfoot .ck{font-size:.9rem;padding:8px 16px;min-height:40px}
.ckmini{font-size:.75rem;color:var(--leaf);font-weight:700;align-self:center}
.ptools{display:flex;align-items:center;gap:8px;margin:-4px 0 12px;font-size:.85rem;color:var(--mute)}
.ptools .pb{flex:1;height:8px;background:#e9e3d2;border-radius:99px;overflow:hidden}
.ptools .pb i{display:block;height:100%;background:var(--leaf)}
.ptools button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:5px 10px;font-size:.82rem}
.toc .mini{display:block;width:54px;height:6px;background:#e9e3d2;border-radius:9px;overflow:hidden;flex:none}
.toc .mini b{display:block;height:100%;background:var(--leaf)}
.bmh{font-weight:700;color:#a87300;margin:4px 0 2px}
.toc .bmi{color:#7a5a00}
body.cloze .sbtns button{color:var(--mute)!important;background:#fff!important}
body.cloze .sbtns .ck.on{color:#fff!important;background:var(--leaf)!important}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <a class="ibtn" href="index.html" aria-label="回首頁" style="text-decoration:none">⌂</a>
    <h1>園藝科教甄 複習本<small id="sub">教甄＋技藝競賽考題重點（94–114）</small></h1>
    <button class="ibtn" id="tocBtn" aria-label="目錄">目錄</button>
    <button class="ibtn" id="setBtn" aria-label="設定">Aa</button>
  </div>
  <div class="chips" id="chips"></div>
</header>

<main>
  <!-- notes -->
  <section class="view show" id="v-notes">
    <div class="tools">
      <input id="q" type="search" placeholder="搜尋：例如 鳳梨、DIF、過氧化鈣" enterkeyhint="search">
      <button class="tbtn" id="clozeBtn">挖空模式</button>
    </div>
    <div id="sresults"></div>
    <article id="art"></article>
    <div class="donebar"><button class="done" id="doneBtn">✓ 這章讀完了</button></div>
    <p class="hint" id="clozeHint" hidden>挖空模式：先想答案，再點灰色方塊翻開</p>
    <div class="pager"><button id="prevBtn">← 上一章</button><button id="nextBtn">下一章 →</button></div>
  </section>

  <!-- family quiz -->
  <section class="view" id="v-quiz">
    <div class="panel" id="quizBox"></div>
  </section>

  <!-- cards -->
  <section class="view" id="v-cards">
    <div class="seg" id="cardSeg">
      <button data-m="all" class="on">全部</button><button data-m="unk">還不熟</button><button data-m="shuf">隨機</button>
    </div>
    <div class="qtop"><span id="cpos"></span><span id="cstat"></span></div>
    <div class="flip"><div class="fcard" id="fcard">
      <div class="face front"><div class="term" id="cterm"></div><div class="yr" id="cyr"></div><div class="tap">點卡片看答題要點</div></div>
      <div class="face back"><div id="cans"></div></div>
    </div></div>
    <div class="cmark"><button class="u" id="cUnk">還不熟</button><button class="k" id="cKnow">記住了</button></div>
    <div class="row"><button class="sec" id="cPrev">← 上一張</button><button id="cNext">下一張 →</button></div>
  </section>
</main>

<nav class="bottom">
  <button class="on" data-v="notes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/><path d="M8 7h6M8 11h6"/></svg>讀筆記</button>
  <button data-v="quiz"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z"/><path d="M12 8v6M9 11h6"/></svg>科別測驗</button>
  <button data-v="cards"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/></svg>名詞閃卡</button>
</nav>

<div class="sheet" id="tocSheet"><div class="sbox">
  <h3>目錄與進度</h3>
  <div id="progTxt"></div><div class="prog"><i id="progBar"></i></div>
  <div class="toc" id="toc"></div>
  <button class="close" data-close>關閉</button>
</div></div>

<div class="sheet" id="setSheet"><div class="sbox">
  <h3>字體大小</h3>
  <div class="fsz"><button data-fs="15">小</button><button data-fs="17">中</button><button data-fs="19">大</button><button data-fs="21">特大</button></div>

const CH=[{"id": "c0", "title": "考題總覽與讀書策略", "short": "考題總覽與讀書策略", "html": "<p>24 份考卷橫跨 95–114 年，最穩定的得分點是「植物科別」「花序／器官形態」「生長調節劑」「切花採收適期」「品種與商品名」五大塊，幾乎每份都考。</p>\n<table>\n<thead>\n<tr>\n<th>來源</th>\n<th>年度</th>\n<th>題型</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>教育部聯招 園藝科</td>\n<td>98、104、105、106、107、108、114</td>\n<td>選擇 40 題（1 分）＋填充、名詞解釋、問答 60 分；98 年只有選擇 20 題</td>\n</tr>\n<tr>\n<td>教育部聯招 造園科</td>\n<td>103、108（108 與園藝科同卷）</td>\n<td>造園史、製圖、測量、材料</td>\n</tr>\n<tr>\n<td>教育部聯招 農場經營科</td>\n<td>105、106、107、108</td>\n<td>作物、生技、畜牧水產、農業經營</td>\n</tr>\n<tr>\n<td>臺中高農 農場經營科（校辦）</td>\n<td>95</td>\n<td>選擇 40 題＋填充，農場經營學比重高</td>\n</tr>\n<tr>\n<td>民雄農工 園藝科（校辦）</td>\n<td>95</td>\n<td>是非 20 題＋選擇 30 題，含造園</td>\n</tr>\n<tr>\n<td>員林農工 農場經營科（校辦）</td>\n<td>99</td>\n<td>選擇、科名填充、有機農業與畜牧問答、蘇力菌計算</td>\n</tr>\n<tr>\n<td>桃園農工 園藝科（校辦）</td>\n<td>112</td>\n<td>選擇 30 題（2 分）、科名填充、英文名詞須翻譯並解釋</td>\n</tr>\n<tr>\n<td>松山工農 園藝科（校辦）</td>\n<td>114</td>\n<td>選擇 20 題、科名、子房位置、英文名詞解釋</td>\n</tr>\n<tr>\n<td>園藝技師高考</td>\n<td>107</td>\n<td>果樹、蔬菜、花卉、造園、園產處理、育種繁殖各一卷申論</td>\n</tr>\n<tr>\n<td>全國農業類技藝競賽 園藝職種</td>\n<td>94、96–114</td>\n<td>94–105 是非 50＋選擇 50；106 起選擇 50 題；94 另有植物識別；造園題到 98 年（見第十七章）</td>\n</tr>\n</tbody>\n</table>\n<p>出題趨勢：</p>\n<ul>\n<li>重複出題很多：荔枝「糯米滋」、苦瓜嫁接絲瓜、ABA 不促進長日植物開花、造粒種子用過氧化鈣、亞洲型百合最大宗、虎渡子法，都至少考過兩次。</li>\n<li>英文名詞比重上升：校辦卷常要求「先翻譯再解釋」，未解釋不給分。</li>\n<li>114 年起出現複選題（全對才給分）。</li>\n<li>農場經營卷會混入生物技術（PCR、基因槍、農桿菌）、病原分類與肥料計算，園藝卷也開始引用。</li>\n</ul>\n<p>讀書順序建議：科別表 → 形態 → 生理與調節劑 → 各論（蔬菜、果樹、花卉）→ 病蟲害 → 計算題 → 名詞與申論。</p>\n<blockquote>\n<p>本筆記答案以考卷所附答案為準；考卷未附答案的題目（松山 114、108 移植適期等）標註「參考答案」。科別以高職課本慣用的舊分類作答，新分類（APG）另附註。</p>\n</blockquote>"}, {"id": "c1", "title": "一、植物科別（每年必考）", "short": "一、植物科別", "html": "<p>科別題幾乎每份考卷都有，一次 5–14 格。下表依科別整理所有考過的植物；粗體為考過 2 次以上。</p>\n<table>\n<thead>\n<tr>\n<th>科名</th>\n<th>考過的植物</th>\n<th>易錯提醒</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>藤黃科</td>\n<td><strong>福木</strong>、鳳果、山竹</td>\n<td>福木考過 3 次</td>\n</tr>\n<tr>\n<td>漆樹科</td>\n<td><strong>芒果</strong>、腰果、阿月渾子（開心果）、黃連木（楷木）</td>\n<td></td>\n</tr>\n<tr>\n<td>楝科</td>\n<td><strong>香椿</strong>、大葉桃花心木</td>\n<td></td>\n</tr>\n<tr>\n<td>梧桐科</td>\n<td><strong>可可</strong></td>\n<td>新分類併入錦葵科</td>\n</tr>\n<tr>\n<td>木棉科</td>\n<td><strong>榴槤</strong></td>\n<td>新分類併入錦葵科</td>\n</tr>\n<tr>\n<td>錦葵科</td>\n<td><strong>棉</strong>、木槿</td>\n<td>木槿不是大戟科</td>\n</tr>\n<tr>\n<td>無患子科</td>\n<td><strong>臺灣欒樹</strong>、荔枝、龍眼</td>\n<td></td>\n</tr>\n<tr>\n<td>大戟科</td>\n<td>錫蘭葉下珠、變葉木、彩葉山漆莖、茄苳、綠珊瑚、聖誕紅（猩猩木）</td>\n<td>錫蘭葉下珠不是茜草科</td>\n</tr>\n<tr>\n<td>茜草科</td>\n<td><strong>咖啡</strong>、玉葉金花、矮仙丹</td>\n<td></td>\n</tr>\n<tr>\n<td>桃金孃科</td>\n<td><strong>蓮霧</strong>、番石榴、白千層、紅千層</td>\n<td></td>\n</tr>\n<tr>\n<td>木犀科</td>\n<td><strong>茉莉花</strong>、光臘樹、桂花、流蘇</td>\n<td></td>\n</tr>\n<tr>\n<td>蓼科</td>\n<td><strong>蕎麥</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>藜科</td>\n<td><strong>菾菜</strong>、菠菜</td>\n<td>菠菜不是繖形花科</td>\n</tr>\n<tr>\n<td>莧科</td>\n<td><strong>雞冠花</strong>、千日紅、莧菜</td>\n<td></td>\n</tr>\n<tr>\n<td>馬齒莧科</td>\n<td><strong>松葉牡丹</strong>、半支蓮</td>\n<td></td>\n</tr>\n<tr>\n<td>繖形花科</td>\n<td><strong>胡蘿蔔</strong>、芹菜、芫荽</td>\n<td></td>\n</tr>\n<tr>\n<td>十字花科</td>\n<td><strong>蘿蔔（萊菔）</strong>、芥菜、甘藍、辣根</td>\n<td></td>\n</tr>\n<tr>\n<td>茄科</td>\n<td><strong>矮牽牛</strong>、馬鈴薯（洋芋）、番茉莉、紫水晶</td>\n<td>洋芋不是天南星科</td>\n</tr>\n<tr>\n<td>唇形科</td>\n<td><strong>紫蘇</strong>、一串紅、彩葉草、羅勒、薰衣草</td>\n<td>金魚草不是唇形科（玄參科／車前科）</td>\n</tr>\n<tr>\n<td>菊科</td>\n<td><strong>牛蒡</strong>、紫錐花、吉康菜、瑪格麗特、茼蒿、萵苣、紫花藿香薊</td>\n<td></td>\n</tr>\n<tr>\n<td>葫蘆科</td>\n<td><strong>黃瓜</strong>、西瓜、絲瓜</td>\n<td></td>\n</tr>\n<tr>\n<td>旋花科</td>\n<td>空心菜、葉用甘薯</td>\n<td></td>\n</tr>\n<tr>\n<td>蝶形花科</td>\n<td>紫藤、黃脈刺桐、刺桐</td>\n<td></td>\n</tr>\n<tr>\n<td>蘇木科</td>\n<td><strong>鳳凰木</strong>、羅望子、鐵刀木、阿勃勒</td>\n<td>鳳凰木：夏開紅花、羽片 10–20 對</td>\n</tr>\n<tr>\n<td>鳶尾科</td>\n<td><strong>唐菖蒲</strong></td>\n<td>唐菖蒲不是臺灣原生</td>\n</tr>\n<tr>\n<td>龍舌蘭科</td>\n<td><strong>夜來香（晚香玉）</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>報春花科</td>\n<td><strong>仙客來</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>龍膽科</td>\n<td><strong>洋桔梗</strong></td>\n<td></td>\n</tr>\n<tr>\n<td>毛茛科</td>\n<td><strong>宿根飛燕草</strong>、耬斗菜</td>\n<td></td>\n</tr>\n<tr>\n<td>苦苣苔科</td>\n<td>非洲菫、大岩桐</td>\n<td></td>\n</tr>\n<tr>\n<td><strong>花荵科</strong></td>\n<td>福祿考</td>\n<td></td>\n</tr>\n<tr>\n<td>石竹科</td>\n<td>菁芳草、香石竹、滿天星</td>\n<td></td>\n</tr>\n<tr>\n<td>百合科</td>\n<td>文竹、白紋草、吊蘭、沿階草、石刁柏、金針菜</td>\n<td>洋蔥舊分類百合科／新分類石蒜科</td>\n</tr>\n<tr>\n<td>天南星科</td>\n<td>芋、火鶴花、白鶴芋、海芋</td>\n<td></td>\n</tr>\n<tr>\n<td>澤瀉科</td>\n<td><strong>慈菇</strong>、野茨菰</td>\n<td></td>\n</tr>\n<tr>\n<td>莎草科</td>\n<td><strong>荸薺</strong>、香附子</td>\n<td>香附子不是禾本科</td>\n</tr>\n<tr>\n<td>柳葉菜科</td>\n<td><strong>菱角</strong>、南湖柳葉菜</td>\n<td></td>\n</tr>\n<tr>\n<td>柿樹科</td>\n<td>象牙樹</td>\n<td></td>\n</tr>\n<tr>\n<td>山欖科</td>\n<td>蛋黃果、黃金果</td>\n<td></td>\n</tr>\n<tr>\n<td>千屈菜科</td>\n<td>紫薇</td>\n<td></td>\n</tr>\n<tr>\n<td>紫葳科</td>\n<td><strong>風鈴木</strong>、凌霄花</td>\n<td></td>\n</tr>\n<tr>\n<td>夾竹桃科</td>\n<td>軟枝黃蟬、黑板樹、夾竹桃</td>\n<td>黑板樹不是桑科</td>\n</tr>\n<tr>\n<td>桑科</td>\n<td>小葉桑、麵包樹、印度橡膠樹、菩提樹、雀榕、無花果</td>\n<td></td>\n</tr>\n<tr>\n<td>馬鞭草科</td>\n<td>金露花</td>\n<td></td>\n</tr>\n<tr>\n<td>樟科</td>\n<td>酪梨</td>\n<td></td>\n</tr>\n<tr>\n<td>番荔枝科</td>\n<td>番荔枝</td>\n<td></td>\n</tr>\n<tr>\n<td>山龍眼科</td>\n<td>澳洲胡桃</td>\n<td></td>\n</tr>\n<tr>\n<td>西番蓮科</td>\n<td>百香果、葡萄西番蓮</td>\n<td></td>\n</tr>\n<tr>\n<td>芸香科</td>\n<td>刺蔥(食茱萸)、柑橘</td>\n<td></td>\n</tr>\n<tr>\n<td>紫茉莉科</td>\n<td>九重葛</td>\n<td></td>\n</tr>\n<tr>\n<td>衛矛科</td>\n<td>黃楊（依 114 答案）(<em>黃楊科)</em></td>\n<td></td>\n</tr>\n<tr>\n<td>葡萄科</td>\n<td>地錦</td>\n<td>參考答案</td>\n</tr>\n<tr>\n<td>胡頹子科</td>\n<td>椬梧</td>\n<td>參考答案</td>\n</tr>\n<tr>\n<td>冬青科</td>\n<td>亮葉冬青</td>\n<td>參考答案</td>\n</tr>\n<tr>\n<td>羅漢松科</td>\n<td>竹柏</td>\n<td>竹柏不是柏科</td>\n</tr>\n<tr>\n<td>蘭科</td>\n<td>綬草及各種蘭花</td>\n<td></td>\n</tr>\n<tr>\n<td>蹄蓋蕨科</td>\n<td>菜蕨（過溝菜蕨）</td>\n<td></td>\n</tr>\n<tr>\n<td>鐵角蕨科</td>\n<td>大鱗巢蕨（山蘇）</td>\n<td>參考答案</td>\n</tr>\n<tr>\n<td>口蘑科</td>\n<td><strong>香菇</strong>、金針菇、鮑魚菇</td>\n<td>洋菇不是口蘑科（蘑菇科）</td>\n</tr>\n<tr>\n<td>光柄菇科</td>\n<td>草菇</td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<p>竅門：「下列作物與科別配對何者錯誤」最愛考的錯誤配對（括號內為正確科別）：木槿配大戟科（錯，應為錦葵科）、竹柏配柏科（錯，應為羅漢松科）、金魚草配唇形科（錯，應為玄參科／車前科）、菠菜配繖形花科（錯，應為藜科）、洋芋配天南星科（錯，應為茄科）。</p>\n<p>95–99 年補充的科別：</p>\n<ul>\n<li>雜草：看麥娘 禾本科、滿天星 莧科、球花蒿草 莎草科、鴨舌草 雨久花科（99 員林）。</li>\n<li>萱草（百合科）、水仙（石蒜科）、菠菜（藜科）、胡蘿蔔（繖形花科）。</li>\n<li>天南星科觀葉：黃金葛、姑婆芋、粗肋草；福祿桐不是天南星科（五加科）（95 民雄）。</li>\n</ul>"}, {"id": "c2", "title": "二、植物形態", "short": "二、植物形態", "html": "<h3>花序</h3>\n<p>有限花序（頭花先開、花軸不再伸長）：卷繖、單頂、聚繖花序。無限花序（由下而上、由外而內開、頂端可繼續生長）：總狀、穗狀、繖形、繖房、頭狀、葇荑、肉穗、隱頭。</p>\n<table>\n<thead>\n<tr>\n<th>花序</th>\n<th>考過的植物</th>\n<th>特徵</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>葇荑花序</td>\n<td>柳、垂柳</td>\n<td>單性花、無花柄，整串下垂脫落</td>\n</tr>\n<tr>\n<td>頭狀花序</td>\n<td>菊花、牛蒡、百日草、非洲菊</td>\n<td>菊科典型</td>\n</tr>\n<tr>\n<td>繖形花序</td>\n<td>胡蘿蔔、矮仙丹</td>\n<td>小花柄等長自一點發出</td>\n</tr>\n<tr>\n<td>隱頭花序</td>\n<td>無花果、雀榕</td>\n<td>花藏在肉質花托內</td>\n</tr>\n<tr>\n<td>肉穗花序</td>\n<td>火鶴花、芋</td>\n<td>雌花在下、雄花在上，外有佛焰苞</td>\n</tr>\n<tr>\n<td>單穗狀花序</td>\n<td>唐菖蒲</td>\n<td></td>\n</tr>\n<tr>\n<td>單頂花序</td>\n<td>茶花、蓮</td>\n<td>屬有限花序</td>\n</tr>\n<tr>\n<td>卷繖花序</td>\n<td>勿忘草類</td>\n<td>有限花序的代表</td>\n</tr>\n<tr>\n<td>複總狀花序</td>\n<td>蜀黍</td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<h3>子房位置（名詞易混淆）</h3>\n<p>「上位花」是指花被位於子房上方，也就是子房下位；「下位花」則是子房上位。104 年問「何者為上位花」，答案是梨。</p>\n<table>\n<thead>\n<tr>\n<th>類型</th>\n<th>別名</th>\n<th>代表植物</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>子房上位</td>\n<td>下位花</td>\n<td>柑橘、葡萄、番茄、百香果</td>\n</tr>\n<tr>\n<td>子房周位</td>\n<td>周位花</td>\n<td>桃、李、梅、櫻桃（花托杯狀）</td>\n</tr>\n<tr>\n<td>子房下位</td>\n<td>上位花</td>\n<td>梨、蘋果、枇杷、南瓜、瓜類、番石榴、香蕉</td>\n</tr>\n</tbody>\n</table>\n<p>典型花由外而內：花萼 → 花冠 → 雄蕊 → 雌蕊（皆著生於花托）。四者齊備稱完全花；只有雌、雄蕊與花冠不算完全花。</p>\n<h3>葉序與變態器官</h3>\n<ul>\n<li>單葉與複葉的分辨依據：葉腋有無腋芽。</li>\n<li>對生：福木、茉莉花、桂花、蓮霧。互生：臺灣欒樹、枇杷、玫瑰、桑。輪生：軟枝黃蟬。</li>\n</ul>\n<table>\n<thead>\n<tr>\n<th>變態類型</th>\n<th>代表植物</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>貯藏葉</td>\n<td>石蓮花</td>\n</tr>\n<tr>\n<td>繁殖葉</td>\n<td>秋海棠</td>\n</tr>\n<tr>\n<td>鱗狀葉</td>\n<td>蘆筍、木麻黃</td>\n</tr>\n<tr>\n<td>葉狀柄</td>\n<td>相思樹</td>\n</tr>\n<tr>\n<td>針狀葉</td>\n<td>仙人掌</td>\n</tr>\n<tr>\n<td>捕蟲葉</td>\n<td>豬籠草、瓶子草（靠蛋白質分解酵素消化）</td>\n</tr>\n<tr>\n<td>葉狀莖</td>\n<td>曇花</td>\n</tr>\n<tr>\n<td>板根</td>\n<td>銀葉樹</td>\n</tr>\n<tr>\n<td>零餘子（葉腋肉球）</td>\n<td>山藥（薯蕷）</td>\n</tr>\n<tr>\n<td>珠芽（莖上營養體）</td>\n<td>百合科</td>\n</tr>\n<tr>\n<td>捲鬚（Clinger）</td>\n<td>葡萄西番蓮</td>\n</tr>\n<tr>\n<td>偽鱗莖 Pseudobulb</td>\n<td>複莖蘭（石斛、嘉德麗雅）</td>\n</tr>\n</tbody>\n</table>\n<h3>果實分類</h3>\n<table>\n<thead>\n<tr>\n<th>分類</th>\n<th>考過的例子</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>可食部位為胎座</td>\n<td>番茄、西瓜</td>\n</tr>\n<tr>\n<td>可食部位為子房壁</td>\n<td>番木瓜</td>\n</tr>\n<tr>\n<td>仁果（假果、梨果）</td>\n<td>蘋果、梨</td>\n</tr>\n<tr>\n<td>準仁果</td>\n<td>柿、柑橘（蘋果不是）</td>\n</tr>\n<tr>\n<td>柑果 Hesperidium</td>\n<td>柑橘</td>\n</tr>\n<tr>\n<td>蓇葖果（裂果）</td>\n<td>飛燕草、銀樺</td>\n</tr>\n<tr>\n<td>角果（裂果）</td>\n<td>十字花科（胡蘿蔔是離果，不是角果）</td>\n</tr>\n<tr>\n<td>蒴果（裂果）</td>\n<td>大花紫薇、胡麻、黃秋葵</td>\n</tr>\n<tr>\n<td>穎果（閉果）</td>\n<td>玉米、水稻（蕎麥是瘦果）</td>\n</tr>\n<tr>\n<td>聚合果</td>\n<td>草莓、番荔枝（一朵花多個離生心皮）</td>\n</tr>\n<tr>\n<td>複果 Compound fruit</td>\n<td>鳳梨、桑椹、無花果（整個花序發育）</td>\n</tr>\n</tbody>\n</table>\n<h3>地下貯藏器官</h3>\n<table>\n<thead>\n<tr>\n<th>類型</th>\n<th>英文</th>\n<th>代表植物</th>\n<th>辨識重點</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>球莖</td>\n<td>Corm</td>\n<td>唐菖蒲、小蒼蘭、番紅花、射干菖蒲、芋</td>\n<td>莖短縮肥大成球形，外有乾燥膜狀葉鞘</td>\n</tr>\n<tr>\n<td>鱗莖</td>\n<td>Bulb</td>\n<td>水仙、百合、孤挺花、風信子、洋蔥</td>\n<td>貯藏在葉（鱗片）</td>\n</tr>\n<tr>\n<td>塊莖</td>\n<td>Tuber</td>\n<td>球根海棠、仙客來、馬鈴薯</td>\n<td>仙客來不是塊根</td>\n</tr>\n<tr>\n<td>塊根</td>\n<td>Tuberous root</td>\n<td>大理花、嘉蘭（依 104 答案）、甘薯</td>\n<td>根部肥大</td>\n</tr>\n<tr>\n<td>根莖</td>\n<td>Rhizome</td>\n<td>美人蕉、藕、薑荷花</td>\n<td>橫走地下莖</td>\n</tr>\n</tbody>\n</table>\n<h3>蘭科特徵（104、106、112 都考）</h3>\n<ul>\n<li>辨識關鍵特徵是蕊柱；花多有「轉位」，子房旋轉 180°。</li>\n<li>花被兩輪：外 3 片萼片、內 3 片花瓣（含唇瓣）。</li>\n<li>雌雄蕊間有嘴狀體，作用是「防止」自花授粉。</li>\n<li>種子細小、無胚乳，需蘭菌（菌根）協助發芽；根有根被層。</li>\n<li>單莖蘭：蝴蝶蘭、萬代蘭。複莖蘭：石斛蘭、虎頭蘭、嘉德麗雅蘭、仙履蘭。</li>\n<li>國蘭（東亞蘭）：素心蘭、四季蘭、春蘭；捧心蘭不是國蘭。</li>\n</ul>\n<p>95–99 年補充：</p>\n<ul>\n<li>甘藷的果實為蒴果；草莓為一朵花多數子房發育的聚合果；中藥店「白果」是銀杏的種子。</li>\n<li>軟枝黃蟬葉輪生（98 與 114 松山都考）。石斛蘭是複莖蘭。</li>\n<li>雙重受精發生在被子植物，產生 2n 胚與 3n 胚乳；裸子植物為單受精，仍有胚乳（由雌配子體形成）。</li>\n<li>大麥的葉耳「長而光滑又抱莖」（95、106 兩度考）。</li>\n<li>金花石蒜是臺灣原生球根花卉；唐菖蒲是鳶尾科「球莖」花卉（<span class=\"ng\">✗</span>「塊莖」是錯的；<mark class=\"ok\">✔ 正確：球莖</mark>）。</li>\n</ul>"}, {"id": "c3", "title": "三、植物生理", "short": "三、植物生理", "html": "<h3>光週期</h3>\n<table>\n<thead>\n<tr>\n<th>類型</th>\n<th>花卉</th>\n<th>蔬菜／其他</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>短日植物</td>\n<td>菊花、聖誕紅、長壽花、蟹爪蘭（螃蟹蘭）</td>\n<td>莧菜、黃秋葵、大豆；馬鈴薯短日促進塊莖</td>\n</tr>\n<tr>\n<td>長日植物</td>\n<td>飛燕草、香石竹（量的長日）</td>\n<td>菠菜、萵苣</td>\n</tr>\n<tr>\n<td>中日性（不受日長影響）</td>\n<td>玫瑰</td>\n<td>番茄</td>\n</tr>\n<tr>\n<td>短長日植物</td>\n<td>報春花</td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li>向日葵不靠短日處理提早開花（松山 114）。甘藍不是短日作物。</li>\n<li>長日處理的兩種方法：日落後延長照明（把長暗期縮短）、暗期中斷（把一個長暗期切成兩個短暗期）。秋冬電照菊可抑制開花，常與水稻輪作減少土壤病蟲害。</li>\n<li>Qualitative LDP（質的長日植物）：不經長日就不開花；Quantitative（量的）：長日只是促進。</li>\n</ul>\n<h3>光敏素 Phytochrome</h3>\n<ul>\n<li>兩種型式同時存在且可互相轉換：Pr（P660）吸收紅光 → Pfr（P730）；Pfr 吸收遠紅光 → Pr。</li>\n<li>紅光（660 nm）是暗期中斷最有效的波段，也最能促進種子發芽。</li>\n<li>組培苗移植前 3 週：用含較多紅光的照明，並增加光度（健化）。</li>\n</ul>\n<h3>春化作用 Vernalization</h3>\n<p>花芽形成前給予一段低溫（約 0–10 ℃）誘導花芽分化；可逆，低溫後立即遇高溫會「去春化」。</p>\n<table>\n<thead>\n<tr>\n<th>類型</th>\n<th>感應部位</th>\n<th>代表作物</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>種子感應型</td>\n<td>胚</td>\n<td>蘿蔔、大白菜、蕪菁、香豌豆</td>\n</tr>\n<tr>\n<td>綠植株感應型</td>\n<td>莖頂生長點</td>\n<td>甘藍、洋蔥、胡蘿蔔、芹菜、紫羅蘭、星辰花</td>\n</tr>\n</tbody>\n</table>\n<h3>C3、C4、CAM</h3>\n<table>\n<thead>\n<tr>\n<th>類型</th>\n<th>初步固定酵素</th>\n<th>特性</th>\n<th>代表</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>C3</td>\n<td>RuBP 羧化酶；卡爾文循環在葉綠體基質（stroma）</td>\n<td>光飽和點低、有光呼吸</td>\n<td>大部分作物、東亞蘭、春石斛</td>\n</tr>\n<tr>\n<td>C4</td>\n<td>PEP 羧化酶（對 CO2 親和力大）</td>\n<td>葉肉細胞＋維管束鞘分工；耐旱耐熱、光飽和點高</td>\n<td>玉米、甘蔗</td>\n</tr>\n<tr>\n<td>CAM</td>\n<td>夜間開氣孔以 PEP 固定，白天進行卡爾文循環</td>\n<td>最耐旱；構造類似 C3</td>\n<td>蝴蝶蘭、嘉德麗雅蘭、秋石斛、鳳梨、多肉</td>\n</tr>\n</tbody>\n</table>\n<h3>光飽和點與光補償點</h3>\n<ul>\n<li>光補償點 Light Compensation Point：光合作用吸收 CO2 量等於呼吸釋出量的光度，淨光合為零。</li>\n<li>光飽和點 Light Saturation Point：光度再增加，光合速率也不再上升的光度。</li>\n<li>光飽和點高：向日葵；低：非洲菫、蝴蝶蘭、火鶴花。中光性植物（1000–4000 ft-c）：菜豆。</li>\n</ul>\n<h3>DIF（日夜溫差）</h3>\n<p>DIF = 日溫 − 夜溫。正 DIF 促進節間伸長，負 DIF（夜溫高於日溫）使植株矮化，可取代矮化劑。適用百合、聖誕紅、金魚草；風信子不適用（106）。</p>\n<h3>休眠與溫度需求</h3>\n<ul>\n<li>自發性（內在性）休眠：環境適宜仍不萌發，如小蒼蘭。強迫休眠 Enforced dormancy：因環境不適而暫停，條件改善即萌發。</li>\n<li>感溫週期性：球根花卉一年內需「暖→冷涼→暖」才能正常開花。</li>\n<li>耐寒力：細胞可溶性醣越多越耐寒；含水量越多越不耐寒。淹水與乾旱的共同現象是植株缺水。</li>\n<li>積溫：作物完成某生育階段所需的日平均溫累積值。</li>\n</ul>\n<h3>種子發芽</h3>\n<ul>\n<li>必要條件：水分、溫度、氧氣；光不是必要條件。</li>\n<li>好光性種子：矮牽牛、金魚草、萵苣、非洲菫（需連續光照至少 4 天）。嫌光性：日日春、雞冠花、百日草。</li>\n<li>高溫休眠：菾菜、萵苣（熱休眠）。美女櫻種子含抑制物質。</li>\n<li>變溫促進發芽：高溫使種皮膨脹、低溫收縮，種皮受傷利於吸水。</li>\n<li>吸水速度：蛋白質種子 &gt; 脂質 &gt; 澱粉。</li>\n<li>種子壽命短：洋蔥、甜玉米、韭菜。乾貯型種子儲藏溫度每降 5 ℃、壽命倍增；含水量每增 1%，安全期減半。</li>\n<li>頑拗性種子 Recalcitrant：不耐乾燥、不耐低溫儲藏（荔枝、芒果、可可）。</li>\n<li>有效水：田間容水量至永久凋萎點之間的水，主要是微管水（capillary water）。</li>\n</ul>\n<p>95–99 年補充：</p>\n<ul>\n<li>聖誕紅是「絕對」短日植物；蒲公英、蕎麥及熱帶周年開花植物屬中性植物；洋蔥結球與日長（長日）相關。</li>\n<li>長日性果樹：香蕉、鳳梨、芒果；柑橘不是。</li>\n<li>綠光最不易被綠色植物吸收。組培室藍光多促進培植體長芽。</li>\n<li>光反應分解水、產生 NADPH 與 ATP；暗反應所需化學能由兩者共同供應。C4 光呼吸很弱，C3 光呼吸旺盛。</li>\n<li>最利於養分積蓄：晝高溫、夜低溫。</li>\n<li>蒸散旺盛的因子：相對濕度低、新生莖葉與未熟果、開放的花；「土壤溶液鹼性」不是。</li>\n<li>根吸收的水與礦物質經木質部往上運輸。植物自土壤吸收的元素約佔植體總量 0.5–6%。</li>\n<li>杜鵑、梅、桃等木本花卉花芽分化在開花前的夏天。</li>\n<li>脂溶性色素：茄紅素（依 95 民雄答案）；花青素、類黃酮為水溶性。</li>\n</ul>"}, {"id": "c4", "title": "四、植物生長調節劑", "short": "四、植物生長調節劑", "html": "<p>六大類：生長素、激勃素、細胞分裂素、離層酸、乙烯、生長抑制劑。唯一的氣體調節劑是乙烯。</p>\n<table>\n<thead>\n<tr>\n<th>調節劑</th>\n<th>考過的用途</th>\n<th>常見錯誤選項</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>生長素（IAA、IBA、NAA、2,4-D）</td>\n<td>IBA 促進發根；NAA 防蘋果落果；鳳梨採前施用萘乙酸鈉防乾旱果梗折斷；萘乙酸甲酯抑制馬鈴薯發芽；組培中生長素比例高誘導根</td>\n<td>Tomatotone 是促進番茄著果，不是防裂果</td>\n</tr>\n<tr>\n<td>激勃素 GA</td>\n<td>無子葡萄；單為結果；打破種子／種薯休眠（馬鈴薯種薯用 GA 或硫氰胺）；防百合、水仙百合在暗處葉黃化；櫻桃幼樹促枝葉、防過早花芽分化；仙客來促開花；瓜類多開雄花</td>\n<td></td>\n</tr>\n<tr>\n<td>細胞分裂素（BA）</td>\n<td>組培中比例高誘導芽；延緩老化</td>\n<td><span class=\"ng\">✗</span>「細胞分裂素誘導根」是錯的；<mark class=\"ok\">✔ 正確：細胞分裂素比例高誘導芽，生長素比例高才誘導根 </mark></td>\n</tr>\n<tr>\n<td>乙烯（Ethrel、電石）</td>\n<td>鳳梨科催花；瓜類（胡瓜）多開雌花；果實後熟與軟化</td>\n<td><span class=\"ng\">✗</span>「使瓜類多開雄花」是錯的；<mark class=\"ok\">✔ 正確：乙烯使瓜類多開雌花，激勃素才促進雄花 </mark></td>\n</tr>\n<tr>\n<td>離層酸 ABA</td>\n<td>促進休眠、氣孔關閉、脫落</td>\n<td><span class=\"ng\">✗</span>「ABA 促進長日植物開花」是錯的（105、107 兩度考）；<mark class=\"ok\">✔ 正確：ABA 促進休眠、抑制生長；促進長日植物抽苔開花的是激勃素 GA </mark></td>\n</tr>\n<tr>\n<td>硝酸銀 AgNO3、STS</td>\n<td>抗乙烯；瓜類促雄花；STS 為切花前處理劑</td>\n<td></td>\n</tr>\n<tr>\n<td>氰滿素</td>\n<td>葡萄修剪後噴施，促提早萌芽</td>\n<td></td>\n</tr>\n<tr>\n<td>生長抑制劑（B-9、Ancymidol、PP333）</td>\n<td>矮化盆花</td>\n<td></td>\n</tr>\n<tr>\n<td>秋水仙素</td>\n<td>抑制紡錘絲形成，使染色體加倍，用於育成四倍體（無子西瓜）</td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<p>切花保鮮劑：STS 為前處理劑；8-HQS 為後處理劑（殺菌）；荷蘭拍賣市場指定 SVB 用於防止葉片黃化。</p>\n<p>95–99 年補充：聖誕紅、菊花盆花最常用的生長抑制劑是 CCC；鳳梨電石催花以夜間效果最佳；生長素使瓜類多開雌花是因為誘導產生乙烯；抑制馬鈴薯、洋蔥、大蒜發芽最好的方法是輻射照射（95 民雄），95 臺中則考 IAA 抑制馬鈴薯發芽。</p>"}, {"id": "c5", "title": "五、土壤、肥料與缺素症", "short": "五、土壤、肥料與缺素症", "html": "<h3>缺素症狀</h3>\n<p>先分「老葉先發症」（移動性元素 N、P、K、Mg）與「新葉／生長點先發症」（不移動 Ca、B、Fe、Mn）。</p>\n<table>\n<thead>\n<tr>\n<th>元素</th>\n<th>症狀</th>\n<th>考過的實例</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>氮 N</td>\n<td>老葉先黃化；過多則深綠、莖葉茂盛、根生長受抑、開花結果不良</td>\n<td>高氮不利馬鈴薯結薯</td>\n</tr>\n<tr>\n<td>磷 P</td>\n<td>葉暗綠或帶紫、生長遲緩</td>\n<td>促開花用高磷肥（白鶴芋 10-30-20）</td>\n</tr>\n<tr>\n<td>鉀 K</td>\n<td>葉緣黃棕至白色斑點，塊根莖發育不良</td>\n<td>西瓜生育後期增鉀，果皮硬度高、減少裂果</td>\n</tr>\n<tr>\n<td>鎂 Mg</td>\n<td>老葉葉脈間黃化</td>\n<td>葉綠素中心元素</td>\n</tr>\n<tr>\n<td>錳 Mn</td>\n<td>幼葉淡綠、葉脈仍綠</td>\n<td></td>\n</tr>\n<tr>\n<td>鈣 Ca</td>\n<td>生長點死亡、根短少、莖稈瘦弱、葉暗綠</td>\n<td>結球白菜心腐（葉面噴氯化鈣）、蘋果苦痘病、番茄尾腐</td>\n</tr>\n<tr>\n<td>硼 B</td>\n<td>新葉變厚、黃化捲曲、生長點停止、葉柄或莖縱裂；果實凹凸不平</td>\n<td>嫩莖萵苣食用莖襞裂、番木瓜果實瘤狀突起</td>\n</tr>\n</tbody>\n</table>\n<p>小胡瓜「尾端肥大果」是授粉不良，不是缺素。</p>\n<h3>土壤酸鹼值</h3>\n<ul>\n<li>pH 低於 5.0：磷、鎂不足，鋁、鐵、錳過量毒害。酸性土壤提高 Ca、Mg、Mn 溶解度（104 答案）。</li>\n<li>耐酸蔬菜：馬鈴薯、西瓜（加石灰反而有害西瓜；馬鈴薯瘡痂病好發於鹼性土壤）。</li>\n<li>喜強酸性花卉：黃梔花、海芋、鈴蘭、杜鵑、觀賞鳳梨。較耐高 pH：瓜葉菊、非洲菊。</li>\n<li>繡球花花色受鋁、鐵影響：酸性偏藍、鹼性偏紅。</li>\n<li>陽離子交換力 CEC：土壤膠體吸附交換陽離子的總量（cmol(+)/kg），越大保肥力越好。吸附力順序 H+ &gt; Ca2+ &gt; Mg2+ &gt; K+ &gt; Na+。</li>\n</ul>\n<h3>肥料</h3>\n<table>\n<thead>\n<tr>\n<th>肥料</th>\n<th>成分含量</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>硫酸銨</td>\n<td>N 21%</td>\n</tr>\n<tr>\n<td>尿素</td>\n<td>N 46%</td>\n</tr>\n<tr>\n<td>過磷酸鈣</td>\n<td>P2O5 18%</td>\n</tr>\n<tr>\n<td>氯化鉀</td>\n<td>K2O 60%</td>\n</tr>\n<tr>\n<td>台肥 1 號</td>\n<td>20-5-10</td>\n</tr>\n<tr>\n<td>台肥 43 號</td>\n<td>15-15-15（番茄盛花期、採收期追肥）</td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li>果樹採收後施用的肥料稱「禮肥」；落葉果樹主要施肥期 12–3 月。</li>\n<li>生理鹼性肥料：硝酸鈉、硝酸鈣；硝酸銨不是。</li>\n<li>乾燥少雨地區宜「早」施（參考答案）；多年生作物施肥期可分散、短期作物可集中；遲效性肥料當基肥。</li>\n<li>堆肥微生物分解最佳碳氮比 25–30。果樹 C/N 比大於 1：枝條充實，利花芽分化。</li>\n<li>整地目的是改善物理性、保肥力、微生物與減病蟲害；「改善化學性質」不是。</li>\n<li>田間澆灌用水量 = （作物蒸散量 + 田面蒸發量 + 土壤滲透量）− 有效雨量。</li>\n<li>報酬遞減律：其他生產要素固定，持續增加某一要素投入，每單位增加的產量逐漸減少。</li>\n<li>有機農業優點：減少污染、改善土壤理化性、減少生產成本；<span class=\"ng\">✗</span>「增加抗藥性病蟲害」是錯誤選項。<mark class=\"ok\">✔ 正確：有機農業不用化學農藥，可減少抗藥性病蟲害的產生。</mark></li>\n</ul>\n<p>95–99 年補充：</p>\n<ul>\n<li>缺鐵：新葉淡黃或白色、葉脈仍綠（98）。鉀的效用：促進光合作用與酵素作用。</li>\n<li>耕地土壤有機質理想含量約 5%。尿素由氨（NH3）與 CO2 高壓合成。</li>\n<li>堆肥加人糞尿是為了供給微生物養分。微生物肥料用菌根真菌、藍綠藻、硫氧化菌，不用酵母菌。</li>\n<li>介質陽離子交換能力強代表保肥力好，不代表肥份高。</li>\n<li>最省水的給水方式：滴水灌溉。作畦以南北向日照最均勻。</li>\n<li>油菜作冬季綠肥主因是耐寒。連作障礙最小：十字花科。</li>\n</ul>"}, {"id": "c6", "title": "六、繁殖與育種", "short": "六、繁殖與育種", "html": "<h3>嫁接（砧木題最常考）</h3>\n<table>\n<thead>\n<tr>\n<th>接穗</th>\n<th>砧木</th>\n<th>目的</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>西瓜</td>\n<td>扁蒲</td>\n<td>預防蔓割病</td>\n</tr>\n<tr>\n<td>番茄</td>\n<td>茄子</td>\n<td>耐淹水</td>\n</tr>\n<tr>\n<td>苦瓜</td>\n<td>絲瓜</td>\n<td>絲瓜根部土壤適應性、耐水性強（105、107 兩度考）</td>\n</tr>\n<tr>\n<td>橫山梨</td>\n<td>鳥梨</td>\n<td></td>\n</tr>\n<tr>\n<td>梅</td>\n<td>野生小梅</td>\n<td>梅根砧</td>\n</tr>\n<tr>\n<td>柑橘</td>\n<td>柚</td>\n<td>產生「喬化」，樹冠高大</td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li>瓜類頂插接適期：砧木本葉一片、接穗子葉合掌期。</li>\n<li>番石榴種苗最常用靠接。木本砧木以 1–2 年生實生苗為佳。</li>\n<li>接穗要發育充實、無病蟲害、部位適當；「具父本優良特性」不是要件。</li>\n<li>橫山梨高接溫帶梨：接穗 5 ℃ 冷藏 20–30 天滿足低溫需求；嫁接後 25–30 天開花，開花前除袋；<span class=\"ng\">✗</span>「11 月中旬最適寄接」是錯的；<mark class=\"ok\">✔ 正確：寄接適期在冬季約 12 月～翌年 1 月（各地略有差異，請對照課本）。</mark></li>\n<li>柑橘健康種苗：莖頂微體嫁接（不是胚培養）。</li>\n<li>合接法：砧木與接穗粗細相近，各削成同長斜面後對合綁紮。</li>\n</ul>\n<h3>扦插與壓條</h3>\n<ul>\n<li>葉柄可發根：大岩桐（非洲菫同理）。</li>\n<li>多肉植物：切口乾燥 2–3 天再插。</li>\n<li>落葉硬材插穗在黑暗中易生根；未木質化插穗在光照下易生根。介質需保水、排水好，「充足養分」不必要。</li>\n<li>枝條含單寧、脂質等抑制物的落葉樹：用黃化處理提高發根。</li>\n<li>可種子又可扦插：蕹菜、落葵。蕹菜小葉種結種困難，必須扦插（112 答案）。</li>\n<li>茶樹扦插最理想時期 12–1 月（107 農經答案）。</li>\n<li>果樹少用扦插苗：根淺，成樹後易遭風害。</li>\n</ul>\n<h3>種子處理</h3>\n<table>\n<thead>\n<tr>\n<th>處理</th>\n<th>重點</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>造粒種子 pellet seed</td>\n<td>粉衣材料為「過氧化鈣」（104、105、107、108、114 五度考）；目的：機械化播種、發芽整齊、適用小粒或不規則種子；「耐貯藏」不是目的</td>\n</tr>\n<tr>\n<td>種子披衣 seed coating</td>\n<td>加入藥劑、色素、肥料，形狀不變</td>\n</tr>\n<tr>\n<td>種子帶 seed tape</td>\n<td>種子依固定間距黏在可分解紙帶上，省去疏苗</td>\n</tr>\n<tr>\n<td>預措</td>\n<td>播種前以物理、化學、生物方法處理種子的總稱</td>\n</tr>\n<tr>\n<td>滲調處理 priming</td>\n<td>以 PEG 或鹽類溶液控制吸水，使種子停在發芽前階段，播後發芽快且整齊</td>\n</tr>\n<tr>\n<td>層積處理 stratification</td>\n<td>種子與濕潤介質層層疊放，低溫保存，打破休眠</td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li>種子繁殖三級制：原原種 → 原種 → 推廣種；先繁殖原原種。</li>\n<li>最快得知種子活力：TTC 法（四唑鹽染色）。種子純度 purity：樣品中該品種乾淨種子所占重量百分比。</li>\n</ul>\n<h3>組織培養</h3>\n<ul>\n<li>組合：白藍菜 → 細胞融合；純系同質二倍體 → 花藥培養；無病毒株 → 莖頂培養（不是葉片癒傷組織）；人工種子體胚 → 細胞懸浮培養。</li>\n<li>生長素：細胞分裂素 高 → 根；低 → 芽；1：1 → 癒傷組織。</li>\n<li>胚培養目的：克服發芽問題、打破休眠、縮短育種年限；「克服自花不親合」不是（108 農經）。</li>\n<li>名詞：培植體 explant（取下來培養的組織區塊）；全能性 totipotency（單一細胞具發育成完整個體的能力）；逆分化 dedifferentiation（已分化細胞回到分生狀態、形成癒傷組織）。</li>\n<li>苗木健化 hardening：移植前逐漸增強光照、減少澆水、降低溫度，提高移植存活率。</li>\n</ul>\n<h3>育種法</h3>\n<table>\n<thead>\n<tr>\n<th>方法</th>\n<th>重點</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>回交育種法</td>\n<td>改進優良品種缺少的一、二種性狀；使雜交後代恢復親本優良性狀</td>\n</tr>\n<tr>\n<td>純系選種</td>\n<td>程序：單株選拔 → 後代試驗 → 選拔純系；純系說（Johannsen）：純系內變異為環境變異，選拔無效</td>\n</tr>\n<tr>\n<td>營養系選種（芽條變異）</td>\n<td>枝條體細胞突變後以無性繁殖固定：新大王蘋果、早生溫州蜜柑、湯姆生葡萄柚（星露佩不是）</td>\n</tr>\n<tr>\n<td>單粒後裔 vs 混合選種</td>\n<td>單粒後裔：各代每株只取一粒，快速純化；混合：選拔優良個體混合採種</td>\n</tr>\n<tr>\n<td>輪迴選種</td>\n<td>增加優良基因頻度與重組機會；<span class=\"ng\">✗</span>「單株同質性高」是錯的；<mark class=\"ok\">✔ 正確：輪迴選種保留族群遺傳變異，個體間異質性高；同質性高是純系選種的特點 </mark></td>\n</tr>\n<tr>\n<td>F1 雜交種</td>\n<td>雜種優勢 heterosis；利用自交不親和或細胞質雄不稔生產種子</td>\n</tr>\n</tbody>\n</table>\n<p>無子西瓜：二倍體幼苗以秋水仙素處理成四倍體（母本）× 二倍體（父本）→ 三倍體種子；種植時需混植二倍體提供花粉刺激。臺灣第一個商業化品種：鳳山 1 號。</p>\n<h3>授粉行為</h3>\n<ul>\n<li>自花授粉：萵苣、豌豆、番茄；茄子自花授粉但有 5–10% 雜交率。自交作物天然雜交率不超過 4%。</li>\n<li>異交：蕎麥、甘藍、花椰菜、蘿蔔。雌雄異株：菠菜、蘆筍、大麻、獼猴桃。</li>\n<li>多胚性：芒果、柑橘（一粒種子可長出多株）。</li>\n<li>茶雌雄蕊成熟期不一致，有自交不孕現象。</li>\n</ul>\n<h3>生物技術（農經卷必考）</h3>\n<ul>\n<li>基因槍（粒子槍）：DNA 包在金或鎢微粒上，高速射入細胞。</li>\n<li>農桿菌：革蘭氏陰性菌；以 Ti 質體攜帶外源基因；主要感染雙子葉植物。</li>\n<li>PCR 溫度循環：95 ℃ 變性 → 50 ℃ 引子接合 → 74 ℃ 延伸。</li>\n<li>起始密碼子 AUG，決定甲硫胺酸。核苷酸 = 磷酸 + 五碳糖 + 含氮鹽基。</li>\n<li>基因重組順序：選取目標基因 → 切割目標基因 → 選取載體 → 載入載體 → 重組體檢驗（藍白篩、營養缺陷株篩選）。</li>\n<li>單株抗體：融合瘤技術，骨髓瘤細胞 + B 淋巴球。</li>\n<li>臺灣第一個基轉作物：木瓜；全球三大基轉作物：大豆、玉米、棉花。基改食品含基改成分 5% 以上須標示（104）。</li>\n<li>依種苗法第一個實施品種公告及保護的植物：聖誕紅。</li>\n</ul>\n<p>95–99 年補充：</p>\n<ul>\n<li>多胚性種子的胚多為「無性」珠心胚（<span class=\"ng\">✗</span>「多為有性胚」是錯的）<mark class=\"ok\">✔ 正確：多為無性珠心胚，通常只有一個是有性的合子胚。</mark></li>\n<li>純系說：丹麥江漢生（Johannsen）1903 年以菜豆研究自交作物，發現「純系選拔無效」。</li>\n<li>番茄自然雜交率約 2–4%（98）。</li>\n<li>柑橘砧木最耐寒：枳殼。不適合葉插：彩葉芋（非洲菫、椒草、長壽花可葉插）。</li>\n<li>番石榴無性繁殖：95 民雄答「壓條法」、105 教甄答「靠接」，作答以題目選項為準。</li>\n<li>無子西瓜是三倍體，不是單為結果；文旦柚、香蕉、鳳梨的無子果實則是單為結果。</li>\n<li>甘藷苗：莖粗、節間短、節數多者佳；<span class=\"ng\">✗</span>「中段苗最佳」是錯的，<mark class=\"ok\">✔ 正確：尖端苗（頂段苗）最佳</mark>；乾旱地區可先萎凋處理。</li>\n<li>我國基因轉殖食品由衛生主管機關把關（99 年為衛生署，現為衛福部）。</li>\n</ul>"}, {"id": "c7", "title": "七、蔬菜學常考點", "short": "七、蔬菜學常考點", "html": "<h3>食用部位分類</h3>\n<table>\n<thead>\n<tr>\n<th>類別</th>\n<th>考過的例子</th>\n<th>易錯</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>根菜類</td>\n<td>甘藷、蘿蔔、胡蘿蔔、牛蒡</td>\n<td>甘藷不是莖菜</td>\n</tr>\n<tr>\n<td>莖菜類</td>\n<td>蓮藕（根莖）、茭白（嫩莖）、竹筍（嫩莖）、百合（鱗莖）、芋（球莖）</td>\n<td>朝鮮薊是花菜，不是莖菜</td>\n</tr>\n<tr>\n<td>葉菜類</td>\n<td>芫荽、菠菜、甘藍</td>\n<td></td>\n</tr>\n<tr>\n<td>果菜類</td>\n<td>黃秋葵（蒴果）、番茄（胎座）、西瓜（胎座）</td>\n<td>蓮藕不是果菜</td>\n</tr>\n</tbody>\n</table>\n<h3>溫度與日長</h3>\n<ul>\n<li>暖季蔬菜夜溫需 18 ℃ 以上。冷涼栽培：豌豆、蠶豆（發芽適溫也較低）；茄果類中最不適冷涼的是茄子。</li>\n<li>馬鈴薯：塊莖 18–20 ℃ 開始形成；短日、低溫、低氮有利結薯；<span class=\"ng\">✗</span>「30 ℃ 生長最旺」是錯的（<mark class=\"ok\">✔ 正確：馬鈴薯喜冷涼，生長適溫約 15–20 ℃，高溫不利結薯</mark>）；前作以水稻最佳；儲藏前用萘乙酸甲酯抑芽；瘡痂病好發鹼性土壤。</li>\n<li>番茄：開花不受日長影響；著果適溫 18–24 ℃；15–18 ℃ 有助茄紅素形成；加工番茄多為停心型、單行畦。</li>\n<li>西瓜果實膨大以 30 ℃ 為佳；芋球莖 25–30 ℃ 發育良好；蒜鱗莖遇高溫停止生長（112 答案）。</li>\n<li>幼苗期要求的溫度較發芽期低（114）。</li>\n</ul>\n<h3>瓜類花性（每年考）</h3>\n<ul>\n<li>高溫長日 → 雄花多；低溫短日 → 雌花多。</li>\n<li>乙烯（Ethrel）→ 雌花；GA、硝酸銀 → 雄花。</li>\n<li>絲瓜雌雄異花同株、花有蜜腺；夏季播種雄花易形成；稜角絲瓜在下午開花。</li>\n<li>甜瓜採孫蔓留果整枝。洋香瓜（cantaloupe，網紋甜瓜）立式網架多採單蔓整枝：主蔓 11–15 節側蔓留果，其餘側蔓摘除，25 節左右摘心；雙蔓整枝則留兩條子蔓各自留果。</li>\n</ul>\n<h3>軟化栽培 blanching culture</h3>\n<p>以遮光使莖葉葉綠素消失、組織柔軟、纖維減少。需要軟化：芹菜（海南青必須軟化）、韭黃、吉康菜、金針菜；山葵不需要。韭黃遮光一次後要隔 2 個月才能再處理。</p>\n<h3>品種與商品名</h3>\n<table>\n<thead>\n<tr>\n<th>作物</th>\n<th>考過的品種重點</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>蘿蔔</td>\n<td>裂葉品種：梅花矸、梅花群、矸仔群（關白大根不是）；醃黃蘿蔔用美濃早生</td>\n</tr>\n<tr>\n<td>嫩莖萵苣</td>\n<td>陛下、掛絲紅、帥透（皇后不是）</td>\n</tr>\n<tr>\n<td>青蒜（軟骨種）</td>\n<td>學甲花蒜、北蒜、宜蘭白蒜；西螺白蒜不是</td>\n</tr>\n<tr>\n<td>甜豌豆</td>\n<td>台中 13 號</td>\n</tr>\n<tr>\n<td>南瓜</td>\n<td>美國夏南瓜 summer squash 為矮性早生種，臺灣只能冬季種</td>\n</tr>\n<tr>\n<td>芋</td>\n<td>檳榔心芋為母芋型品種</td>\n</tr>\n<tr>\n<td>西瓜</td>\n<td>鳳山 1 號為臺灣第一個商業化無子西瓜</td>\n</tr>\n<tr>\n<td>竹筍</td>\n<td>冬筍來自孟宗竹；散生竹（單軸）：孟宗竹、桂竹、箭竹；叢生竹（合軸）：麻竹、綠竹、烏腳綠竹</td>\n</tr>\n<tr>\n<td>蓮</td>\n<td>菜蓮屬食用蓮藕品種</td>\n</tr>\n<tr>\n<td>蔥蒜類</td>\n<td>洋蔥多用種子繁殖</td>\n</tr>\n</tbody>\n</table>\n<h3>特殊成分與生理障礙</h3>\n<ul>\n<li>茭白：菰黑穗菌寄生，產生生長素使莖膨大；菌絲體形成孢子堆時已過採收適期（變成黑心）。</li>\n<li>牛蒡含菊糖，適合糖尿病患；苦瓜含苦瓜素；茄子果肉褐化是酚化物氧化；芋使皮膚癢是草酸鈣針晶。</li>\n<li>嫩莖萵苣缺硼 → 食用莖襞裂；結球白菜葉噴氯化鈣減少心腐病。</li>\n<li>糯玉米胚乳全為支鏈澱粉。</li>\n</ul>\n<h3>菇類</h3>\n<ul>\n<li>構造：繁殖器官為子實體，營養器官為菌絲體。洋菇構造：菌蓋、菌褶、菌環、菌柄、菌絲（112 繪圖題）。</li>\n<li>洋菇（蘑菇）出菇與菇體生長都不需要光（106、107 兩度考）。</li>\n<li>金針菇：控制光線可使菌柄不生絨毛；室內 CO2 不可高於 5%（112 答案）。</li>\n</ul>\n<h3>其他</h3>\n<ul>\n<li>加工蔬菜：特定加工品種、契約生產、品質要求不如鮮銷；<span class=\"ng\">✗</span>「設施集約栽培」是錯的；<mark class=\"ok\">✔ 正確：加工蔬菜多為露地大面積、機械化栽培，以降低成本。</mark></li>\n<li>忌連作：番茄、茄子（茄科）。</li>\n<li>種子壽命極短：洋蔥。</li>\n<li>農藥殘留：生化法（乙醯膽鹼酯酶抑制率）快速篩檢，陽性再以化學法（GC、LC）定量確認。</li>\n<li>蔬菜貯藏方法：低溫冷藏、預冷、CA／MA 氣調、地窖或埋藏、乾燥、輻射抑芽。</li>\n</ul>\n<p>95–99 年補充：</p>\n<ul>\n<li>莖菜類細分：大蒜 鱗莖類、荸薺 球莖類、淮山 塊莖類、石刁柏 嫩莖類；菊芋也屬塊莖類。</li>\n<li>超甜玉米含糖量約 10–12%。草菇菌絲好寄生新鮮纖維。</li>\n<li>豌豆產量關鍵供水期：開花與結果期。</li>\n<li>蘆筍雌雄異株；30–35 ℃ 易纖維化。</li>\n<li>黃秋葵英名 Okra、食用嫩果；學名為 Abelmoschus esculentus，95 民雄題目寫成 Hibiscus 屬而答「×」。</li>\n<li>自然發酵泡菜的酸味來自乳酸菌產生的乳酸。</li>\n</ul>"}, {"id": "c8", "title": "八、果樹學常考點", "short": "八、果樹學常考點", "html": "<h3>品種與商品名（最愛考）</h3>\n<table>\n<thead>\n<tr>\n<th>果樹</th>\n<th>考過的重點</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>鳳梨</td>\n<td>台農 4 號＝釋迦鳳梨、6 號＝蘋果鳳梨、11 號＝香水鳳梨、17 號＝金鑽鳳梨、20 號＝牛奶鳳梨；<span class=\"ng\">✗</span>「香水鳳梨果皮 1/2–2/3 變黃才採」是錯的；<mark class=\"ok\">✔ 正確：香水鳳梨（台農 11 號）須等果皮全部變黃才是採收適期（1/2 變黃是台農 4 號釋迦鳳梨的標準；開英種春果 1/2、夏果 1/3、冬果 2/3 變黃） </mark></td>\n</tr>\n<tr>\n<td>鳳梨芽體</td>\n<td>冠芽（果實頂端）、裔芽（果實基部與果梗間，常作扦插繁殖體）、吸芽（葉腋）</td>\n</tr>\n<tr>\n<td>荔枝</td>\n<td>糯米滋：晚熟、肉厚核小、有特殊香味（105、107 兩度考）；其他：玉荷包、黑葉、桂味、三月紅</td>\n</tr>\n<tr>\n<td>枇杷</td>\n<td>茂木：葉果較小、長倒卵形、較早熟；田中：較大、圓倒卵形、含酸量較多；太平枇杷節主要是茂木；品種還有戶越、照種</td>\n</tr>\n<tr>\n<td>香蕉</td>\n<td>台蕉一號由北蕉組培苗變異個體選出</td>\n</tr>\n<tr>\n<td>梨</td>\n<td>長十郎：砂梨系生食風味最佳的褐皮梨；橫山梨砧木用鳥梨；需水量 砂梨 &gt; 西洋梨 &gt; 秋子梨</td>\n</tr>\n<tr>\n<td>梅</td>\n<td>胭脂梅：果皮帶紅暈、葉柄帶紅，優良經濟品種；野生小梅作根砧</td>\n</tr>\n<tr>\n<td>芒果</td>\n<td>成熟期最晚：凱特</td>\n</tr>\n<tr>\n<td>柿</td>\n<td>澀柿：牛心柿、紅柿；甜柿：次郎、富有</td>\n</tr>\n<tr>\n<td>百香果</td>\n<td>黃色種需人工授粉；台農一號＝紫色種 × 黃色種；紫色種耐寒</td>\n</tr>\n<tr>\n<td>葡萄</td>\n<td>巨峰屬歐美雜交系，由國外引進；世界栽培果樹產量以葡萄居冠</td>\n</tr>\n<tr>\n<td>蓮霧</td>\n<td>原產馬來半島，又稱爪哇蒲桃</td>\n</tr>\n</tbody>\n</table>\n<h3>結果習性與整枝</h3>\n<ul>\n<li>柑橘：二年生枝頂端或近頂端（106）。番石榴：當年生新梢、老熟枝萌發新梢的 2–4 節（104）。能誘發二次結果枝的果樹，結果在一年生（當年生）枝上。</li>\n<li>整枝：梨在多風地區用水平棚架；柑橘用圓頭形；桃用杯狀形；葡萄水平棚架有一字型、工字型、王字型。</li>\n<li>坡地果園沿等高線栽植，多用於 15 度以下坡地。</li>\n<li>衰老期最慢：柿（114）。自然著果率最低：龍眼。</li>\n</ul>\n<h3>著果、留果與疏果</h3>\n<ul>\n<li>葉果比：桃、蘋果 50：1（107 答案）。</li>\n<li>疏果：落花後第 2 週開始；留側向果；留果枝中段，不留末段；依葉片多寡決定留果數。</li>\n<li>李第二期落果：花朵雌蕊與胚珠正常，只是未受精。</li>\n<li>獼猴桃雌雄異株，雌：雄 = 8：1；果實生長曲線考過「三 S 型」（107 答案）。</li>\n<li>環狀剝皮：促花芽分化、促果實生長、養分流向果實；不會促進枝條生長。</li>\n<li>芒果開花不結實，靠飼養金蠅授粉解決（108 農經）。</li>\n</ul>\n<h3>產期調節</h3>\n<table>\n<thead>\n<tr>\n<th>果樹</th>\n<th>方法</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>蓮霧</td>\n<td>春節前後採收，需在 10 月 10 日前後催花；方法：90% 遮陰網全面覆蓋、浸水、斷根、環狀剝皮、修剪、施用催花劑</td>\n</tr>\n<tr>\n<td>鳳梨</td>\n<td>乙烯（電石）催花</td>\n</tr>\n<tr>\n<td>印度棗</td>\n<td>光照（電照）處理</td>\n</tr>\n<tr>\n<td>番荔枝</td>\n<td>修剪</td>\n</tr>\n<tr>\n<td>香蕉</td>\n<td>宿根栽培 10–11 月留萌，隔年 3–4 月把萌芽近地面切掉，使地下塊莖芽眼長出新苗</td>\n</tr>\n</tbody>\n</table>\n<h3>各果樹管理細節</h3>\n<ul>\n<li>香蕉：花軸基部雌花、頂端雄花、中段中性花；偽莖由葉鞘包圍形成；黃葉病（真菌）與萎縮病靠種苗傳播，民國 72 年起推廣組培健康種苗；<span class=\"ng\">✗</span>「每株留 4–6 果把」是錯的（<mark class=\"ok\">✔ 正確：一般每串留約 8–10 把，疏除末端小果把</mark>）；果指肥大時割除末端雄花。</li>\n<li>番木瓜：果肉由子房壁發育；忌連作，廢耕後隔 3 年才可再種。</li>\n<li>蓮霧：好溫暖、耐濕、喜微鹼性壤土；<span class=\"ng\">✗</span>「留向上、大枝幹的花穗」是錯的；<mark class=\"ok\">✔ 正確：留向下或側生、著生在較細結果枝上的花穗，果形較好。</mark></li>\n<li>桃：好光、砂礫地較佳；鶯歌桃、八月桃適合低海拔；結果枝「中段」果實發育較好，疏除頂端與基部果。</li>\n<li>柑橘：油胞飽滿時易受傷，太陽出來後再採；套袋預防綠黴病。</li>\n<li>柿脫澀：可溶性單寧變成不溶性時澀味消失；方法有 10% 酒精密閉 4–5 天、4% 石灰水浸 4–7 天、益收（乙烯）處理；牛心柿常浸石灰水成脆柿。</li>\n<li>梨赤星病的中間寄主是龍柏。</li>\n<li>高緯度果園鋪反光布：使果實著色較好。</li>\n<li>可可椰子原產熱帶亞洲，臺灣多栽培矮幹早生種。</li>\n</ul>\n<h3>技師考申論方向（107 果樹學）</h3>\n<ul>\n<li>留果量原則與指標（葉果比、枝果比），增加著果：授粉樹、放蜂、人工授粉、環剝、生長調節劑。</li>\n<li>果實日燒：高溫強光使果皮組織壞死；預防：套袋、留葉遮果、草生栽培、噴白色保護劑、灌溉。</li>\n<li>草莓預冷：強制通風（壓差）預冷，冷空氣強制穿過包裝內果實。</li>\n<li>柑橘健康種苗制度：莖頂微體嫁接取得無病母樹 → 原原種 → 原種 → 採穗圃 → 網室育苗 → 檢定合格出售，防黃龍病與病毒。</li>\n<li>名詞：Sod culture 草生栽培；Leaf Area Index 葉面積指數（葉面積 ÷ 土地面積）；Hesperidium 柑果；Integrated Fruit Production 果樹綜合生產管理。</li>\n</ul>\n<p>95–99 年補充：</p>\n<ul>\n<li>鳳梨：吸芽著生在葉腋，為第二回結實不可缺；冠芽最易受心腐病。</li>\n<li>華盛頓臍橙屬甜橙類。非更年型果樹：柳橙。</li>\n<li>臺灣平地能產溫帶梨、水蜜桃、葡萄的原因：高接低溫處理花芽、強迫落葉與催芽、低需冷性品種；「電照或遮光」不是。</li>\n<li>可可椰子害蟲紅胸葉蟲的天敵：釉小蜂。</li>\n<li>獼猴桃果實生長曲線為三 S 型（95 民雄與 107 教甄一致）。</li>\n<li>柿用 4% 石灰水脫澀：單寧由水溶性變不溶性。</li>\n<li>番木瓜台農雜交五號不是「日陞 × 哥斯大黎加」（題目答×）。</li>\n</ul>"}, {"id": "c9", "title": "九、花卉學常考點", "short": "九、花卉學常考點", "html": "<h3>切花採收適期（幾乎每年考）</h3>\n<table>\n<thead>\n<tr>\n<th>切花</th>\n<th>採收適期</th>\n<th>採後要點</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>玫瑰</td>\n<td>花萼反捲（水平反捲）時</td>\n<td><span class=\"ng\">✗</span>「花瓣反捲」是錯的；<mark class=\"ok\">✔ 正確：花萼反捲時採收 </mark></td>\n</tr>\n<tr>\n<td>百合</td>\n<td>花序最底部第一朵花適當著色</td>\n<td>清晨或傍晚採；室溫保鮮劑預措 4 小時；<span class=\"ng\">✗</span>「預冷 10–12 ℃」是錯的；<mark class=\"ok\">✔ 正確：預冷與貯藏約 1–3 ℃ 低溫 </mark></td>\n</tr>\n<tr>\n<td>火鶴花</td>\n<td>依花梗硬度與肉穗花序變色，3/4 變色</td>\n<td>切下即泡水；不可低於 12.8 ℃（寒害）；「藍化」來自乙烯、過晚採收或溫度太高</td>\n</tr>\n<tr>\n<td>晚香玉</td>\n<td>花序基部小花由綠轉白、尚未開</td>\n<td></td>\n</tr>\n<tr>\n<td>唐菖蒲</td>\n<td>最下位花著色</td>\n<td><span class=\"ng\">✗</span>「花穗上端小花著色」是錯的；<mark class=\"ok\">✔ 正確：最下位 1–2 朵小花著色時採收 </mark></td>\n</tr>\n<tr>\n<td>洋桔梗</td>\n<td>2–4 朵花開</td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<h3>花卉分類與產地</h3>\n<ul>\n<li>實用分類：一二年生草花、宿根草花（香石竹）、球根花卉、木本花卉、蘭科、觀葉、多肉、水生、食蟲植物。</li>\n<li>秋播草花：葉牡丹；夏季草花：松葉牡丹、百日草、雞冠花。</li>\n<li>水生植物：滿江紅為漂浮植物，莕菜為浮葉植物。</li>\n<li>世界花卉三大生產先進國：荷蘭、日本、美國。洋桔梗育種中心在日本；1–3 月外銷日本價格最高。屏東為洋桔梗、雞冠花冬季切花產地。</li>\n<li>臺灣花卉內銷分級：二碼標示法，第一碼依品質、第二碼依花莖長度。</li>\n<li>臺灣原生：金花石蒜、一葉蘭、白花蝴蝶蘭、獼猴桃、鵝掌藤；唐菖蒲、鐵炮百合（114 答案）不是。本土較具競爭力球根：金花石蒜、紅花石蒜、晚香玉（香水百合不是）。</li>\n</ul>\n<h3>球根花卉</h3>\n<ul>\n<li>花芽分化：孤挺花每形成一定葉片數就形成花芽；百子蓮開花前一年就形成花芽。</li>\n<li>營養繁殖困難、靠種子：大岩桐、球根海棠。</li>\n<li>唐菖蒲：球莖以木子（Cormel）繁殖；球莖大者花穗好；根再生力弱、不耐移植。</li>\n<li>百合：亞洲型雜交百合是切花最大宗（104、112 兩度考）。夜來香花期主要在夏季。</li>\n<li>Scooping（挖底法）：風信子等鱗莖挖去基盤，促使傷口長出子球。</li>\n</ul>\n<h3>蘭花</h3>\n<ul>\n<li>蝴蝶蘭：營養生長適溫約 28–30 ℃；花芽分化需低溫（日／夜約 25／20 ℃）；要在 10–12 月提早開花，夏季上山或移入冷房降溫催花。</li>\n<li>上盆：淺植、根均勻展開、新芽朝盆中央（<span class=\"ng\">✗</span>「植株放中央、新芽在外側」是錯的；<mark class=\"ok\">✔ 正確：老芽靠盆邊、新芽朝盆中央，留出生長空間</mark>）、換盆後 3–5 天再澆水。</li>\n<li>檢定蘭花病毒的指示植物：千日紅。</li>\n<li>介質：樹皮 bark 排水通氣佳，適用蘭花。</li>\n</ul>\n<h3>生理異常</h3>\n<table>\n<thead>\n<tr>\n<th>現象</th>\n<th>作物</th>\n<th>原因</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>柳芽</td>\n<td>菊花</td>\n<td>高溫使花芽逆轉成畸形葉芽</td>\n</tr>\n<tr>\n<td>簇生化（蓮座化）</td>\n<td>宿根滿天星</td>\n<td>冬季低溫、短日、弱光</td>\n</tr>\n<tr>\n<td>裂萼</td>\n<td>香石竹</td>\n<td>日夜溫差大</td>\n</tr>\n<tr>\n<td>簇葉狀生長</td>\n<td>宿根花卉</td>\n<td>不利環境下節間縮短</td>\n</tr>\n<tr>\n<td>藍化</td>\n<td>火鶴花</td>\n<td>乙烯、過晚採收、高溫</td>\n</tr>\n</tbody>\n</table>\n<h3>栽培管理</h3>\n<ul>\n<li>摘心目的：打破頂芽優勢（Apical dominance）、增加分枝與花數、矮化株型、調節花期；「養分集中於頂花芽」是摘蕊（Disbudding）的目的。</li>\n<li>香石竹：一次半摘心可分散產期；以摘心（Pinch）提高商品價值；Sim 系統最易發生突變。</li>\n<li>玫瑰：中國月季引入雜交後才有四季開花品種；大花品系每個枝條頂芽皆可開花，屬開花自發性植物。</li>\n<li>木本花卉修剪在花謝後及休眠期；溫帶花木（櫻花）花芽分化在 7–9 月。</li>\n<li>仙客來用 GA 促開花；白鶴芋開花用高磷肥。</li>\n<li>花卉病毒病症：嵌紋、黃化、畸形、矮化、花色斑駁；防治：無毒種苗（莖頂培養）、防媒介昆蟲、工具消毒、拔除病株。</li>\n</ul>\n<h3>栽培介質</h3>\n<table>\n<thead>\n<tr>\n<th>介質</th>\n<th>重點</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>蛭石 Vermiculite、珍珠石 Perlite</td>\n<td>無機，高溫製成，不帶病原、蟲體與雜草種子</td>\n</tr>\n<tr>\n<td>發泡煉石</td>\n<td>煉鋼廢棄物</td>\n</tr>\n<tr>\n<td>人造土</td>\n<td>紡織廠廢棄物，機械製成直徑約 0.3 cm 毛球</td>\n</tr>\n<tr>\n<td>蛇木</td>\n<td>筆筒樹的氣根</td>\n</tr>\n<tr>\n<td>泥炭苔、水苔、稻殼</td>\n<td>有機介質</td>\n</tr>\n<tr>\n<td>菇類木屑廢棄物</td>\n<td>需堆積 3 個月以上才可使用；<span class=\"ng\">✗</span> 臺灣「多用荔枝樹皮」是錯的；<mark class=\"ok\">✔ 正確：臺灣太空包木屑多用相思樹木屑（請對照課本） </mark></td>\n</tr>\n</tbody>\n</table>\n<p>95–99 年補充：</p>\n<ul>\n<li>晚香玉主要種植期 3–5 月。香豌豆為種子春化型（98、107 兩度考）。</li>\n<li>草坪：暖地型草種有狗牙根、百喜草、假儉草；黑麥草是冷季型。</li>\n<li>水生植物：傘草為挺水植物。海邊地被：馬鞍藤。</li>\n<li>花廊攀緣植物：使君子、紫藤、九重葛；鵝掌藤無法攀附。</li>\n</ul>"}, {"id": "c10", "title": "十、病蟲害", "short": "十、病蟲害", "html": "<h3>病原分類（填充題常客）</h3>\n<table>\n<thead>\n<tr>\n<th>病原</th>\n<th>考過的病害</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>真菌</td>\n<td>十字花科露菌病、白粉病（乾燥易發）、炭疽病、立枯病、疫病、馬鈴薯晚疫病、水稻稻熱病、香蕉黃葉病、西瓜蔓割病、柑橘綠黴病、褐根病</td>\n</tr>\n<tr>\n<td>細菌</td>\n<td>茄科青枯病、蔬菜軟腐病、芋頭軟腐病、十字花科黑腐病、柑橘潰瘍病</td>\n</tr>\n<tr>\n<td>病毒</td>\n<td>木瓜輪點病、各種毒素病</td>\n</tr>\n<tr>\n<td>菌質體</td>\n<td>水稻黃萎病、甘薯簇葉病（常由浮塵子傳播）</td>\n</tr>\n<tr>\n<td>蛋白質（普利昂）</td>\n<td>狂牛病</td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li>青枯病萎凋：細菌堵塞導管，水分無法上運。軟腐病：細菌分泌果膠分解酶，細胞壁崩解而軟腐。</li>\n<li>病徵三大類：壞疽（斑點、立枯、潰瘍、腐爛）、減生（矮化、黃化、嵌紋）、增生（腫瘤、簇生）。「嵌紋」不屬壞疽。</li>\n<li>梨赤星病中間寄主：龍柏。</li>\n<li>褐根病（103）：根部表面有褐色菌絲面、木質部有褐色網紋，樹勢衰弱、葉黃萎凋至整株死亡；對校園的威脅是根部腐爛易倒伏；防治：移除病株與病根、土壤燻蒸消毒、挖隔離溝、避免傷根。</li>\n</ul>\n<h3>昆蟲的目與口器</h3>\n<table>\n<thead>\n<tr>\n<th>昆蟲</th>\n<th>目</th>\n<th>口器</th>\n<th>備註</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>蚜蟲</td>\n<td>同翅目</td>\n<td>刺吸式</td>\n<td>汁液流出動力來自植物韌皮部壓力</td>\n</tr>\n<tr>\n<td>茶小綠葉蟬</td>\n<td>同翅目</td>\n<td>刺吸式</td>\n<td>危害後做成東方美人茶</td>\n</tr>\n<tr>\n<td>薊馬（小黃薊馬）</td>\n<td>纓翅目</td>\n<td>銼吸式</td>\n<td>南黃薊馬不受黃色黏板誘引</td>\n</tr>\n<tr>\n<td>荔枝椿象</td>\n<td>半翅目</td>\n<td>刺吸式</td>\n<td>漸進變態、一年一代；不是完全變態</td>\n</tr>\n<tr>\n<td>黃條葉蚤</td>\n<td>鞘翅目</td>\n<td>咀嚼式</td>\n<td></td>\n</tr>\n<tr>\n<td>小菜蛾（成蟲）</td>\n<td>鱗翅目</td>\n<td>曲管式（虹吸式）</td>\n<td>甜菜夜蛾亦為鱗翅目</td>\n</tr>\n<tr>\n<td>蜜蜂</td>\n<td>膜翅目</td>\n<td>咀吸式</td>\n<td></td>\n</tr>\n<tr>\n<td>螳螂</td>\n<td>直翅目</td>\n<td>咀嚼式</td>\n<td></td>\n</tr>\n<tr>\n<td>白蟻</td>\n<td>等翅目</td>\n<td>咀嚼式</td>\n<td></td>\n</tr>\n<tr>\n<td>天牛</td>\n<td>鞘翅目</td>\n<td>咀嚼式</td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li>變態類型：完全變態（卵→幼蟲→蛹→成蟲）；過變態（幼蟲→擬蛹→蛹）；漸進變態（卵→若蟲→成蟲）；半變態（卵→稚蟲→成蟲，稚蟲水生）。</li>\n<li>蟎類：柑橘銹蜱 → 象皮病（火燒柑）；荔枝腫葉病也是銹蜱，不是椿象。</li>\n<li>媒介昆蟲：柑橘黃龍病 → 木蝨；菌質體 → 浮塵子。</li>\n<li>其他：銀葉粉蝨秋冬、暖冬好發，易傳毒素病；潛葉蠅食痕彎曲白色，農民稱「畫圖蟲」。外來害蟲：龍眼雞、香蕉弄蝶、松材線蟲（紅姬緣椿象不是）。</li>\n</ul>\n<h3>生物與物理防治</h3>\n<table>\n<thead>\n<tr>\n<th>方法</th>\n<th>重點</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>蘇力菌 Bt</td>\n<td>革蘭氏陽性細菌（不是真菌）；內孢子產生毒蛋白，屬胃毒劑；防治小菜蛾、玉米螟等鱗翅目；強光下效能會降低</td>\n</tr>\n<tr>\n<td>白殭菌</td>\n<td>甜菜夜蛾</td>\n</tr>\n<tr>\n<td>黑殭菌（綠殭菌）</td>\n<td>褐飛蝨、甜菜夜蛾、小菜蛾、紅胸葉蟲</td>\n</tr>\n<tr>\n<td>桿狀病毒</td>\n<td>雙股 DNA，感染鱗翅目</td>\n</tr>\n<tr>\n<td>平腹小蜂</td>\n<td>寄生荔枝椿象的卵</td>\n</tr>\n<tr>\n<td>黃色黏板</td>\n<td>誘粉蝨、有翅蚜蟲、潛蠅</td>\n</tr>\n</tbody>\n</table>\n<p>荔枝椿象（108 農經問答）：成蟲與若蟲刺吸嫩梢、花穗、幼果，造成落花落果；主要寄主荔枝、龍眼，也會危害無患子科樹木；防治：冬季捕捉成蟲、摘除卵塊、釋放平腹小蜂、依推薦藥劑防治。</p>\n<h3>殺草劑與雜草</h3>\n<ul>\n<li><span class=\"ng\">✗</span>「巴拉刈是系統性」（106 錯誤選項）；<mark class=\"ok\">✔ 正確：巴拉刈是接觸型（臺灣 2020 年起已禁用）</mark>；年年春為系統性；拉草、草脫淨、理有龍為土壤處理型，土壤須潮濕。</li>\n<li>禾本科雜草：孟仁草、蒺藜草、看麥娘；香附子、螢藺為莎草科；鴨舌草為水田雜草；藿香薊為菊科。</li>\n</ul>\n<p>95–99 年補充：</p>\n<ul>\n<li>蔬菜軟腐病、黑腐病、青枯病都是細菌（98）。水稻稻熱病是真菌（95 臺中）。</li>\n<li>利用天敵的防治稱生物防治；甲基丁香油與性費洛蒙是誘殺。</li>\n<li>99 員林問答：自然農藥（苦楝油、辣椒大蒜萃取液、菸草水、肥皂水、種子油等，具忌避、觸殺、抑菌作用）；有機病害管理四原則（防止病原侵入、減少病原數量、提高植株抗性、改善環境不利發病）。</li>\n<li>口蹄疫感染偶蹄類（豬、牛、羊），馬不易感染。</li>\n</ul>"}, {"id": "c11", "title": "十一、採收後處理與加工", "short": "十一、採收後處理與加工", "html": "<h3>採後生理與貯藏</h3>\n<ul>\n<li>更年型果實 climacteric fruits：後熟時呼吸與乙烯產生驟增（香蕉、番茄、芒果、蘋果），完熟期糖份增加快。非更年型：柑橘、葡萄、草莓。</li>\n<li>果肉軟化主因是果膠：未熟果含大量原果膠，成熟時轉為可溶性果膠。</li>\n<li>櫻桃幾乎不含澱粉。馬鈴薯「低溫」儲藏才會澱粉轉糖，影響加工（<span class=\"ng\">✗</span>「高溫轉糖」是錯的；<mark class=\"ok\">✔ 正確：低溫（約 4 ℃ 以下）儲藏才會澱粉轉糖，加工用馬鈴薯宜 8–10 ℃ 儲藏</mark>）。</li>\n<li>預冷 precooling：採後儘速移除田間熱。方式有強制通風（壓差）、水冷、冰冷、真空預冷（vacuum cooling，降壓使水分蒸發帶走熱，適合葉菜類）。</li>\n<li>MA storage（氣調包裝）：用塑膠膜包裝，靠產品呼吸使袋內氧降低、CO2 上升，抑制呼吸延長貯存；CA 則是人為精確控制氣體。</li>\n<li>冷鏈 cold chain：從採收、預冷、冷藏、冷藏運輸到銷售端都維持低溫，不中斷。</li>\n<li>生理障礙：低氧、高 CO2 傷害（褐心）；缺鈣（蘋果苦痘病、番茄尾腐）；缺硼。</li>\n</ul>\n<h3>加工</h3>\n<ul>\n<li>愛玉凍：低甲氧基果膠（LMP），靠鈣離子凝膠，不需糖與酸。</li>\n<li>低酸性罐頭食品：內容物 pH &gt; 4.6。</li>\n<li>食品殺菌劑殺菌力以「酚係數」表示。防腐方法：低溫、乾燥、隔絕空氣、加熱殺菌、防腐劑。</li>\n<li>蔬果汁殺菌：低溫長時間巴斯德殺菌、高溫短時間（HTST）、超高溫瞬間（UHT）、無菌充填。</li>\n<li>蔬果冷凍流程：選別 → 清洗 → 切割 → 殺菁（鈍化酵素）→ 冷卻、灑水 → 急速冷凍（IQF）→ 包裝 → − 18 ℃ 冷凍儲藏。</li>\n<li>醋酸發酵：C2H5OH + O2 → CH3COOH + H2O。糖化作用：糊化澱粉加麥芽粉水解成麥芽糖。</li>\n</ul>\n<h3>茶葉（農經卷常考）</h3>\n<table>\n<thead>\n<tr>\n<th>分類</th>\n<th>例子</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>不發酵茶</td>\n<td>綠茶、龍井、眉茶、煎茶</td>\n</tr>\n<tr>\n<td>半發酵茶</td>\n<td>包種茶、烏龍茶、東方美人茶</td>\n</tr>\n<tr>\n<td>全發酵茶</td>\n<td>紅茶（臺茶 18 號「紅玉」最適合製紅茶）</td>\n</tr>\n</tbody>\n</table>\n<p>採茶原則：茶芽發育至一心四、五葉時，採一心二葉；初製茶稱毛茶，再加工稱精茶；「腳葉」指魚葉。茶園綠肥用羽扇豆（魯冰花），耐酸、耐旱、耐寒。</p>\n<p>95–99 年補充：</p>\n<ul>\n<li>預冷的意義是移除田間熱、降低呼吸；<span class=\"ng\">✗</span>「預防內外溫差引起病變」是錯的；<mark class=\"ok\">✔ 正確：移除田間熱，降低呼吸與蒸散，延長貯藏壽命。</mark></li>\n<li>精密氣調貯藏產生變味：低氧下行無氧呼吸。</li>\n<li>製茶：殺菁破壞酵素、制止單寧氧化；全發酵茶不殺菁；<span class=\"ng\">✗</span>「揉捻決定品質」是錯的；<mark class=\"ok\">✔ 正確：萎凋與發酵程度決定茶的香氣與滋味；揉捻主要是捲曲成形、使茶汁易溶出。</mark></li>\n<li>水稻果實為穎果，米粒由種皮、胚乳、胚組成；<span class=\"ng\">✗</span>「含約 10% 胚芽稱胚芽米」是錯的；<mark class=\"ok\">✔ 正確：胚芽米是碾去米糠層但保留大部分胚芽（約 80% 以上）的米。</mark></li>\n<li>發酵：利用生物分泌的酵素使有機物分解成簡單物質。造紙抄紙步驟：抄網 → 壓搾 → 乾燥 → 壓光。</li>\n<li>馬口鐵罐頭內壁變黑：食品中硫化物與鐵反應。饅頭表皮縐紋：用高筋麵粉。菸葉品質最佳：中葉。</li>\n</ul>"}, {"id": "c12", "title": "十二、造園學常考點", "short": "十二、造園學常考點", "html": "<h3>造園史</h3>\n<table>\n<thead>\n<tr>\n<th>風格</th>\n<th>考過的重點</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>中國</td>\n<td>「造園」一詞出自明朝計成《園冶》；疊石講求漏、透、瘦；「榭者藉也」，可以倚靠借助；「雜樹映朱欄」為對比手法</td>\n</tr>\n<tr>\n<td>日本</td>\n<td>虎渡子法（龍安寺石庭）：敷白砂為海、掃痕為波，15 石分 5、2、3、2、3 五組，不用一木；茶庭又稱露地（路地）庭；飛石直徑以 30–50 cm 為佳</td>\n</tr>\n<tr>\n<td>義大利</td>\n<td>台地式，利用斜坡基地（Villa Lante）</td>\n</tr>\n<tr>\n<td>英國</td>\n<td>自然風景式，草皮面積特大；不強調邊界、隱藏不調和設施；受中國影響，康白（Chambers）著《東方庭園論》</td>\n</tr>\n</tbody>\n</table>\n<p>造園設計的最高理想：真、善、美。「細部景觀設計」是以圖面表達設計概念、結構與材料、植物選擇。生態設計不強調「使用者設計風格」。</p>\n<h3>植栽配置</h3>\n<ul>\n<li>叢植：三株一叢排成不等邊三角形，不宜成直線或正三角；優型樹不宜叢植；<span class=\"ng\">✗</span> 單一樹種叢植「必須有主景」是錯的；<mark class=\"ok\">✔ 正確：單一樹種叢植不一定要主景，以大小、高低、疏密變化求自然。</mark></li>\n<li>三植法：主樹、副樹、配樹大小高低不一，配成不等邊三角形，求變化與均衡。</li>\n<li>綠籬兼具觀賞與區隔：高 120 cm、寬 60 cm。100 cm 以下矮灌木：作為群植樹叢間的聯繫。</li>\n<li>薄層綠化連同植栽高度 8–12 cm。天際線屬韻律漸層。</li>\n<li>移植：中部以早春未萌芽或梅雨季進行；斷根分次實施。</li>\n<li>移植適期（108 填選，參考答案）：熱帶樹種在高溫期、溫帶樹種在低溫期。棕櫚科 → D夏季；熱帶常綠針葉樹 → A；溫帶常綠針葉樹 → B；一般常綠闊葉樹 → C；熱帶常綠闊葉樹 → A。</li>\n<li>修剪：不傷及枝脈與領環，傷口才能形成癒合組織；殘樁過長、切口不平易腐爛難癒合。三段修剪法：先在枝下方鋸一刀、再在外側由上鋸斷、最後沿領環外側切除殘樁，防樹皮撕裂。補償修剪：移植時剪除部分枝葉，平衡根部減少後的吸水量。</li>\n</ul>\n<h3>製圖、測量、尺度</h3>\n<ul>\n<li>透視圖：地平線 G.L.、視平線 H.L.、視心 C.V.；平行線交會於消點，量測深度用距離點與測點。畫設計圖四條件：視點高度、目的物與視點距離、視心、比例尺。</li>\n<li>工程字依 CNS 採仿宋體；B0 圖紙為 A0 的 1.5 倍；鋼筋間距符號為 @；1：100 圖上 2.5 cm = 2.5 m。</li>\n<li>平板儀安置：定平、定心、定向（<span class=\"ng\">✗</span>「定平→定向→定點」是錯的；<mark class=\"ok\">✔ 正確：定平、定心（對中）、定向</mark>）；經緯儀測角度。整地前不必找基地中心點。</li>\n<li>階梯公式 2R + T = 63–67 cm（R 升面、T 踏面）；<span class=\"ng\">✗</span>「踏面最小 20 cm」是錯的；<mark class=\"ok\">✔ 正確：踏面一般至少約 28 cm（T 約 28–45 cm）。</mark>車道坡度 &lt; 9%、步道 &lt; 10%。</li>\n<li>黃金比 3：5 ≈ 5：8。</li>\n<li>景觀排水管：平行式、魚骨式、隨機式。</li>\n<li>材料：花崗岩、安山岩屬火成岩；二丁掛 60 × 227 mm；G.R.C. 是玻璃纖維強化水泥（不是玻璃纖維）。</li>\n</ul>\n<h3>技師考申論方向（107 造園學）</h3>\n<ul>\n<li>綠籬設計原則與三角、圓、矩形路徑方案的視覺心理效果。</li>\n<li>植物質地（粗、中、細）與視障者環境線索（觸感、氣味、聲音）。</li>\n<li>都市河川景觀改善原則與案例。</li>\n<li>療癒庭園：園藝治療 horticultural therapy 是以園藝活動促進身心健康；設計要點是無障礙、五感刺激、安全、可參與。</li>\n<li>103 問答：造園與景觀定義及關係；色彩運用原則並舉臺灣原生喬木四季色彩（如臺灣欒樹：夏綠葉、秋黃花、秋末紅褐蒴果、冬落葉）。</li>\n</ul>\n<p>95 民雄造園補充：</p>\n<ul>\n<li>《園冶》作者計成是明朝，不是宋朝。中國庭園：北方派規模大、建築雄偉，南方派建築精巧（題目反過來寫，答×）。</li>\n<li>「各物之安排各如其份、不故意做作」是「體」。以池為中心、四周配茶亭並以花路連絡是「迴遊式庭園」。</li>\n<li>三株叢植以不等邊三角形為佳；植穴深寬最好大於土球兩倍；普通磚規格 6 × 10 × 21 cm。</li>\n<li>立面圖是站在物體正面看到的外貌；間接距離測量為光學測法。</li>\n<li>補色調：兩色並放可強調對比。《東方庭園論》作者為威廉康白。</li>\n<li>階段：R 一般 10–15 cm；<span class=\"ng\">✗</span>「R 最長不超過 20 cm」為錯誤選項；<mark class=\"ok\">✔ 正確：庭園階段 R 一般 10–15 cm，最高約 18 cm（請對照課本）</mark>；T 約 28–45 cm；超過 2 m 設平台。</li>\n<li>生態設計 <span class=\"ng\">✗</span> 錯誤選項：「以喬木作為垂直或水平空間的披覆」；<mark class=\"ok\">✔ 正確：垂直與水平面的披覆用蔓藤與地被植物，喬木是遮蔭與空間骨架。</mark></li>\n</ul>"}, {"id": "c13", "title": "十三、計算題題型與解法", "short": "十三、計算題題型與解法", "html": "<p>考場不能用計算機，數字都設計成可心算。六種題型反覆出現：稀釋倍數、肥料成分、配肥、ppm、當量濃度、土壤重量。</p>\n<h3>1. 農藥稀釋倍數</h3>\n<p>公式：原藥量 = 稀釋後水量 ÷ 稀釋倍數。</p>\n<ul>\n<li>106 園藝：16 L × 20 桶 = 320 L；320,000 mL ÷ 1000 = 320 mL；一瓶 100 mL → 至少買 <strong>4 瓶</strong>。</li>\n<li>106 農經：16,000 mL ÷ 800 = <strong>20 mL（甲）</strong>；16,000 ÷ 1000 = <strong>16 mL（乙）</strong>。</li>\n<li>107 農經：每公頃原藥 1.2 L，0.5 公頃用 0.6 L；0.6 L × 1000 = <strong>600 L</strong> 藥液。</li>\n</ul>\n<h3>2. 肥料成分量</h3>\n<p>104：台肥 1 號（20-5-10）500 kg，K2O = 500 × 10% = <strong>50 kg</strong>。</p>\n<h3>3. 配制複合肥料（105 農經）</h3>\n<p>配 1 噸 8-5-5，用硫酸銨（N 21%）、過磷酸鈣（P2O5 18%）、鉀鹽（K2O 20%）：</p>\n<ol>\n<li>N：1000 × 8% = 80 kg → 80 ÷ 0.21 ≈ <strong>381 kg 硫酸銨</strong></li>\n<li>P2O5：1000 × 5% = 50 kg → 50 ÷ 0.18 ≈ <strong>278 kg 過磷酸鈣</strong></li>\n<li>K2O：50 kg → 50 ÷ 0.20 = <strong>250 kg 鉀鹽</strong></li>\n<li>填充物：1000 − 381 − 278 − 250 ≈ <strong>91 kg</strong></li>\n</ol>\n<h3>4. ppm 配製（106 農經）</h3>\n<p>800 ppm IBA 配 1 L：需有效成分 800 mg = 0.8 g；市售品含 0.4% → 0.8 ÷ 0.004 = <strong>200 g</strong>。（水溶液 1 ppm = 1 mg/L）</p>\n<h3>5. 當量濃度（106 園藝）</h3>\n<p>1 N H2SO4 = 0.5 M（二質子酸）。500 mL 需 0.5 × 0.5 = 0.25 mol；濃硫酸 18 M → 0.25 ÷ 18 ≈ <strong>13.9 mL</strong>。</p>\n<h3>6. 土壤重量（108 農經）</h3>\n<p>700 m² × 0.15 m = 105 m³；容重 1.3 g/cm³ = 1.3 t/m³ → 105 × 1.3 = <strong>136.5 噸（136,500 kg）</strong>。</p>\n<h3>7. 其他考過的數字題</h3>\n<ul>\n<li>比例尺：1：100 圖上 2.5 cm = 2.5 m。</li>\n<li>紅磚 21 × 10 × 6 cm、磚縫 1 cm：答案 1B 每 m² 120 塊、1/2 B 60 塊（103 答案）。</li>\n<li>半保留複製：15N 轉入 14N 培養，第三子代 15N：14N 的答案為 2：14（105 農經）。</li>\n<li>染色體數：水稻 24、甘蔗 80。</li>\n<li>乾貯型種子每降 5 ℃ 壽命倍增；稻穀儲藏含水率 12–13% 以下，每增 1% 安全期減半。</li>\n</ul>\n<h3>8. 95–99 年新增計算題</h3>\n<ul>\n<li>99 員林（單質肥折算）：N 210 ÷ 0.21 = <strong>1000 kg 硫酸銨</strong>；P2O5 72 ÷ 0.18 = <strong>400 kg 過磷酸鈣</strong>；K2O 60 ÷ 0.6 = <strong>100 kg 氯化鉀</strong>。</li>\n<li>95 臺中：台肥 5 號（16-8-12）要施 N 48 kg → 48 ÷ 0.16 = <strong>300 kg</strong>。</li>\n<li>95 臺中：50% 撲滅松稀釋 1000 倍，每公頃 1 L，0.5 公頃 → 0.5 L × 1000 = <strong>500 L</strong> 水藥。</li>\n<li>95 臺中：雜異指數 = 1 ÷ Σ（各業務收入佔比²）。甲 500、乙 400、丙 100 → 0.5² + 0.4² + 0.1² = 0.42 → 1 ÷ 0.42 ≈ <strong>2.38</strong>。專業化越高越接近 1。</li>\n<li>95 臺中：複種指數 = 全年作物栽培面積 ÷ 耕地面積 × 100。3 公頃一年三作 → 9 ÷ 3 × 100 = <strong>300</strong>。</li>\n<li>99 員林（蘇力菌）：1 甲 ≈ 0.97 公頃，10 甲 ≈ 9.7 公頃；每公頃 1 kg → 約 9.7 kg；每包 200 g → 9700 ÷ 200 ≈ 48.5，至少買 <strong>49 包</strong>（若題意把 10 甲視為 10 公頃則為 50 包，作答時寫出換算假設）。稀釋 1000 倍是用來算水量，不影響包數。</li>\n</ul>"}, {"id": "c14", "title": "十四、名詞解釋與申論題題庫", "short": "十四、名詞解釋與申論題題庫", "html": "<h3>歷屆名詞解釋（附答題要點）</h3>\n<p>英文名詞先寫中文翻譯，再寫定義與一個例子，是校辦卷的給分關鍵。</p>\n<table>\n<thead>\n<tr>\n<th>名詞</th>\n<th>年度</th>\n<th>答題要點</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>虎渡子法 Tora-no-ko watashi</td>\n<td>104、114</td>\n<td>日本龍安寺枯山水石庭；白砂為海、15 石分 5-2-3-2-3 五組，如母虎帶子渡河</td>\n</tr>\n<tr>\n<td>光飽和點 Light Saturation Point</td>\n<td>105、112、114</td>\n<td>光度再增加而光合速率不再上升的光度</td>\n</tr>\n<tr>\n<td>光補償點 Light Compensation Point</td>\n<td>106、112</td>\n<td>光合吸收 CO2 = 呼吸釋出 CO2 時的光度</td>\n</tr>\n<tr>\n<td>春化作用 Vernalization</td>\n<td>106、107、112</td>\n<td>低溫誘導花芽分化；分種子感應型（蘿蔔、白菜）、綠植株感應型（甘藍、洋蔥、芹菜）</td>\n</tr>\n<tr>\n<td>有效水 Available water</td>\n<td>105</td>\n<td>田間容水量至永久凋萎點間可被吸收的水</td>\n</tr>\n<tr>\n<td>永久凋萎點 Permanent wilting point</td>\n<td>114 松山</td>\n<td>植物凋萎後置飽和濕度環境也無法恢復的土壤含水量</td>\n</tr>\n<tr>\n<td>合接法 Splice grafting</td>\n<td>104</td>\n<td>砧穗粗細相近，各削同長斜面後對合綁紮</td>\n</tr>\n<tr>\n<td>Cormel</td>\n<td>104</td>\n<td>木子，球莖基部產生的小球莖，唐菖蒲以此繁殖</td>\n</tr>\n<tr>\n<td>blanching culture</td>\n<td>104</td>\n<td>軟化栽培，遮光使組織柔嫩（芹菜、韭黃）</td>\n</tr>\n<tr>\n<td>vacuum cooling</td>\n<td>104</td>\n<td>真空預冷，降壓使水分蒸發帶走熱，適合葉菜</td>\n</tr>\n<tr>\n<td>climacteric fruits</td>\n<td>106</td>\n<td>更年型果實，後熟時呼吸與乙烯驟增</td>\n</tr>\n<tr>\n<td>precooling</td>\n<td>106</td>\n<td>預冷，採後儘速移除田間熱</td>\n</tr>\n<tr>\n<td>explant</td>\n<td>106</td>\n<td>培植體，取來培養的組織或器官區塊</td>\n</tr>\n<tr>\n<td>totipotency</td>\n<td>106</td>\n<td>全能性，細胞具發育成完整個體的能力</td>\n</tr>\n<tr>\n<td>horticultural therapy</td>\n<td>106</td>\n<td>園藝治療，以園藝活動促進身心健康</td>\n</tr>\n<tr>\n<td>週位花 Perigynous flower</td>\n<td>106 農經</td>\n<td>子房周位，花托杯狀包圍子房但不合生（桃、李）</td>\n</tr>\n<tr>\n<td>滲調處理 Seed priming (Osmoconditioning)</td>\n<td>106 農經</td>\n<td>以 PEG 或鹽類控制種子吸水，使發芽快且整齊</td>\n</tr>\n<tr>\n<td>教槽料 Creep feed</td>\n<td>106 農經</td>\n<td>仔豬哺乳期開始給予的易消化補助飼料，利於離乳</td>\n</tr>\n<tr>\n<td>完全養殖 Full-cycle aquaculture</td>\n<td>106 農經</td>\n<td>從人工繁殖稚苗到養成親魚再繁殖，生活史全在人為控制下</td>\n</tr>\n<tr>\n<td>determinate inflorescence</td>\n<td>107</td>\n<td>有限花序，頂花先開、花軸不再伸長</td>\n</tr>\n<tr>\n<td>heterosis</td>\n<td>107</td>\n<td>雜種優勢，F1 生長勢、產量優於雙親</td>\n</tr>\n<tr>\n<td>光敏素 phytochrome</td>\n<td>107</td>\n<td>Pr 與 Pfr 可互轉的感光色素，控制開花與發芽</td>\n</tr>\n<tr>\n<td>回交育種法 Backcross breeding</td>\n<td>107 農經</td>\n<td>F1 與輪迴親反覆回交，將一、二種性狀導入優良品種</td>\n</tr>\n<tr>\n<td>積溫 Accumulated temperature (Growing degree days)</td>\n<td>107 農經</td>\n<td>完成生育階段所需的日平均溫累加值</td>\n</tr>\n<tr>\n<td>逆分化 dedifferentiation</td>\n<td>107 農經</td>\n<td>已分化細胞回到分生狀態，形成癒傷組織</td>\n</tr>\n<tr>\n<td>狂牛病 Mad cow disease (BSE)</td>\n<td>107 農經</td>\n<td>牛海綿狀腦病，病原為普利昂蛋白</td>\n</tr>\n<tr>\n<td>補償修剪 Compensatory pruning</td>\n<td>108</td>\n<td>移植時剪除部分枝葉，平衡根部損失</td>\n</tr>\n<tr>\n<td>Pseudobulb</td>\n<td>108</td>\n<td>偽鱗莖，蘭科莖基部肥厚的貯藏器官</td>\n</tr>\n<tr>\n<td>MA storage</td>\n<td>108</td>\n<td>氣調包裝貯藏，塑膠膜內低 O2、高 CO2</td>\n</tr>\n<tr>\n<td>Qualitative LDP</td>\n<td>108</td>\n<td>質的（絕對）長日植物，不經長日就不開花</td>\n</tr>\n<tr>\n<td>聚合果 Aggregate fruit</td>\n<td>108 農經</td>\n<td>一朵花多個離生心皮發育成一個果實（草莓）</td>\n</tr>\n<tr>\n<td>Compound fruit</td>\n<td>114 松山</td>\n<td>複果，整個花序發育（鳳梨、桑椹）</td>\n</tr>\n<tr>\n<td>粒子槍 Particle gun (Gene gun)</td>\n<td>108 農經</td>\n<td>基因槍，金或鎢粒包 DNA 高速射入細胞</td>\n</tr>\n<tr>\n<td>Stratification</td>\n<td>108 農經</td>\n<td>層積處理，濕潤介質低溫層積打破休眠</td>\n</tr>\n<tr>\n<td>Scooping</td>\n<td>114</td>\n<td>挖底法，挖去風信子鱗莖基盤促生子球</td>\n</tr>\n<tr>\n<td>Enforced dormancy</td>\n<td>114</td>\n<td>強迫休眠，因環境不適而暫停生長</td>\n</tr>\n<tr>\n<td>Nutriculture</td>\n<td>114</td>\n<td>養液栽培（水耕），以養液供應植物營養</td>\n</tr>\n<tr>\n<td>seed tape</td>\n<td>114</td>\n<td>種子帶，種子依間距黏在可分解紙帶</td>\n</tr>\n<tr>\n<td>Mycorrhiza</td>\n<td>114 松山</td>\n<td>菌根，真菌與植物根部共生，幫助吸收磷與水</td>\n</tr>\n<tr>\n<td>Juvenility</td>\n<td>114 松山</td>\n<td>幼年性，幼年期即使條件合適也不開花</td>\n</tr>\n<tr>\n<td>Recalcitrant</td>\n<td>114 松山</td>\n<td>頑拗性種子，不耐乾燥與低溫儲藏</td>\n</tr>\n<tr>\n<td>報酬遞減律 Law of diminishing returns、陽離子交換能力 CEC Cation exchange capacity、半數致死量 LD50 Median lethal dose、勝任細胞 Competent cell</td>\n<td>105 農經</td>\n<td>LD50：使半數試驗動物死亡的劑量（mg/kg）；勝任細胞：經處理可接受外來 DNA 的細菌</td>\n</tr>\n</tbody>\n</table>\n<h3>申論題題庫（依主題）</h3>\n<ul>\n<li>繁殖：水梨嫁接流程繪圖（105）；三段修剪法繪圖（106）；組織培養在生產與育種的應用、苗木健化（107 技師）。</li>\n<li>育種：基因轉殖定義與應用（105）；無子西瓜育成（108）；自交不親和與細胞質雄不稔生產 F1、單粒後裔 vs 混合選種、種原來源（107 技師）；F1 花卉種子原理。</li>\n<li>生理：C3、C4、CAM 固定路徑比較（106 農經、107 農經）；DIF 意義與影響（114）；光照對蔬菜生長發育的影響（107 技師）。</li>\n<li>花卉：百合、玫瑰、火鶴切花採收適期（104）；蝴蝶蘭溫度與提早開花（107）；摘心目的（108）；有限／無限花序、病毒病症與防治、生產環境因子（107 技師）。</li>\n<li>蔬菜：蔬菜貯藏方法（107）；洋香瓜單蔓、雙蔓整枝（108、114 松山）；毛豆栽培、農藥殘留檢驗、種子披衣（107 技師）；種子純度與活力（114 松山）。</li>\n<li>果樹：蓮霧五種產期調節法（114）；人工式整枝（105 農經）；留果量、日燒、草莓預冷、柑橘健康種苗（107 技師）。</li>\n<li>病蟲害：褐根病（103）；青枯病與軟腐病病原及病徵成因（106 農經）；荔枝椿象（108 農經）。</li>\n<li>造園：三植法（114）；移植適期（108）；綠籬、植物質地、都市河川、療癒庭園（107 技師）。</li>\n<li>採後：冷鏈、氣體與礦物質失調障礙、蔬果汁殺菌、冷凍加工（107 技師）。</li>\n<li>農經跨域：純系說、草蝦剪眼柄（促進卵巢成熟、提早產卵）、輪作為最好耕作制度、培土影響、真細菌與古細菌差異、遺傳工程四個操作順序。</li>\n</ul>"}, {"id": "c15", "title": "十五、申論題參考答案與作答架構", "short": "十五、申論題參考答案與作答架構", "html": "<p>申論題拿高分靠「結構清楚＋關鍵字＋實例」，不靠字數。以下先給通用架構，再依題庫逐題寫參考答案。</p>\n<h3>通用作答架構</h3>\n<ol>\n<li><strong>破題（1–2 句）</strong>：先寫定義或原理，英文名詞先翻譯再解釋。</li>\n<li><strong>主體分點</strong>：用「一、二、三」或小標分段；配分 10 分約寫 4–5 點，每點 2–3 行。</li>\n<li><strong>每點都要有實例</strong>：寫出作物名、品種、數字（溫度、濃度、時間），閱卷老師找的就是這些。</li>\n<li><strong>能畫就畫</strong>：嫁接、修剪、構造、流程題附簡圖並標名稱，圖文對照最容易得分。</li>\n<li><strong>結尾（1 句）</strong>：教甄卷可加「教學應用」，例如實習課如何帶學生操作、安全注意事項。</li>\n</ol>\n<h3>答題原則</h3>\n<ul>\n<li>「比較」題用表格（項目 × 甲 × 乙）。</li>\n<li>「流程」題用箭頭寫步驟。</li>\n<li>「原因與防治」題分兩段：先原因，再防治（耕作、物理、生物、化學）。</li>\n<li>「試述影響」題依「正面／負面」或「生長期別」分點。</li>\n</ul>\n<p>下列各題格式：<strong>作答架構</strong> → <strong>參考答案</strong> → <strong>答題重點</strong>（必寫關鍵字）。</p>\n<h3>一、繁殖類</h3>\n<p><strong>1. 以水梨嫁接為例，用簡圖與文字說明繁殖操作過程（105，10 分）</strong></p>\n<p>作答架構：準備（砧木、接穗、工具）→ 操作步驟（附切接圖）→ 接後管理 → 教學安全提醒。</p>\n<p>參考答案：</p>\n<ol>\n<li>材料準備：砧木用 1–2 年生鳥梨實生苗；接穗選發育充實、無病蟲害、芽體飽滿的一年生枝，高接溫帶梨時接穗先 5 ℃ 冷藏 20–30 天滿足低溫需求；工具為嫁接刀、修枝剪、嫁接膠帶、塑膠袋並先消毒。</li>\n<li>砧木處理：離地約 10–15 cm 剪斷，削平切面，在一側木質部與皮層間縱切約 2–3 cm。</li>\n<li>接穗處理：留 2–3 芽，基部削成一長斜面（2–3 cm）與背面一短斜面。</li>\n<li>接合：長斜面朝內插入砧木切口，使兩者形成層至少一側對齊。</li>\n<li>固定保濕：嫁接膠帶由下往上纏緊，接穗頂端塗癒合劑或套袋保濕。</li>\n<li>接後管理：隨時除去砧木萌芽；成活萌芽後解除膠帶以免縊痕；高接梨開花前除袋。</li>\n</ol>\n<p>簡圖畫法：畫砧木縱切口與接穗兩斜面，再畫插入後的合體圖，標「形成層對齊」「嫁接膠帶」。</p>\n<p>答題重點：形成層對齊、鳥梨砧木、接穗低溫處理、除砧芽與解綁。教學提醒：刀口朝外、分組輪流操作。</p>\n<p><strong>2. 繪圖說明三段修剪法 three-cut pruning（106，6 分）</strong></p>\n<p>作答架構：目的 → 三個切口位置與順序（附圖）→ 正確傷口位置。</p>\n<p>參考答案：</p>\n<ol>\n<li>目的：修剪粗大枝條時防止枝條重量造成樹皮向下撕裂。</li>\n<li>第一刀：距枝基部約 30 cm，由枝條下方往上鋸入約 1/3 深。</li>\n<li>第二刀：在第一刀外側數公分，由上往下鋸斷，枝條斷落時撕裂會停在第一刀處。</li>\n<li>第三刀：沿枝領（領環）外側、不傷枝脊（脊線）切除殘樁，切口平整。</li>\n</ol>\n<p>答題重點：先下後上、領環與脊線不可傷、不留殘樁；圖上要標 1、2、3 刀順序。</p>\n<p><strong>3. 試述組織培養在園藝作物生產及育種上的應用（107 技師）</strong></p>\n<p>作答架構：分「生產」與「育種」兩大段，每點附作物例。</p>\n<p>參考答案：</p>\n<ul>\n<li>生產：大量快速繁殖（蝴蝶蘭、香蕉組培苗）；莖頂培養生產無病毒苗（香蕉、馬鈴薯、草莓）；柑橘莖頂微體嫁接生產健康種苗；種原以低溫或超低溫保存。</li>\n<li>育種：花藥培養得單倍體再加倍成純系，縮短育種年限；胚培養救援種間雜交敗育的胚；原生質體融合產生體細胞雜種（白藍菜）；細胞培養篩選體細胞變異（台蕉一號由北蕉組培變異選出）；體胚製人工種子；基因轉殖後的再生植株。</li>\n</ul>\n<p>答題重點：微體繁殖、去病毒、花藥培養、胚救援、細胞融合、體細胞變異，各配一個作物。</p>\n<p><strong>4. 何謂苗木健化？穴盤育苗為何要健化？如何健化？（107 技師）</strong></p>\n<p>作答架構：定義 → 原因 → 方法。</p>\n<p>參考答案：</p>\n<ul>\n<li>定義：定植前讓幼苗逐漸適應田間環境，使組織充實、耐逆境的過程。</li>\n<li>原因：穴盤苗在溫室高濕、弱光、充足水肥下生長，組織柔嫩，直接定植易萎凋、日燒、倒伏，緩苗期長。</li>\n<li>方法：定植前 7–10 天逐步減少灌水、降低氮肥、增加光照與通風、降低溫度；也可用輕度摩擦（觸碰）刺激；組培瓶苗出瓶前則逐步開蓋降低濕度。</li>\n</ul>\n<p>答題重點：逐步、控水、減氮、增光、降溫，提高定植存活率。</p>\n<h3>二、育種類</h3>\n<p><strong>1. 何謂基因轉殖？目前利用此技術改良的作物有哪些？主要應用有哪些？（105，10 分）</strong></p>\n<p>作答架構：定義 → 方法 → 作物實例 → 應用分類 → 疑慮（加分）。</p>\n<p>參考答案：</p>\n<ol>\n<li>定義：利用基因重組技術，將外源目標基因轉入植物細胞並穩定表現，突破物種間雜交障礙。</li>\n<li>方法：農桿菌法（Ti 質體，多用於雙子葉）、基因槍法、原生質體電穿孔法。</li>\n<li>作物：大豆、玉米、棉花、油菜為全球大宗；木瓜（抗輪點病毒，臺灣第一個基轉作物）、番茄（延緩軟化）、藍色玫瑰與藍色康乃馨。</li>\n<li>應用：抗蟲（Bt 基因）、抗殺草劑、抗病毒、品質改良（黃金米、延長貯架壽命）、花色改變、生產醫藥蛋白。</li>\n<li>疑慮：生態安全（基因漂流）、食品安全；臺灣規定基改成分 3% 以上須標示（104 年考題答案為 5%，現行已改為 3%）。</li>\n</ol>\n<p>答題重點：農桿菌／基因槍、Bt、抗輪點病毒木瓜、大豆玉米棉花。</p>\n<p><strong>2. 簡單說明無子西瓜之育成（108，3 分）</strong></p>\n<p>作答架構：三個步驟用箭頭寫。</p>\n<p>參考答案：二倍體西瓜幼苗生長點以秋水仙素處理 → 得四倍體（作母本）→ 四倍體 × 二倍體（父本）→ 結出三倍體種子 → 三倍體植株減數分裂異常、不能產生正常配子，需混植二倍體提供花粉刺激果實發育，得無子果實。</p>\n<p>答題重點：秋水仙素、四倍體為母本、三倍體、需授粉樹。</p>\n<p><strong>3. 比較自交不親和性與細胞質雄不稔性的生理機制，並說明如何獲得純系親本生產 F1（107 技師）</strong></p>\n<p>作答架構：表格比較機制 → 各自的親本維持法 → F1 生產流程。</p>\n<p>參考答案：</p>\n<table>\n<thead>\n<tr>\n<th>項目</th>\n<th>自交不親和性 SI</th>\n<th>細胞質雄不稔 CMS</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>機制</td>\n<td>花粉與柱頭的 S 對偶基因相同時，花粉無法萌發或花粉管停止生長；花粉本身可育</td>\n<td>粒線體等細胞質基因使花粉敗育，屬母系遺傳</td>\n</tr>\n<tr>\n<td>代表作物</td>\n<td>十字花科（甘藍、白菜、蘿蔔）</td>\n<td>洋蔥、胡蘿蔔、玉米</td>\n</tr>\n<tr>\n<td>親本維持</td>\n<td>花蕾授粉（開花前 2–4 天剝蕾授粉）或提高 CO2 濃度至 3–5%、鹽水噴柱頭，強迫自交得純系</td>\n<td>三系法：A 系（不稔系）× B 系（維持系）→ 仍是不稔系；A 系 × C 系（回復系）→ F1</td>\n</tr>\n</tbody>\n</table>\n<p>答題重點：S 對偶基因、花蕾授粉、CO2 處理、母系遺傳、三系法（不稔系、維持系、回復系）。</p>\n<p><strong>4. 比較單粒後裔選種法與混合選種法的步驟與優缺點（107 技師）</strong></p>\n<table>\n<thead>\n<tr>\n<th>項目</th>\n<th>單粒後裔法 SSD</th>\n<th>混合選種法</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>步驟</td>\n<td>雜交後 F2–F5 每株只採一粒混合播種，快速推進世代；約 F6 代純合後再進行單株選拔與後代試驗</td>\n<td>從既有族群中選出外觀優良的個體，種子混合後種植，反覆進行</td>\n</tr>\n<tr>\n<td>優點</td>\n<td>節省空間與時間、可在溫室一年多代、保留遺傳多樣性</td>\n<td>簡單省工、維持品種一致性、適合農家自行留種</td>\n</tr>\n<tr>\n<td>缺點</td>\n<td>早代無選拔，劣等個體也被保留</td>\n<td>只依表型選拔，無後代試驗，改良效果有限；異交作物花粉來源無法控制</td>\n</tr>\n</tbody>\n</table>\n<p>答題重點：一株一粒、快速純合、後期才選；混合選種依表型、無後代試驗。</p>\n<p><strong>5. 園藝作物種原的來源、特點與應用（107 技師）</strong></p>\n<ul>\n<li>地方品種（在地種）：適應當地氣候、抗逆境，可作親本提供適應性（如本地芹菜、梅花矸蘿蔔）。</li>\n<li>改良品種：產量、品質優，作為輪迴親。</li>\n<li>引進品種：直接利用或作雜交親本（巨峰葡萄、溫帶梨）。</li>\n<li>野生種與近緣種：含抗病、抗逆境基因，引入改良品種（中國月季使玫瑰四季開花；臺灣原生金花石蒜、白花蝴蝶蘭）。</li>\n<li>人為誘變種與基轉種：擴充變異。</li>\n</ul>\n<p>答題重點：五類來源 ＋ 各一個實例，強調野生種是抗性基因庫。</p>\n<p><strong>6. 說明 F1 種子的育種原理並舉臺灣常見 F1 花卉（107 技師花卉學）</strong></p>\n<p>參考答案：先育成兩個純系（自交系），以組合能力檢定選出雜種優勢最大的組合，每年以相同親本雜交生產 F1；F1 外觀整齊、生長勢強，但 F2 會分離，農民需年年購種。產種利用人工去雄、雄不稔或自交不親和。常見 F1 花卉：矮牽牛、三色菫、金魚草、孔雀草、非洲鳳仙花、石竹。</p>\n<p>答題重點：純系、組合能力、雜種優勢、F2 分離、年年購種。</p>\n<h3>三、生理類</h3>\n<p><strong>1. 試說明 C3、C4、CAM 型植物對 CO2 固定路徑的不同（106 農經，6 分；107 農經「光合作用類型」）</strong></p>\n<p>作答架構：用表格比較，最後一句寫結論。</p>\n<table>\n<thead>\n<tr>\n<th>項目</th>\n<th>C3</th>\n<th>C4</th>\n<th>CAM</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>初步固定酵素</td>\n<td>RuBP 羧化酶（Rubisco）</td>\n<td>PEP 羧化酶</td>\n<td>PEP 羧化酶</td>\n</tr>\n<tr>\n<td>第一個產物</td>\n<td>3 碳的 PGA</td>\n<td>4 碳的草醯乙酸（OAA）</td>\n<td>4 碳有機酸（蘋果酸）</td>\n</tr>\n<tr>\n<td>分工方式</td>\n<td>葉肉細胞完成全部</td>\n<td>「空間分工」：葉肉細胞固定、維管束鞘細胞進行卡爾文循環</td>\n<td>「時間分工」：夜間開氣孔固定、白天關氣孔進行卡爾文循環</td>\n</tr>\n<tr>\n<td>光呼吸</td>\n<td>旺盛</td>\n<td>很弱</td>\n<td>很弱</td>\n</tr>\n<tr>\n<td>光飽和點</td>\n<td>低</td>\n<td>高</td>\n<td>中</td>\n</tr>\n<tr>\n<td>耐旱性</td>\n<td>弱</td>\n<td>強</td>\n<td>最強</td>\n</tr>\n<tr>\n<td>代表</td>\n<td>水稻、小麥、大部分園藝作物、東亞蘭</td>\n<td>玉米、甘蔗、高粱</td>\n<td>鳳梨、仙人掌、蝴蝶蘭、嘉德麗雅蘭</td>\n</tr>\n</tbody>\n</table>\n<p>答題重點：酵素名稱、第一個產物碳數、「空間分工 vs 時間分工」是絕對要寫的關鍵字。</p>\n<p><strong>2. 說明日夜溫差 DIF 之意義，其如何影響植物生長？（114，5 分）</strong></p>\n<p>作答架構：定義公式 → 正／零／負 DIF 的效果 → 應用與限制。</p>\n<p>參考答案：</p>\n<ol>\n<li>意義：DIF（Difference）= 日溫 − 夜溫。</li>\n<li>正 DIF（日溫高於夜溫）：節間伸長，植株較高；零 DIF：中等；負 DIF（夜溫高於日溫）：節間縮短，植株矮化。</li>\n<li>效果主要取決於「日夜溫差」而非平均溫度；實務上常用「清晨降溫」（日出前後 2–3 小時降溫）達到類似效果。</li>\n<li>應用：可取代或減少矮化劑，控制盆花株高，如百合、聖誕紅、菊花、金魚草。</li>\n<li>限制：風信子等球根花卉反應遲鈍；負 DIF 過大或過久會使葉片黃化。</li>\n</ol>\n<p>答題重點：公式、節間長度、取代矮化劑、風信子不適用。</p>\n<p><strong>3. 試述光照對蔬菜生長發育的影響（107 技師）</strong></p>\n<p>作答架構：光的三要素分段：光度、光週期、光質，每段給作物例。</p>\n<p>參考答案：</p>\n<ol>\n<li>光度：影響光合作用與產量。喜強光：西瓜、番茄、甜椒；耐弱光：葉菜類、薄荷、茼蒿；光不足時徒長、落花、糖度低。</li>\n<li>光週期：影響開花、抽苔與貯藏器官形成。長日促進菠菜、萵苣抽苔與洋蔥結球；短日促進馬鈴薯結薯、莧菜開花；瓜類短日低溫多雌花、長日高溫多雄花；番茄為中日性。</li>\n<li>光質：紅光促進發芽與莖伸長、葉綠素形成；藍光使植株矮壯、促進花青素；紅光／遠紅光經光敏素調控發芽與開花；好光性種子（萵苣）需光發芽。</li>\n<li>應用：遮光軟化栽培（韭黃、芹菜）、網室遮陰降溫、LED 植物工廠調配紅藍光。</li>\n</ol>\n<p>答題重點：光度／光週期／光質三分法，每點一個蔬菜例。</p>\n<h3>四、花卉類</h3>\n<p><strong>1. 如何判斷百合、玫瑰、火鶴花的切花採收適期？（104，各 2 分）</strong></p>\n<p>作答架構：一種花一行，「判斷依據 ＋ 原因」。</p>\n<ul>\n<li>百合：花序最下方第一朵花苞已適當著色、尚未開放時採；太晚開嘴易受傷、花粉汙染花瓣。</li>\n<li>玫瑰：花萼反捲至水平、外層花瓣開始鬆開時採；太早採易「垂頸」不開。</li>\n<li>火鶴花：依肉穗花序變色與花梗硬度，肉穗由下往上變色約 1/3–3/4 時採；太早採花梗未硬易垂頭。</li>\n</ul>\n<p>答題重點：最下一朵著色、花萼反捲、肉穗變色比例。</p>\n<p><strong>2. 蝴蝶蘭營養生長、花芽分化之最適溫度，如何在 10–12 月提早開花？（107，10 分）</strong></p>\n<p>作答架構：溫度需求 → 催花原理 → 操作時程 → 注意事項。</p>\n<p>參考答案：</p>\n<ol>\n<li>營養生長：日／夜溫約 28–30／23–25 ℃，高溫可抑制抽棒。</li>\n<li>花芽分化（抽棒）：需低溫誘導，日／夜約 25／20 ℃ 約 4–6 週；屬光週期不敏感、以溫度控制開花。</li>\n<li>抽棒後至開花約需 3–4 個月，故要 10–12 月開花，需在 6–7 月將成熟株移至高山（海拔約 1000 m 以上）或冷房、水牆風扇溫室降溫催花。</li>\n<li>配合管理：催花前施高磷鉀肥、適度增光（約 15,000–20,000 lux）、株體需有 3–4 片以上成熟葉。</li>\n<li>抽棒後避免高溫（30 ℃ 以上），否則花棒可能退化或長出高芽。</li>\n</ol>\n<p>答題重點：高溫營養、低溫催花、25／20 ℃、上山或冷房、推算時程。</p>\n<p><strong>3. 花卉生長期間的摘心管理，簡述其目的（108，6 分）</strong></p>\n<ul>\n<li>打破頂芽優勢，促進側芽萌發、增加分枝與花數（香石竹、菊花）。</li>\n<li>矮化株型，使盆花密實豐滿（一串紅、日日春）。</li>\n<li>調節花期：延後開花或分散產期（香石竹一次半摘心）。</li>\n<li>使養分分配平均，提高切花品質與整齊度。</li>\n</ul>\n<p>答題重點：頂芽優勢、分枝、矮化、花期調節；別寫成摘蕊（摘蕊是去側花芽）。</p>\n<p><strong>4. 有限花序與無限花序的定義？舉五種臺灣重要花卉的花序（107 技師）</strong></p>\n<ul>\n<li>有限花序（determinate）：花軸頂端先形成花且先開，花軸不再伸長，開花由上而下或由內而外，如聚繖花序（滿天星、香石竹）、單頂花序（玫瑰）。</li>\n<li>無限花序（indeterminate）：花軸頂端可繼續生長，開花由下而上或由外而內。</li>\n<li>例：菊花、非洲菊 — 頭狀花序；唐菖蒲 — 穗狀花序；火鶴花 — 肉穗花序；蝴蝶蘭 — 總狀花序；百合 — 總狀花序。</li>\n</ul>\n<p>答題重點：開花順序與花軸是否繼續生長是定義核心。</p>\n<p><strong>5. 舉例說明花卉病毒病症特徵與防治方法（107 技師）</strong></p>\n<ul>\n<li>病徵：嵌紋、黃化、葉片縮捲畸形、植株矮化、花色斑駁（例：蘭花嵌紋病毒 CymMV、齒舌蘭輪斑病毒 ORSV；百合、唐菖蒲嵌紋病）。</li>\n<li>傳播：蚜蟲、薊馬、粉蝨等媒介昆蟲；繁殖材料；切花工具（蘭花病毒主要靠工具傳播）。</li>\n<li>防治：病毒無藥可治，重點在預防 — 使用莖頂培養無毒種苗、網室栽培、防治媒介昆蟲（黃色黏板）、工具以火烤或漂白水消毒、拔除病株、以千日紅等指示植物或 ELISA 檢定。</li>\n</ul>\n<p>答題重點：無藥可治、預防為主、無毒苗、媒介昆蟲、工具消毒。</p>\n<p><strong>6. 舉例說明花卉生產應注意的環境因素（107 技師）</strong></p>\n<ul>\n<li>溫度：生長適溫、春化（紫羅蘭）、高溫柳芽（菊花）、DIF 控高。</li>\n<li>光：光度（非洲菫弱光、向日葵強光）、光週期（電照菊、聖誕紅遮光）。</li>\n<li>水分與濕度：過濕易病害、過乾影響生長。</li>\n<li>土壤與介質：pH（杜鵑喜酸、繡球花花色受鋁影響）、排水通氣。</li>\n<li>氣體：CO2 施用促生長；乙烯使切花老化（康乃馨睡花）。</li>\n</ul>\n<p>答題重點：溫、光、水、土、氣五大項，各一個花卉例。</p>\n<h3>五、蔬菜類</h3>\n<p><strong>1. 蔬菜貯藏方法有哪些？（107，10 分）</strong></p>\n<p>作答架構：貯藏原理（降低呼吸、蒸散、病害）→ 方法分點 → 每點配蔬菜例。</p>\n<ol>\n<li>常溫貯藏：通風陰涼處堆放，適用南瓜、冬瓜、洋蔥、芋頭。</li>\n<li>地窖、溝藏、埋藏：利用土壤恆溫保濕，適用蘿蔔、胡蘿蔔、甘藷。</li>\n<li>低溫冷藏：降低呼吸與微生物活動，葉菜類 0–2 ℃、高濕 90–95%；但熱帶果菜（番茄、甘藷、甜椒）易寒害，需 10 ℃ 以上。</li>\n<li>預冷：採後儘速移除田間熱（真空預冷適合葉菜、強制通風、水冷），是低溫貯藏的前提。</li>\n<li>氣調貯藏：CA（人為控制低 O2、高 CO2）與 MA（塑膠膜包裝），延緩老化。</li>\n<li>癒傷處理：甘藷、馬鈴薯、芋頭採後高溫高濕下形成栓皮層，減少腐爛。</li>\n<li>抑芽：輻射照射或萘乙酸甲酯處理馬鈴薯、洋蔥、大蒜。</li>\n<li>乾燥貯藏：辣椒、金針、菇類乾製後貯藏。</li>\n</ol>\n<p>答題重點：原理一句 ＋ 方法八點，提到寒害與癒傷會加分。</p>\n<p><strong>2. 網紋洋香瓜（cantaloupe）的立式網架、單蔓與雙蔓整枝留果方式（108、114 松山，10 分）</strong></p>\n<p>作答架構：中文名 → 單蔓 → 雙蔓 → 共通管理。</p>\n<ul>\n<li>中文名：洋香瓜、網紋甜瓜。</li>\n<li>單蔓整枝：本葉 4–5 片時保留主蔓，繫蔓上架；主蔓第 1–10 節側蔓全部摘除；第 11–15 節側蔓（子蔓）留 1–2 葉摘心並在其上留果；以上側蔓又摘除，主蔓約 25 節摘心；每株留 1 果。</li>\n<li>雙蔓整枝：本葉 4–5 片時摘心，留兩條生長勢一致的子蔓上架；各子蔓於第 10–15 節的孫蔓上留 1 果，其餘孫蔓摘除，每蔓約 22–25 節摘心；每株 2 果。</li>\n<li>共通管理：果實約雞蛋大時疏果、選果形正、位置適中者；以引繩吊果防掉落；網紋形成期控水。</li>\n</ul>\n<p>答題重點：留果節位（11–15 節）、摘心節位（約 25 節）、每株留果數；可畫簡圖標留果位置。</p>\n<p><strong>3. 臺灣外銷蔬菜毛豆的風土適應性與田間管理要點（107 技師）</strong></p>\n<ul>\n<li>風土適應性：屬短日豆科作物，生長適溫 20–25 ℃；主產區在高雄、屏東、雲嘉南，秋作（9–10 月播種）與春作為主；喜排水良好的砂質壤土、pH 6–7。</li>\n<li>田間管理：選用高雄 9 號等外銷品種；種子可接種根瘤菌；機械播種、合理密植；基肥以磷鉀為主、氮肥不宜過多；開花結莢期保持水分；防治豆莢螟、斜紋夜蛾、銹病，遵守安全採收期（外銷日本殘留標準嚴）；豆莢飽滿、綠色時機械採收後立即預冷加工。</li>\n</ul>\n<p>答題重點：短日、秋作為主、根瘤菌、安全採收期、採後預冷。（品種名請以最新課本為準。）</p>\n<p><strong>4. 生化法檢驗蔬菜農藥殘留的原理與方法，與化學法如何配合（107 技師）</strong></p>\n<ul>\n<li>原理：有機磷與胺基甲酸鹽類農藥會抑制乙醯膽鹼酯酶活性，檢測酵素活性被抑制的程度推算殘留。</li>\n<li>方法：樣品切碎→溶劑萃取→加入酵素與基質→以光度計測吸光度，算出抑制率；抑制率超過 35% 判定為疑似殘留。</li>\n<li>配合：生化法快速（約 30 分鐘）、便宜，用於市場與產地大量篩檢；但只能檢兩類藥劑且無法定量。陽性樣品再送化學法（GC、LC、LC-MS/MS 多重殘留分析）定性定量，判定是否超過容許量。</li>\n</ul>\n<p>答題重點：乙醯膽鹼酯酶、抑制率、快篩 ＋ 化學法確認的兩階段制。</p>\n<p><strong>5. 蔬菜種子披衣處理（Seed Coating）之目的、類型與未來發展（107 技師）</strong></p>\n<ul>\n<li>目的：防病蟲（包入藥劑）、促進發芽與幼苗生長（包入肥料、有益微生物）、改善種子形狀利於機械播種、色彩標識品種。</li>\n<li>類型：粉衣（藥粉拌種）、膜衣（薄膜包覆，形狀不變）、造粒（以過氧化鈣等介質包成圓球，適用洋桔梗、萵苣、胡蘿蔔等小粒種子）、種子帶。</li>\n<li>未來：生物性披衣（拮抗菌、根瘤菌）取代化學藥劑、溫度或水分感應型智慧披衣、可分解環保材料、配合滲調處理提升發芽整齊度。</li>\n</ul>\n<p>答題重點：粉衣、膜衣、造粒三類；過氧化鈣；生物化與智慧化趨勢。</p>\n<p><strong>6. 何謂種子純度 purity 與種子活力 viability？（114 松山，各 4 分）</strong></p>\n<ul>\n<li>種子純度：樣品中「該品種乾淨種子」重量佔樣品總重的百分比，扣除雜質、雜草種子與其他作物種子；另有品種純度指樣品中符合該品種特性的比例。</li>\n<li>種子活力（viability，生活力）：種子具有發芽、發育成正常幼苗潛力的比例；可用發芽試驗或 TTC（四唑鹽）染色法快速測定，活細胞染成紅色。</li>\n<li>補充：種子利用價值 = 純度 × 發芽率。</li>\n</ul>\n<p>答題重點：純度是重量百分比，活力是發芽潛力，TTC 法、利用價值公式會加分。</p>\n<h3>六、果樹類</h3>\n<p><strong>1. 寫出五種蓮霧產期調節方法並簡述操作（114，5 分）</strong></p>\n<p>作答架構：原理一句（使枝條累積養分、抑制營養生長、促花芽分化）→ 五種方法各一行。</p>\n<ol>\n<li>遮光法：以 90% 以上黑色遮陰網全面覆蓋樹冠約 40–60 天，使葉片黃化停止生長後揭網促花。</li>\n<li>浸水法：果園灌水使根部浸水數天至數週，根系缺氧抑制營養生長後排水促花。</li>\n<li>斷根法：在樹冠外周開溝切斷部分根系，減少水分與氮素吸收。</li>\n<li>環狀剝皮：於主枝剝去一圈約 0.5–1 cm 的樹皮，阻斷韌皮部輸送，使碳水化合物累積於枝條。</li>\n<li>修剪與強剪：採收後修剪使新梢整齊萌發，待葉片成熟後配合其他處理。</li>\n<li>噴施藥劑：生長抑制劑（如巴克素）抑制新梢。</li>\n</ol>\n<p>答題重點：遮光（90% 網）、浸水、斷根、環剝、修剪、藥劑；若問時程，春節前採收需 10 月 10 日前後催花。</p>\n<p><strong>2. 何謂人工式整枝？分哪幾種？適用哪些地區與果樹？（105 農經，4 分）</strong></p>\n<ul>\n<li>定義：依人為設計的形狀，利用支架、棚架或籬架引導枝條生長的整枝法，與順應樹性的自然式整枝相對。</li>\n<li>種類：棚架式（水平棚架：葡萄、梨、奇異果、百香果）、籬架式（垂直籬牆：葡萄尼芬式）、平面扶牆整枝（蘋果、梨的對稱式）。</li>\n<li>適用：多風地區（臺灣高接梨用水平棚架防風害）、蔓性果樹、需提高品質與作業效率的小面積精緻栽培。</li>\n</ul>\n<p>答題重點：支架引導、棚架／籬架、多風地區、葡萄與梨。</p>\n<p><strong>3. 果樹留果量的原則、兩種留果量指標實例，及如何增加著果數（107 技師）</strong></p>\n<ul>\n<li>原則：依樹齡、樹勢、葉量、品種果實大小決定；留果過多果小品質差且易隔年結果，過少則產量低、枝條徒長。</li>\n<li>指標：葉果比（桃、蘋果依 107 答案約 50：1；柑橘約 25–30：1）、枝果比（每結果枝留果數）、橫斷面積法（主幹每平方公分留果數）。</li>\n<li>增加著果：混植授粉樹、放蜂或人工授粉、開花期避免噴藥、環狀剝皮、施用生長調節劑（如 GA 促單為結果）、適當摘心減少新梢競爭、維持適當水肥。</li>\n</ul>\n<p>答題重點：葉果比與枝果比、隔年結果、授粉樹與放蜂。</p>\n<p><strong>4. 果實日燒的原因及其預防技術（107 技師）</strong></p>\n<ul>\n<li>原因：夏季強光直射、果面溫度過高（可超過 45 ℃），果皮細胞壞死褐化；葉片過少、修剪過度、乾旱使果實缺水加重。</li>\n<li>預防：套袋；保留適當枝葉遮蔽果實；側向果優於向陽果；噴白色高嶺土或保護劑反射陽光；覆蓋遮陰網；草生栽培與灌水維持土壤水分；整枝時避免枝幹暴露於西曬側。</li>\n</ul>\n<p>答題重點：高溫強光、果皮壞死；套袋、留葉、反射劑、遮陰、灌水。</p>\n<p><strong>5. 推薦草莓採後預冷技術並繪圖說明原理（107 技師）</strong></p>\n<ul>\n<li>推薦：強制通風預冷（壓差預冷）。</li>\n<li>理由：草莓無保護果皮、易受傷，不能水冷（易腐爛）；表面積小、含水量高，真空預冷效果差且易失水；強制通風速度快、均勻。</li>\n<li>原理（繪圖）：將有通氣孔的果箱堆成兩排，中間留通道並以帆布覆蓋，風扇從通道抽氣形成負壓，冷庫內冷空氣被迫穿過果箱通氣孔接觸果實，帶走田間熱。圖上標：果箱、通氣孔、帆布、風扇、氣流方向。</li>\n</ul>\n<p>答題重點：壓差、負壓、冷氣穿過箱孔；圖必標氣流箭頭。</p>\n<p><strong>6. 柑橘健康種苗制度的重要性與實施程序（107 技師）</strong></p>\n<ul>\n<li>重要性：黃龍病（木蝨傳播）、衰退病毒、裂皮類病毒等無法治療，且會經嫁接苗傳播；使用健康種苗可延長果園壽命、穩定產量。</li>\n<li>程序：選優良母樹 → 莖頂微體嫁接去病毒 → 病毒檢定（ELISA、PCR、指示植物）→ 網室保存原原種母樹 → 繁殖原種、採穗圃 → 網室嫁接育苗 → 定期檢定合格後供應農民；配合果園移除病株、防治木蝨。</li>\n</ul>\n<p>答題重點：黃龍病／木蝨、微體嫁接、網室、三級繁殖、檢定。</p>\n<h3>七、病蟲害類</h3>\n<p><strong>1. 褐根病：(1) 外觀病徵 (2) 對校園安全的威脅 (3) 防治方法（103，10 分）</strong></p>\n<p>作答架構：依題目三小題分段，第三段再分「預防／治療」。</p>\n<ol>\n<li>病徵：病原為真菌（Phellinus noxius）。地上部樹勢衰弱、葉片黃化萎凋、提早落葉，急性型數個月內全株枯死；根部與樹幹基部表面有黃褐色至暗褐色菌絲面（菌套）包裹土砂；木質部剖開有褐色不規則網紋，後期木材變輕、蜂巢狀。</li>\n<li>校園威脅：根系腐爛失去抓力，樹木外觀仍綠就可能突然倒伏，颱風時風險更高，危及師生與建築、車輛；病原經根系接觸傳到鄰近樹木。</li>\n<li>防治：\n   - 預防：校園定期巡查樹木健康；避免傷根、埋土過深、樹穴積水；病區工具消毒；移植前確認苗木健康。\n   - 病株處理：移除病株，連根挖除後原地燒毀或燻蒸，不可當堆肥；病土以燻蒸劑或大量潑水浸水消毒；周圍挖深 1 m 以上隔離溝並鋪塑膠布阻斷根系接觸；輕病株可依植物保護手冊推薦藥劑灌注根部。</li>\n</ol>\n<p>答題重點：菌絲面、褐色網紋、急性枯死、突然倒伏、隔離溝、燻蒸。教甄卷可加一句「帶學生建立校園樹木健康檔案」。</p>\n<p><strong>2. 茄科青枯病與蔬菜軟腐病的病原為何？「萎凋」與「軟腐」病徵的成因？（106 農經，6 分）</strong></p>\n<table>\n<thead>\n<tr>\n<th>項目</th>\n<th>青枯病</th>\n<th>軟腐病</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>病原</td>\n<td>細菌（Ralstonia solanacearum）</td>\n<td>細菌（Pectobacterium carotovorum）</td>\n</tr>\n<tr>\n<td>侵入</td>\n<td>從根部傷口侵入，在導管內大量繁殖</td>\n<td>從傷口、孔口侵入肉質組織</td>\n</tr>\n<tr>\n<td>病徵成因</td>\n<td>菌體與分泌的多醣類堵塞導管，水分無法上運，葉片維持綠色卻快速萎凋；切斷莖浸水可見乳白色菌泥</td>\n<td>分泌果膠分解酵素分解細胞間的果膠，細胞分離、組織崩解成水浸狀軟腐，常伴惡臭</td>\n</tr>\n<tr>\n<td>好發</td>\n<td>高溫多濕、連作</td>\n<td>高溫多濕、貯運過程</td>\n</tr>\n</tbody>\n</table>\n<p>答題重點：兩者都是細菌；導管堵塞 vs 果膠分解酵素；可加防治：嫁接抗病砧木、輪作水稻、減少傷口。</p>\n<p><strong>3. 荔枝椿象的危害方式、危害作物與防治方法（108 農經，10 分）</strong></p>\n<p>作答架構：分類地位與生活史 → 危害方式 → 寄主 → 綜合防治（IPM）。</p>\n<ol>\n<li>分類與生活史：半翅目、刺吸式口器；漸進變態（卵→若蟲→成蟲）、一年一代；成蟲於樹上越冬，春季在葉背產卵（每塊約 14 粒）。</li>\n<li>危害方式：成蟲與若蟲刺吸嫩梢、花穗、幼果汁液，造成落花、落果、嫩梢枯萎；受驚時噴出臭液，會使人體皮膚、眼睛紅腫刺痛。</li>\n<li>危害作物：主要為荔枝、龍眼，亦危害臺灣欒樹、無患子等無患子科樹木（校園與行道樹常見）。</li>\n<li>防治：\n   - 物理：冬季至早春人工捕捉越冬成蟲、摘除卵塊、修剪過密枝條。\n   - 生物：釋放平腹小蜂寄生卵塊。\n   - 化學：依植物保護手冊推薦藥劑，於若蟲期（3–5 月）噴施，注意安全採收期。\n   - 區域聯防：果園、校園、公園同步防治。</li>\n</ol>\n<p>答題重點：半翅目、漸進變態、刺吸落花落果、臭液傷人、平腹小蜂、捕蟲摘卵。</p>\n<h3>八、造園類</h3>\n<p><strong>1. 說明植物材料組合手法中的三植法（114，5 分）</strong></p>\n<ul>\n<li>定義：三株植物一組的配植手法，由主樹（最高大）、副樹（次之）、配樹（最小）組成。</li>\n<li>原則：平面配置成「不等邊三角形」，不可排成直線或正三角形；主、副樹距離較近，配樹稍遠；三株高度、姿態、樹冠大小各不相同，但樹種或質感需有統一性。</li>\n<li>效果：有變化又均衡，形成自然的層次感與焦點；可延伸為五株、七株的奇數組合。</li>\n</ul>\n<p>答題重點：主副配、不等邊三角形、不成直線；最好畫個平面示意圖。</p>\n<p><strong>2. 景觀植栽移植的作業適期（108，5 分填選題）</strong></p>\n<p>作答原則：熱帶樹種在高溫期移植根系再生快；溫帶樹種在低溫休眠期移植；一般常綠闊葉樹在春季回溫、新芽萌發前移植。參考答案：棕櫚科 D、熱帶常綠針葉樹 A、溫帶常綠針葉樹 B、一般常綠闊葉樹 C、熱帶常綠闊葉樹 A（官方未公布答案）。</p>\n<p><strong>3. 綠籬設計原則，並以三角形、圓形、矩形進行路徑設計，提出五種方案及視覺心理效果（107 技師）</strong></p>\n<ul>\n<li>設計原則：依功能決定高度（低籬 50 cm 以下作邊界、中籬 50–120 cm 分隔空間、高籬 120 cm 以上遮蔽視線）；選耐修剪、萌芽力強、枝葉細密的樹種（朱槿、月橘、黃楊、黃金槿）；修剪成上窄下寬的梯形使下部得光；需留維護動線。</li>\n<li>方案與心理效果（範例）：矩形直線路徑 — 規則、莊重、引導強；圓形環狀路徑 — 柔和、圓滿、向心聚集；三角形尖角路徑 — 活潑、方向感強、有緊張感；圓形結合矩形（中心圓廣場）— 主從分明、穩定中有變化；三角形連續折線（之字形）— 韻律節奏、延長步行體驗；迷宮式組合 — 探索與趣味。</li>\n</ul>\n<p>答題重點：功能分高度、樹種條件、上窄下寬；每個方案加簡圖與「形→感受」的對應。</p>\n<p><strong>4. 植物質地的分類與特性，及如何作為視障者的環境線索（107 技師）</strong></p>\n<ul>\n<li>分類：粗質地（葉大、枝粗疏，如麵包樹、龜背芋）— 醒目、拉近距離、適大空間；中質地 — 過渡與連結；細質地（葉小、密集，如羅漢松、黃楊、細葉結縷草）— 細緻、擴大空間感、適作背景。</li>\n<li>視障者線索：觸覺 — 粗糙樹皮、光滑葉片、絨毛葉（綿毛水蘇）標示不同區域；嗅覺 — 香草、桂花、玉蘭作為入口與轉角的定位點；聽覺 — 竹叢、葉片搖動聲或落葉踩踏聲；配合路面材質變化、扶手、立體花壇。避免帶刺或有毒植物。</li>\n</ul>\n<p>答題重點：粗、中、細三類與視覺效果；觸、嗅、聽三感官線索；安全（無刺無毒）。</p>\n<p><strong>5. 都市河川景觀的改善原則與三個成功案例（107 技師）</strong></p>\n<ul>\n<li>原則：水質優先（截流污水、生態淨化）、生態工法（自然護岸、多孔隙護坡、保留深潭淺瀨）、防洪與親水並重、綠帶連續形成生態廊道、社區參與與文化結合。</li>\n<li>案例：韓國首爾清溪川（拆除高架道路復育河道）、高雄愛河（污水下水道與河岸廣場）、宜蘭冬山河親水公園、新加坡碧山宏茂橋公園（加冷河由水泥渠道改為自然河道）。</li>\n</ul>\n<p>答題重點：水質、生態工法、防洪與親水、生態廊道；案例寫出「地點 ＋ 做法 ＋ 成果」。</p>\n<p><strong>6. 何謂療癒庭園及其設計原則，舉兩個實例（107 技師）</strong></p>\n<ul>\n<li>定義：以促進使用者身心健康為目的的庭園，常設於醫院、長照機構、學校，可配合園藝治療活動。</li>\n<li>設計原則：無障礙（坡度、輪椅通道、抬高花壇）、五感刺激（色、香、觸、聲、可食植物）、安全（無毒無刺、防滑、視線可及）、可參與性（種植區、教室空間）、休憩與遮蔭、方向易辨識、四季有景。</li>\n<li>實例：醫院附設的療癒花園、長照機構或特教學校的感官花園、校園園藝治療教學花園。</li>\n</ul>\n<p>答題重點：身心健康、無障礙、五感、安全、可參與。（案例請以自己熟悉、可描述細節者為主。）</p>\n<p><strong>7. 造園與景觀的定義及相關性（103，10 分）</strong></p>\n<ul>\n<li>造園 Garden：以庭園為尺度，運用植物、水、石、建築等元素創造供人觀賞與休憩的空間；「造園」一詞出自明代計成《園冶》。</li>\n<li>景觀 Landscape Architecture：範圍更大，包含都市、區域、自然環境的規劃、設計與管理，兼顧生態、文化與社會功能。</li>\n<li>相關性：造園是景觀的發源與基礎，景觀是造園的擴展；兩者都以「人與環境和諧」為目標，共同運用美的形式法則與植栽技術。</li>\n</ul>\n<p>答題重點：尺度差異（庭園 vs 區域）、發源與擴展、計成《園冶》。</p>\n<p><strong>8. 色彩在造園上的運用原則，並舉一種臺灣原生喬木介紹四季色彩（103，10 分）</strong></p>\n<ul>\n<li>原則：統一與調和（同色系、類似色）、對比與強調（補色為焦點）、暖色前進拉近、冷色後退擴大空間、依場所氣氛配色（學校活潑、醫院安定）、考慮四季變化與背景建築色。</li>\n<li>臺灣欒樹（無患子科）：春季嫩葉紅綠、夏季濃綠葉、初秋開黃花、秋末結紅褐色蒴果、冬季半落葉；另可舉茄苳（新葉紅褐、秋冬部分葉轉黃）、烏桕（秋冬紅葉）。</li>\n</ul>\n<p>答題重點：調和、對比、前進後退、場所氣氛、四季；臺灣欒樹一年四色。</p>\n<h3>九、採後處理類</h3>\n<p><strong>1. 解釋冷鏈（cold chain）的定義，說明園產品冷鏈系統作業流程（107 技師）</strong></p>\n<ul>\n<li>定義：生鮮園產品從採收後到消費者手中，各環節都維持在適當低溫、不中斷的保鮮物流系統。</li>\n<li>流程：田間採收（清晨低溫、避免曝曬）→ 預冷（強制通風、真空、水冷）→ 分級包裝（低溫包裝室）→ 冷藏庫暫存 → 冷藏車運輸 → 批發市場或物流中心冷藏 → 零售冷藏櫃。</li>\n<li>重點：依產品設定溫度（溫帶葉菜 0–2 ℃、熱帶果菜 10–13 ℃ 防寒害）；控制濕度；避免溫度波動造成結露；使用溫度記錄器追蹤。</li>\n</ul>\n<p>答題重點：不中斷、預冷是第一關、產品適溫與寒害。</p>\n<p><strong>2. 園產品由空氣成分與礦物元素失調造成的生理障礙：原因、症狀與減少方法（107 技師）</strong></p>\n<table>\n<thead>\n<tr>\n<th>類型</th>\n<th>原因</th>\n<th>症狀與實例</th>\n<th>減少方法</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>低氧傷害</td>\n<td>O2 過低行無氧呼吸，累積乙醇、乙醛</td>\n<td>異味、果肉褐變</td>\n<td>維持 O2 不低於產品閾值（約 1–3%）、包裝膜透氣度適當</td>\n</tr>\n<tr>\n<td>高 CO2 傷害</td>\n<td>CO2 累積超過耐受度</td>\n<td>蘋果、梨褐心；葉菜褐斑</td>\n<td>控制 CO2 濃度、通風、配置 CO2 吸收劑</td>\n</tr>\n<tr>\n<td>乙烯傷害</td>\n<td>與更年型果實混儲</td>\n<td>葉菜黃化、花卉落花／睡花</td>\n<td>分開貯存、通風、過錳酸鉀吸收、STS 或 1-MCP</td>\n</tr>\n<tr>\n<td>缺鈣</td>\n<td>鈣在果實中移動性低</td>\n<td>蘋果苦痘病、番茄尾腐病、結球白菜心腐</td>\n<td>生育期葉面噴鈣、採後浸鈣、穩定水分供應</td>\n</tr>\n<tr>\n<td>缺硼</td>\n<td>硼吸收不足</td>\n<td>嫩莖萵苣莖襞裂、番木瓜瘤果、蘿蔔空心</td>\n<td>基肥加硼砂、葉面噴硼</td>\n</tr>\n</tbody>\n</table>\n<p>答題重點：用表格呈現，每列「原因 → 症狀 → 方法」；褐心、苦痘、尾腐是必舉例子。</p>\n<p><strong>3. 蔬果汁加工常用的殺菌方法（107 技師）</strong></p>\n<ul>\n<li>加熱殺菌：低溫長時間巴斯德殺菌（約 63–65 ℃、30 分鐘）、高溫短時間 HTST（約 90–95 ℃、15–30 秒）、超高溫瞬間 UHT（約 120–135 ℃、2–5 秒）配合無菌充填、熱充填（裝瓶後倒置利用餘熱殺菌瓶蓋）。</li>\n<li>非熱殺菌：超高壓處理 HPP、脈衝電場、紫外線、微過濾，可保留風味與營養。</li>\n<li>原則：果汁 pH 低於 4.6 屬酸性食品，以巴斯德或 HTST 即可；蔬菜汁 pH 高於 4.6 屬低酸性，需加壓殺菌或酸化處理。</li>\n</ul>\n<p>答題重點：三種加熱法的溫度與時間、pH 4.6 分界、非熱殺菌趨勢。</p>\n<p><strong>4. 蔬果冷凍加工流程和操作要點（107 技師）</strong></p>\n<ul>\n<li>流程：原料驗收 → 選別清洗 → 去皮切割 → 殺菁（熱水或蒸氣）→ 冷卻 → 灑水、灑糖（果品）→ 急速冷凍（IQF）→ 點冰衣 → 包裝 → − 18 ℃ 以下冷凍貯藏。</li>\n<li>要點：殺菁目的是鈍化過氧化酶等酵素、防褐變與異味，以過氧化酶活性檢定是否充足；快速通過最大冰晶生成帶（− 1 至 − 5 ℃），冰晶細小、解凍滴汁少；冰衣防乾燥與氧化（凍燒）；貯運避免溫度波動。</li>\n</ul>\n<p>答題重點：殺菁鈍化酵素、IQF、最大冰晶生成帶、− 18 ℃、冰衣。</p>\n<h3>十、農經跨域類</h3>\n<p><strong>1. 簡述純系說（Pure line theory）的概念（106 農經，4 分）</strong></p>\n<p>丹麥學者約翰森（Johannsen）1903 年以自交作物菜豆為材料，發現：① 自交作物的族群由多個遺傳組成不同的純系混合而成，在族群中選拔有效；② 純系內個體遺傳組成相同，其變異屬環境變異、不會遺傳，在純系內選拔無效。此理論區分了遺傳變異與環境變異，成為純系選種法的理論基礎。</p>\n<p>答題重點：約翰森、菜豆、族群內選拔有效、純系內選拔無效、環境變異不遺傳。</p>\n<p><strong>2. 簡述草蝦剪眼柄之目的（106 農經，4 分）</strong></p>\n<p>草蝦眼柄內的 X 器官—竇腺複合體會分泌「性腺抑制激素（GIH）」。剪除或結紮母蝦單側眼柄，可減少此激素分泌，促進卵巢成熟、提早交配產卵，穩定人工繁殖的稚蝦供應。</p>\n<p>答題重點：眼柄 X 器官、性腺抑制激素、促卵巢成熟、人工繁殖。</p>\n<p><strong>3. 六種耕作制度中最好的是哪一種？簡述其四種功能（106 農經，6 分）</strong></p>\n<p>耕作制度有連作、輪作、間作、混作、套作、休耕等，其中「輪作」最好。功能：① 減少連作障礙與土壤病蟲害（如茄科與水稻輪作、電照菊與水稻輪作）；② 均衡利用地力、改善土壤理化性，豆科綠肥可固氮；③ 抑制雜草；④ 分散勞力與市場風險、提高經濟收益。</p>\n<p>答題重點：先列六種制度名稱，再答輪作；四功能各配一個作物例。</p>\n<p><strong>4. 簡述培土對植物生長之影響（105 農經，4 分）</strong></p>\n<ul>\n<li>促進不定根生長、防止倒伏（玉米、甘蔗）。</li>\n<li>促進地下部肥大與軟白（馬鈴薯防塊莖綠化、蘆筍、蔥白軟化）。</li>\n<li>改善排水與通氣、兼有中耕除草效果。</li>\n<li>保護根部、調節地溫；但過深會使根缺氧、傷根。</li>\n</ul>\n<p>答題重點：防倒伏、不定根、軟白、防綠化、排水除草。</p>\n<p><strong>5. 寫出真細菌和古細菌之相異點（105 農經，6 分）</strong></p>\n<
