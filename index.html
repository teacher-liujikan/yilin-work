<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>易霖的教學網頁</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;700&display=swap">
<style>
:root{--bg:#f2f4ee;--card:#fff;--ink:#1b2a21;--muted:#5d6b62;--line:#d4dcd2;--accent:#2d6a4c}
@media (prefers-color-scheme: dark){:root{--bg:#111713;--card:#19211c;--ink:#e4ebe5;--muted:#9aa89e;--line:#2d3a31;--accent:#7cc39d;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.7}
.wrap{max-width:720px;margin:0 auto;padding:32px max(16px,env(safe-area-inset-right,0px)) 60px max(16px,env(safe-area-inset-left,0px))}
h1{font-family:"Huninn","Noto Sans TC",sans-serif;font-weight:400;font-size:clamp(28px,6vw,36px);margin:0 0 4px}
p.lead{color:var(--muted);margin:0 0 24px}
h2{font-size:15px;color:var(--muted);letter-spacing:.06em;margin:24px 0 8px}
a.item{display:block;text-decoration:none;color:inherit;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:8px}
a.item:hover,a.item:focus-visible{border-color:var(--accent);outline:none}
a.item b{display:block;font-size:18px}
a.item small{color:var(--muted);font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>易霖的教學網頁</h1>
  <p class="lead">高職園藝・農業群教學用的線上測驗和檢討網頁。</p>
  <h2>115 學年度第一學期</h2>
  <a class="item" href="agri-quest/"><b>農業概論 闖關測驗</b><small>第一次聯合模擬考 50 題・5 關，錯題回收全對才過關</small></a>
  <a class="item" href="agri-ch3/"><b>農業概論 第三章 作物生產 總複習</b><small>構造、繁殖、栽培管理、設施重點＋動手判斷＋QR 小測驗</small></a>
  <a class="item" href="agri-ch4/"><b>農業概論 第四章 土壤肥料 總複習</b><small>上課帶著複習重點、動手判斷、計算練習，最後掃 QR code 做小測驗</small></a>
  <a class="item" href="agri-review/"><b>農業概論 模擬考檢討</b><small>拿改好的考卷，10 題一大題自己檢討</small></a>
</div>
</body>
</html>
